  md: '# ## 6.2　影响战术


    前面提到过，社会工程人员必须练习说服的技巧，直至它变成日常习惯的一部分。

    这并不是说他们必须影响每件事中的每个人，但是能够随心所欲地使用这一技巧是

    杰出社会工程人员的优良品质。


    影响和说服的很多方面都可以为你所用，并且可以轻松地应用于社会工程审查中。

    其他一些方面可能使用起来并不容易，但是在“影响”领域里具有重要的位置。下

    面将介绍与影响相关的8种不同的战术，它们经常被媒体、政客、政府、骗子、诈

    骗犯及社会工程人员所使用。


    下面各小节介绍了这8种战术，我们会详细分析它们在社会工程领域的应用，同时

    也会涵盖其在其他领域的应用情况。


    # ### 6.2.1　回报


    回报是一种固有的期望，指的是在他人对你好的时候你会给予友善的回应。举个简

    单的例子：当你走进一幢大楼的时候，如果有人为你开门，他会期望你对此表示感

    谢并且希望你报之以李，能为他打开下一扇门。


    回报的规则很重要，因为报之以李通常是在无意识的情况下完成的。理解这一层含

    义会让你在社会工程中更好地运用它。在具体分析之前，先讲几个经常运用回报方

    法的具体例子。


    +   - 制药公司会给每位医生（是的，每位医生）送10 000到15 000美金的“礼物”，包括晚餐、书籍、计算机、帽子、衣服或者其他物品，这些物品上都印有医药公司的标志。在医生选择一种药品给予支持或购买的时候，你认为他们更可能选择哪家公司的呢？

    +   - 政客会被几近相同的方式所影响。众所周知，大多数情况下，政客或说客会更支持那些曾帮助他们竞选的人。

    +   - 回报也经常应用于商业活动，特别是在和合同相关的事情上。也许销售人员会为宴请客户埋单，其后他们会要求对方在合同上有所让步。客户有时不得不让步。'
