- pgno: 462
  md: '腿和脚的指向不仅能暗示一个人是要走还是要留，还能表现他是否感兴趣。我们更多的是关注面部表情，尤其是约会的时候。通常在约会的时候，一方会表现得非常有礼貌，而真实的兴趣水平是由腿和脚呈现的。


    比如，男士很可能会接近有着热情微笑的女士。但是当他接近女士时，如果该女士的腿和脚指向的不是他的方向，或者从未移向他的方向，那就说明该女士对这位男士不感兴趣。作为社会工程师，我们需要特别注意这些线索，并以此判断是否与目标对象建立了足够融洽的关系，让目标对象一直对我们保持注意力。


    脚和腿也适于展现领地意识。若你和目标对象交流时，注意到他开始扩大双脚站立的距离，那就说明他感到自己受到了威胁，要在他的地盘外建立主导地位。图4-3左侧呈现的是谈话进展顺利的状态。请注意萨琳娜和本的腿是挨着的，他们的脚尖也都朝向对方。如果是谁说了什么改变了这种状态，或者其中一人变得焦虑或处于防御状态，那么我们就会看到右侧图片呈现的状态。萨琳娜站立的双腿分开了更大的距离用以表明领地。此外，她的脚尖也不再朝向本。


    ![](img/9f6d2369b69b99fb89843058054e5812_462_0.png)


    图 4-3 从舒适（左）到不适（右）


    最后我想说的是关于跨二郎腿的问题。我们跨与不跨二郎腿的方式都能在很大程度上表明自己是否感到舒适。前面提到过，开放的手势代表信任和热情，能让目标客户信任你。同样地，腿也能体现我们是否开心、坦率、热情或者因为不适而对他人设置障碍。'
