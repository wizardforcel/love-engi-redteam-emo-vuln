  md: '![](img/9f6d2369b69b99fb89843058054e5812_642_0.png)


    图3-3 惩罚作为一种操控手段


    无疑会有人漠视或者回避惩罚。但是如果惩罚足够严重，还是会得到回应。这正是一个恶意攻击者所寻求和试图控制的。


    想象一下你走进公司的食堂，看见一个男人正在对一个哭泣的女员工口出恶言。（她可能看起来像图3-4中的女士。）在那个男人停止辱骂后，受害者含泪向你求助说她的老板威胁解雇她，因为她把胸牌忘在家里了。她需要去这栋大楼的行政处补办胸牌，你愿意帮忙吗？'
