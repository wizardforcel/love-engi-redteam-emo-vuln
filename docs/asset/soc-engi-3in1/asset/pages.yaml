- pgno: 207
  md: '对于真正需要的物品，人们会高估其价值。一个反面例子就是汽油公司在卡特里娜飓风后会提高燃油的价格。他们声称飓风的破坏使燃油出现短缺，导致了油价的大幅提高。当然，如果情况属实的话，燃料价格会比声称的更高，但是这只不过是利用稀缺借口赚钱的反面例子。同时，当BP公司的错误导致数百万加仑的石油污染墨西哥湾，使生态环境受到破坏时，油价并未因原油供应短缺而飞涨，反而有所下降。这是怎么回事？我并不想在这里讨论这个问题，但是它证明了要想稀缺原理发挥作用，它必须是可信的。石油公司失败于此，社会工程人员也可能重蹈其覆辙。


    从社会工程人员的角度来看，如果限制很多或者机会难得，价值也就越高。如果信息是私有的、受限制的且难以得到，并且你愿意与他人分享，你在他们眼中就极具价值。


    社会工程人员可以在利用信息的稀缺性时说：“我不能说这个，但是……”也可以说：“我不确定你是否听过这个消息，但是我听说……”以严肃的语调说出这样的句子意味着信息很难得。


    # 6.2.5 权威


    人们更愿意听从他们眼中的权威人士的指导或建议。要找到足够自信、敢于直接质疑权威的人是很难的，如果权威是他的直接领导或者双方面对面的时候，质疑就更加困难了。


    例如，孩子被教导要听大人的话，要听老师、辅导员、神父、保姆的话，因为对他们来说这些人都是权威。通常来讲，质疑权威会被认为是不敬，谦卑的服从则会受到褒奖。在成年人的生活中存在同样的原则，我们从小就被教导要尊重权威人物，不要质疑规定或者权威人士的命令。


    不幸的是，这一原则让很多孩子落入施虐者和性骚扰者手中。当然，结果并不是这一个原因造成的，但是那些拐骗孩子的人知道孩子从小就是被这样教育的，所以经常寻找那些乖巧的孩子。同样，恶意社会工程人员使用这个原则操纵他们的目标，利用他们的行动或不作为达到入侵的目的。


    了解权威在社会工程活动中的应用很重要。德国社会学家和政治经济学家马克思·韦伯（Max Weber）对权威进行了定义和分类，我将这一分类应用到了社会工程领域。


    # 1. 法律权威'
  merge: -1
  img_proc: true
- pgno: 208
  md: '法律权威的基础是政府和法律。执法人员或者你所在国家、区域和机构的行政管理人员就具有这种权威。


    作为社会工程人员，伪装成执法人员或者其他政府官员通常是违法的，不过伪装成保安、银行保安或者其他类型的具有执行权威的人就没问题，也常用于社会工程实践。


    在英国广播公司《骗术真相》的一期节目中，保罗·威尔森和同伴装扮成收钱的警卫。如果某人穿上足以以假乱真的制服，并且在行动上和平常处于这一权威位置的人一样，目标很少会质疑这种冒名顶替者。装扮成权威人物是社会工程人员混入公司的主要手段。


    另外一种有效的策略就是装扮成律师，前来提取特定的信息。装扮成大众畏惧或者尊敬的角色可以获得某种权威。


    # ## 2. 组织权威


    简单来说，组织权威是通过组织的方式定义的权威，通常涉及管理层级。在组织中具有高层级和权力的人比低层级的人获得的权力及信息多。


    在社会工程审计中，顾问会模仿首席信息官或其他具有组织权威的人，他们可以利用赋予的权威从前台或者其他员工那里获取口令等信息。


    美国司法部的乔纳森·鲁希（Jonathan J. Rusch）写过一篇文章，名为 The ’Social Engineer’ of the Internet
    Fraud，其中说道：“在适当的情况下，人们更可能对来自权威的主张作出快速的反应，即使这种所谓的权威根本未露面。”（详见 www.isoc.org/inet99/proceedings/3g/3g_2.htm。）


    人们也会通过其他方式来应用这一策略，如假扮成获得首席财务官授权或受其指派的人，而不是其本人。由权威人士的名称和头衔带来的权威使得攻击者在目标眼中具有足够的权力。


    鲁希引用了罗伯特·恰尔迪尼所著的《影响力》（Influence，1993）一书中记录的一个实验，实验显示来自3家不同医院的22个检查站的95%的护士愿意给病人注射一种危险的药物，仅仅是因为接到一个素未谋面的据称是研究者的电话。


    实验清晰地显示了，基于命令或来自权威的指示，人们会不顾自己的正确判断做出特定的行为。这种类型的权威可以并且经常被用来入侵公司，拿走具有价值的数据。'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# 3. 社会权威


    社会权威指的是社会团体中的“天生领导者”。社会团体中可能包括同事、大学同学或其他聚集到一起的人。


    在《影响力》一书中，恰尔迪尼写道：“自动对权威作出反应时，人们往往是对权威的符号作出反应，而不是其本身。”


    要想产生社会权威，不需要用很多时间和结构来定义一个权威人物。无论是何场景，都有明显的证据，即人们会受一小群采取同样行动的人的影响，这就是社会权威。


    在社会工程中可以利用社会权威询问或者给目标施压，以得到特定的信息。如果目标拒绝就会受到小组领导者的排斥，导致他在整个小组中被边缘化。服从领导者的社会权威会让人们觉得更加有利。


    攻击者如果想要成功地利用社会权威，可以明示或暗示前面有人或者小组许可以这样的行为。“昨天首席财务官让我过来解决这个问题，乔检查了我的所有证件让我过去了，文件有记录吗？”这句话中就利用了几种形式的权威。


    如果毫无防备地顺从权威，就会不顾现实地服从于权威符号。在西方国家，三种权威符号特别有效。可以用下面三种符号之一来获得别人的顺从（没有其他证据表明他是权威）。


    +   - 头衔

    +   - 衣服

    +   - 汽车


    在一次对埃伦·兰格博士（哈佛大学心理学家，研究说服和影响力）的采访中，在“毫无防备”方面她说了很多。她说人们在日常工作中不会考虑很多，换句话说就是有点机械化。这种情况下，对权威角色的滥用就非常危险。感知的权威可以让他人没有限制地机械响应。详见
    [www.social-engineer.org/episode-007-using-persuasion-on-the-mindless-masses](http://www.social-engineer.org/episode-007-using-persuasion-on-the-mindless-masses)。


    通过得体的衣着、肢体语言甚至一张假的名片，社会工程人员就可以冒充权威，让他们的目标自发响应。'
