- pgno: 549
  md: '对于那些与其他情绪面部动作没有关联的眼眉运动来说，艾克曼博士将其假定为对话信号。


    接下来我会介绍一些艾克曼博士发现的并且广泛使用的对话信号。此外，还会说明社会工程师对对话信号的识别有着怎样的意义。


    # ## 8.7　分解对话信号


    当我们在解读对话信号的时候要牢记一些关键点。艾克曼博士在研究中注意到了面部表情和对话信号的一些区别。总体来说，对话信号与微表情的不同之处在于对话信号会随文化而改变。


    此外，与微表情不同，对话信号是可控的。大多数听者都不会意识到自己释放的对话信号。然而，我们可以有意识地选择向对方释放一些对话信号。这样就可以与其建立密切关系，或者表示我们在认真聆听、赞成、反对或者其他信息。


    当我在介绍这些的时候，请你仅用眼眉做这些组合动作，然后体会其中的感觉。也可以在脑海中想象下一个动作会是什么。


    # ### 8.7.1　命令信号


    与我们在第3章提到的手部命令动作相似，这些命令动作用于强调，往往伴随着一个重音。最常见的命令动作是AU1和AU2的组合动作。做这个组合动作的时候，尽可能扬起眉毛以表现惊讶、疑问或怀疑。作为听者，眼眉的轻微扬起能够表现出“开心的”惊讶——如“让我印象很深刻”。这样能够促成密切关系的建立，并鼓励听者表达更多。


    另外一个和命令动作相关的是AU4的使用。这个动作单元用以表现认知负荷、困惑或者混乱。了解到AU4可以完成眼眉命令动作并能表现困惑之后，社会工程师要注意在表现自信的时候避免使用该动作。如果我们在接近目标对象的时候表现得很困惑，那么自信就不复存在了。


    另一方面，AU1和AU4能够通过将眼眉变为倒置的V形（请回看图5-11）来表现悲伤的情绪。当对方表现出不愿服从的迹象时，社会工程师可以做这个动作来进行挽回。仅使用AU4能够表现出兴趣或专注。


    # ### 8.7.2　强调信号


    当你在杂志或图书中看到重要短语时，往往会在其下加上下划线表示强调吧？这里所说的强调与划线的意义相同。下划线的使用可以涵盖很多字，甚至是整个句子。这和对话信号有异曲同工之处。我们可以使用AU1和AU2的组合动作，或者单独使用AU4，但是要注意它们的区别。当人们在使用强调信号的时候往往会提高声音或者在说个别词的时候'
