  md: '+   - **循序渐进式** 嫌疑人很少会立即承认自己的所有罪行。试着让他逐步承认，例如他当时在现场、拥有涉案的武器或拥有类似的车，随着事实的积累最终形成完整的供词。


    也许在社会工程过程中你会被拦在门口，门卫不让你进入大楼。这时你可以试试是否可以通过以下台词找到突破：“我明白史密斯先生很忙，不能与我见面。你介意把我们的产品信息光盘交给*}他吗？我将在今天或者明天给他打电话。”


    这是一个较小的切入点，但如果你自己不能进入的话，那么至少要将你的工具送进门。


    # 6. 最终目标


    作为一名社会工程人员，如果想要使用合适的采访或审问战术，你可能得自己先回答几个问题。我建议你将问题写在记事本上，因为这样能够帮助你在面对目标时已有充分的准备。此外，将答案写下来并进行实战演练，会给你的审讯准备工作提供思路。


    请回答下面这些问题。


    +   - **人物** 要审问或面对的人是谁？他扮演什么样的角色？列出姓名、职务以及其他有关审问的信息。\n- **事件** 已经做了哪些询问准备工作？审问的目标是什么？必须有一个明确的目标。\n-
    **时间** 询问安排在什么时间段？白天或晚上的什么时候？工作环境中的什么因素让你决定采取行动的时间？打听到什么聚会信息了吗？大部分员工此时都在休假吗？是午餐时间，还是在保安人员换班期间？\n-
    **地点** 询问的地点在哪里？要到目标对象所在的地方吗？跟踪他去健身房、当地的酒吧或托儿所？从目标处获取所需信息的最佳场所是哪里？\n- **原因** 虽然人们经常听到孩子们问为什么，但这里还是必须得问。询问的目的是什么？要目标说出某样东西的下落？让他泄露一些不该泄露的信息？为了进入一个房间或访问某个服务器？'
