    # ## 2.1.2 生理状态


    你困了吗？饿了吗？需要去洗手间吗？身体状态会对你的决策质量产生影响。


    研究人员发现，一夜未眠会导致做出更冒险的决策。¹ 他们发现，大脑中负责乐观态度的部分会更活跃，同时负责计算可能的负面结果的部分的活动减少了。这意味着当我们疲惫的时候，会高估我们成功的可能性。


