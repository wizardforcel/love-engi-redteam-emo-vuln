  md: 'SET可对Teensy编程，设置这个小电路板在插入电脑时将执行何种命令。常见的命令包括创建反向会话或监听端口等。


    SET的最新特性之一是提供了一个Web界面。这意味着SET会自动启动Web服务器程序，从而更易于应用。图7-26显示了这个网页界面的概貌。


    ![](img/9f6d2369b69b99fb89843058054e5812_293_0.png)


    图7-26　SET的新Web界面


    SET是一款强大的工具，它能帮助社会工程审查人员测试出公司存在的常见弱点。SET工具的开发者总是善于听取他人的意见，在工具中增添新的应用，使得其不断完善、越来越流行。如果想更深一步了解这个强大的工具，可以登录
    [www.social-engineer.org](http://www.social-engineer.org) 网站，上面包含每个菜单选项的详细说明。在使用过程中，可以通过
