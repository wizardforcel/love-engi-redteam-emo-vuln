    图6-1　回报的循环过程


    下面展开介绍这个过程中的一些关键点。


    # 1. 送出某样东西


    你送出的不能是完全没有用的东西，必须是有价值的东西。假设送出的是一本精装小说，但是接收方不收集或阅读该语种的书，这样做就徒劳无功。


    送出的可以是一项服务、一件物品、有价值的信息、帮助或者任何接收方认为有价值的东西，甚至简单到为对方开门或者捡起一件掉落的物品。一些销售组织推崇这一方法，却因送出的东西毫无价值而功亏一篑。设想你参加一次展销会，每个参展商都有礼品送出。如果发现有一家只是送出廉价的笔，你会毫不犹豫地走开。下一家送出的礼品是谜题类的游戏，很吸引眼球，你拿起它玩了几分钟，然后销售员走'
