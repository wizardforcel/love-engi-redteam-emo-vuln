  md: '在图1-5中，哪幅图呈现的是开心的表情，哪幅图呈现的是害怕的表情？两幅图的主人公是同一位女士，但是其中的差距却显而易见。


    ![](img/9f6d2369b69b99fb89843058054e5812_408_0.png)


    # 图 1-5  哪个是开心的表情？哪个是充满恐惧的表情？


    在这种情况下，无需语言，甚至都不需要看其他脸部器官，只要看眼睛就足够了。因此，眼睛对于交流的重要性不言而喻。


    有人认为通过对说话者目视的方向能够判定其是否在说谎，但是新的研究否定了这一说法。但是我们仍然能够通过眼睛以及说话者的舒适程度发现很多事情。


    眼神交流这个课题引起了我的兴趣。当别人告诉我一件事情的时候，我往往会希望能更快地理解事实。所以，当他们在说话时，我常常转移自己的目光。虽然我可能表现得并不在意，但却是在积极聆听。不过，同我讲话的人大概不会这样认为。即使我并不是想骗人或者表现得鲁莽，但是从文化角度上来说，双方谈话时有一定的眼神交流是必要的。


    有意识的眼神交流对社会工程师而言非常有利。然而，也不要盲目地认为凡是转移目光的人都是在说谎。需要注意的是那些目光有很大转变的人或者是那些在说话时不能正视你的人。关注一个人不适的情况对解读他的情绪状态有很大帮助。


    在同艾克曼博士的一次谈话中，我问到了眼神交流的重要性。他说：“根据情境的不同，眼神交流会有很多不同的含义，比如维护地位、挑逗他人，或者表明某人在说谎。如果有谁认为转移目光就是说谎，那就算大错特错了。”


    # 1.1.5  嗅觉学


    嗅觉学研究的是气味和非语言交流的关系。我们的身体会将一定的气味同情绪和感觉联系在一起。气味能够极大地触发人们对人、事、物的回忆和情感。


    回想一下烹饪你喜欢的食品的情形。当你闻到那个味道时，会发生什么呢？反之，当你闻到曾经让你感到恶心甚至作呕的味道时，又会发生什么呢？单是想一想都能够让你厌恶地皱起眉头吧。


    气味是一种强大的力量。信息素能够吸引异性，甚至诱发其他情绪，比如恐惧。'
