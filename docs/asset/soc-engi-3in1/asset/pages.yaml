  md: '假设你要问某人以下两个问题：“你要去哪里度假？” “为什么要选佛罗里达州的那个地方去度假呢？”你认为哪个问题能让对方打开话匣子呢？当你问第二个问题时，对方会结合她的行情、喜恶来做出回答。这样社会工程师就能大致了解对方的想法。“怎么样”“什么时候”以及“为什么”的问题会比其他类型的问题更能调动对方的大脑活动。


    非言语语言对于这些类型的问题来说是很实用的。因为我们在提问时的限制总会让人们觉得不舒服或不被信任。


    请回看图4-3和图4-11。本在哪张图片上的肢体语言能让对方觉得舒适呢？


    在图4-3中，本的拇指表现、面部表情和挺胸动作都会让对方觉得本只对她的问题感兴趣，而不是回答。


    在图4-11中，本做了一个开放腹部的动作，还有不错的面部表情。这都说明他确实很好奇。腹部动作和表情表明本信任对方，对方因此也能信任他。


    这也是我们需要重点讨论的。因为我们在提问的时候会很自然地做这些事情。虽然有时在工作中，我们会把焦点集中在要处理的目标或任务上。当我们关注自己的目标，而不是人的时候，我们的表现就会变得不自然。恐惧、不安、担忧、愤怒或其他的情绪和感觉开始出现。当这些情绪出现时，我们的非言语语言就会从“相信我”变成“显示警告”。


    诱导和建立密切关系的这些方面是至关重要的，但是还有许多其他的技能也非常有帮助。在本书中，我引用了艾克曼博士的研究成果，将这些技能概括为“对话信号”。下一节将对它们进行详细介绍。


    # ## 8.5 对话信号


    正如我们在第6章讨论舒适和不适的情况时说道的，有时要先观察微小的线索，然后再深入了解你所发现的。


    和发现一个持续1/25秒的微表情相比，未经培训的新手更容易发现不适的迹象。按照上述原则，艾克曼博士在1979年出版的《人类行为学》一书中撰写了一个章节，在这本书的第3章他讨论了眼眉用作对话信号的有关内容。


    在更深入地了解对话信号前，我们先回顾一下在前言中提到的面部动作编码系统（FACS）以及与对话信号相关的三种动作单元（AU）。


    # ### 8.5.1 动作单元1：扬起眼眉内侧'
