    最后，行为是会传染的。由于我们是社会动物，周围的人对我们的选择有巨大的影响，我们通常称其为同伴压力、从众与服从。无论怎么称呼，人类有一种服从别人的倾向，尤其是在特定的情况下。早在1951年，所罗门·阿施博士便对“群体压力对判断的调整及扭曲”这一课题进行了开创性的研究。^8^
    在那之后的几十年内，大量有趣的研究一次又一次地表明社会环境确实对我们有影响。


    > > ^8^ Solomon Asch, “Effects of Group Pressure upon the Modification and Distortion
    of Judgments,” 1951, http://psycnet.apa.org/psycin​​fo/1952-00803-001.


    其中一个会影响我们的因素是形势的**不确定性**。如果我在吧台点了一份三明治，并让人给我送过来，那么我该付小费吗？我不确定。但是吧台上的一个用来收小费的罐子提醒了我。服务行业的人都知道，放小费罐子可以鼓励人们付小费。


    另一个会影响决策的因素是群体的大小、地位和一致性。例如，**每个人**都会付小费吗？付小费的是电影明星或VIP，还是普通人？


    我想大多数人在面临选择时都不会觉得自己是一头愚蠢的绵羊，但也许当你回想不太远的过去时，就不会这么想了。历史上来说，从众保证了我们的安全。当看到其他人都在逃离那只鬃毛很特别的猫科动物时，也许我也会跟着跑。


    # ## 2.1.4 决策的底线


    希望你现在对什么会影响我们的决策过程有一些了解了。我们并非想要告诉你所有关于决策的信息和研究成果，使得你成为这个复杂而庞大的领域的专家，毕竟，这是一本关于钓鱼攻击而非行为经济学的书。下面是你从本书中学到的东西。


    +   - 我们在决策时并非总是充满理智并富有逻辑，有很多因素影响着我们的决策。

    +   - 钓鱼攻击者了解我们是如何决策的，并且试图操纵我们所面临的情况以引导我们做出错误决定。'
