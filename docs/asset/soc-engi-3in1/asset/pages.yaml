  md: '当我们想到用手交流的时候，或许最先想到的就是手语，但本节讨论的内容并非手语。虽然了解这门和大脑相关联进而形成交流方式的学问激励人心，但我更关注人们是如何通过手释放情绪内容的。


    假设你走进客厅看到地板上有饼干屑，你通常会告诉你的儿子不要在饭前吃饼干，因为地板和他的脸上都写着证据。你会像所有家长一样询问这些饼干屑是从哪里来的。当儿子在纠结是否要说谎时，请想象他的手在做什么。


    也可以想一下读高中时你在全班同学面前朗读自己的作文或诗歌时的情景。听老师叫到你的名字后，你走到教室的前面。当你用颤抖的双手捧着作文，你的同学可能被你的窘相逗乐了，或者准备在课后嘲笑你。那时你的手在做什么？


    回想一下你准备去面试的经历。你给自己打气让自己显得更自信。你知道自己能够胜任这份工作，并且你也很需要这份工作。你镇定自若，准备开始回答问题。你自信地回答每一个问题。之后面试官问到了你在一个你从未听说过的领域的工作经验。你需要思考是否要编造一个答案还是坦承自己对此一无所知。那时你的手在做什么？


    最后，再想想你看过的警察审讯的视频。嫌犯得意洋洋地坐在那里，或许他的手还在敲着桌子以显示他的不耐烦。警察首先进行诱导提问：“6月1日在Lazy Tree酒吧，你见过里科和他的女朋友了吗？”


    嫌犯大喊：“没有！我已经说过了，那天晚上没有在那里见到他。”他握紧的拳头敲了桌子一下。


    刑警耸了耸肩，用一支手指指着嫌犯说：“哦，也就是说那天你曾在酒吧出现过。那早些时候你为什么说那天晚上根本没去酒吧？”


    当“呃，哦”的表情出现在嫌犯的脸上时，他的手会做些什么？


    在上述的每个场景中，象征动作、手势、演示性动作或操纵性动作都有所体现。在最后一个审问的场景中，你大概可以想象出嫌犯由于紧张在搓手或者玩弄戒指、衣角的样子。这些场景的区别是什么？分别揭示了嫌犯的什么情绪？


    在艾克曼和华莱士早期提出的研究中，研究员们讨论了我们的手是如何通过象征动作、手势、演示性动作和操纵性动作来体现情绪的。其中任何一个方面都可以用來判断情绪状态以及信息的真实性。


    在正常沟通的语境中，学习辨别、解读和使用这种形式的非语言交流是非常必要的，对于一名社会工程师来说也是如此。在这项研究中，艾克曼博士参考了大卫·埃弗龙1941年的一项研究。该研究不但十分精彩，而且经久不衰。这项研究是关于非语言交流的，名称是“手势与环境”。该研究围绕两组居住在纽约的来自不同国家的移民展开，研究发现对于人们从世代相传的文化中习得的象征动作和肢体语言，文化差异对于这两点的运用有着显著的影响。'
