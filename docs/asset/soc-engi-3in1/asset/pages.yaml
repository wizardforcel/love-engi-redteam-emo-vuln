  md: '既然你已经知道了一些会影响我们决策的因素，你就能够利用这些信息来让自己和公司变得更安全。


    # 2.2 当局者迷


    每个人在生活中都做出过错误的决定。这一节要讲的正是一些本可以做出更好决定的例子。这些例子事后看来大多很可笑，但在你笑的同时，也请思考一下是什么使得人们犯下决策错误。


    心脏滴血漏洞（Heartbleed）可能是2014年最大的安全事件之一，几乎影响了互联网上的每个人。大多数人（正常）的反应是小心谨慎或恐慌。但有一位先生却与众不同地把他的密码张贴在《华盛顿日报》的网站上，并宣布其他人可以随意使用。9
