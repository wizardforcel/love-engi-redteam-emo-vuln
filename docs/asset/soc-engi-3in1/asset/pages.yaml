    # 第 3 章　了解手的语言


    > > “舌作语说与耳，手作势说与眼。”

    > >

    > > ——詹姆斯一世


    在交流中对手的广泛而丰富的使用是人类独有的特点。我们的双手是非常神奇的，能够完成很多事情。回想小时候站在父母身旁，当有什么吓人的东西出现时，我们就会抓住父母的手寻求安慰和保护。


    甚至在这之前，我们就用双手来探索身边的世界。当我们长大一些，就学着用双手完成基本的技能，如自己吃饭、穿衣，然后学会更高级的技能，如画画、雕刻、烹饪和操作工具。外科医生会花费数百个小时训练双手，使之做到在拯救生命时精准无误；音乐家则学习指位和击键的技巧，等等。1980年，约翰·内皮尔在他的著作《手》中提出了个有趣的观点。他说我们用眼睛和双手探索周边的世界，但其中只有一个能让我们环顾四周的角落，在黑暗中看见东西。他还说人类是唯一能够用手进行有意义交流的生物。无论你是一位多么熟练的演讲者，都需要借助双手让你的演讲更精彩。


    这即是本章探讨的重点：在跟对方的交流中，我们是如何利用手来进行语言及情绪上的互动的。内皮尔称“手是大脑的镜子”，因为大脑所想不仅表现在面部，也表现在手上。


    我们的情绪和手部动作之间有着直接的联系。1973年，保罗·艾克曼博士和华莱士·弗里森博士通过实验进一步证实了这个观点。他们在一篇论文中提到了“手部动作”的概念，分析了手部动作体现出的各种不同的情绪。通过他们的实验以及后期相关的一些实验，我将向你阐述理解、观察和解读手部发出的信号是多么重要。


    # 3.1　用手交流'
