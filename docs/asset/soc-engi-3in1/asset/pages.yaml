- pgno: 103
  md: '傻，对吧？这就是使用剧本而不是大纲所导致的问题。大纲允许你有“艺术创造的自由”，让你在对话里灵活机动，不必担心下面必须要发生什么。


    使用电话提高伪装的可信度，是得到目标认可最快的方法之一。电话允许社会工程人员去“哄骗”或者假冒几乎任何事。看看下面这个例子。如果我想假装是在一个忙碌的办公室里给你打电话，我可以到
    www.thrivingoffice.com 下载一段音频。这个站点提供了一个录音叫“忙”，另外一个叫“很忙”。它们的创作者称：“这个CD很有用，它包含人们可在一家公司听到的所有声音，让人们立即相信这是真实的场景。简单、有效而且质量有保障！”


    这个句子就蕴含着社会工程的真谛——充斥着人们**想要听到**的办公嘈杂声。你发现这个CD能够满足你的预期，而且相当可信（至少在满足目标的预期后，他会是这样认为的），从而能够自动得到信任。


    此外，伪造电话号码欺骗要相对简单一些。像 www.spoofcard.com 提供的服务或者一些自制的方法，都可以帮助社会工程人员改变来电显示的电话号码，让目标认为你是从公司总部、白宫或者当地银行打过来的。利用这些服务可以伪造出世界上任何地方的电话号码。


    电话对于社会工程人员来说是非常有用的，养成使用电话的习惯，给予它足够的尊重，可以增强社会工程人员伪装的技能。因为电话是如此有效的工具，而且它的效力还将持续下去，所以必须在它身上花费相当的时间和精力，让它在任何社会工程场景中发挥作用。


    # ### 4.2.5 伪装越简单，成功率越高


    “越简单越好”的原则一点也不夸张。如果伪装有很多错综复杂的细节，以致忘记任何一个都会导致失败，那么就真的会失败。保持故事情节、事实和细节的简洁性，会增强可信性。


    人际欺骗领域有名的心理学家和研究人员保罗·艾克曼（Paul Ekman）博士，在1993年发表了一篇联合署名的文章，名为“失败的谎言”（Lies That
    Fail）。在那篇文章中他认为：


    > > 很多时候你没有时间去准备故事情节、进行练习和记忆。就算事前有很充分的预案，也有可能突然冒出一个不能预见的方向，说谎者不可能聪明到可以预见所有可能被问及的问题，也不可能准备所有的答案。仅有聪明的头脑是不够的，环境中不可预见的变化会导致原先有效的准备变得不可行。而且，'
