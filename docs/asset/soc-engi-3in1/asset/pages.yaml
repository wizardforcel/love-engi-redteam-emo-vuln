  md: '先给目标一点甜头尝尝，接下来再提请求时就不大可能吃闭门羹。拿前文“开门”的简单例子来说，如果你给别人开了门，他极有可能至少会试图为你打开下一扇门。在提出要求之前，社会工程人员可以预先恭维目标或者提供一些他们认为有价值的信息。通过先给予，接下来有所请求就显得理所应当了。


    下面的示例完美地诠释了“预设”。


    > “你认识我的邻居拉尔夫吗？他总是开着那辆绿色的福特雅仕。”


    在这句话中，你预设了如下信息：


    +   - 我认识这位邻居；

    +   - 他叫拉尔夫；

    +   - 他有驾照；

    +   - 他开一辆绿色的车。


    想要高效地运用预设方法，你要综合运用措辞、肢体语言和面部表情来问问题，从而让人觉得你所表述的是事实。这种方法最基本的一点便是穿透“防火墙”（理性状态），直入“系统最低层”（下意识状态）。最快的方式便是通过嵌入式指令注入你的“代码”，接下来会有进一步的阐述。


    # 5.6.3　嵌入式指令的规则


    一些行之有效的嵌入式指令基本原则如下。


    +   - 指令要短，3~4个字即可；

    +   - 些许强调会更加有效；

    +   - 蕴含在普通的语句中最有效；

    +   - 配以适当的面部表情和肢体语言。


    市场营销中对嵌入式指令的运用很流行。


    +   - “秒杀！”

    +   - “限时特卖！”

    +   - “即刻关注！”'
