  md: '马特又一次过来营救我，他从我身边走过，把我的短裤扔到我头上，说：“你欠我冲浪板的75美元。”


    我回家调理擦伤，这件事最终以我得了肺炎并扭伤了手臂而告终，当然还伴随着那段抹不掉的屈辱回忆。


    为什么我要告诉你们我屈辱的过去？这看起来似乎和钓鱼攻击没什么关系。事实上，它包含了钓鱼攻击的一切要素。


    在我的那次冒险中，每次随着所受到的刺激的增强，所激发的情绪也随之增强，与此同时我也面临选择。而面临选择时，我做的决定一次比一次糟糕。我的杏仁核被劫持了，我的理性中心完全关闭了，我做出理性决策的能力被一种挽回个人形象的欲望所代替。


    当你收到一封钓鱼邮件时，它触发了你的恐惧、贪婪、欲望或者好奇的情绪，你的大脑随之停止处理你的理性思维中心传来的信息，例如“别点那个链接”“我应该把这封邮件报告给管理者”或者“我不认识任何叫Abu
    Abu Ali Abu的王子，并且他也没有理由会给我4000万美元”。如果一封邮件写得很有技巧，那么它确实会引起你的情绪波动并使你失去理智，于是你做出了情绪化的决定。


    这一切会导致我们彻底暴露并处于尴尬的境地，并会使我们蒙受巨大的损失。当然，我想象不出什么点击邮件后可能会导致你丢失短裤的情况，但是你应该明白我的意思了。


    当杏仁核被劫持时，你停止了理性思考，开始仅凭情绪来做出决定，而这通常是一种最糟糕的决策方式。


    # 2.4.2　控制杏仁核


    如果上面所说的一切都是大脑自动化的过程，那该怎么办？我们还有办法控制杏仁核吗？


    答案是：杏仁核可以被控制，但需要一点时间。杏仁核并不能永远劫持大脑，这种劫持是快速的，会被强烈的情绪刺激所延长。然而如果你停下来，休息一会儿再做决定，那么你会感觉到重新获得了控制权。


    有一种情况（或者类似的情况）你可能遇到过。我曾经在一个小组里工作，有很多人在同一个电子邮件列表内，在决定如何处理某一问题时，大家都是通过邮件列表进行交流的。'
