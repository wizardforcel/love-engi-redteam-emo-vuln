    # ### 3.6 影响的原则


    既然你已经对影响和操控的区别有了初步的了解，那么是时候花些时间来深入理解影响，看看如何以及为何其中一些因素能够奏效。有很多人在影响的研究领域取得了杰出的研究成果，包括罗伯特·恰尔蒂尼博士、艾伦·科恩博士和戴维·布拉德福德博士。请和我一起回顾他们所做的工作。


    > 说明 如果想要阅读更多关于影响的研究，试试下面这些资源。


    +   - Robert Cialdini, *Influence: The Psychology of Persuasion*, Revised Edition
    (Harper Business, 2006).'
  merge: -1
  img_proc: true
- pgno: 644
  md: '+   - Allan R. Cohen and David L. Bradford, *Influence Without Authority* (Wiley,
    2005).


    图3-5提供了这些原则的一个快速的概览。基于上述研究以及从社会工程学实践中总结的经验，我们来运用这些原则。下面列举了一些你应该注意的方面。


    +   - 由于人类的行为并不总是循规蹈矩，这些原则中很多都是共同起作用的，在例子中你可以看到它们的相互影响。

    +   - 有些例子适用于多方面的影響。

    +   - 由于这些例子来源于现实世界，它们中的许多可以阐释这些原则是如何被用来实施操控的。（记得我之前提到的位于影响和操控之间的大片灰色区域吗？）

    +   - “专业建议”的目的是为你提供对这些原则更深刻的理解和更灵活的运用，如果你为所在的机构提供安全服务，那么它们对你而言是十分重要的。'
