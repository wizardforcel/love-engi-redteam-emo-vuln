    虽然这两个例子都是社会工程的最真实形式，但是具有不同的目标和结果。社会工程不能仅仅定义为欺骗、撒谎或角色扮演。在我与克里斯·尼克森[Chris Nickerson，电视剧《龙虎小组》（*Tiger
    Team*）中的知名社会工程人员]的一次交谈中，他说：“真正的社会工程不仅是以为自己在扮演角色，而且在那个时刻，你就是那个人，你就是那个角色，你的生活就是那样的。”


    社会工程不是任何一种独立的活动，而是由框架中提到的各种技巧组合形成的活动、技巧和科学。同样，一种美食也不会仅有一种成分，而是精心组合、调配及添加多种配料而成的。社会工程就像烹调，而一个优秀的社会工程人员就像是主厨。使用少量的诱因，稍加操纵和伪装，就能成为一名完美的社会工程人员。


