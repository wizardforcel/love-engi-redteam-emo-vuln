- pgno: 217
  md: '到更多的肯定之言。这种恭维会增强目标的自我肯定，让他感觉你比其他人更了解他。


    明尼苏达大学有一篇关于“肯定强化”的论文（详见 www.cehd.umn.edu/ceed/publications/tipsheets/preschoolbehaviortipsheets/posrein.pdf），其中指出过多的正面肯定可能会起到负面效应。他们称之为过度满足，也就是“肯定”增强到太多的时候，会开始失去它的效应。要消除这种情况，可以通过问题来给出肯定。这种方法会增强正面的行为或态度，同时，提出关于他们自己的问题也会让他们感到高兴。


    通过如下4步能够让人喜欢你。


    +   1. 自信而积极的态度；

    +   2. 建立共识；

    +   3. 应用前面提到的方法，与目标和环境保持同步一致；

    +   4. 有效地进行沟通。


    尼古拉斯·布斯曼（Nicholas Boothman）在他的How to Make People Like You in 90 Seconds一书中说道，人们会在遇见他人的头两秒内决定是否喜欢这个人，要改变第一印象是很困难的。他提出见面时要有好的态度。具备良好的表达能力和不同场景的沟通技巧会让你更受欢迎。你表现出来的就是他们感觉到的。面部表情、肢体语言及着装等必须反映良好和积极的态度。


    布斯曼在他的书中提到一些受人欢迎的关键要素，包括询问很多问题、主动聆听及对别人说的话题感兴趣等，这样的行为有助于让人喜欢你。


    社会工程人员可能需要不断练习，如果能够变得令人喜欢，对审查之路将大有裨益。


    # 6.2.8 共识或社会认同


    社会认同是一种心理现象，发生于人们不能确定正确的行为模式的社会场景中。在看到他人以特定的方式行事或谈话时，你可以轻松判定这种行为是得当的。总体来说，社会影响会导致一个大的社会群体对正确或错误的判断达成一致。这种情况在人们进入不熟悉的场景时很常见，此时他们内心中心没有一个参考框架，所以不知道'
