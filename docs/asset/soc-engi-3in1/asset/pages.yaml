    当然我可以继续给出其他月份的数据，不过至此你应该已经明白了。你可以展示在一个月的时间里，你的培训不仅帮助减少了15%的点击数，也增加了30%的报告数。你还可以展示更深层的信息，那就是你的培训很奏效，因为最需要培训的群体的数目减少了35.5%，而“未点击/报告”的员工数目增加了9.5%。


    这一类报告可以帮助主管了解你做出的成绩，而且培训项目的确值得时间和金钱上的投资。'
