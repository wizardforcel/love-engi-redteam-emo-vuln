- pgno: 479
  md: '主要区别在于宏表情是人们想让他人看到的情绪表现。换句话说，微表情是在我们无意识的情况下表现出来的，是不可控的，而且往往表现出的是当事人当时真正的情绪内容。


    当然，这也让我有了一个疑问，那就是如果我们看到目标对象的微表情是不是就意味着他在骗人呢？PK告诉我这是一种误解。微表情是一种对极为细微的表情所表达的情绪的有意或无意的压抑。艾克曼博士用热点（hot
    spot）来定义那些与言行不一致的微表情或其他任何表现（言语的或者是非语言的）。虽然这些表情本身并不是欺骗的标志，但是高效的面谈者能够利用热点获得微表情出现的原因。


    我们不可避免地要问的是参透人心的天赋是不是也能用来判断别人是否在说谎。PK坚定地认为不存在像匹诺曹的鼻子那样的线索。也就是说，没有单一的线索，即使是微表情也不能从内部或就其本身告诉你某人是否在说谎。要解决这个问题需要确定基准并观察其变化。找到目标对象行为中的热点，确定进行提问的方式，再通过对更多表情的观察进行跟进。


    真相客才在观察他人方面的能力高于平均水平，并不意味着我们普通人不能学习这项技能。我就是个例子。我想我不是PK那一类的真相客才，但是在跟随艾克曼博士和他的团队学习了两年半之后，现在的我已经能够很好地掌握这项技能了。


    在与PK共事的过程中，他给了我以下建议和提示。


    +   1. 当你发现了热点，并开始尝试找寻热点出现的原因时，不要只是关注一种可能性，而要迫使自己通过“对立假设”去思考为什么会出现该热点。这样做能让你保持客观。

    +   2. 做一个积极的聆听者和观察者。不要只关注一件事。要充分利用以下五种渠道：面部、肢体语言、嗓音、声线以及声音内容。

    +   3. 不要急于做出判断。在做出判断之前要充分利用所有可用的时间。让交谈顺其自然。要聆听说话者的故事。利用所有可利用的言语线索和非言语线索。

    +   4. 要注意出现的热点，但是在跟进或挑战说话者或者与说话者对峙的时候要有选择地利用热点。


    还有最后一条建议。


    +   - 你确定的事只是你看到的，所以不要假定为什么别人会表现出某种情绪。我们需要通过问题、基准态和采访策略深入研究情绪的成因。这样可以帮助我们很好地判断出情绪和感觉的区别。


    # 5.2.1 情绪与感觉'
