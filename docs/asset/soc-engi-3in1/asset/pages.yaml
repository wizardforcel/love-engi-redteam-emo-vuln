- pgno: 68
  md: '+   - 信息 如果目标人物主要是25~40岁的男性，并且有几个人是足球或篮球联赛的球迷，那么目标人物就可能会点击运动、女人或者是赛事相关的链接。制定邮件的内容是很重要的，但也要仔细考虑语法、拼写及标点符号等。根据以往的经验，拼写不规范是网络钓鱼邮件露馅的主要原因之一。


    如果收到的邮件内容是“点击这里，输入你的密码来验证你的账户设定”，那么内容不正规就是其致命的问题。邮件必须拼写规范并且能够吸引目标人物的注意。即使目的相同，根据目标人物的性别、年龄或其他因素的不同，内容也应有所变化。如果目标主要是女性，发送同样的邮件就很可能会失败。


    +   - 信道 这个因素的答案很简单，因为你已经知道是用邮件作为传输方式。


    +   - 信息源 同样，这个因素你也无需费神，因为作为一名社会工程人员，你就是信息源。你的可信度取决于你作为一名社会工程人员的技能水平。


    # 场景一：网络钓鱼邮件


    目标人物是45名25~45岁的男性，其中有24名是梦幻篮球联赛的球迷，他们每天都会访问网站 www.myfantasybasketballleague.com
    来进行投票。这些信息是通过论坛上的投票证实的。


    我们的目的是要他们去访问一个归你所有的且可访问的网站 www.myfantasybasketballleague.com，该网址和他们经常访问的网址只有一个字母之差。从外观上看，这个网站是他们访问的那个网站的克隆，两者只有一点不同，即这个里面有个内嵌的恶意帧。网页中间会有个登录按钮，点击之后，会返回到真正的网站。在点击和加载之间的延时，嵌入的代码会入侵他们的系统。


    怎样写这封邮件呢？下面是我写的一个范本。


    你好！


    这是来自“我的梦幻篮球联赛”的好消息！我们新增了一些功能，用户能够在投票时拥有更多的控制权，此外还有一些特殊的功能。我们正努力将这些功能提供给所有的会员，但是需要增收部分服务费。


    我们很高兴地告诉你，前100名登录的会员可以免费享受这项全新的服务。点击邮件中的链接，到我们的活动页面，然后点击网页上灰色的登录（LOGIN）按钮进行登录，就可以看到这些功能添加到你的账户中。网址为
    www.myfantasybasketballleague.com。'
