- pgno: 467
  md: '进行调整和回答。


    请牢记，如果你看到某人身体倾向于另外一个人，那可能意味着感兴趣或舒适。反之，则意味着不适或者不感兴趣。这个简单的辨别方法能够在一些方面帮助社会工程师。首先，如果和你打交道的人离你很远的话，是你表现得太过强势了。


    在一次工作中，我想从坐在旅馆沙发上的一对夫妻那里获得一些信息。于是我径直向他们走了过去。当我接近2米的身高赫然出现在他们面前，之后我又将身体倾向于那位男士进行了提问。直觉告诉我我搞砸了。因为那位男士尽量倾斜自己的身体，几乎要把自己埋在沙发里。很明显，他对我没有兴趣。


    另外一个辨别方法就是在建立密切关系后暗示你很感兴趣。当你的谈话对象开始表达他们的情感或想法时，你稍稍倾斜身体可以表现出你对他们所说的感兴趣，并且正在认真倾听他们所说的话。这说明你信任他们，而且想听他们说话。这样会对你们建立和维持密切关系大有益处。


    想想那些马上要决斗的动物，比如大猩猩。它可能会鼓起胸部，仿佛在说：“我很庞大，不要惹我。”这样做也能帮助大猩猩吸入更多的氧气以备战可能发生的战斗。人类也是一样。当一个人想要宣示领地的时候，他也会挺起胸膛。


    另外一个清晰的标志是看胸部的起伏。胸部的起伏和粗重的呼吸都是为了吸入更多的氧气。在一定程度上这是不适的表现。耸肩之后的大口呼气可能是出于伤心或者放弃。


    那手臂呢？它们仅仅是手的延伸吗？它们在交流中的功能是和手一样吗？手臂的有趣之处在于为躯干和手搭建了连接的桥梁。它们将躯干和手的非语言交流行为联系起来。


    请看图4-8和图4-9，判断哪位是你想接近的对象。'
