  md: '+   - 有个同事曾在你请假的时候替你代班。现在他请你帮忙，可是你已经有安排了，此时你通常会调整计划以答应他的请求。


    这些都是回报的例子。社会学家阿尔文·古尔德纳（Alvin Gouldner）写了一篇论文，题目是 *The Norm of Reciprocity*，内容详见
    [http://media.pfeiffer.edu/lridener/courses/normrecip.html](http://media.pfeiffer.edu/lridener/courses/normrecip.html)。其中有这样一段话。


