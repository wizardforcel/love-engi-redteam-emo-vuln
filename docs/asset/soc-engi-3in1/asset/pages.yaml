  md: '本章以我个人对人类思维攻击的研究成果收尾。缓冲区溢出通常是由黑客编写的程序，通过宿主程序的正常使用，可以利用它执行通常带有恶意目的的代码。一旦运行起来，程序会按照黑客预先设定好的步骤执行任务。那么如果可以在人类的大脑中执行“命令”，让目标按照我们的要求行动，给出我们想要的信息，会怎么样呢？这样是不是就可以证明人的思维是可以被操纵的呢？


    这一强大的信息当然也会被用来达到恶意目的。我以这种方式将此信息公布于众，目的在于揭开“坏人”的面纱，剖析他们的手段、思路和准则，然后一一进行分析，让读者学会如何识别他们的真面目。将这些技术公开出来，有助于大家轻松识别、抵御及缓解这种攻击。


