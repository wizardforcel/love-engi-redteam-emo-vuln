  md: '虽然我们倾向于把明媚的日子与好心情联系起来，但是徐静和阿帕娜·莱布罗最近的一项研究表明，较高的环境亮度只是简单地放大了我们的感受，反之亦然。^7^ 所以如果你心情不错，那么一间明亮的屋子会使你感觉更好；但是如果你很悲伤或者生气，那么同等亮度会使你感觉更糟。


