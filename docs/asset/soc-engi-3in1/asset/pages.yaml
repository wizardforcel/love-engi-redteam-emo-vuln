  md: '![](img/9f6d2369b69b99fb89843058054e5812_56_0.png)


    图2-4 ICanStalkU.com网站主页的经典场景


    位置信息的泄露是社交网站令人不放心的因素之一。在上传照片的同时，你的位置信息可能在你毫不知情的情况下被泄露了。


    像ICanStalkU这样的网站强调了信息泄露的危险。通过一则小故事（还有很多）便可以看到，这些位置信息如何被利用，使受害人遭遇入室盗窃和抢劫等，故事的链接如下：
    www.social-engineer.org/wiki/archives/BlogPosts/TwitterHomeRobbery.html。


    不同种类的信息可以帮助你全面地了解目标。人们喜欢在Twitter上分享自己的地理位置、和谁在一起以及正在做的事情等。Blippy¹能绑定人们的银行账号，然后向好友推送你的每笔消费信息，包括从哪里购买、花费多少等。含有地理位置信息的照片，以及Facebook这种用来分享个人照片、故事和其他相关信息的社交网'
