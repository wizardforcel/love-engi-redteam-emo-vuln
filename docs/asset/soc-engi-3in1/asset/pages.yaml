    倾斜头部、微笑并作出开放腹部的动作是非常有效的策略。美国前总统比尔·克林顿就善于此道。他会举起手掌，微笑，倾斜头部，作出邀请你加入的动作。正是这个非言语动作帮助他赢得了美国人民的心。


    前美国副总统候选人萨拉·佩林也尝试过使用这个动作。她笑起来很好看，头部倾斜的角度也很恰当，但她经常会加入一个耸肩的动作。恰恰是这个动作使得她看起来对她自'
