- pgno: 297
  md: '尽管发出了很多警告，但每年遇到简单攻击的人数仍在不断上升。在网上公开个人信息的人数是惊人的，公开的信息各种各样，关于自己、家庭以及生活琐事等。基于人们在社交媒体上泄露的信息，以及在网络上可以找到的其他信息，凭借接下来讨论的工具，社会工程人员甚者能勾勒出某些人的全部生活。


    密码分析卓有成效的原因之一是人们选择密码的方式。实践证明很多人反复使用相同的密码。更糟糕的是很多人使用的密码很容易猜测，而且不需要什么技巧。


    最近，BitDefender（一家网络安全公司）的一项研究证实了这一点。BitDefender分析了25万多名用户使用的密码，结果十分惊人：其中75%的用户所使用的邮箱密码和社交媒体账户的密码是相同的。再想想近期有1.7亿Facebook用户的个人信息被人以P2P种子的方式发布到网上，这多么恐怖啊。完整的文章内容参见
    [www.securityweek.com/study-reveals-75-percent-individuals-use-same-password-social-networking-and-email](www.securityweek.com/study-reveals-75-percent-individuals-use-same-password-social-networking-and-email)。


    2009年，一名昵称为Tonu的黑客做了一项很有趣的研究。通过获取某个流行社交网站近期弃用的URL，他伪造了页面，对试图登录的人进行了一段时间的记录。不过他这样做并没什么恶意。


    你可以在 [www.social-engineer.org/wiki/archives/BlogPosts/MenAndWomenPasswords.html](www.social-engineer.org/wiki/archives/BlogPosts/MenAndWomenPasswords.html)
    看到研究结果。


    其中的一些信息甚至震惊了资深的社会安全专家。在734 000人中，有30 000人使用自己的名字作为密码，有约14 500人使用他们的姓氏作为密码。更惊人的是下面的统计数字，最常使用的8个密码如下表所示。


    | 密码 | 性别 | 用户数 |

    |---|---|---:|

    | 123456 | 男 | 17 601 |

    | password | 男 | 4545 |

    | 12345 | 男 | 3480 |

    | 1234 | 男 | 2911 |

    | 123 | 男 | 2492 |

    | 123456789 | 男 | 2225 |

    | 123456 | 女 | 1885 |

    | qwerty | 男 | 1883 |


    17 601位男性使用的密码是123456？真是令人震惊啊。'
