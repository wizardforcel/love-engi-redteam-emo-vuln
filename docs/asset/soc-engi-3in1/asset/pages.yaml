- pgno: 700
  md: '与此同时，“拉里”正利用他刚刚给约翰的电脑植入的恶意软件向网络发起攻击。


    还有一种我见过的常见并有效的办法：攻击者给主管寄来一个全新的硬件_jsii，里面嵌入了恶意设备。例如，我的好朋友大卫·肯尼迪制作了一块有内嵌设备的键盘，攻击者可以在这块键盘被安装后访问公司网络。


    你认为有多少主管会在收到一个全新的价值两百美元的微软键盘后把它安装到电脑上？100%。


    这类攻击者目标非常明确，也非常有针对性，他们不会广撒网，而是只用一根鱼叉捕鱼。很多时候这类鱼叉式钓鱼攻击都能捕到“鲸鱼”或者公司里的“大鱼”。


    我们已经定义了钓鱼攻击培训项目的等级，那么下一个问题是，你该从何处开始？


    # 小心选择你的级别


    你应该选择哪一级开始钓鱼攻击培训？这一问题实际上比你想象中容易回答一些，大体可分为两种不同阵营。


    +   - 阵营一 在你能钓到马林鱼前，你该从鲈鱼开始。这意味着你应该从简单一点的钓鱼攻击即一级钓鱼攻击开始，先来看看员工做得怎么样，在这一级中查漏补缺，然后再提升到二级难度。尽可能从简单的开始，然后提升难度。

    +   - 阵营二 深海捕鱼是为了捕到更大的鱼。这意味着从等级三开始逐渐降低难度，直到你找到一个合适的等级，然后从那里开始。


    你该如何选择？我通常喜欢阵营一。我认为这可以让员工保持良好的感觉。他们会觉得自己在取得胜利，而这可以帮助他们更容易适应培训。这是最好的方法吗？我不能断言这是对于安全工作而言最好的方法，但我可以说这是最好的让人开心和投入安全项目的方法。


    我也把经验和项目时间纳入了考虑范围。下面是一些我经历过的情况，以及我决定的处理方式。


    +   - 公司一 有一家公司要求我进行钓鱼攻击培训。这家公司此前从来没有把钓鱼攻击纳入其安全意识训练中，但是他们的领导知道这是个问题。他们想要每个季度只开展一次钓鱼攻击训练。


    我决定从二级攻击的最简易程度开始，在第一季度对所有员工进行钓鱼攻击，然后开展培训。第二季度时，难度提升到二级攻击的较难程度，然后继续开展培训。第三季度开始三级攻击最简易程度的钓鱼攻击。我们看到了点'
