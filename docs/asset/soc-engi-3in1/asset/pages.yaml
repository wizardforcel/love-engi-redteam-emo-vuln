- pgno: 457
  md: '![](img/9f6d2369b69b99fb89843058054e5812_457_0.png)


    # 图 3-21　在这里你看到了什么？


    你是否注意到本在试图表现他的支配欲？萨琳娜的手在暗示什么？


    看起来萨琳娜对于本接近她的方式感到不适，不是吗？作为一名社会工程师，如果你看到这个场景，若想迅速得到萨琳娜的信任并建立密切关系，你会怎么做？


    你不会想孤立本，但又想表示你看出了萨琳娜的不适，并想在不让她更难堪的前提下帮助她。


    通过让本停止生殖器指向的手势外，邀请他们进行积极的谈话可以实现你的目标。使用自信度高但非领地意识的手部动作，比如开放性的手部动作以及指向拇指的动作。'
  merge: -1
  img_proc: true
- pgno: 458
  md: '如果你想加入他们并做出指向萨琳娜的动作或者是有领地意识的动作，那么基本上你和本之间就要爆发一场领地争夺战了。这会徒增紧张气氛。通过使用自信度但是平和的动作，能够缓和气氛，赢得双方的信任，进而建立密切关系。


    在接近他人时，这一点对于你业务的成败来讲至关重要。


    # ### 3．3 总结


    综上所述，这部分内容信息量很大。尝试起来有一定困难，也不是一朝一夕就能够掌握的。我的建议是不要在工作中寻找手部、手臂、拇指和生殖器指向的动作，而是花些时间注意那些“非专业”的动作。去商场里看看远处正在交谈的两个人，去酒吧看男子怎样追求女孩，以及男子是如何被女孩拒绝的。你会为自己所看到的一切而感到吃惊。


    你也可以在新闻、采访或者脱口秀节目中看到大量类似的行为。


    需要注意的是，我们的目标不是抓住每个细小的动作，尝试准确解读每个动作的含义，而是寻找那些基准态的变化，进而解读对方在互动中的情绪变化。看到别人自信满满，就调整自己的接近方式去适应对方；看到别人温良羞怯，就让自己变得更温和安静。


    学会调整接近方式和非语言手部动作以适应你想加入的一方。这样做能够提升社会工程师的能力并让你成为充满魅力的沟通者。


    说了这么多，我们也仅仅是谈了手部的动作，在下一章我们会转向身体的其他部位：躯干、腿和脚。


    # # 第 4 章 躯干、腿和脚


    > > “肢体语言是解开心灵枷锁的钥匙。”

    > >

    > > ——康斯坦丁·斯坦尼斯拉夫斯基


    上一章讲到了手能够沟通感情。我们的手是那么迷人，甚至不用说话，只用手就可以描述整件事情。那么我们身体的下半部分是否也能如此呢？情绪状态的重要信号是不是会深藏在躯干、腿和脚中呢？


    腿和脚是我们的行走工具。我们用腿和脚负重，去不同的地方，并让我们的身体保持平衡。此外，腿，尤其是脚，还是感官享受和极度敏感的来源。'
  merge: -1
  img_proc: true
- pgno: 459
  md: '控制非语言行为的大脑边缘系统会让我们身体下半部分忠实于我们的情绪状态。因为双手和手臂在我们身体的前面，所以我们会注意到自己的行为。腿和脚则不然。这就意味着在与别人打交道的时候，腿、脚和躯干的动作通常是判断一个人真实情绪的关键。我们先从腿和脚着手，然后逐步展开阐述。


    # #### 4.1 腿和脚


    腿和脚能够“告诉”我们别人是否开心、伤心、紧张、不适，甚至是否具有领地意识。学习了解这些信号能够帮助我们读懂目标对象并知晓他们的心情。或许看过那部讲述企鹅跳舞的电影《快乐的大脚》（*Happy
    Feet*）。当感到开心的时候，剧中的那只企鹅就会翻翻起舞。


    这和现实相差并不遥远，当人们感到开心的时候，可能会不由自主地弹跳、摇摆，有时连脚趾都会翘起来。罗宾·迪克尔称之为“对抗地心引力的动作姿态”。图4-1呈现的是对抗地心引力的抬起脚尖的动作。'
