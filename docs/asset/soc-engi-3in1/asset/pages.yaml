  md: '![](img/9f6d2369b69b99fb89843058054e5812_514_0.png)


    图 6-5 因为震惊或惊讶而捂住张开的嘴


    如前所述，当我们感到害怕或是惊讶的时候，我们的身体会通过倒吸气做出 “或战或逃” 的反应。如同摸脸和揉颈部一样，遮住嘴巴也被视为自我安慰的自然反应。震惊、惊讶或者恐惧往往伴随着不适的感觉，之后就是人们自我安慰的行为。


    如果你观察到某人由镇定的基准态转变为如图6-5所示的状态，那么请重新评估你的接近方式，确保自己不是那个让别人受到打击的对象。


    # 注意事项


    若发现对方做出捂嘴的动作，请尽力找出导致该行为的原因。要牢记艾克曼博士强调的关于情绪产生原因的问题。要思考这样的表现是因为愤怒、悲伤还是恐惧。这些情绪会'
  merge: -1
