- pgno: 689
  md: '我能说的是，这两种方法都能帮助你设定一条基线，都能帮助你将钓鱼攻击作为一种教育员工的工具。我的建议是选择最适合你的那种，然后以此作为训练的开端。


    在你决定如何设定基线后，你该如何得知应该发送何种钓鱼攻击邮件呢？


    # 5.2.2　设定难度


    即使你从本书中什么都没有学到，也请留意这一节，因为这是整个项目最关键的地方。这一节非常重要，因为这是设定钓鱼攻击难度的一节。这些年来我一直在将我见过的钓鱼攻击邮件进行分类。当我和米歇尔开始一起共事时，我们创建了一个钓鱼攻击库，里面包含了大量真实的钓鱼邮件示例，并按照系统进行了分类。


    这一系统的分类依据是钓鱼邮件的难度级别——具体来说，是根据识别它是否为钓鱼邮件的难度进行划分的。我和米歇尔把它们分成了下面四类，几乎可以囊括所有基本钓鱼邮件。


    下面将带你概览一下不同等级的钓鱼邮件，然后讨论一下如何利用它们。


    # 一级钓鱼攻击


    一级钓鱼攻击是最容易识别的，通常与（第1章中描述过的）419钓鱼邮件相关。有很多指标可以识别出它是“钓鱼攻击”，大多数普通用户都应该觉得能很容易找出这类邮件不对劲儿的地方。


    当我和米歇尔开始为这些邮件分类时，我们挑出了一些显著特征，可以用下列指标来划分一级钓鱼攻击：


    +   - 非指向性问候和结束语；

    +   - 拼写错误和糟糕的语法；

    +   - 简易的信息/不太可能成立的理由（例如“你已经继承了上百万美元”）；

    +   - 引起贪婪、恐惧或者好奇的心理；

    +   - 文本中出现恶意链接；

    +   - 奇怪的邮件地址/未知的发件人。


    大多数情况下，一级钓鱼攻击具备很多上述特征。尽管你可能不会看到以前那么多的此类的真实邮件，此处也提供了一些例子。'
