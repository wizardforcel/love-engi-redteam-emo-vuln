  md: '社会工程人员通常想知道目标不在办公室时的行踪。目标在上班的路上做了哪些停留，能泄露很多信息。整合并分析这些信息有助于社会工程人员进行合适的伪装，或提出合适的问题，从而诱导目标作出正确的反应。知道目标一天工作的起始时间，对红队[^1]的物理攻击也很有帮助。红队的目标是侵入并获取有价值的资产，用以暴露公司物理安全的脆弱性。


    +   1. 红队是指计算机和网络安全专家，他们得到系统主人的授权攻击系统，以找出恶意黑客可能利用的安全漏洞。也被称为伦理黑客、入侵测试等。——译者注


    跟踪目标的方式多种多样，其中一种方法就是使用跟踪设备。GPS跟踪器是其中的一种，例如大家熟悉的可全球使用的 SpyHawk 超级 GPS 跟踪器，该设备可以从
