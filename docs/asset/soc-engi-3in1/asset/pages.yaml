  md: "社会工程人员还可以利用这里没有列出的其他权威方式，但是这些是最常用的。权威在影响他人方面是一个强有力的武器，通过一些信息收集和推理，社会工程人员就能有效地假扮成权威，从而取得优势地位。\n\
    \n# 6.2.6 承诺和一致性\n\n人们欣赏遵守承诺的人，也希望自己言行一致。通常人们会在言语、态度和行为上保持一致。言行一致降低了信息再处理的必要性，并且为作出复杂的决策提供了捷径。\n\
    \n直觉（就是根据以往的经验判断某一行为的好坏与对错）通常会指出所作的决定可能与以往的感觉和信念相矛盾。这些信号让你感觉自己是被逼同意的，内心其实并不认同。\n\
    \n直觉也会在作出承诺时产生。它表明你并不确定自己的承诺是否正确。你可以扣心自问：“若时光倒转，根据已知信息，我是否会作出相同的承诺？”\n\n在分析社会工程人员如何利用言行一致来获得他人的承诺之前，我们先看3个有关这方面的例子，这会有助于理解。\n\
    \n+   - 营销 公司通常会花费额外的资金以争取更大的市场份额。这并不会增加回报，但是他们相信最终会有利可图，所以值得投入。可口可乐和百事可乐过去几十年在营销上的明争暗斗就是一个很好的例子，然而商业宣传并不会让人们由喜欢百事可乐变成喜欢可口可乐。因为两家公司都“承诺”决不让步，所以当其中一家推出新产品或者展开新的市场宣传时，另一家会立刻跟进。\
    \  \n+   - 拍卖 类似eBay等在线拍卖网站越来越流行，他们对承诺原则的应用更加明显。人们在出价时会感觉作出了一定程度的承诺，如果有人出价更高，他们就会继续跟进。因为承诺，他们偶尔甚至会将价格抬高到自己都不满意的程度。罗伯特·坎普（Robert\
    \ Campeau）收购布鲁明代尔百货公司（Bloomingdales）就是一个典型的例子，在原有的价值之上他多花了6亿美元。Negotiating Rationally的作者马克斯·巴泽曼（Max\
    \ Bazerman）引用《华尔街日报》记者的文章说：“我们已经不再基于价格进行交易，而是基于自我意识……”  \n+   - 嘉年华及赌场等 任何时候，只要涉及赌博或赌场，就存在承诺，他们会用遵守承诺说服人们参与赌博。瑞安·希利（Ryan\
    \ Healy）是一位在线市场顾"
