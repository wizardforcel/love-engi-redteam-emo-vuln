  md: '接下来该如何运用这些信息来保护你自己和你的公司呢？克里斯将会在第4章讨论这些问题，他会讲一些我们的经验，以及客户所做的或好或坏的决定。第4章也讲了针对普通人和专业人士的建议，可以帮助你在家中以及在工作中自我保护。


    # # 第 4 章 保护课程


    > > “学校和真实生活的一个重要区别在于：学校先教你知识然后考试，生活则通过考试来教你知识。”

    > >

    > > ——克里斯托弗·海德纳


    现在你已经通过了我们的常驻心理医生和钓鱼攻击呆子（是的，我说的就是米歇尔）的训练，那么是时候开始运用你所学的知识了。我和很多公司交流过，他们花费大量时间在互联网上，意图寻找学习并教授员工如何进行自我保护的建议。在这些交流和他们所遇到的挫折的基础上，我完成了本章的编写。


    本章会教给你我们从一些世界上最大的组织机构那里学来的经验，以及如何运用它们。我发现“专业”建议和“普通”建议之间的差别很大。


    这里的普通，是指平常的普通人。他们在家的时候，没有全职的IT工作者可以求助。他们上班的时候，隔壁的格子间里并没有这样一位电脑呆子，他可以一边大声感叹你的技术水平有多差，一边告诉你该做什么。即使中小型（或者有时候是大型）公司也没有此类全职的安全专家可以随叫随到。如果你觉得这些描述像是在说你，那么请注意一下这些普通建议。专业建议主要是针对那些更大的、拥有专职安全人员的公司。很多建议对普通人员和专业人员都很有用。因此，本章对于这两个群体的人都很重要。


    另外，本章还涉及一面“绵羊墙”（Wall of Sheep）。你可能对这个词不熟悉，它来源于DEF CON，世界上最大的黑客/安全会议之一。每年的DEF CON上，运作绵羊墙的那些人都会把在会场上连接到未知网络上的“绵羊”们的账号密码公布在上面。为什么要这么做？他们希望提高人们的安全意识，告诉人们抓取这些“安全”信息是多么容易。


    我不会在本章中把特定的公司名称列出来并说出它们的愚蠢想法。相反，我的绵羊墙上列举的是那些和我们曾经一起共事的人所提出的或者（不幸）已经用过的想法，而这些想法通常弊大于利。'
