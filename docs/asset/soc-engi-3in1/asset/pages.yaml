    这两个例子都驱使你想要去点击链接、打开附件，或者采取一些你绝不该采取的行动。


    # 三级钓鱼攻击


    三级钓鱼攻击接近于真实世界中的鱼叉式钓鱼攻击（属于最高级）以外的针对性钓鱼攻击。三级钓鱼攻击邮件复杂而难以识别。


