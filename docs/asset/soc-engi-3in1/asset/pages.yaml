- pgno: 629
  md: '![](img/9f6d2369b69b99fb89843058054e5812_629_0.png)


    图 2-8　杏仁核在大脑中的位置


    举个例子，在与尼尔·法伦（Neil Fallon）的一次谈话中，这位Clutch乐队了不起的主唱告诉我，当他想要准备一场演出时，他会拿出一件带有他称为“演出的味道”的衬衫（我不会去探究这是什么意思的）。当他穿上那件衬衫，闻到那种味道时，他的大脑就进入了表演的状态，就像是打开了一个演出模式的开关一样。


    你几乎可以想象那个画面：尼尔穿上那件衬衫，衬衫上的味道进入他的鼻子里，杏仁核开始处理这种刺激。于是杏仁核说：“哦，我知道这种味道，我该分泌肾上腺激素了。”接着血流开始加快，刺激开始蔓延，尼尔准备登场。


    令人惊奇的是，在《社会工程 卷2：解读肢体语言》一书中引用的资料表明，杏仁核处理这些刺激比大脑更快，因此它会触发一种“自动驾驶”的感觉，直到大脑反应过来。


    # 2.4.1　杏仁核劫持'
