- pgno: 716
  md: '觉得自己是真男人。15分钟后，我在墙壁中间砸出了一个大洞，大得足够我的头钻过去。


    我一直砸墙，直到累得我需要休息为止。我穿过大厅，看到另一个人快要拆完一整面墙了。他几乎和我同时开始工作的。为什么他比我快这么多？


    “见鬼！”我边想边走回我的那堵墙壁前。短时间内我又砸了一个洞出来。我对此感到很满意，不过离推倒整面墙还差得远，而那个人已经开始砸另一面墙了。我有些羞愧地走过去，问他秘诀是什么。


    他给我上了一节5分钟的课，给我讲了钢筋如何贯穿墙壁中最脆弱的部分。接着他告诉我应该敲打哪里，应该用哪种尺寸的锤子。他给了我一把钢筋剪，然后就打发我走了。


    不到10分钟后，我就推倒了我的第一面墙——我很满意！那天我们两人比赛看谁拆墙更快。最后我们在6小时内拆完了一整层楼的所有的墙壁——而且是手动拆除！


    # ## 6.5.1 定义


    我从上面这个故事里学到的是：你应该选择最容易成功的那条路。当然我的办法最终也能奏效，但那并不是最容易的办法。


    有时在公司里我们见过这样的人，他们试图让员工采取正确的行动，原本是出于好意，却做出了糟糕的决定。这一点在报告钓鱼邮件方面表现尤其突出。我们看见很多公司设置了内部电话中心，以便员工打电话报告钓鱼邮件。无论你如何抉择，让报告钓鱼邮件对你的员工来说容易一些，这样才能做到收益最大化。


    # ## 6.5.2 消极之处


    你想要员工报告他们“捕获”的所有钓鱼攻击。你想要员工在收到更多关于这些邮件的信息前不要轻举妄动。你也想要鼓励那些可以培养安全意识的值得提倡的行为。


    然而，如果每次员工收到钓鱼攻击邮件时都得打电话报告所有的细节，然后在电话里被告知删除邮件、转发邮件、等待更多信息，或者无视邮件，那么员工最终会停止报告，因为这么做会消耗他很多工作时间，而这超出他的承受范围。


    这就好像要求你的员工用最重的锤子去砸墙壁一样，因为这会让人“感觉”好像做了什么，但这其实只是在耗尽所有人的精力。'
