    # 第 2 章 决策背后的心理学原则


    > “我立刻就后悔做这个决定了！”


    ——朗·伯甘蒂（Ron Burgendy，跳入圣地亚哥动物园的熊池后），《王牌播音员》


    本章将会探究一些关于决策的问题。为什么我们在明知结果注定不妙时，还是会做某些事？其他人经历或者观察到了什么，导致他们做出了和你不一样的决定？


    有一个至今仍让我觉得好笑的和决策有关的故事。我17岁开始在军事学校念大学。这是一个不鼓励面带微笑的地方，也是一个你永远不用考虑穿什么的地方——指导员每天早上会让你知道的。上课、吃饭和其他活动都必须服从指令。大一时，我很幸运地被选中参加一场在怀俄明大学举办的足球赛。新兵被要求时刻穿着制服，而在出校时，我们得换上一套被称为军便服的特殊制服。这是一套更为正式的制服，包含夹克和鸭舌帽，就像在包含敌方威胁和安全掩体的电影中军人的装备一样。


    当我们进入体育场，看着排列得井然有序的座位时，我意识到几个问题。


    +   - 今天阳光明媚——感觉像有几千摄氏度——我们要在整场比赛中一直穿着军便服。

    +   - 当我笔直地坐在看台上的时候，后背汗水直流。我注意到对面看台上挤满了留着长发的年轻人，他们（在我看来）与我们相比就像没穿衣服一样。他们跳舞、吵架、唱歌、吸烟，还把啤酒瓶到处乱扔。'
  merge: -1
  img_proc: true
- pgno: 617
  md: '我很清楚地记得我当时心里想的是：“该死，我做了一个错误的决定。”


    然而几十年过去了，我很高兴 我选了那条路。17岁时，我每天都为自己所做的决定而感到后悔，但是现在看来在军事学校就读其实是一个很好的决定。


    我讲这个故事是为了说明几个问题，你应该在阅读这一章的时候思考一下。


    +   - 决策的好坏并不总是与我们对这个决策本身是否感到满意有关。

    +   - 决策包含了一系列因素，如我们的看法和情绪。

    +   - 我们每天都在做出或大或小的决策，即使在并不具备所需的全部相关信息的情况下。

    +   - 我们不假思索地、频繁地做出这些或大或小的决策。（最后这一点是钓鱼攻击者最喜欢的。）


    # ## 2.1 决策：观滴水可知沧海


    决策无疑是一种特权，但也可能是一件可怕而充满压力的事情。极少数特殊的情况下，你才能清楚地知道你的决策正确与否。我们喜欢通过权衡轻重的方式来思考问题，并会清醒地考虑可能的后果。（举例来说，你有一个很好的理由购买一辆肌肉车而不是混合动力车，不是吗？）但是你知道情况并非总是如此。


    尽管我们每天会做出很多大大小小的决策，但决策实际上是一个非常复杂的认知过程，它是很多研究的主题。有适用于心理学、体育、商业、经济学、政治学等的决策模型和理论。


    我并不是想试着让你成为一个决策专家，但我要为你介绍一些概念供你思考。我并没有囊括所有已经完成的或者正在进行的优秀的研究，权当入门吧。


    即使只是进行一个粗略的检查，也可以发现有很多因素会影响决策的过程和结果。在阅读下面的内容并感到绝望之前，请记住，人类（还有其他物种）的很多怪癖都归结于一个原因：生存。本章中谈到的很多因素都增加了生存的可能性，无论是鼓励我们快速思考，还是在情况危急时冒更大的风险。虽然我们中的大多数不再靠牙齿和爪子生存，但是我们依然会为了生存而做出适应和调整。


    # ### 2.1.1 认知偏差'
  merge: -1
  img_proc: true
- pgno: 618
  md: '我有认知偏差，你也有，实际上我们都有。不过不必担心，这是正常的。认知偏差是一种思维定势，通常源于过去的经验。有时候认知偏差是好的，因为它使你更快或者更好地做出决定。然而很多时候它也会导致错误决策，因为认知偏差会妨碍你获取所有可用的信息。


    如果人类是真正理性的决策者，那么不管情况如何，我们都应该会基于事实做出相同的决定。但事实并非如此。一个经典的例子是，20%是肥肉的肉和80%是瘦肉的肉（见图2-1），你会买哪种？


    ![](img/9f6d2369b69b99fb89843058054e5812_618_0.png)


    图 2-1　你会买哪种肉


    20%肥肉含量和80%瘦肉含量的意义是完全一样的，但在美国，绝大多数人会选择第一种。（此处特指美国，因为在其他一些国家，肉类是按照脂肪的含量来销售的。）框架效应（framing
    effect）就是一种认知偏差，它指的是你的反应取决于当时的情形，或者说你的反应依赖于语境。


    我和丈夫常常访问一个网页，它所使用的壁纸是有趣而独特的图片。这个网页上有一张照片是由一系列垂直排列、参差不齐的彩色的点构成的——鲜艳的绿色、蓝色、橙色、红色和紫色。我们一开始以为这是一幅不太好的抽象画。但在仔细观察之后我们发现，这其实是彩虹桉树树皮的近距离拍摄的照片。我们本来感觉有些无聊和失望，顷刻间变得欣喜起来，仅仅因为语境（上下文）变了。壁纸本身没有发生变化，但是我们的反应却因为语境的不同而产生了巨大的改变。


    另一个总是影响我们决策的认知偏差是可用性启发法（availability heuristic）。这是一条我们用来快速进行决策的捷径，它依赖于我们容易想起来'
  merge: -1
  img_proc: true
- pgno: 619
  md: '的事物。


    举例来说，你认为在美国被自动贩卖机砸死的人多还是死于鲨鱼袭击的人多？大多数人可能会选择鲨鱼袭击，尽管统计结果表明被自动贩卖机砸死的人更多一些。（我知道这个事实，不过是谁搞的这种调查？）无论如何，在刚刚的判断中，导致你犯错误的原因之一就是你能非常容易地想起新闻故事和电影中鲨鱼袭击人的例子，但是你很少听说有人被自动售货机砸死。如果我们能非常快地想起某些事情，那么我们的大脑会倾向于高估它的频率或者重要性。你可以想象这种倾向对于决策所造成的灾难性后果。


    最后一个值得一提的认知偏差是确认偏误（confirmation bias）。这是说你倾向于寻找支持你的观点的信息，或者按照支持你的观点的方式来解读信息。举例来说，也许你认为杜宾犬是一种危险、好斗的狗（见图2-2），那么如果你在公园看到一只杜宾犬在叫，可能会认为它充满敌意而不是在嬉闹。回家后，你可能会上网搜索“杜宾犬伤人事件”而不是“杜宾犬救婴儿事件”，甚至搜索更粗略的“狗伤人数据”。


