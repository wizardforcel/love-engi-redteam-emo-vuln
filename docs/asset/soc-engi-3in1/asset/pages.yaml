- pgno: 516
  md: '![](img/9f6d2369b69b99fb89843058054e5812_516_0.png)


    图 6-6  双唇紧闭表明是在生气


    当她看着你的时候，双唇紧闭，如图6-6所示。即使是在压抑愤怒的情况下，紧闭的双唇仍是愤怒的标志。在本质上，紧闭的双唇能阻止我们说出那些拼命想说出的话。紧闭的双唇也暗示做这个动作的人正在考虑是否要采取行动，或者应该采取怎样的行动或反应。


    我们还要注意撅起的嘴唇。像紧闭的双唇一样，撅嘴也可以暗示欲语还休的状态。不过撅嘴不代表生气，而是不确定。当你问别人一个她不确定怎样回答的问题时，你是不是会看到如图6-7所示的反应呢？'
