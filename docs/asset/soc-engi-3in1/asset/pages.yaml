  md: '关于心理反应的最后一点是：有很多其他因素影响着人们对你的反应，但是请记住，大多数时候社会工程人员都是在寻求帮助。帮助行为是一个非常庞大且复杂的话题，但是有些部分显而易见。大多数人在考虑是否要帮忙时，都能清楚地权衡风险和/或麻烦。一般来说，人们更可能帮助女性和孩子，也更可能在心情好时帮忙。最后，当周围有人时，人们可能不那么愿意帮忙。（除非有人先跳出来帮忙——社会认同，不是吗？）


    专业建议 人们所处的状况显然可以被用来施加影响。理解特定行为的效果可以使社会工程人员控制自己的行为，从而创造条件让目标说“好的”。


    # 3.8 关于操控需要知道的事


    因为操控对你和你的公司无疑是不利的，所以我想快速概览一下一些常见的手段。（没错，我不会为这一节提供专业建议的。）图3-7为下面的条目做了一个总结。


    +   - 增加易感性 。恶意社会工程人员会用一切手段增加人们对于建议和错误决策的易感性。之前你读到的对强烈情绪甚至生理反应的激发都是让逻辑思维短路的重要办法。\n-
    环境控制 。恶意攻击者进入受害者的生活圈子后通常都会这么做。无论在网络上还是现实世界中都可以找到很多这样的例子。\n- 强制重新评价 。攻击者会让目标对自己所知道的和学到的东西产生怀疑。这一手段通常和其他方法一起使用，例如威胁与恐吓。\n-
    权力剥夺 。通常和权力滥用相伴随，攻击者会让目标觉得除了服从以外没有其他选择。\n- 惩罚 。我在本章中讨论过这一点，这是负面结果的直接运用，会让那些目睹而非经历负面结果的人感到害怕。\n-
    恐吓 。惩罚是利用负面结果，恐吓则是利用惩罚来威胁。'
