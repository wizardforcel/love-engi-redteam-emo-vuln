- pgno: 494
  md: '此时我已经走到了接近前门的位置。他为我打开了门，之后我尾随他进入了公司。他因为我对他的鼓励感谢了我。之后他走他的，我走我的。能够迅速地观察到面部表情并做出回应，让我准时机在他人接受的情感层面与其互动。前面的互动让我取得了成功，最终我得以潜入公楼。


    轻视是我不推荐呈现的几种情绪之一。作为社会工程师，我看到过或者使用过轻视的情绪（如同在拉尔夫的案例中的表现），但是我并不想加入那种感觉。如果一直怀有轻视的情绪，那么这种情绪就会转变成愤怒。因为这种情绪会将我们带向消极的路径，所以我会丢弃这种情绪。


    # 分解


    轻视的情绪包括以下感觉，如优越感、装模作样，或者自大。这种情绪的呈现往往是单侧的，或者只由面部的一部分完成。比如扬起一侧的嘴角，抬起同侧的脸颊或酒窝。社会工程师要能够发现这些迹象，包括对方因为轻视情绪而表现的蛛丝马迹。这些迹象如下。


    +   - 扬起一侧的脸，仿佛是脸颊的挤压导致了眯眼，如图5-14所示。


    ![](img/9f6d2369b69b99fb89843058054e5812_494_0.png)


    图 5-14　请注意抬起的脸颊


    +   - 扬起下巴，如图5-13所示。这样做是为了俯视所轻视的对象。


    +   - 很多情况下，在表现轻视的情绪时，颊肌会抬起，脸部同侧的唇角也会不对称地向上扬起。如图5-15所示。'
