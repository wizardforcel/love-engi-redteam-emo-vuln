- pgno: 661
  md: '# ### 4.2.1 点击链接后感觉危险该怎么办


    不幸的是，这种情况的确会发生，这也是个很好的问题。首先，如果你是公司的员工，那么请将情况反映给IT部门或者给安全部门。这可以节约你和公司很多时间，免得你们头疼，也可以避免将来发生的问题。


    但是如果你并不是某家公司的员工，那该怎么办？首先，回想一下当你点击链接后，网站向你发出了什么请求。你被要求提供账户信息吗？被要求输入用户名和密码吗？被要求下载一个文件，然后安装一个“程序”吗？


    如果网站要求你输入账户信息，而你又输入了你的账户信息或者创建了全新的账户名和密码，那么你就要尽快采取特定行动了。首先，你需要确认是否在其他地方也用了相同的用户名和密码。如果你这么做了，那么立刻去那些地方修改你的账户名和密码。（我等着……）


    如果你有一个邮件中所提到的公司的账户，而且你把它输入到了网站里，那么给那家公司打电话，并告诉他们你可能把你的账户信息告诉了某个恶意的组织。让公司立刻修改你的账户信息以保证你的账户安全。


    如果你安装了一款邮件中要求你安装的程序，那么很有可能你安装了一款病毒软件、木马或者其他恶意程序。你需要清理你的电脑，并在另一台安全的电脑上修改你大多数账户的用户名和密码（或者你可以在清理了你的电脑后再立刻这么做）。


    因为我不可能知道你中了哪种病毒，所以无法就你接下来该怎么做给出更多细节性的指导。如果你不知道怎么处理病毒和恶意软件，那就给专业人士打电话寻求帮助。


    不过无论如何，不要惊慌失措。监控你的重要账户，确保没有异常发生。也可以对你的密码进行一些修改来获取最大程度的保护。


    我说不要惊慌失措时，并不是说你不应该紧张。你应该尽快采取行动，但是惊慌往往会使事情变得更糟。深呼吸，想想该怎么办，然后立刻修复可以修复的东西来防止进一步的损失。


    # ### 4.2.2 攻击者是如何绕过防御的


    攻击者会意识到潜在的受害者可能受过悬停训练。很多邮件服务商甚至会检查URL是否和邮件文本中显示的不同。攻击者可能会购买相近的域名来掩饰他们用来攻击的真实的域名。举例来说，如果一个攻击者购买了http://secure-你的银行
    .com域名，而你在链接上悬停了一会儿，你会以为看到了“正确”的域名，那么这'
  merge: -1
  img_proc: true
- pgno: 662
  md: '会让你信以为真，然后点击它。这时批判性思维就起了重要作用：你的银行是从这个域名给你发邮件的吗？如果你有所怀疑，那就该检查一下。


    其他攻击者会用注册过的证书来使得网站看起来合法和安全，并且攻击者的确拥有这些证书。这些证书可能会以狡猾的方式命名，使用受信任的（trusted）、安全（secure）或者其他字眼来使你相信点击这些链接是安全的。


    另外，黑客会攻击全球范围内的真实的服务器，并用合法服务器来发送钓鱼邮件。他们利用人们对这些服务器的信任来诱使他们点击恶意文件或者链接。是的，黑客正在攻击网络，然后隐于幕后，利用邮件服务器或者面向互联网的设备来发送邮件。通常攻击者会获取这些设备上的邮件地址，然后利用这些邮件地址来联系第一批受害者。


    请谨慎处理这些问题。虽然悬停可以帮助你抵御攻击，但是始终记住点击前请三思。


    # # 4.3 第三课：URL解析


    +   - 分类：普通和专业


    在本节开始前，我要先声明一下，本节不是写给那些网络专家或者对网络非常熟悉、懂得基本的URL解析的人的。本节是写给那些为了保证自己安全而试着去了解URL的人的。因此，如果你觉得本节内容太过基础以至于想给这本书差评，请你停下来，跳过这节。


    如果你不符合上面的描述，那么请继续阅读这一节。URL是uniform resource locator（统一资源定位符）的缩写，即索引至互联网资源的一种地址。就像我的地址一样，如果我告诉你我的地址，你把它输入GPS中就可以找到我家。同理，你输入的URL地址可以带你访问想要访问的资源。举例来说，图4-4展示的是我的公司主页的URL。


    ![](img/9f6d2369b69b99fb89843058054e5812_662_0.png)


    图 4-4　我的公司主页的URL


    URL有很多组成部分，如http、://、www、social-engineer和.com，但是每一个部分代表什么含义呢？让我来逐一为你解释。'
  merge: -1
  img_proc: true
- pgno: 663
  md: '+   - http指访问地址所使用的网络协议。http指标准的网络地址，https则指有SSL（Secure Socket Layer，安全套接层）证书的网络地址，ftp指FTP服务器的协议。还有很多没有列出来的协议，但是大部分钓鱼邮件都利用http或者https。

    +   - www指服务器的子域名。子域名可以是此类形式：ww1、files、secure、blog，或其他形式。

    +   - social-engineer指服务器的域名。

    +   - .com是服务器的TLD（top-level domain，顶级域名）。它可能指一个国家如俄罗斯（.ru）、一个组织（.org）、一家企业（.com），以及其他含义。

    +   - TLD后可能会有一个斜杠（/），斜杠后接的是你想访问的资源的存放目录。


    如果我想给你发送social-engineer.com网站下的一个名为privatefile.txt的文件的地址，并且该网站使用标准网络协议，那么该网络地址的形式如图4-5所示。


    ![](img/9f6d2369b69b99fb89843058054e5812_663_0.png)


    图 4-5  privatefile.txt文件的URL


    为什么理解URL的含义如此重要？因为很多恶意钓鱼攻击者就是利用你知识上的不足来欺骗你。举个例子，如果我声称来自微软，并希望你下载一个名为file.txt的文件，那么你能根据上面所讲的URL知识来判断下列网址中哪些属于微软，而哪些有潜在威胁吗？


    +   - http://microsoft.com/file.txt

    +   - http://secure-microsoft.com/file.txt

    +   - https://secure.microsoft.com/file.txt

    +   - http://microsoft.com/secure/file.txt'
  merge: -1
  img_proc: true
- pgno: 664
  md: '+   - http://rnicrosoft.com/file.txt


    你觉得你做得怎么样？下面对每一个网址进行了分析。


    +   - 第一个网址是合法的，虽然它缺少了www，但它确实指向了一个真实的微软网址。

    +   - 要小心对待第二个网址，它可能并不属于微软，因为secure-microsoft.com中的“_”表示它和微软（microsoft.com）的域名完全不同。

    +   - 第三个网址是安全的。它属于合法公司，并且文件位于安全的https服务器上。secure子域名是隶属于微软的域名的。第二个网址则试图伪装成一个安全网址，但实际上使用了“-”而不是“.”来分割地址。“.”意味着该子域名属于主域名，而“-”指一个全新的域名，因此第二个网址是不可信的。

    +   - 第四个网址也是合法的。它只是位于下一级域名。

    +   - 第五个域名很有迷惑性，不是吗？看仔细了，并不是m-i-c-r-o-s-o-f-t，而是r-n-i-c-r-o-s-o-f-t。把小写的R和小写的N放在一起时，如果靠得足够近且字体合适，那么它们看上去就像一个小写的M。


    恶意钓鱼攻击者还有很多引诱受害者点击链接的手段，这也是为什么学习解析URL是如此重要的原因。


    这里讲一个我的人生中很重要的故事。有人雇用我进行钓鱼攻击。是的，你没看错。正如前面所提到的，截至你阅读这本书时，我这一年内已经发送了超过300万封钓鱼邮件。这个数目很庞大。


    虽然如此，每一封钓鱼邮件都是应客户要求而发送的，以帮助他们对员工进行培训，我自己也在安全培训课程中把钓鱼邮件作为课程的一部分。我并不会从其他人那里窃取什么东西，也不会清空他们的银行账户或者毁掉他们的人生。


    还记得第1章里我访问的假冒亚马逊网站吗？我是说那封钓鱼邮件，我已经发送超过300万封钓鱼邮件了——我难道不该察觉到那是一封钓鱼邮件吗？我本该知道的，但是我差点就上当了。你知道是什么救了我吗？URL解析，因为发送给我的邮件里网址是以.ru结尾的，所以我察觉到这是一个假冒的亚马逊网站，即使它的页面和真的一样。


    即使是有经验的安全专家也会犯错，但是接受相关培训，例如URL解析，可以帮助你降低遭受侵害的风险。'
  merge: -1
  img_proc: true
- pgno: 665
  md: '# 攻击者是如何绕过防御的


    和前面描述的悬停一样，攻击者可以购买一些看起来合法的域名。这些域名和真实域名越是相近，你就越容易相信它是真的。


    攻击者也可以购买一些看起来相近的域名。再次强调，secure-DOMAIN.com是一个不同于DOMAIN.com的新域名，但如果它以一个合法的名称结尾，那么受害者就可能认为这是合法的网址。


    同样，黑客会攻击全球范围内的服务器，然后利用这些合法服务器来发送钓鱼邮件。这类攻击是相当危险的，也很难检测。悬停和URL解析可以帮助你免受其害。


    运用批判性思维，点击前停下来想一想，以及问自己一些分析性问题，这些方法都可以帮助你从容应对。还有就是记住，如果你已经采取了错误的行动，请及时上报相关部门。


    # 4.4　第四课：分析邮件头


    +   - 分类：专业


    本节提供的是专业建议，因为它深入分析了邮件来源。如果你对邮件头不熟悉，那么本节内容并不适合你。由于有大量的邮件服务商存在，我无法告诉你如何定位每家服务商的邮件头，但是我可以告诉你它们是什么，以及你可以如何利用它们。


    你可以在你选定的搜索引擎中输入 **Email headers in <服务商名称>** 来弄清楚你自己的服务商的邮件头。


    回到GPS地址的类比。你来我家之后，我可以查看你的行程的历史记录来确定你是走的哪条路线。如果你告诉我你走的是第一条路线，但是GPS显示你花了大量时间在第二条路线上，那么我就知道你迷路了或者换了一条路过来。


    邮件头与此类似，它们可以告知你邮件是如何到达你的邮箱的。来看看我在写这一章时收到的一封邮件。这封邮件声称来自达美航空公司（Delta Airlines），并说我的航空里程账户有异常情况需要注意。


    让我们看看能否根据邮件头来判断邮件的真假。邮件头如图4-6所示。'
