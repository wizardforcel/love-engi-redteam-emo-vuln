- pgno: 473
  md: '![](img/9f6d2369b69b99fb89843058054e5812_473_0.png)


    图 4-11  相当熟悉的耸肩动作


    这个非语言动作的有趣之处不仅在于做这个动作的人往往会说“我不知道”，还在于是时候动作和言语是不符的。接下来我会举一个例子来说明。'
