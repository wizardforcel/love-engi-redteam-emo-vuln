  md: '旁，当然，作为父亲，我不想让他失望。工作人员点击PDF的时候自然不会看到我们的票，而她的计算机已被恶意代码感染，这段代码能使我入侵她的计算机并开始自动收集信息。将谈话录音，我使用的方法以及设计的故事情节为该公司上了一堂课，以后碰到类似的情况就不再会被攻击了，从而避免了数千美元的损失。


    一种使用现实充值卡的设备能通过手机信号给任意指定号码发送音频内容。社会工程人员可以随时拨入聆听录音内容。这个设备可用于在社会工程攻击中获取密码或个人信息，从而为社会工程人员节省了大量的时间。


    人们可以花好几个小时谈论各种精巧超酷的摄像机（我也可以写好几千页）。图7-11和图7-12展示了执法者普遍使用的一些“间谍装备”（[www.spyassociates.com](http://www.spyassociates.com)）。信不信由你，图片中的所有物品里都隐藏了摄像机或录音设备。可以使用其中任何一种设备秘密记录目标者的信息，以备分析。


