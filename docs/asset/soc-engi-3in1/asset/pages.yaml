- pgno: 60
  md: '侵者有机可乘。社会工程人员只要找到提供该服务的厂商，就可以轻而易举地冒充完成过去收“垃圾”（粉碎过的文件）的工作人员。无论如何，翻找垃圾箱是一种快速收集所需信息的方法。不过，翻找垃圾箱时一定要记住以下几点。


    +   - 穿质量好的鞋子或靴子。没有比跳进垃圾堆，然后被钉子戳到脚更令人抓狂的事了。确保你的鞋子合脚且鞋带系紧了，并能保护脚不为利器所伤。

    +   - 穿深颜色的衣服。这点不需要过多的解释。你肯定会穿那些丢掉也不会心疼的衣服，而且深色的衣服不容易被发现。

    +   - 带一个手电筒。

    +   - 拿到了赶紧溜。除非你是在偏僻到不可能被抓到的地方，否则最好是拿走一些垃圾袋，到其他地方去翻找。


    翻找垃圾桶几乎总能找到一些非常有用的信息。只是有的时候，社会工程人员不需要去翻垃圾桶就能得到这些信息。第1章中有一个例子，详见 [http://www.social-engineer.org/resources/book/TopSecretStolen.htm](http://www.social-engineer.org/resources/book/TopSecretStolen.htm)。加拿大反恐部队计划建造一栋新的办公大楼，然而这栋大楼的一些规划蓝图被当做垃圾扔掉了，甚至都没有经过粉碎。蓝图中包括监控摄像头的安装位置、围栏及其他绝密信息。还好，发现这一图纸的人没有恶意，否则后果不堪设想。


    正如该文章所写的，这则故事只是用来展示很多“愚蠢至极”行为中的一种，但是从社会工程人员的角度来看，翻垃圾桶确实是最好的一种信息收集方式。


    # ## 2.2.4 运用分析软件


    第7章将细致讨论社会工程人员会用到的专业工具集，这里仅作简单介绍。


    Common User Passwords Profiler（“常用用户密码探查器”，缩写为CUPP）和 Who’s Your Daddy（“谁是你爸爸”，缩写为WYD）是两款常用的密码分析工具，社会工程人员可利用它们分析出企业或个人可能使用的密码。


    第7章将深入讨论这些工具的使用方法。WYD这样的工具可以将个人或者公司网站上的信息收集起来，根据网站上涉及的词语来创建可能的密码列表。人们通常会使用文字、姓名或者日期作为密码。这种类型的软件能够轻而易举地生成密码列表。'
  merge: -1
  img_proc: true
- pgno: 61
  md: '像Paterva制作的Maltego工具（第7章有详细介绍），简直就是信息收集者梦寐以求的。这款工具本身就可以帮助社会工程人员完成基于网页的被动信息收集和查询工作，不需要借用其他任何平台或工具。


    之后，Maltego可以存储这些数据并在屏幕上用图形化的方式展现，以用于报告、导出或其他用途。这些对于分析公司信息相当有用。


    记住，收集数据的目的是了解目标企业及其员工。一旦社会工程人员收集到足够多的数据，如何最充分地利用这些数据信息来操纵目标便会了然于胸。应该将目标公司作为一个整体来分析，了解里面的员工大致参加哪些俱乐部、他们的兴趣爱好或者加入的社团名称。他们会不会向特定的慈善机构捐款？或者他们的孩子都就读于同一所学校吗？这些信息对于深入分析都很有帮助。


    清晰明了的分析不仅可以帮助社会工程人员很好地伪装，而且还可以让他们知晓要询问哪些问题，什么时候适合打电话及哪天适合当面交流等，还有会令攻击变得更加容易的很多其他线索。


    前文提到的所有方法，大多是现实生活中手动的信息收集方式，并未涉及信息收集的技术层面，例如，简单邮件传输协议（SMTP）、域名服务（DNS）、网络基本输入输出系统（Netbios）和简单网络管理协议（SNMP）。第7章中细致地讲解了Maltego软件中有关于述信息的收集功能。这些方法值得探讨，但是技术性较强，并不是本书所关注的“人性”入侵技术。


    逻辑上，无论使用何种方法收集信息，首先浮现在你脑海中的问题可能都是：既然知道收集信息的地点、方式以及分类、存储并显示此信息的方法，那么如何使用搜集到的信息呢？


    作为一名社会工程人员，信息收集完成后，必须开始规划如何攻击。为此，首先要建立模型，列出信息使用攻略。交流模型的建立便是最佳的开始方式之一。'
