  md: '![](img/9f6d2369b69b99fb89843058054e5812_59_0.png)


    图2-6　只要肯花时间且有耐心，文档是能拼接回去的


    不过，使用双向粉碎机进行销毁，就会粉碎得相当细，几乎不可能再拼接起来，如图2-7所示。


    ![](img/9f6d2369b69b99fb89843058054e5812_59_1.png)


    图2-7　很难想象粉碎前它是纸币


    很多公司付费将已经粉碎了的文件交给专业公司焚烧。也有一些公司直接将粉碎完毕的文件丢给第三方处理，之后就不管不问了。你大概也能猜到，这样会令人'
