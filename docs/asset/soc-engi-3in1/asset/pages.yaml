- pgno: 480
  md: '我之前提到的七种基本情绪是感觉的基础。在《情绪的解析》一书中，艾克曼博士将情绪定义为“一种受人们自己的过去影响的过程和特定的自动评价。在这个过程中，我们感到与我们的幸福相关的某些事发生了，之后我们通过一组心理变化和情绪性行为来处理这种情况”（原书第13页）。也就是说，我们可以将情绪定义为我们的大脑基于之前的经历和生物活动而形成的一组心理原则，用来处理我们当前遇到的任何情况。


    我们都有内置的指令集，它们建立在我们的童年经历、精神特质、道德和个人信仰结构基础之上。想象你现在在一家杂货店，你无意中听到一位妈妈在责骂孩子。这位妈妈用了贬损的方式，甚至说孩子蠢。你会怎么做呢？你的大脑自动运行“代码”来决定你的感受。如果你的父母这样对待你，或许你会同情那个孩子，替他难过。如果你的父母是有礼貌和充满爱意的，那么那位妈妈的责骂会触发你的愤怒情绪。你会想父母怎么可以如此对待孩子。在大脑反应最初的几秒钟内，你或许不能终止要运行的程序。代码已经注入你的系统中，之后肌肉的、心理的以及身体上的反应都被触发了。情感触发点带来了以下感觉：愤怒、烦恼、挫败和不开心。这些感觉是情绪和情感触发点带来的效果。


    在理解这些感觉后，我们也就能理解情绪的发生是有程度之分的。比如，爱是一种情绪还是一种感觉？如果认为那是一种感觉，那没错。爱通常被视为一种情绪，但它并不是七种基本情绪中的一种。更确切地说，爱是一种来源于情绪的感觉。


    当我们开心的时候，会促使我们去爱。惊喜也能促使我们去爱。爱也可能是哀伤的，会让我们感到恐惧。爱本身并不是用于处理某种情况的“一组心理变化和情绪行为”。我们要牢记这一点。


    下面会详细分析每种情绪，进而帮助你了解如何在交流过程中使用这些情绪。


    # # 5.2.2 恐惧


    想象此刻你正在看电影，电影中一位女士伴着某种不祥的音乐穿过了一个黑暗的房间。音乐暗示着有什么事情即将发生，让你预先感受到了某种情绪内容。突然，一名攻击者从黑暗的角落里跳了出来，手里还挥着刀，会发生什么事呢？


    你或许会因为紧张而倒吸一口气或者尖叫起来。头和身体也跟着向后退，远离让你害怕的东西。这一切是对“或战或退”的心理决策的反应结果。你的身体随时准备着战斗或者逃避。但是在这种情况下，你多半会选择逃避。


    当你感到害怕的时候，情绪更多地经由面部表现出来。如图5-2所示，你会挑起眉毛，睁大眼睛，张开嘴巴倒吸一口气，咧开双唇。你的面部和身体都会变得紧张起来。'
