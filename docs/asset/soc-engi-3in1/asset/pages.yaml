  md: '不幸的是，安全专家的工作越来越多。我们发现只有少数组织机构愿意花钱在咨询或大型团队上，因此专业安全人员在这些公司里不得不身兼数职。显然，最好是由熟悉钓鱼攻击的人来进行钓鱼攻击培训和测试。但是即使这些你都没有，还有一些事情是你可以做的。


    +   - 紧跟流行的钓鱼攻击方式，可以通过访问 [www.apwg.org](http://www.apwg.org) 和 [www.socialengineer.com](http://www.socialengineer.com)
    这类网站。如果你仍然认为钓鱼攻击是一种由没受过什么教育的恶棍发起的低威胁性攻击，那么更新你在相关领域的知识可能是明智的。希望本书可以帮助你建立一些钓鱼攻击的基本概念。


    +   - 把钓鱼攻击和普通社会工程学教育纳入你的安全意识培训中。你的工作一开始也许不能覆盖所有的情况，但通过这些方法来提醒你的员工总比希望问题自己消失要更好。


    对钓鱼攻击的性质和范围有所了解后，你的最终目标是开展一系列连贯的课程，能够进行定期测试和培训，并教导所在的组织机构如何识别和应对现实生活中的钓鱼攻击。


    # 8.1.2 为组织机构设定合理的目标


    在理想的世界中，我们会捕获所有发送进来的恶意邮件，并不受干扰地开展日常工作。然而这并不现实。既然如此，又该如何设定切合实际的目标呢？设定目标是开展钓鱼攻击培训的基础。如果你不清楚你的目标，那么你也不会知道何时到达，或者如何在工作过程中纠正它。


    目标设定高度取决于你的企业文化和领导力。你的公司长期都有高营业额吗？对你所在的公司而言，有效沟通是常态吗？你处在一个高度响应式管理的环境中吗？在钓鱼攻击安全意识方面，你知道你们公司正处于何种水平吗？在设定切合实际的目标时有很多因素要考虑，下面列举了一些以供参考。


    +   - **期限**。你希望多久可以看到变化？即使在小公司内，相信员工行为会在几个月内发生改变也是不现实的。有的客户花了几年的时间致力于在公司文化中创建安全意识并对其进行提升。钓鱼攻击教育并非一劳永逸。除非钓鱼攻击威胁不复存在，否则有效的钓鱼攻击培训项目不会终止。虽然如此，企业文化在几个月内就发生变化也并非完全不可能，只是要明白通常需要更长的时间才能看到显著的变化。


    +   - **指标**。你该如何衡量这种变化？如果不认清现状，那就无法衡量哪些提升是有意义的。如果选择每次只测试一部分人，那么观察每月点击率的变化是无'
  merge: -1
  img_proc: true
- pgno: 759
  md: '意义的。不妨考虑其他的改变指标，例如报告的情况，或者更具体的行为，例如恶意软件侦测率（恶意软件通常是钓鱼攻击带来的）。


    合理的目标是有效开展项目的基础。


    # ### 8.1.3 规划培训项目


    除了每月、每季度或每年随机发送一些钓鱼邮件，一个持续的钓鱼攻击培训项目还有很多要做的事情。你已经设定了目标，但要怎么做才能达到呢？问问自己下面这些问题。


    +   - 使用哪种钓鱼攻击工具，为什么？

    +   - 如何划定公司的基线？

    +   - 应该以何种频率发送钓鱼邮件？

    +   - 每次提升难度要等待多久？

    +   - 如何汇报检测结果（点击率、报告率、其他指标）？

    +   - 对于可疑邮件，员工应该如何处理？

    +   - 员工可以利用哪些途径报告可疑邮件？

    +   - 如何对待“累犯”的员工？

    +   - 如何对待表现良好的员工？

    +   - 如何把上述这些问题纳入相关培训之中？


    你的培训计划应该将上述问题中的因素都考虑进去。前期准备工作越充分，培训项目进展就会越顺利。你甚至能够预判今后可能会出现的问题，并且至少你对如何进行相应的调整能有一些想法。


    # ### 8.1.4 理解指标


    最近有一位欣喜若狂的客户向我们报告说一个月之内点击率下降了50%。50%！可喜可贺，是吧？好吧，可能是。这里有个问题：他们已经决定每个月只测试一小部分人，目标是一年内测试完公司的所有人。这意味着在此时间段内，没有人会接受重复测试。既然如此，一个月的点击率下降又能说明什么？或许员工之间彼此谈论此'
  merge: -1
  img_proc: true
- pgno: 760
  md: '事，于是所有人都知道了公司正在进行钓鱼攻击测试。或许第二组员工碰巧遇到了更容易识别的钓鱼攻击。再或许第二组恰好比第一组更懂钓鱼攻击技术。我们无从得知点击率下降的原因。


    你需要明白数字能说明什么和不能说明什么。对于一个有统计学上的显著差异的数字集合来说——也就是说，每组数据之间的区别是由于一个控制变量所致，而非偶然——某些特定条件肯定存在。这是统计人员研究的问题，已经超出了本书讨论的范围，不过你的的确需要考虑一下。


    很多因素都可以影响测试结果。也许我们问了正确的问题，但这些数据组仍然可能在其他无意义的方面展示出显著的差异，例如喜欢的音乐类型、IQ、子女的数量。明白我的意思了吗？因此，我并不能很肯定地说这个月相比前一个月的显著差异是非常有意义的。但如果这个趋势持续下去，那么我们就可以得出某些积极的结论，甚至不用等你的统计人员开口。我们想强调的关键一点是，如果你持续得到80%的点击率，而报告率几乎为零，而下个月你发现点击率只有10%，那么在你庆祝钓鱼攻击培训终于大功告成之前，请先想想为什么这一切会发生。


    你的员工都出去度假了吗？报告率是否也随之上？钓鱼攻击邮件里有某个很多人都关注的问题吗？数据出现峰值的原因是什么？如果这只是偶然状况，那么下个月你会发现数据又变糟了。当你看到数据持续好转时，就可以开始庆祝了。


    最后，要考虑这些指标究竟是在为什么服务。我们明白有些指标对于帮助你量化培训效果十分重要，并且坦白来说，能为公司管理层提供该培训项目物有所值的依据。但是记住，培训项目理论上是为了帮助你的员工识别和应对钓鱼攻击，而不是制造一页又一页的统计数据。


    # 8.1.5 适当回应


    目前为止，我们希望你已经清楚这一点：我们致力于通过创建安全文化和对员工进行培训来排除安全隐患，而不是排除你的员工。好的培训能让雇主和雇员都从中受益匪浅。通过塑造员工对钓鱼攻击的防范能力和警惕性，你所培养的好习惯将会带入到他们的个人生活中去。好的安全培训项目唯一的缺点是会花费很多时间、精力和资源。不幸的是，据我们了解，过去的观点是在安全上的花费都是强制性的。舍弃这种投资的风险太大。好消息是，尽管如此，对你所在的组织机构而言收益仍远大于投入。


    然而有些人就是不明白这些。尽管有训练和大量的警告，这些人仍然点击他们收到的邮件中的每个链接。他们在论坛上使用自己的工作邮件地址。他们在社交媒体上公布你们公司的内部工作细节。不幸的是，这些人的确将你们置于险境。'
