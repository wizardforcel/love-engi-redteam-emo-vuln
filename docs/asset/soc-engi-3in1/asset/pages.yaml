  md: '+   - 体贴（Thoughtful）　你知道员工每天有多少事要做吗？每天要承受多少压力吗？如果你知道，那么你就会在准备培训课程时深思熟虑，这样才不会给他们繁忙的生活增添额外的压力。与此同时，你还让他们做好保护自己、家人和公司免受钓鱼攻击侵害的准备。你是多么体贴啊！


    我见过很多人出于好意，将BEST方法改造得过于复杂，但实际上造成了反效果——这会让员工感到受挫或者迷茫，而不是学到知识并受到鼓舞。如果你忠实地按照BEST方法来操作，那么通常会有好的结果。例如，有一家我们合作过的公司通过使用本章提到的方法，从一开始89%的点击率和不到10%的报告率，改善为7%的点击率和75%的报告率。


    当然，培训项目的最后一步是重复。不要认为一年一度的钓鱼攻击培训就足以保护你的员工。


    我来问你一个问题，你需要如实回答。读完下面这个问题后，你有五秒钟的时间作答。


    请说出过去一年的安全意识培训课程中最高的三个分数……开始计时。


    如果你如实回答，那么你可能会盯着这个问题想一会儿，然后说出一个分数，但是很可能说不齐三个。对于员工收到钓鱼攻击邮件后的反应时间来说，五秒钟已经很长了。不要指望他们能够回忆起去年你给他们开展的训练内容。假如我是你的员工，那么超过45天你就不用指望我还记得了。


    # 5.3 总结


    读完这一章后，你可能会想：“哇，有好多工作要做。我得碰碰运气。”实话实说，开始时确实需要做一些工作。有时候从上级部门、人事部门、法律部门和其他部门那里获取授权就需要不少努力。开展项目的同时还不引起所有人的反感也不容易。但是一次又一次地，我们在帮助公司推进项目的过程中就已经看到了回报。


    有一家公司报告称与邮件有关的恶意事件减少了70%。70%！仅这一点就会让人觉得前面所做的一切都是值得的。这家公司可以讨厌我，但有70%的员工都不会像去年一样遭受恶意软件的威胁，这就足够了。


    钓鱼攻击之所以存在，是因为对恶意攻击者来说，这一手段简单、有效、有利可图。你需要保持警惕与顽强的精神，坚持推动培训继续下去，并努力让它实现效果最大化。'
