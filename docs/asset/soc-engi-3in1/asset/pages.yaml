  md: '信息对于社会工程师的意义就如血液之于身体。社会工程师掌握的信息越多，他得到的媒介（或者说渗入的方法）就越多。他对目标对象了解得越多，对目标对象的优劣势也就能了解得更清楚。


    关于采集信息的方法，既可以通过互联网收集信息，比如谷歌和Maltego（互联网情报聚合工具）；也可以亲自采集，比如拍照、定位以及诱导。


    如今，互联网的力量让信息采集变得更简单，这也意味着社会工程师能够获得更多的数据。了解如何分类和储存这些信息至关重要。我对目标对象进行了一个名为DAP（详细行动计划）的实践。其中包括针对目标对象发现的信息，观察到的态度或行动以及这些信息是如何收集到的。之后将我想使用的媒介与这些信息相互关联，使其成为针对每个目标对象的行动计划。


    社会工程师及慈善家约翰尼·朗曾是一名道德黑客，他开发了早期的谷歌黑客数据库。这个搜索器可以在谷歌上运行并找到形形色色的信息。在过去的几年里，Offensive
    Security公司的⼈们接管了这个项目。现在的网址是 [www.exploitdb.com](http://www.exploitdb.com)。


    除了上述工具外，还有如Maltego的工具。它允许你收集他人、网站或者公司的数据，并能将这些数据以图解的方式进行标示，以方便阅读和使用。更多信息详见 [www.pateva.com](http://www.pateva.com)。


    近期我发现谷歌地图和必应地图也非常好用。当我们将地点放大到足够大时，就能在这两个网站上看到这个地点的“街景”。如果在接近某个建筑物或者地点前，你已经了解到了它的布局、防护措施、摄像机位置等，就会大大节省现场考察的时间。


    然而，对于社会工程师来说，收集信息的经验法则就是“所有的信息都是有用的”。即便是很少的信息也可能对全局的成功起到很大的作用。


    # ## 2.2 托辞


    我们在使用托辞的时候会将自己扮演成相应的人，并做出相应的事。这个过程从某种程度来说像是体验派表演方法。我们会变成自己伪装的人。穿着、身份证件、肢体语言以及知识都可以让托辞变得可信。


    在本章最初举的那个例子中，我的托辞是自己是“废弃物处理公司的员工”。为了成功实行托辞，我还需要做一些计划。我得确保自己的着装能让目标对象相信我就是我所说的那个人。正如我在第1章谈到“着装认知”时所说的，我要借助自己的着装成为我所说的那个角色，并传递出正确的信息。


    我的身份证件很逼真。我的肢体语言需要暗示一个“蓝领”身份，而不是高管身份。我还需要了解一些相关知识让自己的托辞更完善。我需要知道垃圾压缩机的相关内容，编号的位置，我要找的是什么，以及任何我的“工作”需要的工具。'
