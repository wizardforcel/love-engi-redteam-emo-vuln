  md: '理、生理和精神上的原因吗？只有能够真正站在对方的角度考虑问题，才能构建坚实的共识，否则你意图影响他人的努力将归于失败。


    此外，你不要总想着通过逻辑来创建共识。有一次我到医院看一位挚友（死于喉癌）。他吸烟40多年，有一天发现自己得了癌症。癌细胞扩散得很快，他只能住进医院度过生命的最后时光。他的儿女到医院看他，但是每隔一阵就要离开病房。我想他们一定很痛苦。有一次在他们离开病房后，我跟出去想安慰他们，竟然发现他们在医院外抽烟，我顿时哑口无言。我没有抽烟的习惯，以后也不打算抽烟，虽然知道烟瘾是很难克制的，但我不能理解，在看到父亲的痛苦后他们是怎样点燃那根烟的。


    在这里运用逻辑丝毫没有用处。用吸烟的坏处和对健康的危害来劝说朋友的孩子不会奏效，因为这些话没有任何价值，只会让心情沉重的他们反感，让我一吐为快罢了。在了解对方之前，你是很难通过构建共识影响对方的。


    要使他人想要做一件事，需要从感情和逻辑两方面入手，很多时候还需要理解和谦逊。有一次我去某个办公室处理一些事，因为在外面听到一些有趣的笑话，所以在走进大厅的时候我一直在笑。站在接待台后的女士刚刚肯定是做了一件尴尬的事情，因为她看见我笑的时候，立刻变得很愤怒，并且大声对我说：“没什么好笑的吧，你这个混蛋！”


    我不认识这位女士，并且知道这件事对我心中的目标没有一丝好处。而且对于她觉得我在嘲笑她且会进行反击这件事，我觉得受到了侮辱。不过，我看到她很难受，于是走近接待台，我不是要让她更难受，而是望着她的眼睛，亲切地说：“如果你认为我在笑话你的话，我很抱歉。我之所以笑，是因为在停车场的时候，你同事在说有关周末聚会的事，我认为很有趣。”


