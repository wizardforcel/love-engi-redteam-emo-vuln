    在图6-8中，本表现得有点不舒服。他不仅不确定自己想不想回答那个问题，还表现出对那个问题感到不满。他的眉毛向下聚拢，这表现出了认知负荷（正在思考），他也很可能生气。在问过一个艰难的问题后，我们要寻找撅嘴的表情，以确定对方是否对谈话感到不适。


    虽然这些并不是欺骗的明显标志，但是如果社会工程师看到这些表现，他可以锁定该目标区域的信息，以观察是不是存在欺骗行为。'
