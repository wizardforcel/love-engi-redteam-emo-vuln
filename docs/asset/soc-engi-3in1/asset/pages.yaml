  md: "如果你的公司里有这么一个人，而你已经试过很多办法来教育他，可是都没什么效果，那么你的选择余地就很小了。你可以把他安排到一个不同的——希望危害小一些的——部门里（想想电影《上班一条虫》里的弥尔顿），或者采用最后的办法：开除他们。开除的代价是需要找人接替他们的位置，然后又需要对新人进行全套的安全培训。\n\
    \n**说明**　我们曾经合作过的一家公司做得很好：员工在钓鱼攻击培训中的表现与他们的奖金和评价紧密相关。这家公司有一个指标衡量员工是否“通过”了培训，他们的奖金会因此受到影响。这确实使人们对培训更上心了。\n\
    \n最后一点关于适当回应的想法：组织机构希望它们的人员通过安全工作和明智决策来支持它们。但更重要的是，这一点反过来也成立：组织机构必须支持它们的人员，并制定鼓励安全行为的政策和流程，不要让人员面临在保持礼貌和泄露信息之中必须二选其一的处境。下面是一些组织机构层面需要思考的问题。\n\
    \n+   - 公司对员工的社交媒体有相关政策吗？\n+   - 目前有验证电话双方身份的程序吗？\n+   - 有内部信息应该如何被存储和分享的指南吗？\n\
    +   - 员工有安全便捷的报告可疑事件的途径吗？\n\n帮助员工就是帮助你自己。在你参与其中的同时，确保公司管理层人员和C级管理者都参与到了项目之中。尽管他们可能不喜欢钓鱼攻击的主意，但是他们可能掌握公司的关键信息，因此是最需要接受培训的。\n\
    \n# 8.1.6　决定时刻：内部构建还是外部构建\n\n最近，我有幸给对钓鱼攻击培训感兴趣的一群人做演讲。有人问进行钓鱼攻击培训实际需要花费多少时间。当然，我不能给出一个准确的时间，但是下面的概述可以告诉你培训大体涉及哪些环节。\n\
    \n+   (1) 确保钓鱼攻击邮件逼真、与时俱进并且有一定相关性，但不要给员工造成心理伤害。\n+   \n+   (2) 经相关部门的批准后发送邮件，这一步涉及修改和迭代。\n\
    +   \n+   (3) 确保列表得到了升级——添加了新员工并移除了已经离职的员工。\n+   \n+   (4) 准备合适的教育页面。"
