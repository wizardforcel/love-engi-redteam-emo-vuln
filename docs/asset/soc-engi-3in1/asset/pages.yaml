  md: '正当保罗思索要怎么做时，电话铃响了。电话那头的人火急火燎地描述了他是怎么把珠宝落在加油站的。保罗告诉他此刻正有一名诚实的顾客将那个盒子交上来了。电话那头的人十分欣喜，并说他要给拾到盒子的人200美元作为回报。保罗挂断电话并告诉这个拾到盒子的人，珠宝的主人要在取回盒子的时候给他报酬。这个人称他还要去面试，所以他得离开了。不过他提出了一个解决方案——他要与保罗分享报酬。保罗要做的就是从收银机中拿出100美元给他。然后，等珠宝的主人到加油站的时候，保罗可以留下100美元给自己，剩下的100美元放回收银机。


    保罗给了他100美元，但是珠宝的主人却没有出现。保罗因此赔了100美元。人们为什么会被这样的骗子所欺骗呢？扎克博士是这样解释的：“骗子之所以能成功不是因为他们劝说当事人去相信他们，而是让当事人认为骗子相信自己。”当我们感觉自己受到信任时，大脑就会分泌催产素。当我们的情绪参与进来，扁桃核被强行控制的时候，逻辑中心就会向相反的方向运行。


    这对社会工程师来说是一个关键点。当别人感觉你信任他的时候，他会以信任的感觉作为回报。这是那些安全爱好者在我的五天课程中学到的宝贵一课。他们没有学习如何欺骗、戏弄或者证明某人并不那么聪明。他们学到的是人们容易被善良和信任掩盖下的骗术欺骗，并且被蒙蔽的时间还会较长。


    在完成第一本书的写作后，我收到了很多采访的请求。其中一个问题吓到了我：“难道你不担心教会坏人吗？万一他们用更多的方法来对付我们可怎么办？”对于这个问题，我的答案无论在过去还是现在都是一样的——如果我们不知道如何进攻，就不能很好地防御。如果你第一次在真正的搏斗中挨了揍，那么结局大概不会太好。这就是为什么人们要学习搏斗和保护自己。在课堂上，人们会进行对打，这时两个人会真实地击打对方，然后学会如何击打，如何挨打，以及如何保护自己不被打。


    这和渗透测试有相似之处——学习如何接受、传递和抵御打击。假如你要准备参加拳王争霸赛，肯定不会随便在大街上找个体重只有80斤的人对打。你会选择技能、重量级、力量和经验值都与你相当的拳击陪练。那么关于渗透测试，你想要找一个什么样的陪练呢？是初次参赛的新手，还是知道如何正确搏击，并且能帮你备战拳王争霸赛的陪练？


    负责网络威胁研究的迈克菲（McAfee）前副总裁德米特里·阿帕洛维奇说过的一段话让我开始更加坚信这一点。他说：“我相信所有行业中那些颇具规模、拥有宝贵的知识产权和商业机密的公司都是缺乏抵御能力的（或不久后就会缺乏），而且其中绝大多数受害者很少发现入侵及其危害。”


    （www.prworld.com/article/237163/McAfee_warns_of_massive_5_year_hacking_plot.html）


    坏人们并不会去书店寻找“如何做个坏人”的书籍，他们会在工作中学习。然而，我们则拥有一些资源帮助自己学习抵御攻击的技能。'
