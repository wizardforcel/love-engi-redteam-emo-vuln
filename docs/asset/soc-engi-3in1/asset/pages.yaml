  md: '图3-1提供了一个影响与操控的可视化的例子。图中添加了一些实现影响与操控的示例方法，我会在本章稍后对它们展开论述。运用前面的定义，很容易理解为什么把指导归为影响，而把威胁归为操控。但是影响和操控中间仍有很大一片待定区域。像所有其他的例子一样，具体情况很大程度上取决于社会工程人员所做出的选择。


    ![](img/9f6d2369b69b99fb89843058054e5812_637_0.png)


    图 3-1　影响与操控


    请求帮助可以是一种强有力的影响形式或者一种高明的操控。通过寻求帮助而进入安全机构是一回事，谎称自己的孩子生病而向人乞讨则是另一回事，并且我认为大多数人会同意这种区别。这种区别重要吗？当然，这取决于你的目标是什么。


    # 3.1　为什么这种区别很重要


    我和克里斯为客户提供专业的社会工程服务和培训。这些客户在意的是他们公司的安全以及员工的发展。从实用的角度来说，与应对人员流动和重新培训相比，在已有员工身上进行投资是一种更好的金融决策。因此，公司不希望他们的员工因被骗而导致泄露信息，或者因点击了一个钓鱼网站链接而感到沮丧。他们知道让员工积极地参与到公司安全工作中的重要性。当员工对自己在这方面的测试、培训和能力提升感到乐观时，他们就更愿意参与其中。正如克里斯所言：“总是要让一个人因为遇到你而感觉更好。”


    你能想象收到图3-2中的邮件，然后发现这是一个经过你们公司同意的钓鱼活动吗？² 发件人显然不能用这封邮件结交任何朋友。这是FBI报告的一个真实的电子邮件诈骗事件。³
    当收件人试图跟进时，会收到更多的威胁和恐吓的信息。


