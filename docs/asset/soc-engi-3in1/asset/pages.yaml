  md: '社会工程网站 [www.social-engineer.org/resources/book/TopSecretStolen.htm](http://www.social-engineer.org/resources/book/TopSecretStolen.htm)
    上有一个故事，摘自加拿大渥太华的一份报纸。这个故事很有趣，原因在于一些文档落入了错误的人手中。这些并非一般的文档，而是高度机密的**国防文档**，其中包括加拿大特伦顿军事基地安全隔离墙的位置、加拿大联合响应部队的平面图等。这些文档是怎么得到的？很简单，文档被丢到垃圾桶中，有人从垃圾箱里翻了出来。只要翻翻垃圾箱就能找到一个国家的绝密安全信息！


    简单而致命的攻击每天都在发生，所以人们需要掌握知识、改变密码策略、改变远程服务器的访问方式，还需要在面试、交付、雇用和解聘员工方面改变思路。如不具备知识，也便没有改变的动力。


    2003年，计算机安全研究所和FBI的一项联合调查发现，77%的被调查公司声称员工报复是安全入侵事件的主因。赛门铁克公司的数据丢失防护部门Vontu（[http://go.symantec.com/vontu/](http://go.symantec.com/vontu/)）声称，每500封邮件中就有一封包含机密数据。调查报告中包含如下信息（引自
    [http://financialservices.house.gov/media/pdf/062403ja.pdf](http://financialservices.house.gov/media/pdf/062403ja.pdf)）。


    +   - 62%的报道事件中存在客户身份被盗的风险；

    +   - 66%的受访者认为他们的同事而非黑客会给客户隐私带来最大的风险，只有10%的受访者认为黑客是最大的威胁；

    +   - 46%的受访者声称，员工从公司数据库中移除敏感信息是件“很简单”甚至是“轻而易举”的事情；

    +   - 32%也就是约1/3的受访者不清楚公司保护客户数据的内部策略。


    这些就是令人吃惊且头痛的统计数据。


    后续章节会详细讨论这些数字。这些数字显示了安全处理中的严重缺陷。必须未雨绸缪，在被入侵之前掌握安全知识，才能做出改变，从而避免不必要的损耗、痛苦和经济损失。


    > 孙子曰：“知己知彼，百战不殆。”真是至理名言！但只是“知”尚且不够，知行合一才是智慧所在。


    本书作为社会攻击、社会操纵和社会工程的手册或指南使用最为有效。


    # 1.1.2　本书内容'
