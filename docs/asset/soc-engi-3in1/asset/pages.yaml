  md: '在图6-14中，她真诚地微笑，头部倾斜得也恰到好处。这个动作是说：“我信任你，很高兴认识你，所以你可以信任我。”这种高度舒适的动作会让对方感到温暖，如图6-15所示。这种表现会告诉与你交流的对象：“我信任你，所以你也可以信任我。”


    ![](img/9f6d2369b69b99fb89843058054e5812_527_0.png)


    图6-15　萨琳娜头部倾斜的角度说明她对这个关系的态度是开放的


