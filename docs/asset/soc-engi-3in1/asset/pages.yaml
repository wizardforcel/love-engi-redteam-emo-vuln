  md: '图 7-2 Rapid7 Metasploit Pro钓鱼攻击追踪页面


    # 个人评价


    下面是我对Metasploit Pro的评价。


    +   - 使用这款工具需要怎样的知识水平？


    Metasploit Pro的设置并不复杂。我觉得凭直觉即可胜任，不需要任何特别的软件知识。对所有的软件来说，学习曲线主要在GUI上，有一些我不太习惯的元素，但最后我发现其实挺好用的。


    Metasploit Pro并非是为新手准备的一款工具，但也无需变成专家才能使用它。使用过程中，我在一些简单的事项上遇到过一些困难，比如查看结果或者设置伪造邮件，但是清晰的说明文档和一些简单的教程帮我很好地解决了大部分问题。


    +   - 用户信息的安全性如何？


    因为Metasploit Pro是自我托管的，所以安全性很大程度上取决于你的设置。如果你把它安装在一个面向公众的服务器上，又没有安全措施的保障，那么它很容易被攻陷。我们没有对软件本身进行安全审计以确定其内部安全等级，但是系统是由密码保护的，似乎也使用了较好的安全等级来保护用户数据。因此，结论是：因为Metasploit
    Pro是本地部署的工具，所以安全性取决于你。


    +   - 使用该工具时有其他的困难吗？


    用户界面大部分似乎都可以凭直觉顺利使用，但是我对于如何设置邮件服务器和发送时间有点迷惑。我使用的版本不支持同时进行多项任务。报告是可以使用的，我也可以导出数据，这可以帮助我为客户创建报告。


    +   - 技术支持如何？


    客服很快回答了我的问题，帮我解除了疑惑。


    # 7.1.2 ThreatSim


    ThreatSim（http://threatsim.com/）允许组织机构根据终端用户的行为评估和降低风险。ThreatSim是一个安全意识培训平台，可以帮助培训员工来识别潜在威胁并制定安全决策。ThreatSim早期的产品允许组织机构发送模拟钓鱼攻击邮件给'
  merge: -1
  img_proc: true
- pgno: 727
  md: '终端用户，并为那些落入陷阱的员工提供即时训练。新推出的产品包含附加的场景式训练，主要关注员工在面临安全决策时的一般情形。ThreatScore用户风险管理产品会根据用户历史行为、安全知识、技术水平以及工作特征对员工进行评分，为安全管理员提供数据以降低他们的终端用户所面临的风险。ThreatSim是以SaaS的形式提供的，并根据终端用户数以订阅形式出售。


    # 优点


    +   - **丰富的自定义选项**。ThreatSim为用户提供钓鱼攻击信息和培训信息的个性化设置。钓鱼攻击信息可自定义的范围包括寄件人姓名、地址、着陆页域名，以及一个完整的邮件内容编辑器，其功能包括剪切和复制真实的钓鱼攻击邮件。ThreatSim的数据抓取功能非常强大，你可以使用网站抓取功能来创建一个逼真的模拟着陆页面。每一个训练都是100%自定义的，包括内容、图形和布局，这使得用户可以创建满足他们特定需求的信息。

    +   - **漏洞检测功能**。ThreatSim能检测目标浏览器以识别旧版本软件（例如Java、Adobe和Flash），这些旧版本软件会增加目标遭受由钓鱼攻击带来的恶意软件的感染机会。

    +   - **高级钓鱼攻击模拟功能**。ThreatSim提供了一些为模拟高级钓鱼攻击而准备的功能，包括但不限于：为了更真实地模拟钓鱼攻击，在一段时间内不定时发送钓鱼攻击邮件；基于目标“累犯”频率创建动态列表；基于个人历史表现和技术水平为每一个目标给出风险评级。

    +   - **容易使用**。ThreatSim的界面（见图7-3）可以帮助你十分高效地进行钓鱼攻击和查看结果。邮件列表管理提供了一个简单的两步更新过程，可以移除离职员工以及添加新员工。ThreatSim允许导出全部数据，以供客户进一步分析。

    +   - **多语言支持**。全球性机构逐渐成为钓鱼攻击的目标，它们需要让内容本地化以进行更有效的钓鱼攻击训练。因此，ThreatSim提供了多语言支持，其内容被翻译为14种语言，而且会根据用户需求添加新的语言。


    # 缺点


    ThreatSim只有一个主要的缺点：信息过载。ThreatSim提供的信息对有些用户来说太多了。


