  md: '学习解读他人的非语言交流能帮助我们了解他们的真正意图和动机。学习观察微妙的，或者没那么微妙的表现能帮助社会工程师更有效地交流。


    在此我还要重申一下注意事项，那就是知道如何解读情绪是非常有力的工具。但是不要过度沉溺于寻找每个微小的线索而忘记仔细聆听。聆听交流对方的话会对建立密切关系和信任起到有力的作用。


    在使用这些技能的时候要注意平衡。


    # 7.3.2 我们自己的情绪内容


    面部表情和非语言交流能够改变人们的决策能力。


    当我们感到压力或者紧张的时候会发生什么？我们的肌肉会紧绷，开始出汗，并感到茫然。我们的脸上和身体上表现出的紧张也会给目标对象带来不安和紧张的感觉。除非我们的托词就是要表现恐惧或压力，否则的话就会让目标对象感到困惑。


    就像那个等待非语言许可去穿越“视觉悬崖”的婴儿一样，与我们交流的对方也在寻找是否能够信任我们的线索。因此，对于表现不安和紧张情绪的练习和控制是很重要的。这样我们才能表现出正确的情绪内容。


    如果你要表现紧张或恐惧，那么道理也一样。就像我之前讲过的那次经历，我在面试前向前台解释我是怎样把咖啡洒在了简历上。如果我在讲述这个悲伤的故事时表现得很镇定、从容和自信，那么我可能不会成功。因为我的非语言交流行为与我的语言交流行为不一致。


    # 7.3.3 非语言社会认同


    除了要观察目标对象的非语言行为外，还要了解周围环境的氛围。大家的感觉如何？观察一下这里充满了忧郁还是欢声笑语。对我们身处的环境氛围的了解会帮助我们为自己设定匹配的情绪内容。


    一次，我的航班晚点得太久了，以至于我错过了两次可以转机的机会。当飞机进入机场航道的时候，机长通过对讲机告诉我们：闪电击中了机场，导致某些地方无法供电。


    闪电不仅击中了总电源，还击中了备用电源。当我走进航站楼的时候，唯一的光源是机场保安的手电筒。人群陷入一片混乱。乘客朝机场工作人员大吼大叫，对错过航班和延误表示愤怒。我向自己认为应该过去的门走去，看到了长队愤怒的人。


    刚才发生的事就是社会认同的典型例子。换句话说，人们的情绪能够带动我们做出我们平时做不出的行为，或者采取我们平时不会采取的行动。当时每个人都像疯了一样，形势很紧张，这种情绪在整个人群中蔓延开来。诚然，我们通常不会在这样紧张的局势下'
