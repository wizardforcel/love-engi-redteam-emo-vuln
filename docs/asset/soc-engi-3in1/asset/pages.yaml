- pgno: 659
  md: '你可能一开始会想：“不能让我的UPS包裹出问题，最好检查一下。”或者，你并没有UPS账号，但也可能会感到惊慌：“谁用我的名字建立了一个UPS账号？”


    不管是哪种情况，恐惧或者好奇都会让你想要点击邮件中的那个链接。这封邮件有正确的标识，看起来很正式，甚至可能和你收到过的其他UPS邮件十分相像。这些细节使得你相信这是一封真实的邮件。


    幸运的是你刚刚阅读过本书的前三章，并意识到这封邮件可能是某种精心设计的恶意邮件，目的是让你下载恶意软件、泄露个人信息，或者参与某种违法活动。你首先能做的是什么呢？


    你能做的就是把鼠标悬停在链接上。简单地把你的鼠标移到链接上，但是不要点击！只需要把鼠标悬停在上面，看看会发生什么。你可以看见类似图4-2的提示。


    ![](img/9f6d2369b69b99fb89843058054e5812_659_0.png)


    图 4-2　悬停成功而不点击


    我不确定你的情况，但是我对UPS会把我的账户信息存在一个位于南美的服务器里这件事很是怀疑，后缀 .za 表明了这一点。因为悬停可以反映URL（链接）的地址，而那个地址并不指向UPS，所以这封邮件被确认为钓鱼邮件。


    如果你看到这样的链接，那么你需要用批判性思维来问问自己下列问题。


    +   - 这封邮件来自我认识的人吗？'
  merge: -1
  img_proc: true
- pgno: 660
  md: '+   - 我预料到会收到这样一封邮件吗？

    +   - 邮件里的请求合理吗？

    +   - 这封邮件是否试图唤起某些情绪，比如恐惧、贪婪或者好奇，或者最重要的——它是否试图让我做点什么？


    因为这封邮件的意思很含糊，所以你甚至无法如实回答第一个问题。你没有期望或者请求这封邮件，而URL指向一个完全不同的网站。关键是不要因为好奇而点击链接，而应该立刻删除这封邮件。


    悬停在这个链接上，或者任何链接上，会显示它所指向的地址。另外，这一举动可以快速帮助你回答批判性思维的问题，从而清楚地做出决定。


    想象你订阅了每月发送的《社会工程人员通讯》。当它被发送到你的邮箱时，你会看见一个指向更多关于社会工程学信息的链接。你可以首先把鼠标悬停在上面，然后你会看到图4-3所示的内容。有些情况下，声明的攻击者可以阻止悬停，所以当你点击时，再次确定一下地址栏里的地址，以确保你访问的是一个合法的地址。


    ![](img/9f6d2369b69b99fb89843058054e5812_660_0.png)


    图 4-3　一个安全且正确的链接


    这封邮件是你要求发给你的（通过订阅通讯），链接也符合你订阅的网站。基于这些原因，你可以点击这个链接。'
