    Wombat Security有可靠的技术支持团队。我的个人体验非常好。他们对建议和想法能迅速做出回应。我发现他们非常专业、容易相处，并关心客户的需求。


    # 7.1.5  PhishLine


    PhishLine（www.phishline.com）是一种企业级的SaaS解决方案，可模拟真实世界的社会工程学和钓鱼攻击，提供在线安全意识训练、基于风险的调查以及详细的报告和指标。


    # 优点


    +   - 多重渠道的攻击模拟 。 PhishLine并不限于传统的基于链接的钓鱼攻击模拟。它能够让用户对便携式媒体、文字、语音、模拟门户页面、智能附件等钓鱼攻击形式进行测试和衡量。同时它还支持一系列定制功能，允许安全专家精确地测试和衡量真实世界的安全威胁。

    +   - 报告和度量 。 PhishLine会收集很多可用数据，使得在专业平台上进行历史数据分析变得更加轻松。PhishLine的报告功能不仅仅是汇总数据，它还可以提供对人群、进程以及社会工程学和钓鱼攻击威胁的技术层次的可视化分析。PhishLine能够发送即时可用的分级的用户报告和有意义的指标。

    +   - 对用户的服务承诺 。 PhishLine是由安全专家开发并提供技术支持的。这是一个很重要的事实，因为很多此类应用只是由开发者来提供支持服务。这支技术支持团队不仅可以解决软件问题，还可以应对错综复杂的钓鱼攻击和安全威胁。

    +   - 将基于风险的调查整合于真实世界的安全培训 。 用户可以使用PhishLine来进行针对性的网络安全意识训练和基于风险的调查，并将从解决方案中得到的关键指标和发现应用于自己的全局安全措施和风险培训项目中。'
