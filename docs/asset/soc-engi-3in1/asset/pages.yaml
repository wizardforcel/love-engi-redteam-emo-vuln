- pgno: 90
  md: '会适得其反而且没什么用处。要对假设性问题进行规划才能取得最大的效果。


    在询问假设性问题时，司法人员掌握的一件有用的法宝就是：“在回答下一个问题之前，请考虑清楚……”这句话给对方的暗示就是在回答问题时一定要诚实。


    掌握这些技巧需要成年累月的训练。如果前几次尝试不成功也不要沮丧，要不断尝试。不要有畏惧，下面有掌握这一技巧的窍门。最后还会有一个综述。'
