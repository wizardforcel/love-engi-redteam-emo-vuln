  md: '当培训项目开始时，我们看到很多公司太过在意这些数字。记住，培训的主要目的是对钓鱼攻击的威胁有所了解，以及展示培训对员工所起的作用。有时候统计数据会诱使你过于关注数字而不是人或者目标。


