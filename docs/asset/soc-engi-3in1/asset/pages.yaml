  md: '每个肌肉动作都能分解成一个动作单元。动作单元描述了是什么样的肌肉在被激发后创建了表情。艾克曼对情绪的研究告诉我们是什么触发了我们的这些情绪以及何时被触发。结合这两个方面会帮助我们以等式的方式理解面部表情。


    如果情绪是由刺激物触发的，神经元就会向面部传递电脉冲，进而触发肌肉运动，并将情绪从外部呈现出来。


    刺激物+情绪=肌肉触发


    因为你可以在线学习完整的面部动作编码系统课程，所以在此我不会过多地介绍面部动作编码系统。我要说的是面部表情对于了解他人是何等重要。


    本章的核心，也是我希望你能体会的是：仅仅因为你看到了他人的情绪，并不代表你明白他为什么会有这样的情绪，或者他为什么表现与出其所说话的话不一致的面部微表情。这也是艾克曼博士亲自告诉我的一件事，同时也是他曾经记述过的。


    一旦你学会领悟微表情，就能根据你所观察到的情绪改变交流风格，然后通过提问和诱导来确定你所观察到的情绪是否属实。通过提问、对话和诱导可以准确描述你所观察到的情绪产生的真正原因。为了帮助开发这个技能，艾克曼博士正在研发一个信息培训工具——有效应对情绪表现（Responding
    Effectively to Emotional Expressions，亦称RE3）。


    需要注意的是，不要把我们自己的情绪加入到观察到的情绪里，也不要臆断别人会有某种感受的原因（否则将受到“自我论”的错误影响）。开始对话后，你可以判断为什么会有这样的情绪。对情绪的理解能帮助我们更多地改变和影响目标对象。


    同样需要注意的是，我们社会工程师的目标是成为目标对象的“一员”。当我们让对方觉得我们和他们一样的时候，这一目标就很容易达成了。比如，假设你要接近一群正在愉快大笑的陌生人，你垂头丧气，耷拉着眼皮，连嘴角都是下垂的（这些都是典型的悲伤情绪表现）。你觉得那群人是希望你加入他们并就你的问题进行讨论还是会无视你？如果你的目标是加入他们，你大概也能想到，如果表现得很悲伤的话，是很难加入那群人的。


    换句话说，如果你的目标对象是那个正在伤心的人，你能大笑着拍他的后背讲笑话吗？还是应该降低音量，减少肢体动作，温柔地来到他身边，问一句“发生什么事了”。


    艾克曼博士和奥沙利文博士进行了一个名为“真相奇才”的测试。他们发现了一小群在谎言识别方面远远高于平均水平的人。保罗·凯利就是那些“真相奇才”中的一员。他也是本书的“技术审校”。在本书中，我通常会用来PK代表他，以便区分他和保罗·艾克曼博士。


    在听了艾克曼博士关于面部微表情的演讲后，保罗了解到这些表情是无意识的、跨文化的。之后，他与艾克曼博士进行了会面。说到保罗·凯利的沟通技巧有一个有趣的现'
