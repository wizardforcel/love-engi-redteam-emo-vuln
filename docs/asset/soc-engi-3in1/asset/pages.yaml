  md: '需要尝试改变人们的观念，只需要让人们采取一些细想时会觉得不妥的行动。


    采用这4个框架规则并进行细致的计划，能够让框架成为摧毁性武器，不过这也是恶意社会工程人员每天都在使用这一战术的原因。在美国，特别是“西方文化”中，人们接受的教育就是要接受框架的影响、接受被灌输要思考什么以及怎样思考。


    如果我15年前告诉你，几乎每个电视节目都是看真人生活秀，你一定会笑我。为什么？因为观看那样的节目似乎无聊又愚蠢。然而在2006年，《洛杉矶时报》声称现实类电视节目的数目提高了28%（详见
