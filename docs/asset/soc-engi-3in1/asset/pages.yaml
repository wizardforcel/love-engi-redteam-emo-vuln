  md: '我们并非坏人，所以我们会考虑你的员工的感受，但是由于会议而长期避开一周的某一天或两天，这对钓鱼攻击训练中的所有人没有任何帮助。


    # # 6.7 眼不见心不烦


    又是一个尴尬的我童年时的故事，这与鬼怪有关。我们小时候都害怕某些东西——壁橱里的响声、床底的撞击声、树枝打在窗户上的声音，或者看起来像是鬼怪的影子。无论恐惧的是什么，都会导致不合理的想法和行为。（真实的故事：米歇尔曾经在走廊里背着枕头跑，她以为这样可以在黑暗中保护自己。）


    看吧，当我听到奇怪的声音，或者我觉得看到有东西在壁橱里移动时，我就会害怕地钻进毯子里一动不动，并闭上眼睛。


    为什么？好吧，这其实是很符合逻辑的，不是吗？如果我看不到怪兽/鬼怪/坏人，那么显然我就是安全的。我把安全与能否看到那些让我害怕的东西挂钩了。


    既然现在我已经长大成人，并意识到大多数这类恐惧都是不合理的，我也意识到如果真的有怪兽追我，那么裹在毯子里闭上眼睛也只是看不见它而已，并不能让我脱险。


    # ## 6.7.1 定义


    如果恶意邮件发到你的员工的邮箱里，那么应该如何处理？现在你明白我为什么提倡设立一个报告系统了吧。但是在公司尚未设立报告系统的情况下，我见过些公司建议他们的员工直接删除钓鱼攻击邮件。


    如果你懂一些安全常识，那么你可能会惊讶于有人竟然把“删除邮件”作为安全建议，但确实有这种情况发生。


    # ## 6.7.2 消极之处


    如果员工点击了链接，然后系统出现了崩溃，他们现在很害怕，但是安全建议只是删除邮件，那会怎样呢？


    如果情况更糟糕一些，员工点击了链接，输入了某种验证信息，但接下来什么也没发生，然后员工就删掉了邮件，那会怎样呢？几天后员工将这件事告诉其他人，然后安全团队介入调查，却发现那封邮件已经被删除了。'
