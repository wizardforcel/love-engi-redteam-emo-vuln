  md: '# 6.6.1　定义


    我听说有些公司表现出和我童年时一样的恐惧。不是对大老鼠，而是对恶意的钓鱼攻击。怎么会这样呢？


    我曾被告知：“我们想要开展钓鱼攻击培训，但是周一不合适，因此我们不会在周一进行。”或者：“周四是员工会议，因此你可以在任何时间进行钓鱼攻击，但请避开周四。”这本质上和“钓鱼攻击没问题，但请不要在满月之夜进行”一样。


    限制钓鱼攻击培训的日期或时间，就好比确信大老鼠只会在满月之夜出来吃了你。我们都知道大老鼠只要饿了就会出来吃了你，无论何时——并非只在午夜。真的。


    与之相似，坏人不会只在你不开员工大会的时候攻击你。


    # 6.6.2　消极之处


    在一些公司里，我们会避开特定的日子进行测试。我见过有员工对我们的调查给出了这样的回应：“呃，我知道这不是我们公司的钓鱼攻击测试，因为我是在周一收到这封邮件的。我们不会在周一进行测试。”


    你的训练目标，记住，是教会你的员工在任何时间都能发现所有的钓鱼攻击邮件，而不是教他们弄清楚钓鱼攻击邮件是来自公司还是来自坏人。你想让他们无论何时何地都能保证安全并免受钓鱼攻击威胁，而不是让他们知道周一和周四不会收到来自公司的钓鱼邮件。


    # 6.6.3　如何改进


    解决办法很明显：不要根据对公司来说“方便”的时间来安排钓鱼攻击训练；相反，要根据钓鱼攻击者眼中现实的情况来安排。我同意有时候发动钓鱼攻击是不合适的。例如，当每个人都在放假、过节，或者其他大部分人都不在的情况下。你想要数据和指标来协助你看清楚大体状况，这意味着你应该在人们都在时发动钓鱼攻击。


    尽管如此，要意识到钓鱼攻击者并不会因为你休息或者心情不好就不给你发邮件。记住，一些最具恶意的并成功奏效的钓鱼邮件是在纽约“9·11”事件、日本海啸、海地地震、新奥尔良飓风发生后不久发送的。钓鱼攻击者不会关心你或者其他人遭遇了什么，他们只会为达目的不择手段。'
