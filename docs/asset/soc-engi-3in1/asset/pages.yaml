    +   - 问候语很简单，只是说“你好”。而通常情况下问候语应该包含姓名或用户名。

    +   - 通常被人们忽视的最大线索是链接。当我们把鼠标滑到链接处时，我们看到的网页不是Facebook，而是社会工程师的网站。'
