  md: '# 6.1 影响和说服的5项基本原则


    要想成功影响目标，下述说服的5项基本原则尤为重要：


    +   - 目标明确；

    +   - 构建共识；

    +   - 洞悉环境；

    +   - 灵活应变；

    +   - 内省。


    社会工程的全部目的就是影响目标采取一项不一定符合他们最佳利益的行为。他们不仅会采取行动，而且想要采取行动，甚至在最后还会感谢你。这种影响的力量很强大，也使得具有这种能力的社会工程人员成为传奇人物。


    世界知名的NLP培训专家杰米·斯马特曾经说过：“地图非疆域。”我喜欢这句话，因为它很适合用来形容这5项基本原则的关系。没有一项原则能够涵盖全部精髓，但是每一个都能在地图上为你指明疆域拓展的一个方向。下一小节会详细讲述第一项原则：制定明确的目标为何非常关键。


    # 6.1.1 心中有明确的目标


    我们不仅要在心中有明确的目标，甚至需要更进一步，将目标写下来。首先需要问自己：“通过这次活动或者交流我想要得到什么？”


    我们在第5章（尤其是有关NLP的部分中）曾讨论过，人的内部系统运作受其思维和目的的影响。如果专注于某项事物，则更可能实现或者得到它。这并不是说如果你一直想着得到一百万美金，就会得到它。事实上，这是不可可能的。相反，如果你的目标是赚一百万美金，并且专注于赚钱的具体步骤，那么你的目的、知识和行动会提高你达成目标的可能性。“说服”也是同样道理。你的目的是什么？是改变某人的信仰，还是要他采取某种行动？假设你的好朋友正在做的事情对其健康非常有害，你想要说服他别再那么做了，此时你的目标是什么？也许最终目标是说服他停止伤害自己，但是过程中存在很多小的目标，将所有这些目标列出来，可以使影响他的过程更加清晰。


    在设定目标之后，必须问自己：“我怎么知道目标已经实现了？”我曾经听过杰米·斯马特的培训课录音，他是NLP领域的世界级专家。他给教室中的所有学员提'
