    ![](img/9f6d2369b69b99fb89843058054e5812_638_0.png)


    图 3-2 通过威胁使人服从


    毫无疑问，当人们发现自己采取的行动居然是社会工程人员施加影响的结果时，难免会感到尴尬或者生气。但是如果员工认为自己是由于恐惧、愤怒或惭愧而被迫采取了某项行动，那么对于公司来说情况可能会更糟或者更难应对。这种环境并不利于学习。可以想象，这对于一位想要对公司有所贡献的员工来说是多么沉重的打击。这就是我们要强调影响和操控之间的区别的原因。强调这一区别并不只是因为我们很善良友好。我们也是教育者，知道明确这一区别会让这方面的教育和培训步入正轨。


    # ## 3.2 如何找出区别


    区分影响和操控对我们而言很有意义，希望对你而言也是如此。我会首先承认，其中的灰色区域很复杂微妙。因此，下面几节将会探讨一些问题，当你准备好进行社会工程训练时可以先问问自己。


    # ### 3.2.1 如何与目标建立融洽的关系


    在一些资料里，融洽的关系（rapport）的定义冗长且复杂。它很容易理解和辨别，但想用一个简洁的句子来定义却有点难。它大致上是指和另一个人建立关系，其中包括相互喜欢以及相处感到舒适等要素。建立融洽的关系是成功的社会工程人员为了提高效率而必须快速培养的技能。融洽的关系是施加影响的一个必要条件。当你建立了融洽的关系后，人们会答应你的请求，因为他们喜欢你，可以感觉到你们之间的联系，并且想要帮助你。'
  merge: -1
  img_proc: true
- pgno: 639
  md: '对利用操控的人来说，建立融洽的关系是不太可能的，也不是必要的。一个想要威胁别人的人很可能并不在乎与目标建立某种联系。实际上，操控者与目标之间的联系越少越好。坦白来说，对大多数人而言，对一个与他们有私交的人运用操控手段是很困难的。


    # ### 3.2.2 当目标发现自己被测试时，感觉如何


    我心里住着的顾问总是想问这个问题：“你点击了我的钓鱼邮件，你感觉如何？”正如之前所讨论的，感到尴尬甚至愤怒仍然可以有教育效果。你已经把挑战置于目标面前，然而他们的表现令人失望，而这可能最终导致他们或他们的公司面临威胁。但是如果你后续提供为下一次获得成功所需的信息，那么就可以创造出一个基于学习的环境。希望随着时间的推移，你能创造出一种公司文化，员工不会因为中招而感到尴尬，而是期待下一次培训的到来。我们曾见证过某些公司的成功。


    另一方面，如果你通过一些方法来激起恐惧、愤怒、惭愧或无助的感受来使人们服从，那么随之而来的抵抗的洪流极有可能让你错失教育机会。人们会记得你给他们带来的感受而不是经验教训。


    # ### 3.2.3 测试的意图是什么


    我并非在讨论炫耀给客户的那一套直截了当、结论漂亮的玩意儿。我在讨论你自己的意图和你的个人需求。你真的关心你的机构是否在学习或者提升吗？或者你只是想要一种赢家的感觉，因为你让人们做了一些他们不该做的事吗？这是一个你需要自己回答的私人问题。我们大多数人喜欢获胜的感觉，而有时候社会工程协议可以让人感觉像一场游戏一样。


    幸运的是，有很多机会你能获胜，同时 很好地为你的公司服务。但是总会有那么一个时期，你没有获得任何进展，内心也开始产生挫败感。你也可能会感到焦虑，觉得必须做点什么才对得起公司管理人员付给你的钱。那时你不得不开始真正反思你的选择和动机，因为此时使用操控手段的诱惑非常大。不过通常来说，如果你真的把公司的利益放在心上，那么你会做出明智的决定的。


    # ## 3.3 操控：来者不善


    有一个我们经常会遇到的问题或者评论，那就是为什么我们不使用操控。毕竟坏人总是会这么做。这是一个法律问题。坏人想要获胜，他们不在乎受害者，也不关心教育效果。坦白来说，操控更有效也更容易。然而，除了在专业环境下更具有破坏性而非实用性以外，使用操控也不是长久之计。'
  merge: -1
  img_proc: true
- pgno: 640
  md: '在经历操控后，人们不大可能再次听从你的请求。这一结果可能是可以接受的或者求之不得的，这取决于你的工作和你的目标。但是在公司安全以及专业合作的世界里，这并不是一个最理想的选择，因为你寻求的是建立长期合作关系。


    我同意在测试和教育中不敢越雷池一步是不现实的，但是也不需要跳进火山口才知道它真的很烫。公司安全目标可以在不诉诸恐吓或者激怒员工的基础上完成。一位专业的信息安全工程师人员所提供的体验可以在富有挑战性的同时不造成伤害。


    # 3.4 谎言，全都是谎言


    让我们来谈谈图3-1中展示的一些例子吧。其中一个总是能抓住人们注意力的是欺骗。人们对欺骗有某种看法，而这种看法肯定是负面的。显然，如果有人对你喊“你是个骗子”，他绝对不是在恭维你。


    虽然大多数人想要机械地把伦理道德与此关联起来，但是我认为这是有问题的。问题的性质并不取决于你是否把欺骗用于社会工程协议的一部分。你肯定会在社会工程协议中多少使用一些。


    对我来说，这个问题的性质取决于意图和动机。如果我的丈夫已经吃了两包糖果和半包曲奇饼干，我会告诉他我们已经没有任何米饭布丁了，而事实上我把它藏起来了，我说谎是出于对他的健康的关心。另一方面，撒谎并把米饭布丁藏起来，我就可以自己独吞了……如果这么想，那就太自私了。注意，在这个例子中虽然我的**行为和导致的结果相同，但是动机不同，我的丈夫在发现真相后的感受也会截然不同**。（顺便说一句，米饭布丁真美味。）


    撒谎的名声并不好，但是无疑我们都这么做，或多或少。我们是社会动物，在群体中生活就意味着要知道自己该说什么（或者不该说什么）。想想如果你完全坦诚地说出你的见解——包括你朋友的穿着打扮、你母亲对家具的品味，或者你的另一半的健康水平——你的人际关系会如何。真相会伤人。


    人类和其他物种似乎有着天生的欺骗的倾向。有很多有趣的研究表明，婴儿在没有语言表达能力前就有这种能力。你们中如果有人已为人父母的话，就可证明这一**点。来自朴次茅斯大学的瓦苏德威·雷迪博士发现婴儿能讲话之前——或者，更重要的，有能力理解“实话”这个概念前——就有了欺骗他人的能力。⁴


    > ⁴ Richard Gray, “Babies Not as Innocent as They Pretend,” The Telegraph website,
    July 1, 2007, http://www.telegraph.co.uk/science/science-news/3298979/Babies-not-as-innocent-as-they-pretend.html
    .'
