  md: '![](img/9f6d2369b69b99fb89843058054e5812_521_0.png)


    图 6-11 咬或者嚼东西是紧张和沉思的表现


    图6-10和图6-11都能表现沉思、焦虑或思考（认知负荷）。


    # 注意事项


    机灵的社会工程师会在交流过程中关注上述嘴唇动作的变化，观察对方何时开始有这些表现，并记住与此同期发生的谈话或是问题是什么。和其他所有嘴唇动作一样，舔嘴唇也可以归类为非语言操纵性动作。操纵性动作的增加是偏离基准态的表现，同时也是我们需要关注的“热点”。


    这些操纵性动作能够表现紧张、焦虑或者抑制。它们都能很好地表现或预示不适。'
