  md: '这样他们就可以对外说他们进行了钓鱼攻击培训，但事实上他们的员工从未学过如何辨别真实的钓鱼攻击。


    # 6.1.2　消极之处


    认为体现每个人的感受优先于教学需要是很糟糕的，因为它会限制你开展教学环节。让我用举重的例子来说明这一问题。锻炼肌肉首先需要用正确的姿势和合适的重量破坏原有的肌纤维，再让它恢复和增长，然后重复这一过程。过于轻松的训练无法破坏你的肌纤维。同理，你不能在没有任何突破的情况下练出钓鱼攻击肌肉。


    # 6.1.3　如何改进


    为了正确地训练你的钓鱼攻击肌肉，你需要随着时间推移来增加钓鱼攻击的“举重砝码”。话虽如此，你不必一味增加难度而全然不顾人们的感受，但钓鱼攻击需要回归现实。


    我同意避免使用可能过于个人化的主题，因为这会导致人们感觉受到伤害或者被冒犯。但是你该如何把握不越过那条线呢？在此我无法为你回答这一问题——这是需要你自己分析和决定的。


    # 6.2　老板是例外


    “我是看着你学的！”我和朋友用这句话开玩笑可能超过10万次了。这句话源于美国无毒品合作组织（Partnership for a Drug-Free America）在1987年的一则非常严肃的公益广告。这则公益广告中，一位年轻人遭到他的父亲质问，因为年轻人的母亲在壁橱里发现了一盒毒品。


    这位父亲责骂他的儿子并问：“是谁教你吸毒的？”儿子最终停止了抵抗，喊出了那句令人心寒的话：“是你！我是看着你学的。”


    这则公益广告强调了与每个人都相关的重要的一点：不要认为自己地位高就可以从规则中豁免。


    # 6.2.1　定义


    当我们帮助一家公司开展钓鱼攻击培训时，我们会努力工作来赢得老板的认可。我们一般会在提交10次建议、参加50次会议、发送几百封邮件后获得许可。在我们花'
