  md: '在头顶和眼眉之间有一大块垂直的肌肉，几乎覆盖了整个额头。这块肌肉能够扬起眉毛。如果要使用这块肌肉，需要将眉毛的内侧提起。这样就使得眉毛形成一个斜三角形，并且额头中心的皮肤会出现褶皱（只在中心部位，不是整个额头）。艾克曼博士在图8-2中展示了该行为。


