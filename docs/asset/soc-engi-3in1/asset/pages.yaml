  md: '我常说在社会工程师的语言中最有力的几个字就是“您能帮帮我吗”。这种要求会触发对方自动的心理反应。他会在心里判断这个求助是否安全、方便以及应该做些什么。


    正如我们在第7章所说的，如果社会工程师能够触发目标对象的同情心，那么目标对象的逻辑处理中心就会关闭，由此便营造出一个更容易响应请求的氛围。


    我可以用一个甚至不涉及社会工程的事例来很好地诠释非语言交流中同情和帮助的主题原则。当时我从当地的一家杂货店往外走，前面不远处，一位老太太正一边推着购物车，一边从钱包里面取车钥匙，突然有什么东西掉了出来。我走近一看，发现那是一小叠钱。


    我把钱捡起来，然后开始追那位老太太。当我走近时，她正在将购买的杂货往后备箱里装。她身高大概有一米五左右。我近两米的个子在她旁边显得异常高大。我拍了拍她的肩膀，说：“打扰了，这是你掉在地上的钱。”


    她先是感到惊讶，之后就变成了恐惧。或许她只听见“打扰了”和“钱”，所以她开始尖叫：“我被抢劫了！”


    此时我的脑海中立刻浮现出两个形象，一个男人很高大，穿着黑色皮夹克和牛仔裤，带着锁链钱包，站在一个娇小、年长的女士的面前。


    我错在哪里呢？我接近她的方式。我没有选择从侧面接近她，或者是放慢走路的速度，我仅仅想着“我是在帮她”，而且我使用了不恰当的非语言行为来提供帮助。


    当社会工程师寻求帮助的时候，我们需要谨慎地规划肢体语言和面部表情的使用。如果我们想表达适度的悲伤，就不能挺着胸，摆出强势的站姿，并表现出恐惧、愤怒或者开心。同时，在提出要求的时候，我们不应表现得很沮丧或伤心，因为这样也会使得别人很紧张。


    现在让我们来回忆一下我在书店的交际行为。如果我泪流满面地接近我的目标对象，那位男士就可能会立刻带着孩子走开。


    我们需要调整非语言行为，使其与提出要求的情绪相匹配。对于使用同情/帮助的原则来推进诱导来说，这是很重要的一环。


    有时我们即使不说话，也能获得帮助。在一次工作中，我走进了一幢办公楼的大厅，站在角落里为下一步的接近做准备。我的叹息声一定很大，因为当一个门卫经过时，她停下来问道：“你还好吗？”


    快速思索了一下后，我回答：“不太好，谢谢关心。”我肩膀下沉，慢慢转身离去。


    她问道：“怎么了？需要帮助吗？”'
