    不过如果你的公司对于雇员收到的鱼邮件或其他攻击的反应是给予惩罚，那你可就要面对一些挑战了。如果是这样的话，员工就不能够在公司公开讨论关于安全的关心和实践。但是管理层需要认识到，被恶意社会工程师蒙骗并不意味着员工的软弱或愚蠢。这是人之常情。管理层需要帮助员工解决问题并把恶意攻击带来的副作用降到最低。最好的方法就是成立一个部门或者派专人负责报告和安全相关的事件。该部门或人员不会因为担心报告问题而受到公司处罚。也可以考虑对其进行额外的培训。


    # 9.4 总结


    写作这本书的过程同时也是一个学习的过程。能够有机会和艾克曼博士以及保罗·凯利密切合作改变了我对非语言行为的使用和看法。当我更多地学习、阅读、写作和对比时，我在日常交流中能观察到的迹象也就越多，从而让我能够更好、更宽泛地交流，理解对方的情绪内容，同时也让自己更安全。在这本书中没有神奇的技能能让你变成测谎专家或是读心者。但是结合本书描述的技能，你就可以真正地理解对方想要表达的情绪，即使对方没有说什么。这是一种奇妙的能力。


    练习这些技能的时候，一定要谨记艾克曼博士的话：“能够看出别人的感觉不代表我们知道对方为什么有这样的感觉。”这也是我在工作初期艾克曼博士告诫我的。学习使用观察到的情绪，集中力量进行诱导。学习关注那些基准态的微妙变化。无论你是否是专业的社会工程师，这些技能都会在交流中助你一臂之力。


    如果你想和我讨论相关问题或者就书中的观点进行辩论，都可以联系我。我的网址是 [www.social-engineer.com](http://www.social-engineer.com)。在网站上你可以找到直接与我交流的方式。随时欢迎你与我切磋讨论。


    感谢花费宝贵的时间阅读本书。希望你能够获得可以在生活中使用的有益信息，因为我知道我的生活一直受益于此。


    最后，请记住我的格言：让人们因为遇见你而感觉更美好。有些人通过让别人难堪和蒙羞达到自己的目标。有些人用恐惧和嘲笑给别人以教训。但是我知道授之以谦逊、善良和鼓励会有更好的结果。批判性思维也让我受益。无论对方是孩子还是表现得像个孩子，我们都要花时间从他的眼中发现问题。花时间去理解人们的情绪，无论这些情绪是否有意义，是否合理。我保证当你这样做的时候，你的面前会开启一个新的世界。你可以因此探究社会工程师，甚至任何站在你面前的人的秘密了。'
