- pgno: 172
  md: '虽然你想到的可能是“努力吧”，但是用这种方式可以让目标知道你在听，并且对他的困境表示同情。


    这种技术叫做反射式响应。反射式响应具有几项基本原则。


    +   - 积极聆听，如同前面所说的那样。

    +   - 当需要作出回应时，注意自己的情绪。了解目标说话时候你自己的感觉有助于你给出适当的反应。

    +   - 重复内容，但不能鹦鹉学舌，而是用你自己的语言。

    +   - 可以用一些含糊的语句来作出反应，比如“听起来像”、“似乎”或“好像”。这些话缓和了你想要传达的信息。如果需要证明的话，下次在和同事、老板、父母或者其他人发生争执时说“你因为……生我的气”，记下他们的反应，然后换种方式说“似乎你是因为……而生我的气”。对比这两种反应，你就会发现哪一种方式更好。


    反射式响应与积极聆听一起使用时，是构建信任和融洽关系的致命武器。


    当学着去更好地聆听并且使之成为天性的一部分时，你将提高对听到的信息进行反应的能力。社会工程的目标是收集信息，进入那些不允许你进入的地方或者获取无权得到的信息，或者促使目标做出常理下不会做的行为。心里总是想着自己必须非常擅长操纵他人，往往会阻止你学习并练习重要的聆听技巧，但这恰恰是你需要成为一个优秀的聆听者的原因。


    设想以下两种情形。


    +   - 一位邻居走过来，问你是否有大约一个小时的时间去他的车库，帮他完成一个项目。这位邻居有一只狗，曾经好几次钻进你的垃圾箱，而且喜欢把你的院子当做厕所。在经过漫长的一天后，你正要坐下来放松，看看电视或读读书。

    +   - 一个儿时的玩伴走过来，告诉你他需要有人帮忙搬一些家具。他刚在离你家5英里的地方买了房子，但是不能把沙发搬上楼。而你此时正要坐下来休息片刻。'
  merge: -1
  img_proc: true
- pgno: 173
  md: '哪一种情况会令你更愿意放弃休息呢？大多数人会倾向于第二种情况，但会找出拒绝第一种情况的借口或理由，或者至少要推迟到另一天他们不是那么“忙”的时候。


    为什么呢？人们和朋友在一起时通常会感到放得开和自由。当你感觉和某人一起非常舒服的时候，你们之间将没有界限，并且在帮助他们的时候会撇开自己的回报和需求。人们会很自然地相信朋友的信息，而对来自一个陌生人的信息则会再三揣摩到底是什么意思，考虑这些信息是否值得相信。这种朋友间的关系，通常被称为“共识”。


    多年来，共识仅仅在我们谈到销售人员、谈判代表以及类似人员的时候才会提到。共识并非销售人员的专属。它是一种所有人都可以使用的工具，尤其是社会工程师。如果你想知道如何快速建立共识，请继续阅读本书。'
  merge: -1
