  md: '+   - “我能抓住那个想法的要点。”

    +   - “那个是如何抓住你的？”

    +   - “我会联系你的。”

    +   - “我刚想联系来着。”

    +   - “这感觉怎么样？”


    动觉思维者的次感元范围如下：


    +   - 强度（强/弱）

    +   - 面积（大/小）

    +   - 质地（粗糙/光滑）

    +   - 温度（热/冷）

    +   - 重量（重/轻）


    帮助动觉思维者回想起与某一事物相关联的感觉或者情感，可以让那些情感再现。对于非动觉思维者来说，动觉思维者可能是最难应对的，因为他们对景象和声音都不会有反应。社会工程人员要想与他们沟通，得和他们进行感觉上的联系。


    理解以上这些基本原则，能够帮助你快速辨别出对方是何种类型的思维者。再次回到原来的问题，在不询问对方早上起来的第一感觉的情况下，如何判断他的主导感官呢？就算判断出来又怎么样呢？有那么重要吗？


    # 4. 辨别目标的主导感官


    想要确定对方的主导感官，首先尝试自我介绍，然后开始简短的交流，在此过程中留意对方所说的话。在你走向目标对象并和他打招呼时，也许他都没有正式地看着你。可能他比较无礼，也可能他不是一个视觉思维者。视觉思维者需要看着对方说话才能正确沟通，这种行为似乎证明他不是视觉思维者。这时，你可以再简单地问一句：“今天的天气让人感觉很舒服啊！是不？”
    观察他的反应，特别注意他是否会面露喜色。


    也许你可以戴一个大的、闪亮的银戒指，谈话时不断地打手势，也许你会看到戒指引起了他的注意。他会不会感兴趣地伸手触摸，甚至想要拿在手里仔细看看？动觉思维者遇到这种东西会很想触摸。我认识一位女士，她是一个很明显的动觉思维者，每当看到自己认为质地柔软或高品质的东西时，她必须要摸一摸。她会说：“哇哦，那件毛衣看起来好柔软啊！”
    从这句话来看，我们可能认为她是视'
