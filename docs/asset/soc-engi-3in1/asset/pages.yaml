- pgno: 101
  md: '看似我们在以很专业的口吻解答非常简单的问题，然而，你必须得明白：伪装的方法虽多，但也是有限度的。请明智地选择适合你的那一种。


    # 4.2.3　练习方言或者表达方式


    学会用不同的方言与人沟通会给人留下深刻的印象。受居住地的限制，要学会说一种不同的方言或者口音需要一些时间。不是说不可能，只是学会像美国的南方人那样慢声细语地讲话或者学会亚洲人的口音会非常困难。有一次我参加一个国际营销组织举办的培训课程，他们提供的一些统计数据说明，70%的美国人更喜欢聆听一个英式发音的人讲话。我不确定这个统计数据是否属实，但是我会说我喜欢自己的口音。那个课程之后，我听说不少参加课程的人开始练习英式发音了，他们的发音真的很糟糕。我在英国有一个好朋友，名字叫乔恩，当他听到美国人试图去模仿英国口音来表演《欢乐满人间》时非常生气。如果他听到我们组说的英式发音，估计会气炸了。


    这个课程让我明白，即便统计学告诉我们哪一种口音更利于销售使用，或者是因为你要到南方或者欧洲去做社会工程，这些都不意味着你可以轻易学会当地的口音。在存疑的时候，就扔到一旁。如果不能让你的方言完美、自然流畅，就不要去尝试。演员们为了和角色的口音一致并且发音清楚，需要专门的声乐教练及培训课程来练习发音。克里斯蒂安·贝尔（Christian
    Bale）是威尔士人，但是想从口音中辨别出来这点非常困难。在他大多数的电影里，他听起来并不像英国人。而电影《莎翁情史》中的格温妮丝·帕特洛（Gwyneth
    Paltrow）的英式口音就相当明显。


    大多数的演员有方言教练帮助他们完善发音。因为大多数的社会工程人员请不起方言教练，所以可以看一些讲方言发音基础知识的书，比如伊万杰琳·玛琪琳（Evangeline
    Machlin）的《舞台方言》（*Dialects for the Stage*）。虽然这本书的出版时间比较早，但是包含了很多很棒的建议。


    +   - 找到你想学的方言的例句听，像《舞台方言》这种书常常是附带录音带的，里面有多种方言。

    +   - 努力跟着录音带说，学里面人的发音。

    +   - 在感到自信以后，用该方言说话并录下，以便在事后听的时候纠正发音。

    +   - 营造一个场景并和伙伴进行练习。

    +   - 在公众场合用该方言说话，看看别人是否觉得可信。'
