  md: '我还记得开始写第一本书时的感觉。我只是想分享我的经历以及在我成长的道路上所学到的东西。两年多以后，当我想写第二本书的时候，我对自己想表达的内容有了更清晰的认识。我知道我不想长篇大论地发表自己的见解。如果我想再写一本书，那本书的内容一定是建立在科学的基础上。然而，我也自问：我是谁？为什么大家会想读一个社会工程师写的一本关于科学的书？


    之后我和我的好友布拉德·史密斯参加了一个会议。当我们说起这个话题的时候，他面带笑容，握着我的手臂，信心满满地对我说：“克里斯，这些技能并不是你生来就会的。你的人生轨迹、奋斗历程和你的所作所为成就了今天的你。这些对于对社会工程这个领域感兴趣的人们来说都是值得珍视的人生课题。”


    一年后，布拉德去世了，但是他的话一直回响在我耳边。我开始思考经营一家社会工程公司，雇用一些员工，并提供为期五天的课程和服务。所有的课程和服务都围绕我所掌握的技能展开。我开始思考对我影响最大的那些技能，其中非语言交流改变了我的交流方式。


    希望你能喜欢阅读这本书。也希望你能带着一个开放的心态去尝试并证实书中描述的方法。这本书开启了我生命中的新篇章，我找到了另外一个能够倾诉我内心并分享我的人生所学的机会。


    我清楚众口难调的道理，也知道你一定能在书中找到一些纰漏。但是我希望在吸取了第一本书的评论、想法和批评后，这本书会有所进步。


    感谢你在阅读本书的过程中“聆听”我的想法。


    克里斯托弗·海德纳吉


    2013年10月


    # # 前言


    > > “我一直教自己注意我所看到的。”——夏洛克·福尔摩斯


    当我决定写第二本书时，我需要用更多的时间去思考我想表达的主题。我的第一本书《社会工程：安全体系中的人性漏洞》[^1] 是带领读者初步了解一名专业的社会工程师需要掌握哪些技能。这些技能不难，通过练习就能够掌握。书里没什么高深的内容。


    [^1]: 该书已经由人民邮电出版社出版，书号9787115335388。——编者注'
