  md: '为什么这些标准很重要呢？当你选择了一个顾问时，也就同意了将你们公司所有员工的邮件地址交给他或她，以便他或她能给所有员工发送钓鱼邮件。这些邮件可能会请求验证信息或者包含个人信息的细节，因此你需要相信你雇用的这个人值得信任，可以妥善地处理这些情况。


    # ## 8.2 总结


    据估计，每小时有1450亿封邮件被发送出去。我读过一些报道，有的声称50%的邮件都是恶意邮件，有的说是30%，还有说20%的。姑且按照20%来计算，那么过去的一个小时内，有290亿封恶意邮件在全球各地被发送出去。29
    000 000 000! 这个数字让人震惊。


    这个问题不会消失，但是你可以反击。你可以帮助你的公司抵御和减轻钓鱼攻击的损害。正如我们在本书中试图解释的那样，没有魔法药或者一步到位的解决办法，但是通过努力、坚持和合理规划，你同样可以取得成功。


    现在你已经知道，我和米歇尔觉得钓鱼攻击是每个人都必须注意的重要问题，但我们也意识到这并不是唯一值得关注的问题。我非常清楚，还有很多层面的安全问题需要警惕——网络、人类，以及处于两者之间的所有东西。


    我和米歇尔希望本书能够对你的工作有所帮助。如果你在阅读本书，但你并不在IT部门工作，那么我希望它可以帮助你理解为什么钓鱼攻击培训对于保证安全十分重要，无论是在家中还是在工作中。


    保持批判性思维，不要轻信那些链接，让动作慢下来，检查得更仔细一些。如果你能做到这些，那么你“上钩”的概率就会大幅度降低。


    保证安全。


