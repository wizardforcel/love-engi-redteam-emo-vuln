    显然邮件头中的域名和邮件中的域名毫不相关。回信地址和认证结果也和 USInsurance无关；相反，它们来自一个欧洲站点。一个安全意识强的人会对此产生警惕，如果这个站点是一个不受信或未知的来源，那么他会上报这封邮件。他不会点击其中的链接，而是会删除这封邮件。


    # 攻击者是如何绕过防御的


    检查邮件头就可以确保安全了吗？不。正如我们所说，有些钓鱼邮件攻击附带一个目的：对网络进行渗透，然后获取使用SMTP服务器的权限。为什么要这么做？


    如果你曾经收到过来自朋友的邮件，结果发现其实是一封非法邮件，请举手。（有多少人在书前面举起了手？）'
