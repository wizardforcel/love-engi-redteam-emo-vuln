    # 第 7 章　专业钓鱼攻击者的工具包


    > > “技术只是工具。”

    > >

    > > ——比尔·盖茨


    我记得祖父第一次带我去深海捕捞时的情景，那时我大概五六岁。我们登上了一艘驶向大海的大船。随着船远离码头，我能看到的陆地越来越少。我害怕吗？并不。为什么呢？因为祖父在我的腰间系了一条粗绳子，另一头系在船的栏杆上。我还记得他说：“至少如果你掉下去了，我们还能钓一条大鲨鱼上来呢！”


    我们进入了规定的区域，船员纷纷拿起巨大的钓竿。钓竿上的线轮比我还大，钓线的另一端有巨大的钩子。船员拿起一根钓竿，把一只大虾绑在钩子上，把钓线浸入水里，接着把钓竿递给我。我的小手几乎握不住钓竿，更不用说钩上来任何东西了。船员看见我在挣扎，于是递给我一个小的东尼虎牌钓竿。我感觉自己像大人一样了，但是我并没有钓到任何东西。


    为什么呢？因为小钩竿并不是合适的海钓工具。刚开始那根钓竿是没问题的，但是我没有力气或者技能来使用它。本章的讨论将围绕着这一教训展开。


    截至目前，本书已经讨论了钓鱼攻击背后的心理学原则、如何开展优秀的钓鱼攻击培训，以及决策背后的逻辑——如何在取得进展的同时又能避免掉入常见的陷阱。接下来的最后一个问题就是工具了。


    尽管如此，问题不仅是工具那么简单。如果只是把工具列表摆在你面前，然后丢下一句“玩得愉快”，那是很容易的。但是我想从专业钓鱼攻击者的角度为你做一个'
