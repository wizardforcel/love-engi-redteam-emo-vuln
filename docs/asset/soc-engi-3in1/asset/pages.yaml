- pgno: 38
  md: '会工程框架彻底改变了人们分析社会工程的方式。


    # ### 1.2.3 社会工程的框架及其使用方法


    我根据个人的经验和研究列出了社会工程人员需具备的各个要素。这些要素都很重要，具备所有要素才能成为一名合格的社会工程人员。这些要素并非一成不变。事实上，从建立开始，框架已经有了很大的发展。


    这个框架的目的在于为学习这些技巧的人提供足够的信息，它并非每章包含的所有信息的资源参考。例如，第5章中有一部分是关于微表情的，内容源于该领域一些杰出人士的研究和我使用这些信息的经验。这些内容绝不可能替代保罗·艾克曼（Paul
    Ekman）博士等杰出人士在该领域50年的研究成果。


    在通读框架之后，你会发现利用框架中的很多技巧不仅可以提高安全实践水平，而且也可以提高自身安全防护、有效沟通和理解他人的能力。


    参考本书目录可大致了解框架，也可以在[www.social-engineer.org/framework](http://www.social-engineer.org/framework)上查看该框架。框架乍看上去有点难以理解，但本书中对各个课题都进行了分析，你将学会如何应用每个技巧，并不断增强技能。


    知识就是力量——诚哉斯言。掌握知识是防御大部分社会工程攻击的最佳手段。即使知识不能提供百分之百的防护，详细了解攻击手法也会让你保持警惕。学习知识不仅可以增强自身技能，而且还可以让你提高警觉。


    除了学习，还要动手练习。本书并非仅需阅读一次的手册，而是一本学习指南。你可以根据需要对每节的课题进行学习和练习。框架内容是循序渐进的，因为社会工程攻击也是如此。框架按照社会工程人员在实践中或计划阶段利用技巧的顺序来讨论各个技巧。


    框架展现了攻击的要点。在攻击计划完成之后、交付之前，必须要研究、增强和练习相关的技巧。


    假设你需要为一家公司策划一次社会工程审计，目的是看你是否能够进入其服务器机房获得其中的数据。


    也许攻击计划是伪装成需要进入服务器机房的技术支持人员。那你就需要收集信息，甚至需要进行垃圾搜寻。


    由于需要伪装成技术人员，你可以采用隐秘的摄像工具捕捉相关信息，练习技术人员的语言、脸部表情/声音，让你在行动、声音及表情上看起来就是一名技术人'
  merge: -1
  img_proc: true
- pgno: 39
  md: '员。


    如果能找到为客户提供技术支持的公司的名称，也需要收集他们的信息。你的客户通常要谁来提供服务呢？具体联系人的姓名是什么？攻击需要适当地计划。


    不过本书并非仅为执行审计工作的人员所写。很多读者想知道攻击是什么，不是为了保护公司，而是为了保护自身。不清楚恶意社会工程人员的思维方式，其结果就是很容易被攻击。


    大学中主修安全的学生也在使用这个框架。框架中列出了这些攻击的实现方法，读者可以深入学习。


    一般来说，这些信息也可以提高每个人的日常沟通能力。通晓怎样读取面部表情或怎样提问会让他人更加放松并引出正面的回应，可以提高你与家人和朋友沟通的能力。它会帮助你成为一个好的倾听者，让你更加关注他人的感受。


    读懂身体语言、面部表情和语调信息也可以增强你的沟通能力。知道怎样保护自己和你爱的人，会提升你的价值，让你对外部世界更加敏感。'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# 1.3 小结


    和其他任何书籍一样，只有付诸实践，书中知识的价值才会得以体现。实践得越多，对这些技能的掌握也就越成功。


    前面我说过社会工程和烹调十分相似。通过将各种正确的调料进行适量混和，可做成令人垂涎欲滴的美味佳肴。第一次尝试烹调时，菜可能做得过咸也可能淡而无味，但是你不会轻易放弃，通过不断尝试，终会得偿所愿。社会工程也一样。一些必须掌握的技巧可能轻而易举就学会了，而有些技巧则难学得多。


    如果某个课题很难理解或很难掌握，请不要放弃，也不要认为自己学不会。只要付出努力，任何人都能学会和使用这些技巧。


    同时也要记住，与烹饪秘方一样，成功的社会工程也需要很多“配料”。第一种配料可能在一段时间后才会发挥作用。有些技巧，例如第5章介绍的“人类思维缓冲区溢出”，只有在你掌握书中的一些其他技巧之后才有意义。


    不管怎样，要反复练习，对没搞清楚的课题要进行额外的研究。现在，让我们开始“烹调”吧。你的“秘方”起始于下一章的第一味配料——信息收集。'
  merge: -1
  img_proc: true
- pgno: 41
  md: "# # 第2章　信息收集\n\n> > 战争的胜利百分之九十取决于情报。  \n> > ——拿破仑·波拿巴\n\n人们常说，没有什么信息是不相关的。本章的主题是信息收集，这句话放在这里完全适用。即使是最微小的细节也可能促成社会工程人员的成功入侵。\n\
    \n我的良师益友马蒂·阿哈罗尼在渗透测试方面有十多年的专业经验，他的一次亲身经历是这方面最好的例证。那次，马蒂的任务是入侵一家在网上查不到什么信息的公司，因为能入侵该公司的途径很少，所以这项任务极具挑战性。\n\
    \n马蒂开始通过互联网寻找可能取得突破的任何蛛丝马迹。一次搜索中，他发现该公司一名高管的公司电子邮件地址出现在了一个集邮论坛上，且该高管对20世纪50年代的邮票表现出了浓厚的兴趣。马蒂迅速注册了一个域名，类似于\
    \ [www.stampcollection.com](http://www.stampcollection.com)，然后从谷歌上找来一堆20世纪50年代的邮票图片。他快速创建了一个网站展示他的“集邮册”，随后又精心编写了一封电子邮件发给该高管。邮件内容如下。\n\
    \n> > 亲爱的先生，\n\n> > 我在 [www.forum.com](http://www.forum.com) 上发现你对20世纪50年代的邮票很感兴趣。最近我的祖父过世了，给我留下一个集邮册，我想出售这批邮票。我建了一个网站，如果你想看的话，请访问\
    \ [www.stampcollection.com](http://www.stampcollection.com)。\n\n> > 谢谢！\n\n> >\
    \ 马蒂\n\n在给目标发送电子邮件前，他想确保产生最大的影响。他找出论坛帖子中该官员办公室的电话号码，给他打了个电话，说：“早上好，先生，我是鲍勃。我看见你在\
    \ [www.forum.com](http://www.forum.com) 上发的帖子。我爷爷最近过世了，给我留下了一大堆20世纪五六十年代的邮票。我拍了照片，并且做了一个网站。如果感兴趣的话，我可以将链接发给你看看。”\n\
    \n目标非常急切地想看到这些邮票，就等着收电子邮件了。马蒂发送完电子邮件后，便等待他点击链接。马蒂将一个恶意帧嵌入到网站页面中，帧中的代码会利用当时很流行的IE浏览器的已知漏洞，使目标计算机受控于马蒂。"
  merge: -1
  img_proc: true
- pgno: 42
  md: '不久，受害人就收到了邮件，而且迫不及待地点开了链接，公司系统的边界防御也就打开了。


    短短的一条信息（受害人寻找邮票时留下的公司邮箱地址）就导致了这次入侵的发生。所以我们说，没有信息是不相干的。带着这样的思想，我们来看看信息收集中会碰到的问题。


    +   - 怎样收集信息？

    +   - 社会工程人员收集信息可以利用的资源有哪些？

    +   - 如何利用收集到的信息进一步描述目标？

    +   - 如何对这些信息进行定位、存储及分类，才能够使之最易于使用？


    为了完成适当而有效的信息收集工作，这些只是需要解决的问题中的一小部分。在多如牛毛的社交网站上，人们可以轻易地与其所选的人分享自己生活的方方面面，这使潜在的破坏性信息比以往任何时候都多。本章通过社会工程实例讲解信息收集的原则和应用，以及人们发布在网上的信息对于其个人和企业安全有何破坏性的影响。


    社会工程人员使用到的很多技巧或方法都来自于其他领域，其中一个典型的例子就是销售。销售人员往往很健谈、随和，而且非常善于收集别人的信息。


    我曾经读过一本有关销售的书，作者鼓励销售人员去收集购买者的推荐，其中有个问题是这样的：“你认为谁能像你一样从该产品中受益呢？只要说一个人就可以。”


    只需要简单的交流就可以让一个人敞开心扉，他可能推荐家人、朋友甚至同事。收集这些信息使销售人员可以在“熟人介绍”的情况下拜访客户，并能够迅速获得对方的信任，不至于吃闭门羹。


    销售人员在拜访时可以使用如下开场白：“我刚从隔壁的简家里过来，她买了我们的优惠套餐。在了解各种好处之后，她支付了一年的套餐费用，并认为你也能从中受益。请问能耽误你一分钟，听我介绍一下简刚刚买的优惠套餐吗？”


    销售人员使用的这些技巧经常被社会工程人员效仿。当然，社会工程人员并不会要求交谈的对象推荐他人，而是自己通过分析得到其中的信息。销售人员从当前客户处收集信息，然后利用这些信息使新的“目标”客户更乐于倾听并接纳自己的建议。此外，通过暗示前一位顾客已购买，并在交流中使用“优惠”、“优先”等关键词，销售人员在短时间内就使目标兴趣盎然。这种技巧很有效，因为'
  merge: -1
  img_proc: true
- pgno: 43
  md: '它建立了信任，利用了“熟人”，能让目标跨越最初的沟通障碍，与销售人员或社会工程人员更为自然、舒服地交流。本章以及第3章将深入探讨这些话题。


    作为社会工程人员，这两个角度对于理解和有效运用技巧都至关重要。回想一下第1章中对主厨的相关阐述：一位优秀的主厨知道如何辨认出高质量的菜肴、新鲜的蔬菜和优质的肉类。他们很清楚秘方中的配料，但若不能把握好各食材的用量，这道菜要么淡而无味，要么偏咸，甚至会难以下咽。想要成为主厨，仅仅知道菜里需要放盐是远远不够的，还需要了解适量的各种配料如何搭配，这样才能掌握烹饪的艺术。社会工程人员只有牢牢掌握各种技术手段的使用方法和适用场景（“秘方”），才能成为社会工程达人。


    本章帮助你找到平衡点。信息便是社会工程人员“秘方”里的首要配料，下一节会详细介绍。信息质量越高，成功的几率就越高。本章从如何收集信息讲起，然后讨论通过哪些途径来收获信息，最后将讨论如何整合各类信息并运用到社会工程中，这样本章在体系上就很完整了。'
  merge: -1
  img_proc: true
- pgno: 44
  md: "# 2.1　收集信息\n\n收集信息就如同盖房子一般。如果想从房顶盖起，肯定是必败无疑。一栋坚固的房子必定是在打下坚实的地基后，从地面往上盖的。收集信息时不要想着怎么组织和运用这些数据，创建一个文件或信息收集服务来收集信息才是当务之急。\n\
    \n事实上，有很多工具可以帮助我们收集和运用这些数据。在渗透测试和社会工程审计中，我使用Linux BackTrack发行版，BackTrack是专为这一目的而设计的。BackTrack^1^和大部分Linux发行版一样，是免费、开源的，也许它最大的优点便是集成了300多款安全审计工具。\n\
    \n+   1. BackTrack是基于Ubuntu的自启动运行光盘，它包含了一套安全及计算机取证工具，简称BT，目前最新与最好用的版本是BT5。\n+\
    \   \n+   ——译者注\n\nBackTrack中的工具也是开源和免费的。特别吸引人的一点在于这些工具的质量都很高，其中很多都能与同类商业软件媲美，甚至是有所超越。这其中就有两个特别适用于信息收集和存储的工具，一个是Dradis，另一个为BasKet。接下来将分别简要介绍这两款工具。\n\
    \n# 2.1.1　使用BasKet\n\nBasKet从功能上看有点像记事本，但是比记事本要强大得多。这款软件现在由王凯文（Kelvie Wong）维护更新，你可以从BackTrack中找到，或者到[http://basket.kde.org/](http://basket.kde.org/)网站上免费下载。该网站有详细的介绍，教你如何安装。这款软件易于使用，界面也并不复杂。\n\
    \n如图2-1所示，界面很简单，很容易上手。在屏幕左侧单击鼠标右键，选择“New BasKet”，会添加一个新的“BasKet”，用以保存数据。"
  merge: -1
  img_proc: true
- pgno: 45
  md: '![](img/9f6d2369b69b99fb89843058054e5812_45_0.png)


    图2-1　信息收集阶段，使用BasKet轻松组织收集到的数据


    BasKet新建好以后，便可以往里面复制/粘贴数据，添加屏幕截图，甚至可以添加OpenOffice办公软件或者其他类型的图表数据。


    添加屏幕截图的方式有好几种，最简便的方法是复制图片，在新“BasKet”中单击鼠标右键，选择“粘贴”。如图2-1所示，添加图片的操作简单、快捷，同时可以通过输入、粘贴等各种方式为图片添加文字备注。


    在通常的安全审计中，BasKet组织和展示数据的方式是它的优势之一。我通常为不同类型的数据建立不同的BasKet，例如域名查询信息、社交媒体信息等。然后，使用谷歌地图或谷歌地球获取目标客户的建筑和设施图片，保存到BasKet中。信息收集完成后，快速提取和使用这些信息也很简单。图2-2展示了一个接近完工的BasKet，其中有很多有用的信息和标签。


    如图2-2所示，使用BasKet来存储和组织信息很简单。我尽可能多地往里面存放信息，因为再小的信息也可能是有用的。我收集的信息包括目标客户的网站内容、域名查询信息、社交网络、图片、员工联系方式、简历、论坛、爱好等一切可能与目标公司相关的信息。'
  merge: -1
  img_proc: true
- pgno: 46
  md: '![](img/9f6d2369b69b99fb89843058054e5812_46_0.png)


    图2-2　包括很多有价值信息的几近完整的BasKet截图


    信息收集完成之后，直接单击“BasKet”菜单，然后单击“Export”，将整个BasKet导出为HTML网页文件。这对生成报告和共享信息非常有用。


    对于一名社会工程人员来说，接下来要详细讨论的数据收集是每次行动的核心。然而，如果信息不能得到及时的重现和运用，将会毫无价值。BasKet及其类似工具使得信息收集和使用工作更加简单。一旦你尝试使用，便会爱不释手。


    # 2.1.2　使用Dradis


    尽管BasKet是款非常好用的工具，但是如果要收集的信息很多，或者需要一组人共同完成信息收集、存储和调用操作，那么就需要一款能够供多用户共享数据的工具——Dradis。根据Dradis工具开发者的描述，Dradis是可以提供信息中央存储的独立Web应用，可以统一管理需要收集的信息。


    和BasKet一样，Dradis也是一款免费的开源工具，你可以在 http://dradisframework.org/ 网站上免费下载。Dradis可以安装于Linux、Windows和Mac等不同操作系统，http://dradisframework.org/install.html网页上有详细的安装和配置说明。


    Dradis安装并设置好以后，就可以浏览你分配的本地主机和端口，或者使用标准端口号3004。只要打开浏览器，在地址栏中输入 http://localhost:3004/
    即可登录使用。'
  merge: -1
  img_proc: true
- pgno: 47
  md: '登录进去以后的欢迎界面如图2-3所示。注意左上角的添加分支（Add Branch）按钮，添加分支以后就可以像BasKet一样添加信息，如备注、图片等，甚至可以导入笔记数据。


    ![](img/9f6d2369b69b99fb89843058054e5812_47_0.png)


    图2-3  Dradis简洁而易用的界面


    Dradis和BasKet只是用来收集和存储数据的两款小工具，二者的网站上都有很好的设置说明和使用介绍。


    不论操作系统是Mac、Windows还是Linux，你都能找到相对应的工具。重要的是工具用起来顺手，并能处理大规模数据。


    基于上面提到的因素，我建议社会工程人员放弃使用Windows或Mac操作系统自带的记事本和文本编辑器。它们无法满足你对于数据格式和相关区域高亮显示的需求。图2-3显示的是我使用的Dradis服务器端，有一部分我专门用来保存电话交谈记录。这个功能很好用，可以记录我根据所收集的信息产生的想法。


    这些工具表明了社会工程人员是怎样利用收集到的信息的。利用信息的第一步便是要像社会工程人员一样思考。


    # 2.1.3  像社会工程人员一样思考


    拥有几百兆的图片和数据固然很好，但是当你回过头来浏览这些信息时，如何能够保证最大限度地挑出有用的信息呢？


    当然，你可以打开浏览器，随机输入冗长的词语进行关键词搜索，这样做可以找到某种形式的信息，其中一些甚至是有用的。然而，在肚子很饿的情况下，你才不会跑到厨房，不管三七二十一地往锅里随意扔食材，然后就开始翻炒呢。计'
