  md: '作为社会工程人员，我和克里斯需要理解影响与操控的过程以帮助客户抵御攻击。所以让我们来把镜头转一下，看看帷幕背后的男人（或女人）吧。


    # # 第3章 影响与操控


    > > “这不是你要找的机器人。”

    > >

    > > ——欧比旺·肯诺比（Obi-Wan Kenobi），

    > > 《星球大战4：新希望》


    讨论社会工程时不能不提到影响与操控。对于所有的意图和目的而言，它们是第2章中所讨论的决策的催化剂。正如我们所发现的，人们做事有很多缘由，但是优秀的社会工程人员对此足够了解，因此可以引导人们做出决策。


    让我们从定义开始。克里斯在他的第一本书《社会工程：安全体系中的人性漏洞》¹ 中，把影响定义为“让某人像你所希望的那样行动、反应、思考或者信任”。操控和影响类似，但是它主要用于不怀好意的情况，几乎总是符合操纵者的最佳利益。


    ¹ 该书已经由人民邮电出版社出版，书号9787115335388。——编者注


    在深入这个有趣的领域之前，我想提一件事。我和克里斯明确区分了所谓的影响（influence）和操控（manipulation）。显然，二者很相似，你可能也听过人们互换使用这两个词。二者都是指一个人采取了对另一个人生效的行为。但是它们给人的感觉不同，不是吗？你可能听过某人产生了“坏的影响”，但是你听过有人用“好的操控”这种表述吗？尽管二者都会导致某种看起来相同的决策、行为或者其他结果，但二者得到结果的方式以及目标的感觉是完全不同的。


    在这个层面上，我认为影响和操控分属于两个极端。影响显然是积极的，例如给家庭成员提供建议，帮助他做出健康饮食的选择。操控则是消极的，例如由于担心个人安全受到威胁而泄露信息。二者之间还有很多难以界定的情况，因为很多交互既有积极的方面又有消极的方面。无疑，影响制造了紧张情绪，或者说是行动的必要，否则人们就没有改变行为的动机。因此，要知道影响和操控之间的界线并不是一个点，而是很大一片灰色区域，并且通常因个人解读的不同而有所差异。'
