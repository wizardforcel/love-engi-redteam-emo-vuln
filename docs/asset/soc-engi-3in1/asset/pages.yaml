    # 8.2.3　社会工程框架的运用


    SSA攻击可能会让你瞠目结舌。从这个应用了社会工程框架的特殊攻击中，你能获益颇丰。


    基思首先进行了信息收集。可能你已经听烦了，但是获取信息是所有优秀社会工程人员攻击的核心所在，掌握的信息越多就越有利。'
