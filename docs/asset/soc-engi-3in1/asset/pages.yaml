- pgno: 681
  md: '有所改善。


    当然，不幸的是，很多公司在被攻破后或者嗅探到钓鱼攻击后才这么做。我见过钓鱼攻击模拟的结果被上报给董事会后，董事会决议开展一系列持续的钓鱼攻击模拟来提高安全意识的情况。当然，这是很好的，可以让人们受到教育以保证安全。


    我的观点是组织机构不应该等到被攻击后才开展这类项目。“鸵鸟”安全法（把你的头埋在沙里，假装你不会被攻击）很少起作用。安全委员会已经不再说“如果你被攻击了”，转而开始说“当你被攻击时”，因为似乎早晚我们都会遭受攻击。


    不要做枝头低垂的果子——在钓鱼攻击者把你从树上摘走前就进行训练和教育吧。


    # 把钓鱼攻击当作渗透测试的一部分


    对公司来说，把钓鱼攻击当作渗透测试的一部分已经变得很寻常了。这么做可以有很多办法。有一种钓鱼攻击方法可以使得 shell（或者远程访问你的网络）成为可能，通过载入可执行文件或者包含允许渗透测试人员远程访问网络的代码的附件。在另一种方法中，钓鱼攻击会引导你访问一个页面，这个页面会收集你的证书信息。第三种方法则是诱导员工访问一个
    404 错误页面，而员工并不会被告知他或她正在接受钓鱼攻击模拟。而第四种方法则引导员工访问一个教育页面。[^1]


    [^1]: 教育页面，即点击钓鱼邮件链接后，会引导你进入一个关于防范钓鱼攻击的安全教育页面。——译者注


    不管你的公司做出哪种选择，把钓鱼攻击模拟当作渗透测试的一部分都是一个好主意。我知道这句话会引出另外的一些问题。例如，我现在的渗透测试公司能够很好地进行钓鱼攻击测试吗？它在安全领域有经验吗？我们对这一测试应该抱着什么态度？


    这些都是很好的问题。在与渗透测试公司进行沟通之前，你的头脑中应该已经有了清楚的答案，这样才能确保得到你想要和需要的服务。


    # 为什么问为什么


    好了，你现在对想要开展培训的基本原因有了比较清晰的认识，但是为什么了解想要开展培训的原因是很重要的呢？


    很简单。因为这个答案会影响你组织培训的方式、使用钓鱼攻击的方式、所选择的媒介，以及所期待的结果。'
