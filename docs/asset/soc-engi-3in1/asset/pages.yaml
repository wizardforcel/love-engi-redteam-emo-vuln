- pgno: 269
  md: '用耙的方式，大约30秒钟之后我就成功进门了。很多社会工程人员都有过类似的经历，懂得锁的原理并携带合适的工具才造就最终的成功。公司会花费数万甚至数百万元美元购买硬件、防火墙、入侵检测系统以及其他保护手段，再把它们都扔在一个房间里，最后只用廉价的玻璃和一把20美元的锁来保护它们。这样的情况屡见不鲜。


    因为撬锁会面临被发现或被抓住的风险，所以练习是必不可少的。你必须动作迅速以降低风险。有一些地方安装了摄像头来监控这种行为，但最终效果不佳，除非当时有人正在监视摄像画面，否则它只是记录了有人非法闯入并窃取服务器的过程而已。


    通过一些简单的方法就可逃过摄像头的法眼，比如用LED强光照镜头或者用帽子或头巾遮住面部。


    # 2. 打开磁性锁和电子锁


    磁性锁之所以越来越风靡，主要原因在于其运行费用低廉并且提供了一定程度的安全保障，不像传统的弹子锁那样可以被撬开。磁性锁的形状、大小和磁力级别各异。只是从某种程度上来讲，磁力锁也并不安全：如果突然断电，大部分磁力锁将失效，门就被打开了。当然，没有使用后备电源才会产生这样的后果。


    强尼·龙是世界知名的社会工程人员和黑客，谷歌黑客入侵数据库的创始人及《非技术黑客》（No Tech Hacking）一书的作者。他讲述了自己使用衣架和毛巾绕过磁性锁的故事。他注意到员工从里向外走向门口的动作会触动门锁打开，还注意到门中间有一道足以塞进一个系着毛巾的衣架的间隙。通过摇动毛巾，锁就被打开了，他也就长驱直入了。


    我最近实践了一下这一过程。果然只要略微施力，并确定所需衣架的长度，两分钟不到我就打开了锁。最让人惊讶的是，即便花大价钱安装专业的商务锁、配备防弹玻璃的金属门，同时增加后备电源和断电的情况下自动上锁的栓锁，也防不住衣架和破布。


    当然，打开这些锁也可采用一些高科技的方法。有人发明了RFID克隆机，该小型设备可通过获取和重放RFID密码打开门锁。市场上也有多种复制磁性卡的设备。


    # 3. 各种各样的开锁工具'
  merge: -1
  img_proc: true
- pgno: 270
  md: '除了扭力扳手和拨片之外，社会工程人员可能也会使用一些其他的工具（比如推刀、撞匙和挂锁垫片等）来进入目标地点。掌握了下列工具的使用技巧后，就可以轻而易举地进入目标场所了。


    +   - 推刀


    推刀被誉为最快捷的打开旋钮锁门的工具，如图7-6所示。旋钮锁常用于服务器机房或办公室的门。这把刀基本上可以在不破坏门的情况下切进正确的位置释放门闩。


    ![](img/9f6d2369b69b99fb89843058054e5812_270_0.png)


    图7-6　典型的推刀


    +   - 撞匙


    虽然撞匙已经面世多年，但只是因为被用于犯罪行为才在新闻中被广泛关注。撞匙是经过特别设计的钥匙，用户把钥匙插进锁里，轻轻用力使之在适当的位置发生“碰撞”，将所有的弹子排成一条线，这样就可以在不破坏锁的情况下，转动锁芯。基本的技巧是把钥匙插入锁中，拔出一个或两个凹口的长度，然后对钥匙稍稍用些力，用螺丝刀或其他小物体轻轻“碰撞”钥匙。这个动作强行使弹子进入恰当的位置，这样锁芯就可转动了。图7-7展示的就是一把撞匙。'
  merge: -1
  img_proc: true
- pgno: 271
  md: '![](img/9f6d2369b69b99fb89843058054e5812_271_0.png)


    # 图7-7　典型的撞匙


    +   - 挂锁垫片


    垫片是插入挂锁底部的一小块薄金属片，用来解除锁定机制。垫片被推入底部的锁轴，将锁轴与锁定机制分开，然后解开锁。如图7-8所示。


    ![](img/9f6d2369b69b99fb89843058054e5812_271_1.png)'
