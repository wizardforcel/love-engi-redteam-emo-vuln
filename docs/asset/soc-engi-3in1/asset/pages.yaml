- pgno: 166
  md: "+   2. 这个手势在美国是一个“和平的象征”，但在欧洲它的意思是“胜利”。如果手掌朝脸，它意味着“没门儿”。\n+   \n+   3. 在美国这是一个舒适的坐姿，并无任何恶意。然而在其他国家，如泰国、日本、法国以及中东和近东地区，露脚底意味着不敬。露出你身体最底下和最肮脏的部分是一种侮辱。\n\
    +   \n+   4. 在美国这个手势表示一切正常。但是在世界其他地区有很多不同的含义：在巴西和德国，这是一个猥亵的手势；在日本这意味着“钱”；在法国则意味着“没有价值”。\n\
    +   \n+   5. 在美国这是一种问候，一种打招呼或表示再见的方式。在欧洲它可能意味着“不”，而在尼日利亚则是一种严重的侮辱。\n+   \n+  \
    \ 6. 在美国点头是表示认同的一种方式，类似于说“是的”。在许多地方都是同样的含义，但在某些地区，例如保加利亚和希腊，点头意味着“不”。\n\n这些只是在不同地区或者面对不同对象时具有不同含义的几个手势的例子。明白手势的各种含义非常重要，因为沟通本身往往比谈话内容更为重要。\n\
    \n本节是为了表明，在和目标对象的互动过程中，不仅需要观察这些原则，还要积极地运用它们，以操纵目标进入最容易被社会工程的状态。了解将要接触的目标对象的文化背景，避免因错用手势而带来不好的结果。\n\
    \n# # 1. 锚定\n\n如果使用得当，手势可以产生很大的影响。这些手势原则中的一部分来自对NLP的研究，但是当你试图将目标对象的思维置于你的控制之下时，它们可以起到很关键的作用。\n\
    \n方法之一便是锚定，就是用特定的手势与一种类似表达形成关联。例如，你在和目标说起一些正面和美好的事物时，可以重复并且仅仅是右手做出手势。如果是坏事，则可以只用左手比划。在做这个手势几次后，你就能开始在目标的脑海里“锚定”了一个“事实”：右手动作和美好的事物相关联。\n\
    \n销售人员使用这种方法来进一步强化“他们的产品”或“他们的服务”是最好的，而竞争对手的却不是。一些政客使用这种方法将积极的想法或他们想要听众认为是积极的想法与特定手势进行锚定。对此，比尔·克林顿是个范例，他深谙此道。"
  merge: -1
  img_proc: true
- pgno: 167
  md: '# 2. 镜像


    还有一种被称为镜像的手势战术，指的是你尝试匹配目标的个性化手势。当然，这并不像听起来那么容易。但是仅仅通过观察目标对象能够得到什么信息？他害羞吗？他说话大声、个性外向吗？如果在接近一个胆小的人的时候，你的动作和声音都很大，肯定会把他吓跑，甚至可能直接导致你的社会工程失败。同理，如果你很内向的话，在与“大嗓门”的人打交道时则必须镜像“大嗓门”的手势。镜像不仅包括模仿目标的肢体语言，还包括模仿他的手势，让对方更容易跟着你的思路走。


    你可以将这个原则运用到另一个层次。目标对象在看到熟悉的手势时，会有一种自在的感觉。不过必须要注意把握好分寸，因为如果目标有一个特别的手势用得比较多，而你也在同样的情况下使用，这可能会产生激怒他的风险。要模仿他，但不要完全相同。如果目标在思考结束时手总是放在下巴上，那么你可以把手放在脸的一侧或用手指轻敲几次下巴作为呼应。


    下一节进一步分析了手势这一话题，讨论目标对象双臂和手的摆放位置的重要性。


    # 5. 4. 3 双臂和手的摆放


    执法人员在培训时就强调观察采访和审问时目标手臂及手的摆放和位置。在审问期间，动作的增多或者“坐立不安”能够显示其压力越来越大，标志着审问正在产生预期的效果。当然这是在执法环境中；社会工程场景中，你会看到相同的迹象，但目标的压力迹象可能表明你需要适当后退，除非你的目的就是要通过压力吓退他。


    某些执法人员被教导要注意如下几个标志。


    +   - 当一个人处于放松状态时，肘部一般会没有拘束地放在身体两侧。当感到威胁或害怕时，身体的自然反应是肘部向胸腔收进。从本质上来讲，在受到威胁时，这一反应为内部器官提供了一层保护。\n-
    手势也往往会透露很多信息。目标对象可能会用手势描述出一些不会说出的东西。例如，在刑事审讯过程中，嫌犯可能使用手势来描述作案过程（即绞杀、射杀及刺伤等），但词句中只会提到犯罪或事件。观察对象可能使用的手势的微妙变化很重要。'
  merge: -1
