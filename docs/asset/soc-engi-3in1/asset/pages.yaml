- pgno: 679
  md: '我们花了许多年来制订和测试这套培训。现在我们对它进行了重新改良，使你能尽快上手，这样我们就能帮助尽可能多的人来准备好这场与钓鱼攻击市场进行的战争。


    # 说明


    我曾经在中国做过一些工作，并参观了厂商推销产品的大市场。我一直把一则建议记在心中：我被告知会有很多人试图让我买他们的产品，而我要做的仅仅就是说“不好”。结果在我回绝后，随着我走远，那些厂商不断降低他们的价格。这简单的两个字让我省下了上百美元。


    本章的目标是告诉你我在最近这些年里学到的一些东西。这样一来，你花在“市场”里的时间会更少一些，但收获会更大一些。


    首先我们来看一些基础问题，然后我们将一起开展项目，最后会概览一下在公司实施这个项目的方法——无论公司有100人还是100 000人。


    # 5.1 基本方法


    很多人知道我们喜欢烹饪（和吃），任何美味的一餐都始于一些基本的问题：


    +   - 我想吃什么？

    +   - 我应该用什么配方？

    +   - 这一餐的目的是什么？

    +   - 有其他的需要准备的东西吗？例如盘子、配菜等？


    如果你替我问米歇尔这些问题，那么她只会告诉你“羔羊肉”——但我该回到主题上来，因为本章并不是关于食物，而是关于我们的钓鱼攻击培训。但是钓鱼攻击培训和做饭类似，在你能够开始培训之前，你必须解决一些基础问题。


    说明 不要被骗了——对你所在的组织进行钓鱼攻击听起来很简单，但是只是简单地发送钓鱼攻击邮件而不回答下面这些问题会导致失败。


    # 5.1.1 为什么


    问“为什么？”似乎是很简单的，但是你的答案应该是能对你的钓鱼攻击培训有所改变的。为什么你要开始这一培训？你曾经因为下面的理由进行过钓鱼攻击模拟'
  merge: -1
