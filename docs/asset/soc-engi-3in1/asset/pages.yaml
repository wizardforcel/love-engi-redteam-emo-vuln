- pgno: 680
  md: '吗？


    # 遵守规定


    公司政策、董事会，或者有些情况下合同谈判都能决定他们想要你的组织进行何种测试。我们在和一些大公司合作时遇到过这类情况。政府规定或者其他规定要求公司进行钓鱼攻击测试并报告结果。


    对于开展钓鱼攻击来说，遵守规定并非一个坏理由，但是如果这是唯一的动机，那么正如我们所发现的，很多公司都会选择最小的难度然后拿到数据就完事了。这种简单服从的测试会导致倾向于使用稍弱一些的模板，人们往往只会查看一下钓鱼邮件点击率。


    再次强调，确定一条基线是很好的，但对于钓鱼攻击培训来说，不要把遵守规定当成唯一的理由也是很重要的。


    # 被告知进行钓鱼攻击模拟


    有时候某位老板、首席信息安全官，或者其他人会要求某个部门组织并发送钓鱼邮件来进行钓鱼攻击模拟。当我听说这是开展钓鱼攻击项目的动机时，我会和提出这一要求的聊聊，从而找出驱使他进行模拟训练的（列在这里的某一种）原因。如果你被告知要开展这一项目，那么你也应该问问他们这些问题。


    # 尝试增强安全意识


    很多公司把钓鱼攻击模拟当作他们的年度常规项目之一，用于测试人们受钓鱼攻击的影响程度。这些测试可以每月或每季度组织和发送，并且它们几乎总是有教育作用的。


    安全意识是非常常见的一种开展钓鱼攻击模拟的原因，它是公司具有前瞻性的体现。通常定期参与钓鱼模拟会对营造安全文化有显著的影响，这是一件好事。


    另外，我们曾经看到过有人从对钓鱼攻击一无所知到能够（在家和在工作中）识别出最高级别的钓鱼攻击的转变。这是开始钓鱼攻击培训的一个很强大的理由，对你的员工如何看待安全意识有着长久的影响，这也能让他们看到公司有多么重视他们以及他们的福利。


    # 经历安全事件后的启示


    很多公司是在发现漏洞或者发生类似的安全事件后进行钓鱼攻击模拟的。模拟是为 了首先设置一条基线，然后教育人们或者解决一些问题，再重新测试看看状况是否'
