  md: "# 第4章 伪装：如何成为任何人\n\n> 诚信是建立关系的关键。如果善于伪装，也能成功。\n> \n> ——理查德·杰尼（Richard Jeni）\n\
    \n有时我们会希望自己变身为另外一个人。我就常常很见鬼地希望自己能稍微瘦一点，帅一点。即使医学界还没有研发出一种快速变身的药物，但是解决这种窘境的方法确实存在，那就是伪装。\n\
    \n什么是伪装？有人认为只是社会工程过程中编造的故事或者谎言，但是该定义是非常狭义的。更为精确的定义是，以背景故事、衣着、仪表、个性和态度来塑造角色以完成社会工程审计工作。伪装包括你所能想到的基于对象角色的方方面面。作为社会工程人员，你伪装得越全面就越令人信服。一般情况下，伪装得越简单，说明技术越娴熟。\n\
    \n伪装，尤其是从互联网出现以来，越来越多地被恶意利用。我曾经看到过一件T恤上写着：“互联网上，男人是男人，女人是男人，小孩子是等待着你的FBI探员。”虽然这是句调侃，但这种说法有一定的道理。在互联网上，你可以随心所欲地装扮成任何人。这种伪装技术多年来一直被恶意黑客用来攫取利益，而且不仅限于互联网。\n\
    \n在社会工程过程中，角色扮演或者假扮别人以达到目的有时是必要的。克里斯·海德纳吉或许没有一个技术支持人员或者一个进出口公司首席执行官那么大的影响力。当一个社会工程情形出现，有能力成为那个要伪装成的人是非常重要的。在一次讨论会中，我和世界知名的社会工程人员克里斯·尼克尔森（Chris\
    \ Nickerson）聊到这个话题，他说到了一些我认为真正切中要害的观点。\n\n尼克尔森说伪装不是扮演某个角色或者出演部分剧情，不是撒谎后不停地圆谎，而是真的成为那个人。你的一丝一毫都是正在扮演的那个人。走路的方式、说话的方式、肢体语言都与那个人一样。我同意他的这个伪装哲学。一部令人感到绝无仅有的电影，往往是因为演员的出色表演，他们对于角色巧妙、精准的演绎让我们难分真假。\n\
    \n这在我的生活经历中得到过验证，很多年前我和妻子观看了布拉德·皮特出演的精彩影片《燃情岁月》。电影中他扮演一个自私的混蛋，拥有一个饱受折磨的灵魂，做了很多错误决定。他的表演如此到位，以至于我妻子讨厌了这个演员好几年。他就是个很好的伪装者。"
