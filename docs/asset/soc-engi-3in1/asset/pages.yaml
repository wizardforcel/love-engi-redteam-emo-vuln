- pgno: 245
  md: '# 图6-10 同样的商品放置在多行货架中


    +   o 块放置  具有一定共性的商品放置在一个块（品牌）中。可以并排放置、上下堆叠、中心环绕，也可以使用磁力挂钩等各种方式（参见图6-11）。


    ![](img/9f6d2369b69b99fb89843058054e5812_245_0.png)


    # 图6-11 类似商品或品牌的块放置方式


    货架图不是操纵购物者的唯一方法。还有一个测试，即在商场内循环播放特别设计的音乐。结果是在播放音乐的情况下，购物者在大卖场内的购物时间平均会增加18%。


    杰-查尔斯·沙巴特（Jean-Charles Chebat）和理查德·米琼（Richard Michon）在《商业研究期刊》上发表了一篇有关加拿大大型购物中心的研究论文（详见[www.ryerson.ca/~rmichon/Publications/Ambient%20odors.pdf](http://www.ryerson.ca/~rmichon/Publications/Ambient%20odors.pdf)）。研究者在空气中喷洒特别设计的香味，意图促发购物者的快乐情绪、刺激购物。结果是在一周的研究时间里，平均每个购物者会多买50美金的东西。


    去大型购物中心和水果店的体验肯定不一样。不过，从这些方法和实验中我们能学到很多。了解大脑对事物的分类方法，有助于你组织自己的“货架”，以便操纵目标的感觉、情绪和思维。


    再来说一下色彩，它们是操纵目标情绪的一种主要方式。放置商品的原则同样适用于色彩。你的衣物或者用品的色彩能够对目标产生影响。很多研究的主题是色彩及其效果。下面列出了一些通过色彩影响人们思维或情绪的方法。'
