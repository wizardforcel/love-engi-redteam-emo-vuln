- pgno: 464
  md: '![](img/9f6d2369b69b99fb89843058054e5812_464_0.png)


    图 4-5　她是友好的吗？


    我们能够迅速决定是否喜欢或信任一个人。我们的非语言行为是自身感觉的真实写照。我们在跷二郎腿的时候会将腿礼貌地朝向我们喜欢的人。但如果是图4-5的情况，那就是我们用跷起的二郎腿在自己和自己不喜欢的人之间设置了一道屏障。


    腿和脚在非语言交流方面有着丰富的含义。当我们将注意力向身体上方转移时，你还会有更多发现。下面就来讨论躯干和手臂。


    # 4.2　躯干和手臂


    假设你在拥挤的地铁上，整个地铁上唯一剩下的空座就在你的旁边。这时来了一个看起来好久都没洗澡的男士。他走近的时候，你闻到了难闻的气味。你会怎么做呢？又无处可去。或许你会先把头转向另一边，然后倾斜身体。仅仅几厘米的距离丝毫不会驱除那位男士的体味给你带来的不快，但你仍然会这样做。这是为什么呢？'
  merge: -1
  img_proc: true
- pgno: 465
  md: '我们倾向于远离我们不喜欢的东西，而趋近我们喜欢的事物。现在如果那位男士变干净了，也没有了难闻的体味，性别也换成了充满魅力的异性，而且刚刚沐浴完毕，那么你又会倾向于哪种方式呢？


    躯干的无意识倾斜能够表明我们喜欢群体中的哪个人。想象你和一群朋友在一起的画面。当你知道谁和谁在情感上比较亲密后，再看看他们的躯干倾向是否能证明上述观点。


    请看图4-6，看看谁喜欢谁是不是表现得很明显。


    ![](img/9f6d2369b69b99fb89843058054e5812_465_0.png)'
  merge: -1
  img_proc: true
- pgno: 466
  md: '# 图 4-6 本真正喜欢的是谁？


    在图4-6中，两位女士都倾向于本，但是本更倾向于萨琳娜。这表明了他真正的兴趣所在。


    即便目标对象是坐着的，躯干也能告诉我们他们的想法。请看图4-7，判断萨琳娜是觉得舒适还是想离开。


    ![](img/9f6d2369b69b99fb89843058054e5812_466_0.png)


    # 图 4-7 留下，还是要离开？


    如果看出萨琳娜想走，你就猜对了。躯干的移动，比如像图4-7中移向前方的情况表明萨琳娜想离开。


    观察躯干的关键在于其倾斜度。目标对象倾向于哪里以及怎样倾斜意味着她喜欢谁或不喜欢谁，同时也能表明她是感到舒适还是想要离开。这些迹象能够帮助我们恰如其分地'
  merge: -1
