- pgno: 691
  md: '损失的恐惧、内心的贪婪，以及对“如果……那会怎样”的好奇心超越了逻辑和理性的力量。


    # 真实生活中的一级钓鱼攻击


    我曾经见过这样一个人，他曾协助发起过恶意攻击，他告诉过我的悲惨故事让人颤栗。他和他的同伙不仅会发送钓鱼攻击邮件，还会用真人扮演来让一切显得更可信。让我给你举个例子。


    假设你不幸回复了这类邮件。你会收到回复，告诉你需要签署法律文件，而且会面安排在某个城市的一间办公室里。


    当你走进办公室的时候，你会看见一个穿着像是<插入邮件来源所在的国家>军队制服的人，他面前摆着很多看起来相当正式的文件。你会被要求签署银行转账表格、法律权利表格、律师表格——这些都与邮件里声称的相符。然后你要交给他们一张5000美元的支票。这与你日后会收到的450万美元相比，看起来只是一个小数目。不幸的是，由于政府原因，一周后你会被告知需要另付5000美元来帮助取出政府所拥有的钱。


    我认识的人告诉我，在拿走受害人5000到15 000美元后，他和他的同伙就会消失不见。一次对5个、10个、20个或者100个人发动这样的攻击，对于一个外国团伙加上若干名美国的操作者来说运气并不算坏。一个星期里他们就可以拿到100万到400万美元——是的，你没看错——然后就消失在落日里。


    因此，你不应当嘲笑他们，也不应当认为一级钓鱼攻击很蠢而且根本不会奏效。还记得我告诉过你我在去年发了300万封钓鱼攻击邮件吗？其中一级钓鱼攻击有5%到7%的点击率，因此，最少有15万人点击了这类邮件里的链接。钓鱼攻击者只需要一个愿意点击和打开恶意软件的人就可以摧毁你的网络，所以15万人并不算少。


    # 二级钓鱼攻击


    二级钓鱼攻击更复杂，尽管也有与一级钓鱼攻击类似的指标，但它的主题更为巧妙和隐蔽。我和米歇尔归纳出了下面这些特征：


    +   - 非指向性问候和结束语；

    +   - 拼写正确但有一些语法问题；

    +   - 信息更复杂但仍然很基本；'
