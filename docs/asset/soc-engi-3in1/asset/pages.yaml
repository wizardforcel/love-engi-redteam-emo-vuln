- pgno: 250
  md: '钱，他伪装的角色将是“可以”要钱的人。在这种情况下伪装成慈善组织就比较合适，因为请求捐助或者询问财务信息是再寻常不过的事了。


    # 2. 意识激励


    意识激励非常难以描述。每個人的理想都不同，这些理想可以影响激励。如果你 的理想是经营一家餐馆，那么这就是你的激情所在。你会长时间工作，比员工投 入更多的精力，而且不太在意金钱回报，因为那是你的梦想和目的，而对其他人
    来说则只是一份工作。


    梦想和信念可以深植于一个人的心中，以至于几乎不可能将它们同其人分开。当 听到有人说“我有一个梦想”时，你会想到马丁·路德·金吗？有些人的梦想和 目标是要成为什么样的人，而不是脑子中的空想。


    人们会被拥有类似梦想和目标的人所吸引，所以“物以类聚，人以群分”这句话 用在此处非常合适。但这也是很多人能够被操纵的原因。


    让我们以基督教电视传道者为例来进行分析。那些信仰或者渴望信任上帝的人聚 在一起。具有类似信念的人能够增强彼此的信念和做正确事情的欲望，但是电视 传道者可以利用这种意识告诉他们上帝的意愿是让某个教堂繁荣，因而他们的钱
    包也就能鼓起来。


    电视传道者进行几番激励性的布道、洒下一些泪水，突然间人们就将支票不断地 送过来。这些传道者同时利用了金钱和社会理想这两种工具（参见下文），将听 众的思想转换成他们的思维方式，所以这些人将辛苦挣来的钱捐了出来。有意思
    的是，如果你问那些追随者，对于“牧师比他们富裕得多”有何感觉，他们相信 那是上帝的旨意。他们的思想已经发生了改变或者已经被操纵。


    意识激励也能用于对人们进行道德教育，甚至借助恐惧这一激励方法也能对人们 产生很大的影响。人们常常通过具有寓意的故事和寓言教育儿童意识激励。《格 林童话》就是这类类型激励的最好例子。故事的结局通常是坏人受到惩罚或者死
    亡，而好人在坚忍不拔地克服各种困难后最终得到了巨大的回报。这些故事借助 恐惧让孩子们知道做坏事会受到可怕的惩罚，甚至可能死去。


    意识激励也用于市场营销，在“志趣相投”的人“碰面”的地方投放广告。例 如，尿布公司在家庭杂志上做广告，动物保护组织选择在动物园做宣传，运动器 材公司则瞄准体育赛事等。这类类型的激励使得广告中的商品或服务在具有共同
    思维模式的人群中热销。'
