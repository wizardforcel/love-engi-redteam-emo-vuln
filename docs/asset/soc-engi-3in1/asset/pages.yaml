- pgno: 698
  md: '![](img/9f6d2369b69b99fb89843058054e5812_698_0.png)


    # 图 5-3  行动中的懒人原则


    我知道，任何人似乎都能识别出这一钓鱼攻击，但事实是它奏效了。同样简单的是关于煤炭绿色化倡议的钓鱼邮件，它只有一行字，就让可口可乐公司中招了。此类钓鱼邮件层出不穷，但是都有一个共性，那就是它们都很简单，但直击要点。它们是如何做到的呢？


    这些攻击之所以有效，是因为收件人正期望着收到这类邮件。他们已经做好准备接收、认可、打开并阅读这类“主题”的邮件。他们认为收到这类邮件是理所当然的，因此就照着邮件里的要求去做了。


    很多例子中，鱼叉式钓鱼攻击中更重要的是OSINT（open-source intelligence，获取开放性情报，或者信息收集）的部分，而不是发送邮件的部分。这一部分可以为攻击者清理出一条通向受害者的途径，以及了解如何对目标进行渗透。


    在可口可乐公司的例子中，点击链接后恶意软件就加载到了目标的电脑中。目标电脑被攻击后，进而就影响到了整个网络。'
