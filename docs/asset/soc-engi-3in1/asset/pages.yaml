    # 专业建议


    在人们答应一个请求后，他们很可能继续再答应一个。经验丰富的社会工程师能够在不显得古怪或者冒犯的同时逐渐提高要求，并克制自己对于持续索取行为的个人反感。在斯坦利·米尔格兰姆博士20世纪60年代的实验中，“逐步加强”（escalation）这一概念得到了令人惊讶的体现。12


    12 S. Milgram, “Behavioral Study of Obedience,” Journal of Abnormal and Social
    Psychology 67(1963): 371 - 8.


    尽管这项研究的目的是为了确认人们服从权威的程度，但它同样也是一个很好的对“逐步加强”这一概念的说明。参与者被要求通过（假的）电击来“教”学习者记忆单词。每次学习者犯错时，教师就要增加15伏特的强度。图3-6展示了参与者看到的面板。


    ![](img/9f6d2369b69b99fb89843058054e5812_649_0.png)


    # 图 3-6 米尔格兰姆的“电击”面板


