- pgno: 733
  md: '# 图 7-7 ThreatSim教育页面


    # 个人评价


    下面是我对ThreatSim的评价。


    +   - 使用这款工具需要怎样的知识水平？


    ThreatSim很容易使用。它肯定是为新手用户设计的，但是它也有健壮性。我发现利用它来设置钓鱼攻击邮件是很轻松的。导入用户列表以及设定发送时间也都可以直觉操作。报告功能不像我想象中那么有健壮性，但最后还是成功地把数据导出了。ThreatSim团队一直在改进和提升他们的产品，总体来说它是很容易使用的一款工具。


    另外，有一些新功能使ThreatSim使用起来更轻松。我最喜欢的是动态列表生成。这意味着我可以设置标准，然后创建一个符合标准的用户列表。例如，我可以把标准设置为“使用的语言”，然后从用户中找出全部西班牙语使用者并创建一个相应的列表，接着发送给这些人西班牙语的钓鱼攻击邮件。


    我喜欢的其他一些功能还有个性化的培训视频，以及一些针对中招用户进行强化训练的工具。


    +   - 用户信息的安全性如何？


    ThreatSim是本地部署的服务，使用自己的服务器保存数据。ThreatSim也使用亚马逊云服务器实现负载均衡。这要依据你的需求而定。我曾测试使用ThreatSim发送上千封钓鱼邮件，效果良好。我们没有对ThreatSim进行安全审计，因此我不能对软件的安全等级下任何结论。软件本身在安装时有多重验证以确保访问系统的人是得到授权的。


    +   - 使用该工具时有其他的困难吗？


    没有值得一提的困难。


    +   - 技术支持如何？


    ThreatSim的团队对问题的回应速度非常快。我们曾经在一次大型培训项目中遇到了一个问题，技术支持团队和我们一起工作了好几个小时，帮助我们解决了问题。'
  merge: -1
  img_proc: true
