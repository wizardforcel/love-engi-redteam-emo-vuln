  md: '乔和萨拉之间总是起冲突，不过平时他们表现得很专业。随着邮件列表变长，有一次乔把萨拉从邮件列表中移除了，然后对我们的几个人说：“她以为自己是谁？她只是一个无能的黑洞。”


    我们中有人开玩笑道：“乔，你发那封邮件时忘记把萨拉从邮件列表里移出了。”


    乔吓坏了，他并没有去验证这一说法是否属实，而是立刻给萨拉和我们发了一封邮件，公开道歉说：“萨拉，我之前说你是个无能的黑洞，这是违反职业道德且毫无根据的。我知道我们并非总是意见一致，我的评价确实太无礼了，我向你道歉。”


    当我们收到这封道歉的邮件时，我们意识到玩笑开大了。有人立刻又写了一封邮件：“乔，那只是一个玩笑。你应该先查看一下邮件列表的。”


    然而在这封邮件发出去之前，萨拉回复了：“乔，鉴于你承认了你的错误，我会原谅你，但是我不确定人事经理是否也会这样，相信你会享受周末的沟通课程的。”


    乔迅速地读完了邮件，发现自己被戏弄了。他对此非常生气，并回复说：“你们两个笨蛋死定了，你们让我向那个虚荣的、无能的黑洞道了歉，然而她确实对得起我的每一句评价。这次我闹出了笑话，但是下次就轮到你们了。看萨拉怎么对付你们。”


    他点击了发送，但这次他确实忘记把萨拉从邮件列表中去掉了。这就是杏仁核劫持导致的最坏的结果。乔每次都被情绪所控制，这导致他处于非常尴尬的境地。


    如果乔花30秒的时间停下来检查一下他发送的邮件，他可能就会看穿之前的恶作剧，然后一笑了之。但现在他要花上几天时间和人事经理谈话，并且给萨拉和所有小组成员写一封正式的道歉信。


    你想要控制杏仁核吗？当你阅读电子邮件时，如果你感到恐惧、愤怒、充满欲望或者强烈好奇，那就花30秒的时间停下来想想，在点击链接、回复邮件以及任何其他动作之前应该采取的验证措施。


    当然，钓鱼攻击者并不知道他们正在试图劫持你的杏仁核，但是他们的确知道：如果能够激起你的情绪波动，那么他们就能让你采取一些“不符合你的根本利益的行动”，这就是社会工程学的关键所在。


