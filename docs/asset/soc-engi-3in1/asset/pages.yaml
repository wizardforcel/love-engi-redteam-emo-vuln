  md: '呼叫中心打电话时都会刻意超出这个时间范围。每每此时，服务支持代表就开始变得不安，想结束我的电话来保证他的工资不会下调。那时我就会就敏感信息提出要求。服务支持代表就会因为紧张而停止批判性思考，并开始回答我所有问题。当我说“我不想打扰您太久，就让我问最后一个问题”时，情况尤其是如此。这种说法会让服务支持代表看到希望，感觉此通电话很快就会结束。之后，我就会问类似这样的问题：“我自己做了一点小生意，我努力尝试让自己成熟起来。有那么多清洁服务公司，您喜欢哪一家呢？”我还会问这样的问题：“我刚创立了自己的办公室，不知道该用哪种操作系统和软件。您用什么操作系统？什么浏览器？”


    在电话快要结束之前，那些客服代表们就不能进行正常的逻辑推理了，他们会只关注工资标准，从而做出糟糕的决定，说出不该说的信息。


    如果在公司内部提倡批判性思维技巧，让员工在通过提问、思考后阻止攻击行为并保护了公司的财产后得到奖励，事情就会朝着良性的方向发展；相反，很多公司往往基于是否恪守定下的制度而决定奖惩。


    为了帮助客户学习批判性思维技能，我开发了一个被我自己称为“批判性思维入门”的程序。它不是针对对话写出来的文稿，而是一系列的思考方式。这种思考方式会帮助客户养成一定的习惯以保证他们的安全。以下就是关于使用自动取款机的注意事项。


    +   1. 环顾四周，确保安全。

    +   2. 在走到机器前不要拿出银行卡。

    +   3. 在插卡前，晃动卡槽，确保其是机器的一部分，而不是伪造的读卡器（黑客安装）。

    +   4. 注意那些突出的或者看起来很奇怪的部分，因为那可能是伪造的机器部件（这个安装在卡槽上的部件会盗取你的信息和密码）。

    +   5. 插入银行卡后，输入密码时要遮挡键盘。

    +   6. 取款完毕后要带齐现金、卡和收据。

    +   7. 离开取款机的时候把所有的物品放进钱包。


    这些简单的步骤能让你不会因为伪造的取款机部件损失钱财或受伤害。你需要帮助员工或者客户开发针对各种情况的入门程序。


    +   - 如果我怀疑邮件是钓鱼邮件的时候该怎么做？

    +   - 如果我点击了一个可能是钓鱼邮件的链接该怎么办？

    +   - 如果我怀疑接到的电话是钓鱼电话该怎么办？'
