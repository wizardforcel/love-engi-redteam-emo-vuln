  md: '在埃弗龙的研究基础上，艾克曼和华莱士创建了一个针对这种形式的肢体语言的理解体系。这个体系分为三个部分：起源、编码和用法。


    # 3.1.1 起源


    非语言行为的起源在于该行为成为了人们交流风格中的一部分。艾克曼和华莱士将这种起源分为三类：神经系统类、生存本能类，以及随文化、阶级、家庭或个人变化的一类。


    了解非语言行为的起源意味着，我们将通过他人（而非自己）的经历或起源来判断或观察非语言手部象征动作。


    # 3.1.2 编码


    编码是指行为和含义间的关系。无论象征动作看起来如何，通过行为可以判定是何种编码涉及其中。


    艾克曼博士解释说一个随意的象征动作的视觉形象与它的本意并不相符。以一个流传最广的手势之一为例，这个手势是“向某人掷小鸟”（指对别人竖中指）。无论是在身体上还是生理上，这个手势的本意既不代表一只鸟，也和它意图表现的竖中指的行为没有关系，对吧？


    另一方面，一个拥有形象编码的象征动作也给解码带来了线索。换句话说就是这个动作看起来与它的实际意义相符。例如，用大拇指和食指做出手枪的动作。这个手势看起来就是一个手枪的样子，意义不言自明。


    最后，固有编码的象征动作与形象编码的象征动作类似。动作的表现形式同它所表达的意义一致。但是固有编码的象征动作不仅仅是做出动作，还会把编码表现出来。举例来说，我来自一个喜欢直接表露感情的家庭。这并没有什么稀奇的，但是当我们开玩笑的时候，我们会用拳头轻击对方。固有编码的象征动作不只是一个紧握的拳头，还包括玩笑时真实击打对方的行为。


    # 3.1.3 用法


    所谓用法，顾名思义，是指何时使用非语言手部动作。做出行为的外部条件、辅助性的语言行为，中转的信息内容，以及交流方式是交互式还是沟通式都会影响用法。


    综合考虑起源、编码和用法帮助艾克曼和华莱士建立了不同的手部非语言交流方向。对每个方向的了解可以帮助我们看出人们努力表达的是什么或者他们是什么样的情绪。


    接下来探讨手部非语言交流的三个方面：象征动作、手势/演示性动作以及操纵性动作。'
  merge: -1
  img_proc: true
- pgno: 433
  md: '# 1. 象征动作


    正如我在第1章提到的，艾克曼博士将象征动作（emblem）定义为包括以下五个方面的手部非语言交流形式：


    +   - 一个包含了一个或两个词的简单短语的直接传译；

    +   - 一个为团体、阶级或亚文化群所熟知的准确含义；

    +   - 经常是有意地用来向他人传递特定的消息；

    +   - 接收者知道其接收的象征动作是有意为之；

    +   - 发送者对交流负责任。


    正如人们清楚自己所说的话，大多数人也清楚自己使用的象征动作。此外，就像我们说话会有口误，象征动作也会出现“象征错误”。但是大多数情况下，做动作的人是非常清楚自己使用的象征动作的。


    了解起源可以帮助社会工程师在了解象征动作的基础上，理解人们说出的或者未说出的情绪状态。


    这通常会有很强的暗示性。图3-1中的手势通常会被理解为“我爱你”，在有些地区却是黑帮拉丁国王帮的标志。在那些地方要慎用这个手势。'
