- pgno: 70
  md: '+   - **信息**　因为你是面对面地传送信息，所以必须简洁明了。故事的基本内容如下：你在报纸上看到关于招聘数据库管理员的广告，然后打电话给人力资源部门的黛比。她说今天有预约了，但是你可以先把简历送过去，本周晚些时候再进行面谈。在你开车过去的时候，一只松鼠跑了出来，导致你急刹车，使得咖啡洒了出来，溅到了包上，弄脏了简历和其他物品。同时，你还有另外一个约会，但是又很需要这份工作，希望她能够通过你的U盘重新打印一份新简历。

    +   - **信道**　面对面的口头交流，运用声音、面部表情和肢体语言。

    +   - **信息源**　再强调一次，作为社会工程人员，你就是信息源，除非你觉得有必要找一个替身。


    手中拿着沾上咖啡渍的文件夹，里面装些湿的文件，会使故事更加逼真。沮丧而无助的表情也会很有帮助。说话的时候要有礼貌并且真诚，以博得她的好感甚至同情。U盘中要有可打印的myresume.doc文件或myresume.pdf文件。PDF是最常用的格式，大多数公司会运行有漏洞的较老版本的Adobe
    Reader程序。确保简历不是一些特殊的格式，能被大多数人打开。


    大多数时候人们会伸出援助之手。如果情节真实感人，他们会愿意帮助那些遭遇不幸的人。如果你缺少社会工程人员的天赋，我给你一个特别的建议，你可以在故事中加入这么一段：我今天过来顺路送女儿上学，她在爬过椅子和我吻别时，不小心将咖啡打翻洒进了我的包中。我当时已经离家比较远了，而且要迟到了，来不及回去。您能帮忙重新打印一份吗？


    无论如何，这个故事通常都会成功，前台会将U盘插入她的计算机，导致计算机被入侵，我们也就成功入侵了公司的网络。'
