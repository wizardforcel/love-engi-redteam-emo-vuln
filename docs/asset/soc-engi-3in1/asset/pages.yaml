  md: '![](img/9f6d2369b69b99fb89843058054e5812_523_0.png)


    图 6-12　遮住眼睛是典型的悲伤的表现


    # 注意事项


    如果你看到对方遮住眼睛的表现，并且这种表现并不是由你所说的话造成的，那么最好的问题就是问一句“一切都还好吗”。看出他人的悲伤并表示关心，没有比这能更快建立密切关系的方式了。


    这个动作十分了得，它还可以用来从他人那里获得同情。在正确的时间微妙地做出这个动作，能够为自己制造悲伤的感觉，还能够吸引他人接近你并对你表示关心。骗子和社会工程师一直都在上演同情和援助的剧情。


