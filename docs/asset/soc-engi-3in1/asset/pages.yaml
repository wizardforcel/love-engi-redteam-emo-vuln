  md: "本章包含了很多信息，但是我们并不期望你成为一个只会“纸上谈兵”的心理学家。我们希望本章可以帮助你理解基础决策以及影响决策的因素。你会用所有这些知识来重新设计你的决策制定方案，使你在家中和在工作中更安全吗？理想情况下，是的。但是哪怕你只是从本章中收获了一点点，并思考自己的反应和决策，我和克里斯也会感到很高兴。记住：情绪反应是正常的，你要做的只是调整一下，这样你就可以避免一些日后会让你后悔的行为。\n\
    \n本章要说的最后一点是：决策应该是一个周期性的过程。我和克里斯已经分享了很多故事，这些故事谈到了 一些“欠佳”的决策。我斗胆猜测你们中大多数人可以体会那种感觉。随着我们经验（和年龄）的增长，我们应该通过自身的经历和其他人的决策来学习。下面5步（见图2-9）可以帮助你反省自己的决策，使得你不会再犯同样的错误。\n\
    \n+   1. **确保正确地理解问题**。你知道应该如何定义一个好的决策而不是一个感觉好的决策吗？你是否了解所有关于该决策的信息？是否需要考虑其他人的意见？之前是否有过类似的情况？如果有的话，你之前所做的决定的结果如何？\n\
    +   \n+   2. **尽可能完整地收集信息**。是否有任何偏见或个人感觉会影响你对信息的理解？你是否受其他人影响？你应该受他们影响吗？\n+   \n\
    +   3. **考虑切实可行的选项**。是否有看待这一问题的不同方式？是否有其他选择？可能的结果会是什么？\n+   \n+   4. **做出决策**。注意这是第（4）步而不是第（1）步。\n\
    +   \n+   5. **评估效果**。决策是否达到了你的期望？为什么达到或者为什么没有？你可以从中学到什么？"
