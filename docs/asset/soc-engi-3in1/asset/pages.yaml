  md: '# # 第1章　社会工程学初探


    > > 知己知彼，百战不殆。

    > >

    > > ——孙子


    社会工程<sup>1</sup>（Social Engineering）在很大程度上被人们误解了，从而导致人们对其定义和工作方式有很多不同的观点。有人简单地将社会工程视为撒谎，可以骗得免费的比萨或骗财骗色等；有人将其归类为罪犯或骗子的工具；也有人将其划到科学的范畴，认为其理论可以分门别类或采用数学公式加以研究；还有人将其视为长久失传的神秘技艺，掌握了社会工程学，从业者就能像魔术师那样制造强大的思维幻觉。


    1 中国大陆的书籍和文章中普遍采用的译法是“社会工程”，台湾地区更多翻译成“社交工程”。本书一律依照大陆的译法。——译者注


    无论你的想法如何，你都可以从本书中获益。每个人每天都会在各种情况下使用社会工程的方法。小孩利用它来得到糖果，雇员利用它来得到晋升。大到政府部门的运作，小到公司的市场行为，或多或少都有社会工程的影子。不过罪犯和骗子之流也利用社会工程达到窃取他人信息和犯罪的目的。与任何工具一样，社会工程无好坏之分，它仅仅是一种多用途的工具。


    下面这些问题有助于进一步理解本书的观点。


    +   - 你需要尽可能确保公司安全吗？

    +   - 你是每日阅读最新安全信息的人吗？

    +   - 你是测试客户系统安全的专业渗透测试人员吗？

    +   - 你是主修信息技术专业的大学生吗？

    +   - 你是需要新的、更好的社会工程观念以应用到实践中的社会工程人员（Social Engineer）<sup>2</sup>吗？

    +   - 你是惧怕欺诈和身份盗用的消费者吗？


    2 Social Engineer，指利用社会工程技术获益的人员，本书统一翻译成“社会工程人员”。——译者注


    不管你是上述哪一类人，本书所包含的内容都会在应用社会工程技巧方面开阔你的视野。你将会了解社会工程的黑暗世界，懂得“坏人”是怎样使用社会工程的'
