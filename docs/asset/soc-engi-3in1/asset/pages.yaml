  md: '在一次社会工程活动中，我被机敏的保安人员拦住了，于是装成很疑惑的样子，说 道：“昨天，吉姆检查我的证件后让我进去了，我刚才还以为你们有记录呢。”


    保安听说吉姆同意我进去，就没再询问，让我进去了。社会认同不会总是这么容 易，但是用起来功效会很强大。


    本节提出的社会认同原则是当今所使用的最致命的影响战术。毫不夸张地说，这些 战术为社会工程人员激发和诱导他人提供了强大的工具，使得社会工程人员可以控 制他人的行为。


    谨记，影响和说服的艺术是让他人以你希望的方式想要去做、行动、思考或相信的 过程。为目标创造动机是一种强大的力量，可以说是社会工程的超级武器。前面提 到的原则和方法可以让这件超级武器变成现实，但必须经过很多的工作才能产生相
    应的效果。


    这样说意义何在？我经常发现在经过训练并熟练掌握某一技巧后，想要忘掉就很困 难。社会认同似乎很有吸引力，但用于影响别人的时候应该特别小心，尤其是作为 社会工程人员。要想让这些技巧根深蒂固，就得用它们来帮助别人。例如，当你开
    始练习阅读微表情，甚至开始利用其操纵目标时，初始反应可能是觉得自己拥有了 一项神秘的能力，几乎可以读心了。这就是需要小心的 地方，你还需要练习技巧并 不断精化，但是不要认为你已完全了解。


    如果能说服他人戒烟，或者劝服他人开始锻炼身体，采取一种更健康的生活方式， 就可以深入发掘这些技巧，去帮助他人。将这项技术运用到社会工程活动也不是 那麽遥不可及的事情了。


    很多技巧都需要真正地对人们感兴趣、关心他们并抱有同情心。如果这不是天性， 就必须努力掌握这些技巧。我鼓励你花这个时间，因为这些技巧能让你成为一名优 秀的社会工程人员。


    设想你能改变自己的想法，让自己相信可以轻松地掌握这些技巧。再设想你能改变 目标的想法，让他们体验到你想让他们体验的东西。设想你能随意改变交谈对象经 历的事实，包括你自己的，这就是下一节的内容，它会让你感到震撼。'
