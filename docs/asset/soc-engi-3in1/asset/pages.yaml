- pgno: 712
  md: '费了如此多精力让一切开始运转后，我们知道整个培训项目是否被接受就处于一线之间了。


    由于公司联络人不想有任何事情阻碍我们开展培训，他们有时候会说：“我们将会把C级领导人排除在测试之外。”我们对此感到迷茫，不知如何是好，他们可能会补充说：“他们不太需要这个。”


    唉。


    # 6.2.2  消极之处


    也许你很清楚为什么不把C级领导人纳入培训是很糟糕的，但还是让我来解释一下吧。想想1987年的那则公益广告：“我是看着你学的！”


    那则公益广告给了我们上了重要的一课：正确的行为和态度是自上而下传播的。如果C级领导人不愿意像其他人一样接受测试，那么这会向员工传达什么样的信息？


    # 6.2.3  如何改进


    另一方面，当老板100%投入到培训中时，员工的态度也会显著改变，变得积极和顺从。当员工看见高层愿意接受培训并且接受测试时，他们就不会感觉自己是被单独挑出来的。


    有一家公司是这样处理这一问题的。该公司的总裁写了一封邮件发给全公司以表明他对培训的支持。他甚至分享了他第一个月的钓鱼邮件点击率。当员工们看到总裁不仅参与了培训，还在第一封钓鱼邮件上中招时，他们对培训的好感增加，也看到了公司对培训的支持。在此如果有员工说“我看着你学的”，那就真是件好事了。


    # 6.3  我只会修补其中一个漏洞


    当我年轻时，我曾是一名狂热的冲浪爱好者。我有一块只能在小浪花上冲浪的老冲浪板，它又大又厚。像很多年轻一人一样，我不懂得爱惜自己的东西，因此我经常随意地在海浪上横冲直撞。


    就这样用了几个月后，冲浪板上开始出现损伤——一个在底部，一个在侧边上。明天风浪会变大，因此我不想花太多时间修理它。我随便抹了些树脂，加上玻璃纤维，修补了一下底部。'
