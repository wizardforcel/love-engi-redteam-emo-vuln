  md: '再次问问自己下面这些问题，看看你想要使用的政策是积极的、消极的，还是丑陋的。


    +   - 这一政策、主意或者想法的定义是什么？

    +   - 为什么它是消极的或者丑陋的？

    +   - 如何改进这一政策？


    现在带着你对这些问题的回答，思考以下问题，看看能否带给你启示。


    +   - 找出最佳途径。你想要员工做什么？不点击邮件并报告？保存邮件并报告？转发邮件？还是打电话报告？

    +   - 如果员工点击或者打开附件，那么这些新政策真的能保证公司的安全吗？

    +   - 如果员工点击或者打开附件，那么这些新政策真的能保证员工的安全吗？


    根据本章中所描述的任何政策来回答上述问题，可以帮助你快速识别它们是否属于消极且丑陋的那一类政策。


    # 6.9　总结


    政策并非一个有趣的话题，没有人想要把时间花在制定一些所有人都要遵守的规则上。但是政策对于保证公司安全、保证员工安全以及制定清晰的行为守则来说，则非常必要。


    让我重申一下：我知道实施我所提出的安全政策需要付出很多时间、精力和金钱，也需要做很多工作。我也知道这可能是一个漫长的过程，一路上会有一些障碍。但是不要因此放弃。一直坚持下去，你看到的结果会告诉你，你所付出的时间、精力和金钱是值得的。


    有一家我曾经合作过的公司，他们的平均钓鱼邮件点击率从80%下降到了9%，而他们的平均报告率从不到10%上升到了64%。这家公司的恶意软件事件数量持续减少了70%。这都是由于新政策的实施。


    这些转变是一夜之间发生的吗？不。这些结果是花了几年的时间才得到的，但这难道不值得吗？只有通过持续的钓鱼攻击测试、定期的培训和努力的工作，我们才能得到这些数字。'
