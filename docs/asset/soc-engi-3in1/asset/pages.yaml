  md: '如果员工点击了附件中的PDF文档，打开它时却发生了阅读器崩溃，那会怎样呢？\n他可能会有些担心他点击的东西，于是他删掉了邮件，这导致他现在无法告诉你是哪个文件崩溃了，甚至它从何处而来也说不清。


    上述情况都是我亲眼目睹过的真实事件，它们发生在那些建议“删除邮件”的公司里。


    这些情况下删除邮件与把你的头埋在毯子里并无区别。你认为自己是安全的，只是因为你看不见那些危险罢了。


    # ### 6.7.3 如何改进


    不付出时间和精力是不会有所改进的。你需要为员工提供一个可以报告可疑邮件的地方。他们可以转发邮件到此处，并让邮件得到审阅。如果没有这一措施，那还有什么可做的呢？他们可能搁置、删除甚至点击可疑邮件。


    唯一的改进办法是给员工创造一个可以报告的途径。在你清楚地给出那个途径后，确保它可以做到以下几点：


    +   - 保证公司安全；\n- 保证员工安全；\n- 保护你辛苦建立的数据和资产。


    如果你的报告系统可以做到这几点，那么相比于简单地删除邮件并盼望平安无事，就已经是一种改进了。


    # ## 6.8 给所有人的经验


    我可以向你保证，上述这些安全政策中的任意一个如果放在合适的情景中，那么看上去都会很不错。你曾经见过那种非常差的广告吗，就是你会说“真有人为这个花钱啊”的广告？你可以想象他们的市场人员坐在会议室的桌子前彼此击掌欢呼，认为这个绝妙的主意从此会颠覆市场，他们的产品会大卖。


    我在写这一章时想象过类似的情景——当驱使人们采取行动的是压力、紧张和工作时间过长，而非一种颠覆世界的渴望时。此外，在处理钓鱼攻击邮件方面缺乏经验和正确的指导，也会让人感觉上述这些政策似乎是可行的。'
