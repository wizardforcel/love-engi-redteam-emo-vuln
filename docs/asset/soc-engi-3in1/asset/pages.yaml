  md: '# # 7.1　商业应用


    本节要谈的是商业应用，属于付费的类型。下面要介绍的产品我认为是钓鱼攻击软件中的领军者。随后我会提供一些可用的开源软件。


    # ## 7.1.1　Rapid7 Metasploit Pro


    熟练的渗透测试人员是很难找到的，因此有效利用他们的时间是很重要的。Rapid7 Metasploit Pro（[www.rapid7.com/products/metasploit/editions-and-features.jsp](https://www.rapid7.com/products/metasploit/editions-and-features.jsp)）可以通过闭环漏洞验证来显示风险程度并进行风险优先级划分，还能通过模拟钓鱼邮件攻击来对安全意识进行衡量。内置Rapid7
    NeXpose（[www.rapid7.com/products/nexpose/](https://www.rapid7.com/products/nexpose/)）可以用来验证环境中的漏洞，显示系统风险，并进行行动优先级划分。端到端（end-to-end）的钓鱼攻击项目允许你安全地对用户的行为进行测试，并提供对未成功通过测试的用户的分析。此外，你可以在Rapid7
    UserInsight（[www.rapid7.com/products/user-insight/](https://www.rapid7.com/products/user-insight/)）中查看钓鱼攻击测试结果以获取更全面的用户风险信息。


    # ### 优点


    +   - 利用Rapid7，你可以衡量用户安全意识，还可以选择通过渗透测试来评估安全措施的有效性——例如漏洞发掘和Java有效载荷。

    +   - Rapid7是一个功能全面的攻击安全工具，它不仅能用于钓鱼攻击，也涵盖了漏洞发掘、证书检查和Web App测试。

    +   - Rapid7是一款本地部署应用，可以确保个人网络调查结果的隐私。

    +   - Rapid7包含UserInsight，为你提供包含钓鱼攻击在内的用户全局风险概览。

    +   - 只需要一次授权，Rapid7即可向不限数量的用户提供不限次数的钓鱼攻击项目。


    # ### 缺点


