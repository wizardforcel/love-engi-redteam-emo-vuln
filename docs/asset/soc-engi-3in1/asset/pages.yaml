- pgno: 470
  md: '# 图 4-9 手臂呈现这种状态，同时伴有其他肢体语言，是在说“我对你的想法不感兴趣”


    在图4-9中，凭直觉我们就知道交叉双臂是这位女士在她和别人之间设置屏障的意思。然而需要注意的是，交叉的双臂并不总是意味着屏障。做这个动作的人可能比较冷或者只是简单地因为他觉得这个姿势比较舒服。其他的迹象可以表明情感层面。在图4-9中，躯干和腿的姿态表明不感兴趣。另外一个关键的迹象是双臂交叉的位置。当它高于胃部、低于胸部的时候是不适的表现。这种交叉双臂的类型是防御类型，是在说“我不舒服”。


    一定要注意如果仅仅是交叉双臂并不代表不感兴趣或者不舒服。与其他肢体语言信号一样，要寻找相对基准态的突然变化来判定情感层面。


    换句话说，图4-8展现的是开放的腹部动作（第3章有过介绍）。手臂的敏感部位或者前端暴露的时候，基本上是“我和你在一起很舒服，我很信任你”的意思。如果看到图4-8的表现，就可以断定自己已经与他人建立了密切的关系。


    除了表示舒适度，腹部动作还能表现自信度。图4-10就表明腹部动作能用于宣示领地。若不加以限制，这种动作会看起来失礼或者有些自大。'
