    # 2.1.3　外部因素


    如果不考虑我们所处的外部环境，那么关于驱使我们选择的因素的讨论是不完整的。外部环境包括我们周围的物质环境与身在其中的人。


    像温度和环境光这些因素不一定会直接影响我们选择鸡肉还是汉堡。与此类似，我不能通过调整恒温器来迫使你点击钓鱼链接。我想说的是，研究表明环境可以影响或者加强我们对情景的感觉。


    某种程度上，体温和人际关系融洽、信任以及慷慨的行为都有关系。在“体温影响信任行为：脑岛的作用”这篇论文中，姜允儿等人发现，短时间的温暖或寒冷的刺激，会导致人们在信任游戏中做出不同的选择。大脑中有一块特定区域同时负责温度感知和信任选择。⁴
    劳伦斯·威廉姆斯和约翰·巴奇在“体温升高促进了人际关系升温”中也有类似的发现。⁵ 然而在其他研究中，酷热则常常与愤怒、好斗以及决策受损有关。⁶ 想想在大热天想要导航到奥兰多的某个度假胜地时那蟒多般的场景吧，那可真算不上是美好的体验。


