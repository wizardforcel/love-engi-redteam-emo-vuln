- pgno: 118
  md: '# ## 5.1 思维模式


    要改变某人的思维方式，必须要理解人们的思维方式和思维模式。逻辑上，这是进行这方面社会工程尝试的第一步。


    听上去好像我们得成为心理学家或者神经学家才能理解人们思维的方方面面。纵然那会有一定的帮助，但其实没那么必要。通过一些研究和实际应用，就能深入人类思维的内部工作机制。


    2001年8月，美国联邦调查局（FBI）发布了一份司法公告（详见[www.social-engineer.org/wiki/archives/ModesOfThinking/MOT_FBI_3of5.htm](http://www.social-engineer.org/wiki/archives/ModesOfThinking/MOT_FBI_3of5.htm)
    ），其中包含一些人类思维模式的深入阐述，具体如下。


    > > 让客户认可你的非言语行为、用客户认可的语言表达方式，并且在音量、语调和方言上相匹配，这样通常可以免吃闭门羹。


    上面这句话虽简单，但是其中包含的内容却很多。一般来讲，如果能够迅速摸清目标的主导思维模式，然后通过微妙的方式进行确认，就可以令其在告知你哪怕是私密信息时，降低戒备，打开心扉。从逻辑上来讲，这时也许你会问：“怎样才能识别目标的主导思维模式呢？”


    即使问目标自己这个问题，也不一定能够得出一个清晰的答案，因为很多人并不清楚自己到底是何种思维模式。因此，社会工程人员必须掌握特定的工具才能识别他人的思维模式，然后快速切换到对应的模式。方法和途径有现成的，但是首先必须要了解其基础。


    # ### 5.1.1 感官


    对于认知的价值问题，哲学家已经争论了几个世纪了。有些人甚至认为，现实并不是“真实”的，它只是我们的感官带给我们的认知。就个人而言，我并不赞同这种思想，但是我相信这个世界是通过感官进入我们的大脑的。人们通过解释这些感官获得对现实的认知。传统的分类方法中，感官通常分为5种：视觉、听觉、触觉、嗅觉和味觉。


    人们倾向于钟爱这些感官中的一种，也就是说某种感官会占据主导地位，这也是人们记住事物的方式。通过一个练习就能确定自己的主导感官，闭上眼想象你清晨起床的画面，你能记得的第一件事是什么？'
  merge: -1
  img_proc: true
- pgno: 119
  md: '是温暖的阳光照在脸上的感觉吗？是配偶或小孩叫你的声音吗？你清楚地记得楼下咖啡的香味吗？抑或是嘴里并不清新的口气，提醒你需要刷牙了？


    当然，这一实验并不能完全确定，可能要尝试好几次才能真正意识到自己的主导感官。我曾经和一对夫妇说起过这一概念，他们的反应很有意思。妻子醒来的第一反应是看看时钟，担心自己快迟到了，而丈夫则是每次都翻个身，发现妻子不在身旁。几个问题之后，基本上可以确定丈夫是动觉类型的，或者说其主导感官是触觉，而妻子则是视觉占主导地位。


    以上只是测试，实际工作中你不可能直接走向目标说：“闭上眼，告诉我今天早晨起床后你做的第一件事是什么。”除非你伪装成家庭医生，否则肯定会吃闭门羹。


    那么，如何才能在避免尴尬询问早晨起床习惯的情况下得知目标的主导感官呢？


    # ## 5.1.2　3种主要的思维模式


    尽管我们有5种感官，与思维模式相联系的只有其中的3种：


    +   - 看到，也就是视觉思维者

    +   - 听到，也就是听觉思维者

    +   - 触到，也就是动觉思维者


    每种感官都有各自起作用的范围，或者说有各自的次感元。声音太大或者太轻？光线太亮或者太暗？环境太冷或者太热？拿实际例子来说：直视阳光会感觉太过刺眼，喷气式发动机的声音太过震耳，零下30度（华氏）感觉太冷等。伊万·巴甫洛夫做过一个实验，每当给狗喂食时，他就摇手铃。最后狗一听到铃声就会流口水。然而，大多数人不知道的是，伊万更为感兴趣的是次感元引起的生理和情绪反应。有趣的是，铃摇得越大声，狗的口水流得越多。次感元的范围变化引起了身体的直接变化。欲详细了解巴甫洛夫的研究和他的全部演讲，请参见
    [www.ivanpavlov.com](http://www.ivanpavlov.com)。


    尽管人和狗有很大的不同，巴甫洛夫的这项研究对于理解人们的思维模式还是很有价值的。我们中的很多人可能同时具备3种思维模式，但是占据主导地位的只有一种——“响声”最大的那个。甚至在主导思维模式下，主导感官的深度也会有所变化。


    下面我们将深入地探讨每种思维模式的一些细节。'
