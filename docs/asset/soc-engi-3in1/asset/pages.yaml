- pgno: 287
  md: '![](img/9f6d2369b69b99fb89843058054e5812_287_0.png)


    图7-23 Maltego收集的信息展示


    # 使用Maltego的原因


    Maltego能自动采集大量信息并为用户实现数据的自动关联，可以为用户节省数小时的搜索时间，并展示信息的关联图。Maltego真正的强大之处在于找到这些数据之间的关系。尽管数据挖掘很有用，但是展示信息之间的关系对社会工程人员更有价值。


    我在[www.social-engineer.org/se-resources/](http://www.social-engineer.org/se-resources/)贴出了一些视频，讲解怎样高效地使用Maltego。前面的案例中Maltego屡功至伟，但后续的入侵使用了另外一个强大的工具。


    # 7.2.2　社会工程人员工具包


    社会工程人员花费了大量时间来完善自身的技能，然而，许多攻击方式需要通过创建附加恶意代码的邮件或PDF文档来实现。


    这些事情都可以利用BackTrack中包含的诸多工具来手动完成。起初搭建[www.social-engineer.org](http://www.social-engineer.org)网站的时候，我曾和好友戴夫·肯尼迪交谈过。戴夫是流行工具FastTrack的开发者，FastTrack使用Python脚本和网页界面能够自动实现渗透测试中的一些最常用的攻击。我对戴夫说，单独为社会工程人员开发一个类似FastTrack的工具是个不错的主意，这个工具让社会工程人员点击几下鼠标就能创建PDF文件、电子邮件及网站等，这样就可将注意力集中到社会工程中的“社会”这部分上来了。'
  merge: -1
  img_proc: true
- pgno: 288
  md: '戴夫仔细思考了这个问题，决定创建一些简单的Python脚本，让社会工程人员可以创建附加恶意代码的PDF文件并随邮件发送。于是社会工程人员工具包（Social
    Engineer Toolkit，SET）就诞生了。在写本书的时候，SET已经被下载了150多万次，而且很快成为社会工程人员审计时配备的标准工具包。本节将介绍SET的主要特点及使用方法。


    # 1. 安装


    安装步骤十分简单，只需安装Python和Metasploit框架。这两个软件在BackTrack发行版中已经存在，所以不用担心。BackTrack 4甚至已经包含了SET。如果需要从头开始安装，过程也十分简单。依据导航进入安装目录，在控制台窗口上运行如下命令：


    ```

    svn co http://svn.secmaniac.com/social_engineering_toolkit set/

    ```


    执行完命令之后，将得到一个名为set的目录，该目录下包含了所有SET工具。


    # 2. 运行SET


    运行SET的过程也很简单。只需在set目录下输入./set，就会启动初始SET菜单。


    请 访问 www.social-engineer.org/framework/Computer Based Social Engineering Tools:
    Social Engineer Toolkit %28SET%29，这里有SET菜单的完整展示图，以及对每个菜单选项全面、深入的介绍。接下来介绍SET中两个最常用的功能。


    首先讨论鱼叉式网络钓鱼攻击，然后讨论网站克隆攻击。


    # 1. 鱼叉式网络钓鱼


    网络钓鱼是一个术语，描述恶意诈骗犯如何通过定向设计的电子邮件“广泛撒网”，吸引人们访问特定的网站、打开恶意文件或者输入个人敏感信息，为以后的攻击做准备。要在今天的互联网世界生存，必须能够检测并防御此类攻击。


    社会工程审查人员使用SET可以创建有针对性的电子邮件对客户进行测试，然后记录有多少雇员上当了。这个信息随后可用于培训，以帮助员工识别和避免这些陷阱。'
  merge: -1
  img_proc: true
- pgno: 289
  md: '使用SET进行鱼叉式网络钓鱼攻击，选择选项1。选择1后，会看到如下几个选项：


    +   - 执行群发邮件攻击

    +   - 创建一个文件格式负载

    +   - 创建一个社会工程模板


    要进行邮件式的鱼攻击，选择第一个选项。第二个选项用于创建一个恶意的PDF或其他文件，以备作为邮件附件发送。第三个选项用以创建模板，待日后使用。


    在SET中发起攻击十分简便，只需选择正确的菜单选项然后点击启动。例如，如果我想发动邮件攻击，向受害者发送伪装成技术报告的恶意PDF文件，我会选择选项1——执行群发邮件攻击。


    接下来，我会选择一个攻击向量（选项6），这种攻击对很多版本的Adobe Acrobat Reader软件都有效——应用了Adobe util.printf()
    Buffer Overflow¹漏洞。


    ¹ 请参见 [http://www.nsfocus.net/yulndb/12573](http://www.nsfocus.net/yulndb/12573)。——译者注


    接下来几个选项会设置攻击的技术问题。点击选项2——Windows Meterpreter Reverse_TCP。使用Metasploit接收反向会话或者受害者电脑的IP和端口，以避免入侵检测系统（IDS）或其他系统的报警。


    选择443端口，使数据流看起来好像是加密的SSL数据。SET会创建恶意PDF文件并设置监听功能。


    执行上述步骤后，SET会询问是否要更改PDF的文件名，例如改成类似TechnicalSupport.pdf等更加隐蔽的名称，然后输入邮件信息以备收发。最后，SET发出一封看起来很专业的电子邮件，引诱用户打开附件中的PDF文件。受害者收到的邮件如图7-24所示。'
