  md: '![](img/9f6d2369b69b99fb89843058054e5812_597_0.png)


    # 图 1-10 伪装成贝宝公司（Paypal）邮件的钓鱼邮件


    尽管这些钓鱼骗局手段更高明，但是仍然有一些蛛丝马迹可以让人判断它们是假的。


    +   - 问候语通常是模糊的，难道银行不知道客户的名字吗？“尊贵的客户”不算。

    +   - 拼写、语法和大写字母方面的问题，尽管比之前的 好，但是仍然有一些奇怪的地方。

    +   - 用于验证的链接指向的网址并不属于所谓的发件人。'
  merge: -1
  img_proc: true
- pgno: 598
  md: '+   - 使用紧迫的语气（“请立即回复，否则您的账户将被冻结”）。


    这些邮件主要通过利用人们恐惧或焦虑的心理来迫使其采取行动。任何威胁到金钱的事情都是可怕的。实际上，本节中大多数例子都有很多共性，特别是让人们采取行动的方法。


    +   - **利用权威**。这是一条影响原则，第3章会详细谈到。人基本上是社会动物，我们都会对不同形式的权威做出反应。

    +   - **时间限制**。邮件中说你的账户会在48小时后销户！这种话的确增加了紧张感。出于我们的生存本能，任何对获取资源的限制都会让我们感受到威胁。

    +   - **可能的危害**。想到你的银行账户被检测到异常行为，可能是某些不法分子正在试探你的账户，这一点确实让人害怕。毕竟唯一应该在我金钱附近徘徊的人是我——也可能是史努比。


    # 2. 社交媒体威胁


    另外一个你可能见过的常见主题是通过社交媒体进行的网络钓鱼。社交媒体的核心当然就是交际，因此如果你使用的社交媒体服务用邮件通知你有新的好友请求或者要求你点击某个链接，那么你通常不会怀疑。一般而言，这类邮件和金融类邮件的难度等级差不多，也可以通过相同的细节来进行识别。然而在我看来，这类邮件反而更容易让你中招，因为你既然加入了社交媒体，那么收到一些邀请就是很正常的，更重要的是，也是你期盼的。另外，这类邮件可能不会像银行邮件那样引起你的警觉，这会降低你的防范意识。


    和金融服务钓鱼一样，这类邮件有时也会利用恐惧来驱使某类行为，如图1-11所示。'
  merge: -1
  img_proc: true
- pgno: 599
  md: '![](img/9f6d2369b69b99fb89843058054e5812_599_0.png)


    图 1-11　伪装成YouTube邮件的钓鱼邮件


    恐惧是普遍的行为激发因素，但是失去社交媒体账号不只是紧要的事件，而且很不方便（对大多数人来说）。然而，社交媒体鼓励用户参与和相互联系，所以也给了攻击者其他的可乘之机。这些攻击也依赖于人们的责任感。社交媒体网站通过人们的相互联系而发展壮大，它们让参与社交变得有趣，让你成为某个小组的一员。钓鱼攻击者也使用相同的把戏。很多人点击链接是因为他们不想因为拒绝他人的好友请求而伤害他们的感情，或者他们不想因为不回复而显得粗鲁——即使是对他们不认识的人（见图1-12和图1-13）。'
