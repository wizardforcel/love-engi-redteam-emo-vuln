  md: '要找出答案，请继续阅读下面的小节，其中提供了几个商业和市场营销领域的操纵实例，为我们讨论和分析如何进行个人层面的操纵奠定了基础。


    # 6.4.1 召回还是不召回


    2010 年 5 月，《华盛顿邮报》报导了一个有趣的故事，详见 www.washingtonpost.com/wp-dyn/content/article/2010/05/27/AR2010052705484.html。儿童用羟苯基乙酰胺（Tylenol）、布洛芬制剂（Motrin）、可他敏（Benadryl）
    和仙特明（Zyrtec） 的制造商，在液态非处方药中发现一批布洛芬制剂存在缺陷，但是又不想花费一大笔钱来召回，那么公司是如何回应的呢？


    他们使用了操纵战术。公司雇用了许多合同工，让他们到每家药店买下所有布洛芬制剂，然后销毁。不幸的是，由于某合同工的疏忽，写有该计划的一份文件失落在了其中一家药店，随后这件事就被报告给了美国联邦药品管理局（FDA）。


    根据备忘录，FDA确实让该公司分4次召回所有问题药品，其中的一次召回就达到了1.36亿瓶。只是已经太晚了，因为报告称已经有775名儿童和婴儿由于服用这批药品产生了不良反应，最终有37例病亡。报告中并没有说是问题布洛芬制剂还是对布洛芬制剂的反应导致了死亡。那不是我们讨论的重点。


    这是一个非常阴险的操纵实例，至少是尝试操纵。为了保护公司形象，他们竟然放弃了正确的流程且不顾全世界儿童的生命安全。他们尝试对系统进行操纵，结果有人因此而丧命。遗失在药店的文件内容主要是讨论合同工怎样奉命买回产品，只字未提“召回”。


    事情败露后，他们执行了很多有趣的操纵战术。他们歪曲事实说之所以这样做，是因为专家认为该制剂对儿童来说并不存在很大的风险。


    在此之后，他们正式道歉，并且解雇了6名高管，然后开始进行真正的操纵了。在被质询时，公司说他们不是在尝试人们所说的“隐秘地召回”，而是要检验所谓的 有害批次药品，所以让合同工将药品买回来测试。如果发现确实有问题，公司会采取正确的流程。公司尝试使用操纵战术中的转移方法，将人们的注意力从他们的事实行为上转移，以使情况看起来没那么糟糕。他们还使用了掩饰方法，操纵那些不认可他们行为的人，声明公司正在尝试测试以确定是否需要召回。


    这种类型的操纵值得讨论，因为转移策略也适用于个人层面的操纵。如果你去了不该去的地方，并且被抓住了，那么编一个可信的故事有助于你操纵目标，让你顺利过关。将目标的注意力从当前问题上转移，会为你赢得时间，改变目标的关'
