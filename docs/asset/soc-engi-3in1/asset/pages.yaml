- pgno: 703
  md: '我不会在这里花时间谈如何选择软件，但我要说一点：项目中所需的统计方式和数据可以帮助你作出决定。


    目前为止，你可能已经有了一个完美无缺的培训计划，但是没有最好的数据，这一切都是无用的，不是吗？这也是我们发现的平庸和专业的钓鱼攻击者（我说的是以此作为一种公司服务的人员）之间最大的差别。


    简单的区别体现在他们收集到的数据和它们呈现给公司的数据的差别上。我听过有人说：“我们只需要点击率，对吧？”不！


    点击率确实重要。但是如果我给你发送一些一级钓鱼攻击邮件，然后你的点击率是，例如10%，而第三个月时我给你发送一些三级钓鱼攻击邮件，然后点击率到了90%……点击率只会让员工看起来像是突然都变成了钓鱼傻瓜，尽管事实并非如此。


    回想一下开展培训的原因：教导员工识别、报告和抵御钓鱼邮件攻击。什么样的统计数据会让领导觉得自己把钱花在了对的地方？你该如何设置项目以最大化收益？统计数据可以告诉你什么来帮助你改善项目？我将会回答这些问题。


    # ### 只是统计数据而已，女士


    正如之前所提到的，你得首先决定什么数据对你而言是重要的，然后才是下一步。很多次我被问及哪些数据是重要的。在我逐项告诉你它们为什么重要前，想想谈到钓鱼攻击时，什么样的员工才是好员工。你知道点击钓鱼邮件不好，不点击钓鱼邮件好。这很简单——那么其他好或者坏的行为呢？


    希望你已给员工设置了一个可以报告钓鱼邮件的机构。如果员工可以把他们发现的任何疑似钓鱼攻击的邮件都发送到合适的“权威机构”那里，那么你们公司就能省很多心了，甚至还能发现几个漏洞。因此，报告钓鱼攻击邮件的员工是很棒的。


    我也常常被问及员工该如何报告。最好的建议是让他们转发邮件给部门中的指定邮箱。转发的邮件可以用于分析，员工也可以得到接下来该怎么做的建议。有些公司提出指定一个电话号码用来接收报告，但是可以想象，如果公司里有5000个员工，50%的员工都打电话来报告钓鱼邮件，并且他们每天都会收到一封邮件，那么工作压力就太大了，也不会有什么效果。


    下面是一些我认为重要的统计数据。


    +   - **点击人数**。这是最明显的数据，但也是最必要的。这是你的基线。这些数字告诉你有多少人将公司置于危险之中，以及多少人需要进一步培训。然而单独这一数据并不能告诉你很多信息。你需要以此为基础来获得更多数据。'
  merge: -1
  img_proc: true
- pgno: 704
  md: '+   - **报告钓鱼攻击的人数。** 假设你们公司有供员工报告钓鱼邮件的机构。这是“解决”钓鱼邮件问题的过程中非常重要的一部分。我们的目标是创建一个环境，让所有的员工在看到钓鱼邮件后——并在他们点击前——进行报告。事实上你也需要让你的员工知道点击后该怎么办。删除邮件不是一个好办法，他们需要一个机构来报告情况。有很多次我开始和公司工作时，第一件事件就是帮助这家公司设立这样一个机构，这是很重要的一步。\n-
    **点击却未报告的人数。** 你知道点击钓鱼邮件是不好的，而报告钓鱼邮件是好的，所以那些点击而不报告的员工占全了你不希望他们做的事。这些员工需要更多的训练和帮助。\n-
    **点击并报告的员工人数。** 员工点击了邮件但仍然报告了这一情况是件好事。为什么？这意味着尽管这些人采取了一些你不希望他们采取的行动，但是通过培训，他们意识到了风险依然存在，并采取了积极的措施。\n-
    **未点击也未报告的人数。** 因为这一类员工没有点击，所以并没有漏洞上的风险。然而你仍然想要让这些员工对他们收到的可疑信息进行报告。报告是每个员工都要了解的重要一步。\n-
    **未点击却报告的人数。** 这一类员工属于最佳员工。他们采取了如你所期望的行动，不仅识别出了钓鱼攻击邮件，还报告给机构，帮助了其他人。


    让我们回到假设上来。如果你们公司有报告机构，那么你需要知道每次钓鱼攻击中有多少人发现了钓鱼攻击并且报告给了机构。我会告诉你一些追踪这一数据的方法。


    因为你知道最需要帮助的员工是那些点击了钓鱼邮件但是没有报告的，而最佳员工是那些没有点击还进行了报告的，所以你会想要了解每类员工的人数，并且希望后者在每次攻击中都有所增加，因为这说明你的辛勤工作有了回报。


    有很多方法追踪这些数据，但是我发现帮助IT/技术支持中心（或者其他管理钓鱼攻击的部门）设立一些规则可以使得这一任务更加轻松。


    举个例子，我们有时候会在邮件中嵌入一段与背景色（白色）相同的文字。我们称其为“白色文字”。（我是从哪儿 学到这么棒的点子的？）这段文字需要包含一些在常规句子中肯定不会用到的字符，例如Th1$s$aphi$hingemai10rz-DATEHERE。


    然后我们设定一条规则，让用来收集报告信息的邮箱中的某个指定文件夹——如Oct201X Phishing Reporters——按条件过滤。除非你的SaaS解决方案有办法让你追踪（详见第7章），如此操作后，你会在月底得到一个清单。通过简单的Excel技'
