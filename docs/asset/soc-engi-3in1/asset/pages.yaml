- pgno: 493
  md: '有一次我和一群销售人员在一起聊天，无意中听到一个叫吉姆的人在告诉大家他当月的销售业绩。他没有直接说他有多成功，但是他确信大家都知道他打败了拉尔夫。因为他在说话的过程中提到了拉尔夫当月差强人意的销售业绩。当其他人走开的时候，我在拉尔夫脸上看到了如图5-13所示的表情。


    ![](img/9f6d2369b69b99fb89843058054e5812_493_0.png)


    # 图 5-13 轻视情绪的单边表现


    拉尔夫很快发现自己的表现不妥。他重拾回笑容，并追上了人群。他不想离群索居。我走到他身旁说：“拉尔夫，我是公司的新员工。刚才那个人说的话简直蠢到家了。他看起来就像个傲慢自大的混蛋。”


    拉尔夫看着我，仿佛我能读懂他的心思。他说：“他没有那么坏。他只是更看重他自己……”他的声音逐渐弱了下去。


    “好吧，不管怎样，我相信你下个月肯定能打败他。”'
