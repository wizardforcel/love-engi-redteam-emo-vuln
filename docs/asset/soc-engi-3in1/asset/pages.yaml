  md: '一季度或下一年里需要做什么。这种情况下，我认为它是一个很有力的用来划定基线的工具。但是像这样的单一测试，如果必须要做，那么其结果应严格视为基线参考。


    # ## 6.4　太多训练使人厌倦


    你曾经受够了某些事的折磨吗？我记得当我第一次开始学习另一门语言时，我只愿意达到最低要求，还逃避作业，仿佛它是某种坏东西。因此，我并没有进步得像我想象中那样快。当面临考试或者提问时，我感到很沮丧和失落，我一直想放弃。


    问题出在哪里？我只是做到能够说“我在学习这门语言”的程度，但是对于真正的学习来说，我所做的还远远不够。因此我在相当长的一段时间内忍受着初学者注定会经历的紧张和挫败感。


    # ### 6.4.1　定义


    一开始你们公司可能会把钓鱼攻击培训看作反欺诈训练，或者提醒你在圣巴克时记得锁上你的电脑。如果你经历过这种训练，那么你就会明白我的意思。教练会告诉你为什么有些东西不好，给你展示一些短片来告诉你怎么做才是正确的，并希望你能从中学到一些东西。如果从这个角度来看，那么这一培训可能会被看成某种“一劳永逸”的训练。


    悲伤的事实是，正如之前所提到的，每个人每一天都会收到很多钓鱼邮件。只测试员工一次，并只给他们一次培训来告诉他们如何识别钓鱼邮件，这和把他们派往法国的一个月前只给他们上一堂法语课没什么两样——都没有什么效率。


    # ### 6.4.2　消极之处


    “一劳永逸”式的思维会导致下列结果。


    +   - **极其受挫的情绪**。对于感觉自己一直以来都没有进步的员工，以及因为没有员工在学习所以感觉培训浪费金钱的公司来说，当用这种方式思考时，失望是常态（看见我之前所做的了吗？）。

    +   - **缺乏安全意识**。不仅训练是低效的，而且由于上述的受挫情绪，很多员工会在识别钓鱼邮件方面做得不如那些持续接受测试和培训的员工。

    +   - **IT部门和其他部门之间缺乏联系**。IT部门和其他部门之间的关系会变得更加对立，而非成为一个团结一致并服务于你的“团队”。'
