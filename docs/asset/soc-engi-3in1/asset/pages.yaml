  md: '+   - 他想要什么？

    +   - 他是否能构成威胁？

    +   - 他在我的生活中会出现多久？


    上述每个原则都按照一定的方式以非语言形式体现出来，既不会画蛇添足，也不会有所减损。接下来就对其中一些原则进行探讨，并了解非语言交流是如何对这些原则产生影响的。


    # 8.1 人为时间限制


    如前文所述，当一个陌生人接近我们的时候，我们首先在心里想的一个问题就是：“他会在我的生活中停留多久？”尽管我们能够回答其他的自问，但是如果这个问题得不到回答，我们仍会觉得不安。


    从非语言的角度来回答这个问题，我们需要知道我们待人接物的方式会如何影响对方对我们要求的看法。


    如果我因为遇到困难而向你求助，那么从心理角度来讲，我的兴趣点何在？你的第一反应会是：“在我这，因为你是在寻求我的帮助。”但是这样的想法并不正确。因为我关注的是我的问题，而不是你的问题。人们都是以自我为中心的。我不认识你，我所关注的是如何解决我的问题。如果我的肢体语言表现出我对你感兴趣，这种压力会让你感到不适，同时也让我的工作难以进行。此外，我们在求助的时候还要考虑是寻求一时的还是较长一段时间的帮助。


    因此，无论你是面对目标对象，还是远离他，我都建议你人为设定一个时间限制。这样就不会让交谈对象觉得你的兴趣点在他的身上，而是在你自己的问题上。这样就会让对方安心，不会觉得你会占用他太多的时间。


    比如，一次我在书店因为要寻求建议而尝试接近一位顾客。那位顾客正和他年幼的儿子在一起。他们走到了书架前，我面对书架站在他们旁边。我只把头转向那位男士，然后说道：“很抱歉打扰您，但是您能给我5秒钟时间吗？我想给我的侄子买本书。我觉得他和您的儿子同龄。我不会选书，像这个年龄段的孩子都喜欢读什么样的书呢？”于是，我的“5秒钟求助”最后演变为一场长达25分钟的对话。在对话过程中，我知道了他的全名、生日、工作经历以及很多其他的相关细节。我之所以能够迅速与他建立密切关系并进行诱导，是因为我的非语言行为和人为限定时间让他放松下来。


    # 8.2 同情/帮助'
