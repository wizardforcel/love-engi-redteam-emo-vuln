- pgno: 684
  md: '内部邮件看上去是一个很好的主题，可以帮助你的员工理解钓鱼攻击的危险性。让员工接触看起来和你的公司网址相似的URL，或者声称来自人事部门、IT、管理部门或者C级管理者²
    的邮件，都能帮助他们了解钓鱼攻击者的惯用手段。这是帮助你的员工来熟悉地解码URL并学会更仔细地观察邮件地址的一种很好的办法。（更多关于这些保护手段的信息详见第4章。）


    ² 指CEO、CFO等级别的管理者。——译者注


    你想要把这一主题的钓鱼攻击训练提升到何种难度？我们公司从来都不推荐从最高难度开始。你不会想让员工感到无助的。我建议刚开始这一主题时不要太难，可以在邮件中留下一些提示，然后再逐渐提升难度。


    是的，我听过一些争论：“坏人不会在意的，他们今天会展开最高难度攻击的。”我同意这一点，但也不要忘了这一简单的事实：我们 并非坏人。我的意图和目的是不同的。我的目的并非展示“你的员工有多笨”，而是帮助你开展优质的培训，使得你的员工在工作和生活中更安全。这并非是通过让人们觉得自己很笨和毫无希望来达到的。所以，尽管从简单的部分开始并非100%贴近现实，但是这一方法确实可以在训练中奏效。


    目前为止，你会感觉选择主题和开展钓鱼攻击培训的原因一样重要。在你进行下一步之前，花点时间仔细考虑这两节的内容是很重要的。对于为何开展钓鱼攻击培训以及打算以何种主题开始先有一个清晰的想法，然后就可以确定钓鱼攻击培训的哪些特征可以帮助你把培训办得更贴合实际、更有教育意义、更成功。


    # 5.1.3 要不要在邮件中使用商标


    在继续按培训规划走下去之前，我需要停下来讨论一个在钓鱼攻击社区一直很热门的争论：“要不要在邮件中使用商标，这是一个问题。”


    想象你收到一封来自希腊的某个组织的钓鱼邮件，它看起来像是一封来自UPS（联合包裹速递服务公司）的邮件——它有商标，措辞也很官方，甚至在页脚有法律术语。尽管邮件被设计成来自UPS的样子，邮件中的链接却都指向一个恶意的信息窃取网站，这个网站会窃取你的密码、用户名、账户信息，等等。


    随着坏人越来越多地使用这种技术，很多公司都开始选择在邮件中使用商标的钓鱼攻击模拟来测试员工的反应。这一决定激起了钓鱼攻击专家、供应商、法律部门，以及那些公司商标被用作测试的公司之间的争论。


    在我发表意见之前，我先说两句：我并非律师，我所提供的也不是法律建议 。你应该先找一家律所进行咨询，再决定是否在钓鱼攻击模拟中使用商标或者其他品牌'
