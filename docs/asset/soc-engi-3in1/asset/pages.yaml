  md: '无论采用何种方式，社会工程师都会在邮件中利用收件人恐惧、好奇或畏惧的心理促使收件人做出并不符合他们最佳利益的行为。


    让我们看一封钓鱼邮件，并分析为什么这是一个有效的战术。最近钓鱼邮件在Facebook上传播得最为广泛。Facebook拥有十亿多用户，自然也是钓鱼邮件的目标。请看图2-1。


