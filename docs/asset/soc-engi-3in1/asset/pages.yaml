    说明 小时候，我也有某种虚拟的关系，那就是我的女笔友。我清楚地记得，那时候虚拟关系的建立不像今天这样迅速直接。社交媒体对我来说依旧是一个有趣的东西。它为人们提供了一种简单快速的结交朋友的方式，不再局限于传统的社交圈和职场圈。不幸的是，这也导致了那些愿意结交朋友和扩大社交网络的人特别容易受到钓鱼攻击。从这一点来说，做个“与世隔绝”的人要安全得多。就在此刻，我的账户里大约有34个邀请（并非钓鱼）等待我处理。也许我应该尽快处理它们，否则人们可能会认为我不需要朋友。


    # 3. 公共事件诈骗


    最后一类你可能见过的钓鱼欺诈真是令人发指。骗子在一起公共事件发生后直接进行钓鱼攻击，例如自然灾害、飞机坠毁或者恐怖袭击——基本上任何受到大量媒体关注的事情，同时也是大多数人重点关注的事情。他们利用了我们自然产生的恐惧、好奇和同情。用挑剔的眼光来看，这些攻击大都处于中级水平。它们包含了明显的非法标志。尽管如此，有些人很容易成为这类钓鱼攻击的受害者，因为他们仅凭情绪反应来处理这些事件。怎样让人們不经大脑就做出决定？激起强烈的情绪。第2章会讨论这种叫作“杏仁核劫持”（amygdala
    hijacking）的有趣现象。'
