  md: '问，他在专栏中写过一个带女儿去马戏团的故事，详见 www.ryanhealy.com/commitment-and-consistency/。他花了44美元买票，5美元停车，开了40分钟车到达马戏团，因为他承诺过要带女儿去看马戏。女儿要吃棉花糖，他答应了并给了她5美元。棉花糖不会高于这个价吧？当卖糖的人过来
    说每袋要12美元的时候，他怎么能违背承诺呢？他不能，因而最终花12美元买了一袋棉花糖。


    这种虚假的一致性被定义为根据以往的经验或期望所应有的预期。那些经验或者期望会驱使目标采取导致入侵的行为。例如当技术支持人员过来时，按照预期他会进入服务器机房，那个要求与之前的经验和期望一致。当伪装者要求进入服务器机房时，他能够得到允许，因为这和目标的预期一致。


    要使大部分人采取特定的行动、透露信息或者泄露秘密，承诺和言行一致可能很大的影响要素。


    社会工程人员武器库中应该有承诺和言行一致这一强大的武器。如果社会工程人员能够让目标做出一些小的承诺，那么扩大这个承诺也不是什么难事。


    罗伯特·恰尔迪尼在《影响力》一书中这样写道：


    > 使用承诺和言行一致操纵他人的关键在于初始承诺。也就是在作出承诺、明确立场之后，人们会更加愿意同意那些和他们初始承诺一致的要求。很多说服专家会尝试引诱对方选择一个初始立场，该立场与他们随后要求的行为一致。


    希望采用承诺与言行一致原则的社会工程人员通常会让目标人物泄露一些通向最终目标的细微信息。通过让目标对象的行为与其已经说出的事情保持一致，攻击者可以让对象泄露更多的信息。


    另一方面，攻击者的行为也必须与自己所说的保持一致。攻击者应该从小处着手，逐步扩大信息收集的范围。


    举一个不现实的例子，攻击者不能一开始就询问核设施的发射码。这个要求肯定会被拒绝，此时攻击者剩下的选择就不多了，而且不能收回这一要求。不过，如果从小处开始，逐步扩大收集信息的范围就会更加自然，对受骗者来说也不会显得太过突兀。


    采用缓慢、渐进的方式会比较困难，因为社会工程人员通常会不耐烦，想要立刻拿到“密码”。如果能够保持冷静和风度，则更容易得偿所愿。清晰地定义每次审查采用的方式，甚至写下来，能够帮助你在审查时清晰地定义每一个目标，以及实现这些目标的步骤和方式。'
