    本章最后讨论的自我安慰的动作是倾斜头部。这个动作的意义与开放腹部的动作类似。恰当地倾斜头部并带着微笑，这个动作就成为强有力的交流工具。不过请牢记微笑一定要真诚，头部的倾斜一定要微妙。假笑和严重的头部倾斜让你看起来有精神错乱之感，而且不靠谱。但是恰当的倾斜角度能让你看起来值得信任，还能表现出你的友好，如图6-14所示。


