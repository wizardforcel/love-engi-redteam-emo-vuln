  md: '让你看起来仿佛能读懂别人的心思。 许多人都认为微表情（持续时间很短、无意识、跨文化、普遍性的面部表情）背后的科学是没有意义的，因为没有人能迅速学会解读面部表情。本章会证明这项由艾克曼博士领导的研究是多么先进的科学，同时也会证明为什么称其为科学事实。在接受仅仅两个小时的培训后，绝大多数学生的技能都得到了提升，有些学生则用时更短。


