  md: '# 6.5.3　如何改进


    无论何种情况下，我们看到的成功开展了钓鱼攻击培训的公司里，报告钓鱼邮件是通过邮件或者网页的形式来通知合适的团队进行处理的。有些情况下，钓鱼攻击的反馈是自动化的，我见过有的公司创建了钓鱼攻击数据库，为员工提供邮件对比来确认他们收到的是否为钓鱼攻击邮件。


    无论采取哪种方法，如果对员工来说报告钓鱼邮件是容易的，那么他们就会更愿意报告，也更容易接受钓鱼攻击培训。我知道目标并非只是停留在让员工的生活变得更轻松这一点上。然而人们很忙碌，并且——尽管社会工程安全是我眼中头等重要的事情——我意识到并非每个人都和我想的一样。你需要和你的员工一起努力，让培训成为他们都想参加的一项活动。


    # 6.6　坏人在周一休假


    当我还是个孩子的时候，我哥哥和我同住一间房，我们有一个很酷的双层床。有一天哥哥告诉我，在满月的午夜，会有大老鼠会从墙壁里钻出来吃掉我。


    于是我睡觉前进行了安全检查。今晚是满月吗？如果不是，那我就很安全，墙上的时钟显示的时间没什么关系。如果今晚是满月，那我就要担心了。几个夜晚过去了，我仍然很“安全”。


    但是有一天晚上，当我们都钻进被子里准备睡觉时，我拉开窗帘往外瞧了一眼。“哦，不，”我心想，“今晚是满月！”


    我看了看时钟，现在才晚上9点。“我要是睡着了怎么办？如果我半夜睡过去了，那么大老鼠会趁机吃了我吗？”


    我一直醒着，盯着时钟看了几个小时。夜里11：55左右，哥哥在上铺开始挠墙。我吓得一动不动。午夜时分，一只手从上铺伸了下来，抓住了我的脖子。我发出了一声可能很远都能听得到的尖叫。


    我确信我们在此之后没少挨打。不管怎么说，我花了一些时间才意识到：


    +   - 没有大老鼠；

    +   - 如果大老鼠存在，那么它们不会等到满月的午夜才出来吃掉我。


    在我五岁时，这些教训并没有什么意义，而现在它们在很多地方都能派上用场。'
