  md: '最近发生了一起被称为Francophoning的企业级钓鱼攻击，之所以这么称呼是因为目标公司主要在法国。^4^ 这是一起精心策划的钓鱼攻击。一位行政助理收到一封关于发票问题的邮件，随后有电话打过来，电话的另一头是一个自称公司副总裁的人，要求她立即处理刚刚邮件中提到的发票问题。助理随后点击了邮件中的链接，导致后台加载了一个恶意软件。该恶意软件使得攻击者可以控制她的电脑并窃取信息。这个例子很有趣，因为其中有很多要素在起作用，例如利用权威和性别差异。不过这里主要想说的是，如果你从多个渠道听到同一个故事，那么这个故事就会听起来更加可信。


    > ^4^ Symantec Official Blog, “Francophoned — A Sophisticated Social Engineering
    Attack,” August 28, 2013, [http://www.symantec.com/connect/blogs/francophoned-sophisticated-socialengineering-attack](http://www.symantec.com/connect/blogs/francophoned-sophisticated-socialengineering-attack)。


    # 1.3 示例


    我不太清楚你们的情况，但我和克里斯都善于从例子中学习。本节涵盖了一些因钓鱼攻击而受到重大损失的例子，并介绍了一些如今仍在使用的钓鱼手段。我们也会讨论为什么它们如此奏效。


    首先，有必要提到反钓鱼工作组（APWG，www.apwg.org）。我们可以用好几页来介绍这些人，但是没有必要，你需要知道的就是反钓鱼工作组是一个全球安全爱好者联盟，他们对全球的钓鱼攻击进行研究、定义和报道。


    根据反钓鱼工作组2014年8月的报告来看，钓鱼攻击仍旧数量惊人。2014年第二季度，消费者向反钓鱼工作组报告了128,378个不同的钓鱼站点和171,801封不同的钓鱼邮件。^5^
    这是自反钓鱼工作组开始追踪这些数据以来第二高的季度报告数值。交易服务和金融机构是主要攻击目标，占总体的60%。同时也呈现出了一个新趋势：针对在线支付和加密货币（crypto-currency）的攻击有所增加。


    > ^5^ Anti-Phishing Working Group, “Phishing Activity Trends Report, 2nd Quarter
    2014,” August 29, 2014, [http://docs.apwg.org/reports/apwg_trends_report_q2_2014.pdf](http://docs.apwg.org/reports/apwg_trends_report_q2_2014.pdf)。


    现在你已经总览了这些数据，是时候谈谈其中的细节了。


    # 1.3.1 重大攻击


    目前为止，塔吉特公司（Target Corporation）受到的攻击可能是最著名的案例之一。它影响了近1.1亿消费者——估计大约有4000万信用卡信息和7000万人可识别信息遭到泄露；你的个人数据可能就在其中。^6^
    这个事件中一个有趣的地方在于，攻击者似乎并非特意针对塔吉特公司。^7^ 这是一起攻击升级的例子。塔吉特公'
