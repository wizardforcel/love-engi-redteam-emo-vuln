    # 2.4　杏仁核简介


    米歇尔让我在这一节里介绍一下我在上一本书（《社会工程　卷2：解读肢体语言》）里谈到的一个问题——杏仁核劫持（amygdala hijacking）。在讨论杏仁核劫持之前，让我们来简单了解一下大脑中的一块很神奇的区域——杏仁核。


    杏仁核是一团细小的灰色物质，位于下丘脑的下方、海马体的左方（如图2-8所示）。尽管它很小，但是它有一项主要的功能：处理所有形式的刺激（视觉、听觉、嗅觉、触觉、味觉），并把这些过程发给大脑的其他部分进行处理。'
