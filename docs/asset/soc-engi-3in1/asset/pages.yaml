  md: '![](img/9f6d2369b69b99fb89843058054e5812_482_0.png)


    # 图 5-3　担忧的表情


    当人们有所担忧的时候，他们会扬起眉毛，额头也会紧张起来。在图5-3中，本表现的就是这种担忧的表情。这个表情可能会和悲伤混淆。虽然眼睛、上眼皮和眉毛的特征不同，但两者有一个共同特征，那就是额头中心的皱纹。人们或许会睁大眼睛，这说明他们在冥思苦想。现在你知道担忧与恐惧相关，这种情况下恐惧并不能说明什么，那么你该如何调整交流方式去改变目标对象的情绪内容或者他心里所想呢？


    由于恐惧/担忧的情绪已经存在于目标对象的头脑中了，所以要终止该情绪很难。因此，你需要做一些改变来为目标对象的恐惧重新定向。比如，可以推测你的要求让目标对象产生的担忧是：“我应该让他进来吗？怎么做才是正确的选择？”要让他打消恐惧，可以这样说：“我知道这个请求很唐突，但是管理部突然让我来这是因为事出有因。我更不愿意这样，但是我不能丢了这份工作。”


    这样说也许能让目标对象的恐惧消除，进而转移到他的工作和令人苦恼的管理部门上。这样做就使得他放下了责任感，并帮助他做出决定。'
