  md: '站，是社会工程人员特别喜欢的信息源。只需片刻功夫，目标人物的住址、工作、照片、兴趣等信息就呈现在眼前了。


    1 一种消费信息分享网站，当你的朋友刷卡购物时，你能马上知道他们买了什么，以及这些东西的价格和购买地点。


    社交网站成为最佳信息源的另一个原因是它可以匿名伪装。如果目标人物是一个刚离婚的中年男子，平时热衷于更新Facebook，那么你就可以假扮成一名希望结交新朋友的年轻女士。很多时候，人们在被拍马屁时，会泄露很多重要信息。结合伪装的技术，再加上人们通常认为自己见到、读到的就是真实信息这一安全漏洞，你便很容易得手。


    # ## 6. 公开报告


    公开数据可能来自目标企业内部或者外部，包括季度报告、政府报告、分析报告及公开交易公司的收入信息等。例如，邓白氏集团（Dunn and Bradstreet）以及其他公司的销售分析报告都能以极低的价格买到，而这些报告中通常会包含目标公司的大量详细信息。


    稍后会详细讨论的还有背景查询服务，比如 [www.USSearch.com](http://www.USSearch.com) 和 [www.intelius.com](http://www.intelius.com)。还有一些类似的有偿查询网站都提供查询服务，价格从每次1美元到49美元包月不等。通过搜索引擎，可以免费查到很多有用的数据，但一些财务明细数据和个人信息就得通过这种合法的付费形式有偿获得。最令人震惊的是，有些公司甚至会向客户提供个人的社会保险号（Social
    Security Number）。


    # ### 2.2.2 运用观察的力量


    虽然观察并不能称为社会工程工具，但是简单的观察却能给你带来关于目标的不少信息。目标企业员工使用钥匙、门禁卡（射频识别卡）还是其他方式进入办公大楼？有没有指定的吸烟区？垃圾桶有没有上锁？办公大楼有外置摄像头吗？供电系统或空调机组等外围设备的维修公司是哪家？这些信息都可以给社会工程人员的入侵提供可能。


    上面仅仅是通过观察可以得出答案的几个问题而已。花上一段时间观察目标，并用隐藏式摄像机录制下来，然后回去慢慢研究和分析，你会学到很多知识并且你的信息量也会暴增。


    # ### 2.2.3 垃圾堆里找信息'
