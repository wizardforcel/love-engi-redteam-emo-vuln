- pgno: 705
  md: '巧，你可以将此清单与另一份列出了谁点击了邮件、谁没有点击等信息的列表进行对照，这样你就得到了想要的数据。


    我们甚至为那个特殊的邮箱植入了一些强大的功能，例如在设定规则后，如果有人转发了邮件到此邮箱，那么发件人会收到一封感谢邮件，告诉他们邮件中发现了钓鱼攻击，并且他们在报告这一点上做得很好。


    如果你决定这么做，那么早期的名单会清晰地告诉你目前情况如何、你该如何提升，以及你需要在哪方面努力。


    # 5.2.5　报告


    开展项目所做的种种努力都是为了这一刻：报告。这份文档的背后是你的努力、汗水、泪水、心血、决策和痛苦艰辛的时刻，最后汇集在一起，才成就了这一份无比珍贵的报告。


    本节并不是要指导你如何写报告。我只想简单地描述一下我们该如何报告数据，因为这可能会帮你想到几个点子。


    让我们以X公司为例。X公司有1000名员工，该公司希望我们每个月进行一次钓鱼攻击。公司之前从来没有进行过钓鱼攻击训练，他们不想在邮件中使用其他公司的商标，只想使用公司内部的商标，不过要先从一级钓鱼攻击开始，然后再看看该如何进行。


    报告中包含下面这样的表格。


    | 第一个月：一级钓鱼攻击 | 数目 | 统计数据 |

    |---|---:|---:|

    | 发送邮件数 | 1000 | 100% |

    | 点击数 | 750 | 75% |

    | 报告数 | 50 | 5% |

    | 点击/未报告 | 705 | 70.5% |

    | 点击/报告 | 45 | 4.5% |'
