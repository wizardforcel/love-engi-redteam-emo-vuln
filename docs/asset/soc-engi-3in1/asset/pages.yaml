    # 6.1.3  保持自身和环境一致


    对自身和周边环境保持警觉或者说感觉敏锐，是一种洞察目标和自身状况的能力，它会告诉你你是否在朝着正确的方向前行。


    第5章中讨论的很多原则也适用于说服战术。观察目标的肢体语言和面部表情，就能够大致知道你对其产生的影响。


    要想真正掌握影响和说服的艺术，必须成为观察和倾听大师。加拿大阿尔伯塔大学的认知神经心理学家克里斯·韦斯特伯里（Chris Westbury）估计，人类的大脑在处理信息时每秒钟能够计算2亿亿次。这些计算会以面部表情、微表情、手势、姿势、语调、眨眼、呼吸频率、说话方式及无声语言表达等各种不同的方式呈现。掌握影响战术就是要敏锐地把握自身以及他人的这些细微呈现。


    在接受艾克曼博士的微表情训练后，我发现自己更擅于观察了。随后我发现自己对周边以及自身的变化更加敏感。当感觉到脸上出现某种表情时，我就能够分析出它对别人产生的影响。这种对自我以及周边环境的认知，是我生命中最重要的体验之一。


    NLP专家提倡在尝试影响他人时尽量减少内心活动。如果你免费在靠近目标时想着下一步进攻、终极目的或者怎样解决潜在的不利因素，这些内心活动会使你对周围的变化反应迟钝。成为敏锐的观察者需要付出大量的努力，但是这些付出都是值得的。


    # 6.1.4  不要疯狂，要灵活应变


    这里说的不要疯狂和灵活应变是什么意思呢？“疯狂”的一种广为流传的定义是“不断重复做同样的事，期待不同的结果”。愿意并且能够保持灵活应变是说服'
