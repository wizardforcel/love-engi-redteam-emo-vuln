  md: 很多社会工程人员以为伪装仅仅是乔装打扮。衣着的确能起到作用，但伪装是门学问。通过伪装这种表演方式，可以整个变成另外一个人。要实现这一点，社会工程人员必须明确到底什么是伪装，作出计划，并演绎完美的伪装，这样才有可能成功。本章将涵盖伪装的各个方面。首先会讨论伪装的确切定义。接着讨论作为一名社会工程人员如何去伪装。最后，会把这些结合起来，通过几则故事去展现如何有效地应用伪装。
