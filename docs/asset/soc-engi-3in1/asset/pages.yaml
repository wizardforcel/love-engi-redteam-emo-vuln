    # 防范钓鱼攻击：给普通人的建议


    不幸的是，高级钓鱼攻击意味着你对收到的邮件不得不多加防范。下面列出了一些防范钓鱼攻击的简单规则，能够帮助你不懂技术的朋友和家人。


    +   - 如果在家收到不明邮件，请不要打开，并将它删除。如果在公司收到，请报告给合适的内部机构来处理。

    +   - 如果邮件来自认识的人，在点击任何附件或者链接之前仔细思考一下。邮件内容和你认识的这个人的行为相符吗？如果邮件中提出了请求，那么这请求说得通吗？如果对这封邮件的发件人身份存有疑虑，那么通过其他方式联系他。

    +   - 如果邮件来自一个曾在线打过交道的机构（例如银行或者社交媒体），可以给他们打电话或者通过浏览器访问其官网，并且不要点击邮件里的链接。永远不要通过邮件提供认证信息或者个人信息。多花五秒的时间，使用已知的安全的方式来提供个人信息，可以保障个人信息的安全。


    听从这些建议意味着你可能错过朋友的新消息，或者错过一次在线交易，但是换个角度来看，也避免了可能出现的从电脑被攻击到身份信息被窃等不良后果。如果你对钓鱼攻击问题的严重程度和潜在的后果有所认识，就会明白：哪怕一点点批判性思维就可以帮助你避免日后的很多痛苦。


    在撰写这一章时，我参加了一家公司的会议。这家公司有员工点击了钓鱼邮件中的链接，导致电脑中被安装了某种勒索软件。这些勒索软件加密了用户的驱动、网络以及与之相连的驱动。黑客使用的是非常牢固的加密技术，其中也没有漏洞可以突破。这意味着用户要么付钱给敲诈者，要么失去数据（除非正确备份过）。其实只需要多花几秒钟思考一下，通过浏览器打开链接而不是点击邮件里的链接，就可以防止造成如此巨大的损失，这难道不值得吗？


    # 防范钓鱼攻击：给专业人员的建议'
