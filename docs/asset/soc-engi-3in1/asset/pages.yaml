- pgno: 302
  md: '# 7.3 小结


    工具是社会工程的一个重要方面，但工具本身不足以成就社会工程人员。仅有工具是没有用的，掌握工具的功能并实际运用才是重点。


    本章的核心主题在于熟能生巧。无论是使用电话、基于软件的工具、网络还是其他间谍工具，练习使用才是成功的基石。例如，在社会工程活动中使有电话时，可以篡改来电显示甚至变换说话的声音。然而，如果在使用这些神奇的技术时，你的声音听起来过于生硬、紧张、不安或者准备不足、言之无物的话，那么你所期望的成功就会落空，并且很有可能让一切变得不可信。这项原则在应用伪装技术时同样非常适用。你要伪装的那个人如何谈吐？他会说什么？他会怎么说？他掌握了什么样的知识？
    他会询问什么样的信息？


    不管社会工程人员使用软件工具、硬件工具，还是两者都用，都应该花时间去学习每个工具的详细功能，因为工具的每个特征都会影响审计工作的成败。


    工具能节省大量的审计时间，并可弥补审查人员潜在的不足。这一点在第8章的案例分析中体现得尤为明显。'
