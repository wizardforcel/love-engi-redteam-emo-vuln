  md: '他说：“你好，我是ABC垃圾回收公司的乔，我们接到你们采购部门的电话，要求派一个人来检查后面被损坏的垃圾箱。明天会来人收垃圾，如果这个垃圾箱无法修复，我会让他们带一个新新的来。但是我得去后面检查一下。”


    保安人员毫不迟疑地说：“好吧，你需要带着这个徽章过去。经过这里再绕到后面，就可以看到垃圾箱了。”


    社会工程人员顺利拿到了通行证，对垃圾箱进行了长时间仔细的翻查，但是他还想扩大战果，试图进一步发现线索。他看着写字板说：“这里显示说要检修的不是食品垃圾箱，而是装纸张和技术垃圾的。到底会在哪里呢？”


    “哦，照着我告诉你的路线，它们在第3隔间。”保安说。


    “谢谢！”乔说。


    简单的伪装，穿着有标识的衣服，带着“工具”（如写字板），并且故事情节简单而又好记。正是它的简单性和缺少细节使得这次伪装更加令人信服，进而发挥作用。


    另一种惯用的伪装就是所谓的技术支持人员。只需一件Polo衫、一条卡其裤与一个小的电脑工具包。许多社会工程人员使用这种技术顺利进入了公司大楼，因为“技术人员”通常能不受监督地进入任何地方。同样的法则也适用于这里，即保持故事情节的简单会使这种伪装真实可信。


    # 4. 2. 6 伪装必须显得自然


    想要使伪装看起来自然一些，可以采用我前面推荐的大纲模式，而不是使用剧本方式。大纲模式下社会工程人员可以自由地发挥，使用详细的剧本则会太机械。伪装中可以加入社会工程人员感兴趣的项目或故事。假如每次有人问一个问题或做出一个论述，你都支支吾吾，需要深入地思考，而不能做出及时明智的回答，可信性就会因此大打折扣。确实，很
    Nus，很多人都是思考后再说，因此这并不是要求你立即答复，但是要有答案或者要找到一个没法回答的借口。比方说，有一次对方在电话中询问一则我不知道的信息。我就说：“让我找找。”然后我迅速看了一遍，假装我是在大声询问同事：“吉尔，麻烦让比尔给我份XYZ账户的订货单。谢谢！”


    然后“吉尔”会拿来表格，我就可以得到需要的数据，而表格再也不会被提起。


    下面列出了几条让伪装更加自然的方法。'
