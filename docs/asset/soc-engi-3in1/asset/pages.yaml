- pgno: 550
  md: '拖长声音。此时你会看到什么样的眼眉动作或者对话信号呢？当说话的时候，尤其是当声音越来越高，越来越大时，我们会看到扬起的眉毛（AU1和AU2）。


    # ## 8.7.3　标点符号


    在对话过程中，你可能想通过加上感叹号甚至问号来强调特定的字句。这时我们的额头就会产生对话信号。


    这对话信号可以由AU1和AU2共同完成，或者由AU4单独完成，但是它们的用途是不同的。AU1和AU2用于表现感叹。AU4用于强调语言的严肃性或重要性，抑或是所述事情的困难之处。这些信号会为特定的讲话加上“标点”。


    # ## 8.7.4　疑问


    在对话过程中，你可能想强调一个问题，或者让你的谈话对象知道你对他所说的内容有些疑问，甚至感到困惑。


    正如你能想到的那样，AU1和AU2可以在这时发挥作用。这些扬起眉毛的动作可用于人们提问或者是对答案不确信的时候。如果有人在对话过程中感到困惑，那么她就会使用AU4来拉低她的眉毛以表现认知负荷。


    # ## 8.7.5　词汇搜索


    当我们想不起要说的词时，会出现什么样的对话信号呢？


    答案是AU4。眼眉会向中间聚拢，以表现认知负荷（思考）。有时我们甚至会通过弹响指的方式去想那个要说的词。当我们最终想出那个词之后，眉毛也会放松下来。


    当人们抬起眼睛，思考某个想表达的词时，会使用AU1和AU2结合的动作，在这个过程中，他的眉毛也会扬起。


    # ## 8.8　非语言对话信号


    你可能会想：“所有的对话信号都会用到AU1和AU2，或者AU4。那对话信号又有什么特别之处呢？”问得好！当我们在对话过程中发现这些信号时，应该会很容易地判断出它们的含义，对不对？


    假设你正在听别人讲述一件事情。在某个时刻他使用了AU4，拉低、聚拢了眉毛，还伸出了手指，降低了说话的音量。此时发生了什么？这说明他要讲到这个事情中严肃、不祥或者消极的部分了。'
