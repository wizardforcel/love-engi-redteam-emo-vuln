- pgno: 438
  md: '# ## 2. 演示性动作


    在《手部动作》一书中，艾克曼博士是这样定义的：“演示性动作是指那些与演讲、措辞、内容、声调变化曲线及响度等时时密切相关的行为。”换言之，手势是一种能够强化我们所说的话的动作姿态。从某种程度上来说，它和象征动作有异曲同工之处，二者都是有意而为之，但演示性动作则更显得表面化一些。


    以下是演示性动作和象征动作的区别：


    +   - 演示性动作通常没有准确的语言意义；

    +   - 演示性动作一般不会在没有对话的情况下使用；

    +   - 只有说话者会做演示性动作，听者则不会。


    演示性动作会因为使用者的心情、问题或者态度的变化而改变。当人们在讲话或思考过程中感到尴尬时，演示性动作使用的频率会增加。


    演示性动作类型和使用频率的突然改变，往往暗示着欺骗或者基准态的重大改变。这种改变提醒社会工程师要对说话者给予更多注意。


    演示性动作可以分为下列8种类型：


    +   - 发令动作，用来强调某个特殊的词或者短语；

    +   - 表意动作，用来“速写”思路；

    +   - 指示动作，用来指向物品、地点或事件；

    +   - 节律运动，用来描述事件进行的步调；

    +   - 空间运动，用于描述空间关系；

    +   - 活动电影，用于描述身体运动或者非人类肢体运动；

    +   - 象形动作，用于描述涉及的物体；

    +   - 象征动作，用于阐明某事，甚至可以替代一句话或一个短语。


    观察演示性动作不仅有趣，还能帮助社会工程师判定基准态，理解对方的想法并对情感触发点做出反应。


    艾克曼博士在他的书《说谎：揭穿商业、政治与婚姻中的骗局》中提到了一非常有趣的演示性动作的规律：“演示性动作会随着我们说话的增加而增加。当人们感到非常愤怒、恐惧、焦虑或者兴奋时，他们会倾向于使用更多的演示性动作。”'
  merge: -1
  img_proc: true
- pgno: 439
  md: '随后艾克曼博士又解释了为什么人们可能会停止使用演示性动作。感情投资、尴尬、假装关切都可能让人停止使用演示性动作。此外，艾克曼博士称那些不太擅长说谎的人也会停止使用演示性动作，因为他们需要思考的是与该谎言相关的内容，而不是去思考怎样更恰当地描述事件。


    这些迹象都表明，在对话过程中，技术熟练的社会工程师会观察他们的目标对象的基准态以及任何与基准态相关的变化。


    # 3. 操纵性动作


    操纵性动作是指涉及对身体部位或衣着进行整饰的所有行为。紧张、不适、习惯，或者对于放松的需求通常都会引发操纵性动作。有一点很重要，那就是，当你注意到一个人有操纵性动作时，不要机械地认为那一定代表欺骗。


    反之，寻找操纵性动作是观察对方基准态变化的一个很好的方法。我们可以问问自己，谈话在进入情感层面前对方是如何表现的。观察对方的基准态变化能够帮助社会工程师发现对方情绪变化的迹象（再次强调，不是因為欺骗才发生变化）。


    人们玩弄自己的头发、手或戒指的行为都是操纵性动作。他们可能平时也经常整理自己的袖口、扣子以及衣服的其他部分。这些迹象可以用来判断对方是在安抚自己还是感到非常紧张。图3-5到图3-7展示的是你或许看到过的常见的操纵性动作。


    ![](img/9f6d2369b69b99fb89843058054e5812_439_0.png)


    图 3-5 搓手是一个常见的操纵性动作


    当人们感到紧张或者没把握时往往会搓手。比如本的基准态是尖塔形手势（这是自信的标志，本章稍后会提到）。当我问到前两天晚上他在哪里时，他开始做出如图3-5中所示的动作。这个基准态的变化能够让我们了解到我们的问题或者与这个问题相关的思考让他感到紧张。'
