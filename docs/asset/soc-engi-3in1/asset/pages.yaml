- pgno: 359
  md: '这个清单可以帮助专业审计人员确立指南，列出在审查中什么可为、什么不可为。此外，许多公司还面临的一个最大的问题是，如何挑选优秀的审计人员来完成这些任务。


    # 9.6.4 挑选最好的审计人员


    如果你摔断了骨头，病情十分严重，医生告诉你痊愈的机会只有50%，但是如果是非常出色的医生来医治的话，痊愈的几率会增加，你会尽力寻找这样一位医生来医治你吗？当找到他的时候，你会问什么问题？你不想看看他过去的工作成就吗？你会想要一些证据，证明他具有理论和实践能力，能提高你康复的机率。


    你可以依照类似的方式，找寻合适的审计人员。在与审计计划成本人员交流时，以下问题可供参考。


    +   - **知识** 这个团队是否发表过研究报告、论文、演讲或者其他显示其社会工程知识的材料？他们是否是这个领域的领先者？你不应该安全审查工作交给那些使用过时方法、不能与时俱进的团队。


    不经过一番调查，很难判断一名审查人员和一个审计团队的知识水平。询问他们是否发表过有关安全审计的论文、文章等是一个不错的主意。确保你雇用的团队是这个领域的佼佼者。


    +   - **经验** 客户通常不愿意被指名道姓、大肆宣扬。以我的经验来看，许多客户不愿被放上网站或市场宣传材料中，因为他们会感到尴尬，也怕导致入侵事件的发生。但你可以通过其他方式判断审计人员的经验。不妨询问他曾使用过的方法以及解决方案。


    审计人员在初次会面时通常不会将所有的秘密全盘托出，但是多问一些他进行过的攻击，能帮助你判定他的技能水平。


    +   - **合同** 为审查活动列出框架、形成文件并设定相应的限制，是审查成功的前奏。个人而言，我不喜欢大量的限制，因为大部分恶意社会工程人员根本不讲什么限制。但至少应该就一些规则和不允许的条目达成一致。


    社会工程人员希望对方准许其进行电话录音，在巡查建筑物或交互的过程中进行录像，尤其是在进行物理安全审计时，可以获得从办公场所拿走一些东西的书面许可。审查人员可不想在完成审查任务后得到一张逮捕令或一份起诉书。'
  merge: -1
  img_proc: true
- pgno: 360
  md: "同时要指派紧急联系人，他知道审计一事并且能为审计人员和他的团队担保。如果审计人员陷入法律纠纷，他可以打电话给紧急联系人。没人想在半夜翻垃圾的时候被警察抓去蹲拘留所。有了紧急联系人，就等于有了“免于司法纠纷”的通行证，长久来看这能省去许多麻烦。\n\
    \n+   - **共识**　运用本书中的原则去寻找优秀的审计人员。与他通电话或见面时，他给你什么感觉？你看到了什么？你有没有感觉他非常专业，他的目的就是要帮助你？\n\
    +   \n+     审计团队对自己的描述和业务方式与你的要求一致吗？如果你是雇用审计人员的项目经理，责任都需要你来承担。审计人员也许不想和整个项目组的人见面，因为越少人知道社会工程团队的外貌，对物理安全审计就越有利。所以他们可能只想见项目组中的一到两个人。这就意味着你必须确保审计人员的素质很高，有足够的能力完成任务。\n\
    \n+   - **时间**　公司在寻找审计人员时经常会犯一大错误，即不给审计人员足够的时间去完成工作。他们认为打几通电话、上一下网站完全可以在一天内完成。尽管这可能是真的，但是如何进行信息收集、计划和目标研究呢？这些都需要花时间的。时间非常重要，但也是把双刃剑——足够的时间有利于审查工作更好地完成，但时间太长会增加成本。管理，但是不要微管理。\n\
    \n这些只是在为公司挑选合适审计队伍时所要考虑的一部分问题。最后，社会工程团队必须让你感到舒服和满意，让你相信他们是真心想帮助你，他们将尽全力保持专业并遵守规则。"
  merge: -1
