  md: '在帮助你选择软件前，还有一个话题需要讨论，那就是公司政策问题。在你翻阅下一章前，请停下来想想，你觉得你可以从积极的、消极的或丑陋的公司政策里学到什么。下章见。


    # # 第 6 章  积极的、消极的和丑陋的：公司政策及其他


    > > “受过教育的人并不记忆事实，而是尊重事实。”

    > >

    > > ——汤姆·希勒（Tom Heehler）


    政策 似乎在有些人眼中根本没有讨论的必要。我几乎想要把这一话题从这本书里去掉，但是我和米歇尔很快意识到：如果我们不讨论手头这些例子、不讨论那些应用过的方法以及曾被我们支持或质疑的决策，那么这本书就会存在缺憾。


    为什么理解安全政策的实施是如此重要？本章中的很多内容看上去都还不错，我们也明白为什么公司会认为它们有效。我们也从客户那里学到了一些东西，并想要分享给你。


    在考虑本章的最佳组织方式时，我们起初打算把每一节分成积极的、消极的和丑陋的这几个方面……然而很快我的清单被消极的和丑陋的部分占满了，于是我们决定改变这一组织方式。


    我会在本章中把每个想法或者政策摆出来，然后从以下三个角度来讨论。


    +   - 这一政策、主意或者想法的定义是什么？

    +   - 为什么它是消极的或者丑陋的？

    +   - 如何改进这一政策？


    我不希望让任何人感觉糟糕；我希望本章能够帮助你思考这些政策为什么无效，以及它们应如何改进才能在你的钓鱼攻击培训中起到积极作用。


    让我们开始吧。'
