  md: '作为一名社会工程人员，如果不被抓到，你可能不会使用这种方法。如果在某个本不应出现的地方或场合被抓，不要惊慌失措，要让他人觉得你很淡定。你的淡定会让抓住你的人极大地降低警觉，也给予你一个消除疑虑的机会。凯文·米特尼克（更多关于米特尼克的信息可以参见第8章）非常擅长这种战术。他可以不经大脑地迅速做出反应。此外，在危险的场合表现出淡定，可以让他获取到很多信息。


    • 保全面子式 审讯者可以将罪行合理化，给嫌疑人一个机会及理由供认事实，保全他的面子。不过，审讯者不应把理由设计得太好，以至于犯罪嫌疑人在法庭上用它来为自己辩护。


    社会工程人员也可以利用这种方式。审讯者不希望给对方太好的借口，但社会工程人员可以。最好这个理由能够好到让目标不假思索就知道这只是一个为了配合你的借口。


    一种方法是说有更高级别的人叫你过来，接下来你可以这么说：“我能理解你此刻的为难，但是如果在史密斯先生周一回来之前我还没有将他的邮件问题搞定，我不敢想象他会有多沮丧。”这种方式会给目标挽回面子，同时他也会满足你的请求。


    • 自尊心膨胀式 这种方式的关键是令对方感到自豪。想要它奏效，你需要找到嫌疑人的一项非常自豪的成就。吹嘘他的长相、机智或整个犯罪的精妙过程可能会使他的自尊心急剧膨胀，诱使他急切地认罪，以表明他就是那么聪明。


    在社会工程过程中，社会工程人员经常使用这种方法。通过鼓吹目标对象的成就，得到他们的最高机密。在美国核工程师的案例中（参阅第3章），在社会工程人员的夸奖和吹捧下，他说出了本不应该泄露的机密信息。


    • 夸张式 如果审讯者夸大犯罪事实，犯罪嫌疑人可能会承认案发的真实情况。举个例子，如果审讯者想把强奸罪扣到一个小偷的头上时，可以这样说：“要不然你为什么会在半夜闯入他人卧室？”这种问法往往会令犯罪嫌疑人承认只是想偷窃，并非是要强奸。


    你也可以使用这种方法夸大你想要执行的任务。通过夸大去那里的理由，可以促使目标为你提供稍低的访问权限。例如，你可以说：“我知道史密斯先生希望我来修理他的电脑，因为他丢失了大量的数据，但是如果你感觉不合适的话，我可以通过公司的另一台电脑来解决他电脑的问题。”'
