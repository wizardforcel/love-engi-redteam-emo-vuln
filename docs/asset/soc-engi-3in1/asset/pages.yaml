    # 8.1.3 社会工程框架的运用


    这个故事里，凯文总结了一些促使艾瑞克成功的做法和表现，例如在和警察谈话时要保持淡定以及迂回地处理不熟悉的问题。


    你也可以找出艾瑞克所用的社会工程框架及使用方法。


    举个例子，任何成功的社会工程审查或攻击的第一步都是信息收集。从这个例子中你可以发现，艾瑞克一定是事先做足了功课才开始攻击的。他对电话系统、DMV的运行方式以及有待渗入的流程颇为熟悉。我不清楚这个攻击发生在多久以前，但是现在有了网络，这种攻击就更加简便了。网络是信息收集的金矿。几年前有人想出了一种攻击Tranax
    ATM取款机的方法，几个星期之后在互联网上就可以找到实现这种攻击的详细手册了。


    同样，如本书之前提到的，选择与你的工作或曾经的身份相似的身份来伪装，能增加成功的几率，因为伪装得越“逼真”，就越有利于收集信息并攻破目标。显'
