- pgno: 489
  md: '![](img/9f6d2369b69b99fb89843058054e5812_489_0.png)


    图 5-9 真正的悲伤是一种很复杂的情绪，但是也能形成情感上的联系


    “我失业了一段时间，今天终于收到了这里的一份面试邀请。在来的路上，我心情十分紧张，突然一只猫从路边窜了出来，我喜欢猫，不想伤害它，所以我只好突然转向，结果咖啡洒到了我的文件夹和座位上。简历都湿透了。幸运的是，没撞到猫，不过简历是毁了。”


    “哦，那太糟糕了。我能帮你做点什么？”


    我的脸上带着深深的悲伤，回答道：“我的USB钥匙里还存着简历。你能帮我打印一份吗？”之后我把电子钥匙递给了她。


    几分钟后我的简历打印完毕。我收到同事发来的短信，短信的内容是“壳”。之后秘书说：“你叫什么名字？我会告诉琼斯女士你到了。”'
