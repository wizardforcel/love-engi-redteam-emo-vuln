- pgno: 495
  md: '![](img/9f6d2369b69b99fb89843058054e5812_495_0.png)


    图 5-15 在这个轻蔑的表情中，请注意嘴唇的不对称变化


    +   - 我们需要认识到的是轻蔑的情绪可能是最容易观察到的情绪（仅次于开心）。你可能会惊讶能看到这种情绪的频率，但是不要忘记思索这种情绪产生的原因。


    当嘴和脸颊的一侧因为轻蔑的情绪抬了起来，往往会产生一种假笑。之后可能会出现点头或者其他表现自大的姿态。


    关于轻蔑要说的太多了。对于新手来说，这是一个很容易被错过的情绪，也是需要我们掌握的重要情绪。一旦学会识别轻蔑，你可以轻松地在日常生活中发现它们。


    为了说明轻蔑的要旨，我会转述PK给我讲过的一个故事，讲的是他何时开始能够观察和使用这种表情。那是一次他在阿拉伯国家的经历。PK的雇主请他吃饭，但是特别指出不要给他那桌点酒。这在伊斯兰文化中是非常常见的要求。然而，PK告诉我说，他当时在一个同事脸上看到了一个表示轻蔑的微表情。之后，在与那个助理建立了密切关系后，那个助理告诉PK说他的雇主很“虚伪”，因为他在出国的时候经常喝酒。这个助理虽然在资历上不如那位雇主，却更像是位虔诚的穆斯林，因为他从不喝酒。


    如果你在和别人交流的时候看到了轻蔑的表情，而又不知道为什么，那么这个时候请迅速重新评估是否需要对你的接近方法或者肢体语言进行改变。确保你的接近方式和表达'
  merge: -1
  img_proc: true
- pgno: 496
  md: '不会太具有进攻性。不要使用任何可能冒犯他人的语言或者笑话。此外，外出工作时要确保自己在目标对象看来不会无礼。


    # 5.2.6 厌恶


    轻视的情绪往往是针对某个人，而触发厌恶情绪的原因却有多种，比如气味、味道、触碰、景象或者是想到某些东西或某个人感觉。更有甚者，我们自己或我们的所作所为都可能让自己厌恶。厌恶的情绪能够在一个人士上触发强大的心理反应。当你厌恶某个东西的时候，会有什么样的感觉？有些人会晕血。还有一些人在想到呕吐的时候会觉得恶心。或许在读这一段的时候你已经开始做出如图5-16所示的表情。


    ![](img/9f6d2369b69b99fb89843058054e5812_496_0.png)


    图 5-16 在这个厌恶的表情中，我们可以看到厌恶以及深藏的愤怒


    在我与PK的谈话中，他告诉我在测试和真实生活中人们往往会忽略厌恶的情绪，因为人们不能对其进行辨别。然而，训练自己在交流过程中观察厌恶的情绪能够极大地改变我'
  merge: -1
  img_proc: true
- pgno: 497
  md: '们的交流。当我让大家列出艾克曼提出的七种普遍的情绪时，大部分人都迅速列出了开心、悲伤、惊讶、恐惧和愤怒，却少有人提到厌恶或轻视。而这两种情绪对社会工程师来说都是很重要的。虽然厌恶的情绪通常会与愤怒混淆，但这两种情绪都有各自独特的特征。


    想象一名执法人员在和一名嫌犯进行面谈。在问到一名失踪人员时，嫌犯的脸上闪现了一个厌恶的神情。这意味着什么呢？该执法人员需要对此进行更深入的询问。他需要知道这个厌恶的情绪是因为嫌犯对他的厌恶还是因为想到了暴力场景，还是其他什么原因。


    一旦经过训练后你就能够观察到这种表情，就如PK所说的：“你看到的会比你想要看到的更多。”


    # 分解


    我们将厌恶的情绪分解为不同的部分，以便社会工程师在交流过程中理解和运用。请注意以下迹象。


    +   - 皱鼻子，如图5-17所示，仿佛是要切断鼻子与异臭之间的联系。褶皱通常会出现在鼻梁上。


    ![](img/9f6d2369b69b99fb89843058054e5812_497_0.png)


    图 5-17　请注意皱鼻子的动作


    +   - 嘴唇会卷起来，不过有时也会张开，并露出牙齿。图5-18分别展示了这两种情形。在典型的厌恶情绪中，上唇会靠向鼻子，露出上牙。'
