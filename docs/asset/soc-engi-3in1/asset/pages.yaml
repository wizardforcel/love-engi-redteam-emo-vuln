    # 1.3 总结


    考虑到我们在交流中有很大一部分信息并不是通过言语传递，而是通过面部、身体、双手、脚以及腿来传递的，我们应当用足够多的时间去了解非语言交流。但是为什么要通过一本关于社会工程的书来了解呢？


    诈骗犯、行骗高手以及社会工程师长期使用这些技能。他们能够与他人建立和谐的关系，能够看出目标何时被引诱，何时被套牢。本质上，他们都能够解读目标人群释放的非语言信号。


    作为一名社会工程专家，我发现了解这些信号是非常重要的。并不是说因此我能够利用它们给自己找借口，而是因为我能够通过解读这些信号了解目标对象的情绪状态，并判断自己的表现。


    在我们讨论细节之前，要先讨论什么是社会工程以及为什么需要提防与其相关的恶意使用。


    # 第 2 章 什么是社会工程


    > “启蒙不是对光明的想象，而是对黑暗的觉知。”


    ——卡尔·古斯塔夫


    我将社会工程定义为能够影响人们的一种特殊行为，受其影响，人们会去采取某种可能（也可能不是）对其自身最为有利的行动。正如第1章所述，我曾经受雇在不使用暴力的情况下潜入库房。为了完成这项工作，我采用了社会工程的方法。比如通过寻找托辞和模拟身份的方式，从三到四个不同方面施加影响。我的意图是测试公司的安保状况，以及员工是否能够依照相关规范行事。在进出口、摄像机位，以及可能会招致罪犯日后破门而入的其他地方，我也拍了照片。典型的一种情境如下。'
