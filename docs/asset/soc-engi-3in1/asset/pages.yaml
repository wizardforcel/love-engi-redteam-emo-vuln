    我曾经合作过的一家公司就被一名心怀恶意的社会工程人员攻入了，他当时利用的就是员工的恐惧心理。在得知公司的CFO出城参加一个重要的商务会议，期间不便被打扰后，该社会工程人员伪装成一名技术支持人员混进了公司。他要求进入CFO的办公室，但被拒绝了。然后他使用了如下伎俩：“你们的CFO史密斯先生打电话给我，叫我在他出席会议的这段时间帮他把电子邮箱的问题处理好，如果在他回来之前解决不了，后果会很严重。”


