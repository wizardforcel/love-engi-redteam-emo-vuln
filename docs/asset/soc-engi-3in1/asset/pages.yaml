- pgno: 551
  md: '再加上言语，上述判断就更明确了。不过，艾克曼博士通过研究，还为社会工程师发现了另外一种相反的情形——无需言语的对话信号。


    这是一个很重要的话题，因为如果能在对方不说话的情况下了解所要传递的信息会提升我们的交流能力，并对对方产生影响。需要谨记的是，以下对话信号的使用无需语言。


    +   - 怀疑。如果人们在使用AU1和AU2情况下，下拉嘴角，抬高下唇，放松上眼睑，头也左摇右摆，那么这就是怀疑的表现。

    +   - 模拟惊讶。在抬高上眼睑、张开嘴巴的情况下再结合AU1和AU2。这样通常是惊讶的表现。

    +   - 肯定和否定。这一点的有趣之处在于其具体含义是由文化背景决定的。在西方，我们将会将使用了AU1和AU2的快速倚仰头部的动作视为肯定。但是在希腊和土耳其，这是否定的意思。

    +   - 复杂的疑虑。在表示复杂的疑虑时，AU2只作用于脸的一侧。扬起的眉毛表现当事人的疑虑。艾克曼博士发现这个动作是不会无故出现的。人们会通过这个动作有意地表现疑虑。因此，如果你观察到这个表现，要知道这是刻意为之，不是很诚的。艾克曼博士以20世纪30年代到40年代的电影为例说明了这一点。我把这个信号同《星际迷航》中的斯波克先生联系在了一起。PK指出约翰·贝尔西经常扬起一边的眉毛来刻意表现怀疑。这并不是说做这个动作的人在骗人，而是说这不是一个自然产生的信号。

    +   - 点头。PK和艾克曼博士同时也指出点头是一个简单却有效的对话信号。当你在说话的时候，是否注意到对方有多少次肯定的点头（垂直方向上的）？大多数的时间里，听者不会注意这个信号。说话者会注意到听者在聆听时有意识地点头，作为回报，说话者会报以认可，表现得更放松、更健谈。这是一项既能建立密切关系又能实现诱导的重要技能。

    +   - 最后一项——摇头。PK曾和我说过他第一次去巴基斯坦的经历。当时他发现点头对于他来说出现了未知的变异。听者开始频频侧向点头，不是表示否定的左右摇头，而是将耳朵稍稍移向肩膀的方向。经询问后，他得知这是一个在南亚常用的对话信号，用晃动头部的方式表示对方已经理解你所传递的消息。他在印度的时候也看到过相同的区域信号。


    # 8.9 像社会工程师一样使用对话信号


    艾克曼博士在Human Ethology（《人类行为学》）一书第202页中关于对话信号和情绪表现关系的概括能够很好地总结本节的内容：'
  merge: -1
  img_proc: true
- pgno: 552
  md: '> “情绪表现的学习同样需要了解对话信号。对话信号是很常见的，所以如果我们不能识别对话信号，就会在研究情绪表现时感到困惑。如果想从直接主导对话过程的行为中摆脱出来，学习对话的学生就应当对情绪表现有所了解。”


    对他的这番话，我表示非常赞同。对这些信号的了解对于社会工程师来说是极其重要的。这些微小的线索能够帮助我们看出对方是否抓住了要点，表示怀疑或者感到厌倦。观察到这些信号之后，就可以因此调整接近方式，改进你的风格，从而更有效地进行沟通。


    需要注意的是，我们要练习的动作单元只有三种：AU1、AU2和AU4。我们可以记住对话信号的口诀：眉毛上，眉毛下，点头是鼓励。通过练习这些动作单元，去体会它们所表达的感觉，以及你自己的感受。在对话的过程中，从他人身上寻找并识别这些信号会帮助我们解读对方的情绪。


    # 8.10 总结


    诱导是社会工程师工作的关键所在。作为一名社会工程师，我谈了很多关于如何利用诱导策略的问题，但是本章介绍了一个有关诱导的新方法——非言语接近法。


    本章的内容涵盖了艾克曼博士以及大思想家罗宾特·迪克尔和罗伯特·西奥迪尼博士的研究成果。我将这些信息与我多年的经验和实践结合在了一起。我们的成果形成了一套能适用于任何诱导的“良方”。无论你是否是社会工程师，这种方法都能助你一臂之力。


    我们在一天中会和很多人交谈，却很少思考对话中涉及的所有方面，比如我们的眉毛是什么样子的，姿势是怎样的，以及脸和手都做了些什么。但我们还是能顺利地进行对话，传播并接收信息。那么接下来我们会如何使用这些信息呢？


    这是社会工程师的另一个法宝。如果我们能识别更多的信号，就能更轻易地摆脱消极的特征，同时使那些能让对话顺利进行的因素得到加强。反观当今世界，我们将更多的时间用在发送短信和邮件以及在社交媒体发帖子上面，导致对话质量下降。


    2011年，亚伦·史密斯进行了一项名为“美国人和手机短信”（[http://pewinternet.org/reports/2011/cell-phone-texting-2011.aspx](http://pewinternet.org/reports/2011/cell-phone-texting-2011.aspx)）的调查。调查结果显示，31%的美国人都更愿意接收短信，而不是进行面对面交谈。而现在，随着Facebook、Twitter、Snapchat、Instagram以及其他社交媒体的盛行，这个比例会更高。现在这个时代对于社会工程师而言，对话和诱导的技巧比以往任何时候都显得更为重要，而这也正是本章内容的重要意义所在。


    本书涵盖了那么多关于非语言行为在日常交流中重要作用的研究成果和信息。我们该如何整合这些成果和信息？又该如何应用？这正是本书最后一章要讨论的内容。'
