- pgno: 285
  md: '# 7.2 在线信息收集工具


    如前所述，信息收集是社会工程的一个关键方面。若在这一点上投入的精力不足，可能会导致社会工程行动的失败。现在，社会工程人员可以通过多种工具来收集、分类以及运用信息。


    这些工具完全改变了社会工程人员查看和使用数据的方式。他们将不再局限于使用常规的搜索方式寻找数据，这些工具为他们打开了互联网的资源之门。


    # 7.2.1 Maltego


    收集和分类信息可能是很多社会工程人员的薄弱环节。如果存在一个工具，它可以同时对一个域名、IP地址，甚至是一个人进行几十种搜索；能提示各项信息的权重，显示信息重要与否；有一个GUI界面，可以用不同颜色表示不同的对象，可以导出利用；最重要的是有免费的版本可用，怎么样？


    Maltego就是社会工程人员梦想的工具。这个神奇的工具是由Paterva公司（www.paterva.com）的员工开发的。Maltego有一个免费的社区版本，可以从他们的网站下载，BackTrack4的每一个版本中都集成了Maltego程序。如果想要解除免费版在功能上的限制，如可转换的次数及保存数据，花费大约600美元就可以得到完整的授权。


    我参与的一次审查充分证明了Maltego的强大威力。当时我的任务是对一家小公司的网站进行安全审查。目标是入侵该公司CEO的计算机，但他是一个严谨、古板、不常使用网络的人。作为印刷公司的老板，他只关心自己的生意，几乎不使用高科技。显然这项任务极具难度。


    我首先打开Maltego。通过该公司的域名，提取所有网站页面和Whois数据库中的电子邮件地址，这是个很好的信息基础。然后我深入查看这位CEO的电子邮件是否在其他网站或链接中使用过。我发现他给当地的一家餐厅写了一些评论，并公开了他的电子邮件地址。同样，他在对另一个州的一家餐厅的评论中也给出了电子邮件地址。从评论中可以发现，他去这个州探亲时去过这家餐厅，评论中甚至提到了他兄弟的名字。使用Maltego做进一步调查，我找到了他父母和兄弟在这一地区的住址。通过对姓氏进行搜索，我找到一些新的链接页面，其中提到了他在那里创业时使用的另一个邮箱，以及他与当地教堂发生了矛盾，而后转到了另一家教堂。随后，我发现他Facebook上链接的一篇博文，其中有他们一家人观看完最喜欢的球队比赛后的一些照片。下面是我花了不到两个小时的时间，用Maltego获得的调查结果。'
  merge: -1
  img_proc: true
