- pgno: 507
  md: '当别人在真诚地微笑时，你多看他一眼，也会多一分开心。这源于大脑接收情绪的方式。我们看到的情绪表现越多，对这种情绪的感觉就越清晰。


    阅读完本章的内容后，你或许会好奇怎样才能通过练习去识别这些情绪。


    # 5.3 完美的练习造就完美


    学习如何模仿和识别社会工程师所使用的技能，既是成为一名社会工程师的必由之路，同时也是保护自己远离恶意的社会工程师攻击的方法。学习观察面部表情并不像我们想象的那么困难。像艾克曼博士那样的研究人员毕业生都在研究这个课题，而且还开发了工具来帮助人们学习如何识别面部表情和肢体语言背后的含义。借助艾克曼博士的微表情培训工具METT（Microexpression
    Training Tool）和METT培训高级工具，我的技能得到了磨练。在我的培训课上，我也使用这些工具帮助我的学生学习相关技能。


    这些并不是唯一的方法。我的学习历程始于艾克曼博士的著《情绪的解析》和一面镜子。我坐在那面镜子前，按照书中每个章节描述来运动我的脸。我时而看镜子时而不看，尝试体会其中的区别。我反复进行这样的练习，直到我觉得我的面部表情已经能够做到和书中所述类似的程度。在那之后，我开始分析在我身上发生的情绪和动作，确保二者能够匹配。


    我也开始观察身边的人，看我是不是能够注意到他们面部做出的宏表情。我还让自己在每次交流时都要找出一种微表情。比如，在镜子前练习完愤怒的表情后，我就了解到生气时会瞪眼、皱眉，嘴巴和下巴会收紧，下颌会放低。之后我就开始观察我的家人和朋友，在他们的脸上寻找这些微妙的迹象。我讶异于我所看到的一切，因为我的面前仿佛呈现出一个全新的世界。我能在谈话中清楚地了解家人真实的情绪。然后我就开始犯所有菜鸟都会犯的典型错误：我相信我所看到的表情，我认为自己知道为什么对方会有那样的表情。最初，这个错误让我深感挫败。当我学着控制那种冲动的时候，我开始观察情绪，并认识到需要学习的还有很多。渐渐地，我与孩子、妻子、朋友和他人的交流能力有所提升。


    然后我发现了面部表情的商业含义，意识到我能够利用自己掌握的非语言交流技能影响他人的情绪。


    我发现练习得越多，我掌握的速度和准确度就越高。我自己教授一个5天的培训课程，在一次课后，一个学生问我能否“关闭”这种能力。我说不能。虽然我并不认为我们一直需要使用收集到的信息或对其作出反应，但是一旦我们知道了什么事，是很难停止的。


    我把这比作学习一门外语。我曾多次去过中国大陆和香港地区。为了让旅行容易些，我开始学习中文。在几节课后，我惊讶地发现我经常能够在中国餐馆或者亚裔市场上听到少量自己知道的词汇。'
  merge: -1
  img_proc: true
- pgno: 508
  md: '这和面部表情的观察是一个道理。我们了解得越多，那么能在无意中“听到”的就越多。因此，关于面部观察有以下两条规则：一是老话说的“熟能生巧”，但是错误的练习对我们的技能提升并无益处，所以我们要把这句话改为“完美的练习造就完美”；二是不要以为自己知道人们情绪背后的原因。


    # 5.4 总结


    面部不仅能通过有意识的宏表情表现人们的情绪内容，也能通过无意识的微表情做到这一点。学会观察表情内容，并识别“热点”（矛盾）能提升社会工程师的专业技能，同时帮你找出正在进行恶意攻击的人。


    从更私人的角度来说，对面部的了解能够帮助我们更好地了解自己，了解如何与他人沟通。这会让你与他人建立持久的关系，更好地交流以及深入了解周围的人。


    我在都柏林授课的时候，曾遇到一位非常年轻而且有活力的德国女学生。她热爱人际交流背后的心理学，在交际方面也颇具天赋。当我带着学生们出去工作的时候，我抓拍了一张她的照片。抓拍的内容是她“专注的脸”。那张脸上呈现的是典型的愤怒情绪。


    在和那个女学生工作的时候我给她看了照片。这对于她未来的交流有很大的帮助。这种自我意识能极大地帮助我们提升技能，还能帮助我们控制自己的情绪内容。


    有时在培训面部表情的时候，学生们会觉得不知所措。因为有太多部位参与情绪的表现，还有太多的方面需要观察。每每遇到这种情况，我就会先用一堂课来介绍一些稍微容易些的内容。然后再带领他们投入到更具细节的工作中。


    这堂课讲的就是舒适和不适的表现及其区别，而这也正是下一章讨论的主题。


    # 第 6 章 了解舒适和不适的非语言表现


    > “很多时候是不适的感觉扩大了舒适区的范围。”


    ——彼得·麦克威廉姆斯


    如同本书前几章的讲述方式一样，但凡在教授社会工程课程时，我都会讲到肢体语言和面部表情。一些学生会对自己需要观察的事项感到茫然无措，他们认为观察太多的东西会分散注意力。我没有帮他们想出什么观察所有表情或线索的捷径，而是告诉他们做一件事：寻找舒适和不适的迹象。每个人都会有自己肢体语言的基准态，因为不适导致的基准态变化能给社会工程师提供很多信息。“真相奇才”PK注意到，这种基准态的变化'
  merge: -1
  img_proc: true
- pgno: 509
  md: '被艾克曼博士称之为“热点”。曾负责“奇才项目”的奥沙利文博士指出，那些奇才们在测试的时候常会观察他们的受试者，然后通过对舒适和不适表现的识别进行判断。


    想象你的目标对象是本，并希望与之对话，以便进行信息采集。当你接近他的时候，看到他将双手放在后脑勺上，脸上流露出如图6-1所示的满意神情。


    ![](img/9f6d2369b69b99fb89843058054e5812_509_0.png)


    图 6-1 本很满意，他感觉很舒服、很自信


    当你开始同他说话的时候，你的问题围绕着他的公司展开，之后他做出了如图6-2所示的动作。'
  merge: -1
  img_proc: true
- pgno: 510
  md: '![](img/9f6d2369b69b99fb89843058054e5812_510_0.png)


    图 6-2 在本身上发生了什么变化？


    当本考虑做决定的时候，他开始感到不适。他颈部的肌肉紧张起来，开始怀疑自己继续对话并回答问题是否明智。他的姿势也从自信变成了十分不适。


    对于社会工程师来说，这种变化包含了极大的信息量。我们可以清楚地看到本的情绪，以及这种情绪对他的影响。此时，聪明的社会工程师会迅速判断出自己是否能够继续跟进或是遗让。进退的选择视工作的目标而定。


    本章内容主要讲述的是关于观察这些微妙的，或者没那么微妙的舒适与不适的信号的，以及社会工程师如何运用这些信号。接下来将通过几个部分来进行介绍。


    # 6.1 颈部和脸部的安抚动作


    除了我们之前讨论过的揉颈部的行为外，社会工程师还能注意到其他明显不适的迹象。关键是要找到一种能够表明目标对象受某事物影响而感到不适的行为变化。'
  merge: -1
  img_proc: true
- pgno: 511
  md: '与男士用手揉他的后颈相似，当女士感到害怕、被威胁或者担忧的时候，她们通常会把

    手放在胸骨上切迹（suprasternal notch）的位置，如图6-3所示。


    ![](img/9f6d2369b69b99fb89843058054e5812_511_0.png)


    图 6-3  这个颈部安抚动作表现出了不适


    曾经有一个孩子在商店走失了。我同查看安全录像的人员进行了交流。他们注意到，当

    妈妈得知孩子走失时，首先做出的动作就是图6-3中的动作。


    社会工程师可能会注意到的另一个舒适基准态变化是揉擦脸部的动作，如图6-4所示。'
  merge: -1
