- pgno: 102
  md: '世上有无数种方言和口音，我个人找到了一种很有用的方法，就是写下我要讲的话的音调。这样我可以练习朗读，并且记住大意，让我的口音更自然。


    这些建议可以帮助社会工程人员掌握或者至少是熟练使用另一种方言。


    即使不能掌握另一种方言，学会工作领域的专业表达方式也可以使情况有所改观。在公共场合听两个人交谈是一个好主意。餐厅、购物广场或者任何能找到一群人坐在一起聊天的地方都是绝佳的场所。仔细地听人们交谈所用的短语或关键词。当你听到他们在一些对话中运用的词汇时，可以考虑把它们纳入到你的伪装中，使其更可信。同样，这也需要研究和勤加练习。


    # #### 4.2.4 使用电话不会减少社会工程人员投入的精力


    最近几年，互联网开始主导某些“不需面对面交流”的社会工程活动。然而，在过去，电话是社会工程中不可或缺的一部分。由于这种转变，很多社会工程人员不再花时间和精力去探究“打电话”这件成功利器。


    这里想说明的是，电话仍然是一种非常强大的社会工程工具，不该因为互联网的非人格化性质而减少对它的使用。


    很多时候，社会工程人员在策划电话攻击时的想法会有所不同，因为利用互联网看起来更简单一些。要记住，在使用电话进行社会工程时，要投入同等的精力、同等深度的研究和信息搜集，最重要的是同等水平的练习。我曾和一个小组一起练习利用电话进行攻击。我们研究了适宜的方法、语调、语速、音调以及措辞，然后过了遍剧本（通常一分钟左右的时间），开始了一个会话。第一个人打了电话，连线到某个人，刚开始的几句话就搞得一团糟。在初头初尾的尴尬和恐惧中他挂掉了第一通电话。这给我们上了很好的
    一课：话筒另外一头的人根本不知道你想说什么，所以你不会真的“搞砸”。练习会话可以帮助你学会处理那些意料之外的事，而这通常是由你不慎改变剧本所造成的。


    如果没有一组人陪着你训练或磨练这些技能，你必须得有创造力。试一试给家人或者朋友打电话，看看你能在多大程度上操控他们。另一种练习方法是给自己录音，就像在打电话一样，然后重放一遍看看听起来如何。


    我个人认为使用剧本大纲是很重要的。这里有个设想：想象你不得不给电话公司或者另外一个机构打电话。理由是他们搞错了一笔账单或者服务有问题，所以你打电话过去抱怨。在你跟客服解释以后，告诉他你有多失望，有多生气。客服没有为你提供任何帮助，他说：“本公司承诺提供最好的服务。请问还有什么需要帮助的吗？”如果电话另一端的人稍微思考一下他的问题，就会知道这样问有多'
