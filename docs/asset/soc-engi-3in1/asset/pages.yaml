- pgno: 715
  md: '+   - 缺乏标准。这看起来似乎显而易见，但事实是，当一次性的培训项目开展时，公司缺乏合适的标准来判断这笔钱是否用对了地方，或者培训是否有效。


    一次性的简单测试不仅不能起到帮助作用，似乎还会带来相反的效果——它实际上阻碍了公司训练员工防御钓鱼攻击的能力。


    # ### 6.4.3　如何改进


    好了，我明白了……并非每家公司都想要每个月向全体员工发送一次钓鱼邮件。是的，我可以一直争论到脸色发紫说这是最好的办法，并被证实有帮助，但是仍然有很多人想要慢一点开始。那么，什么才是重要的呢？


    重要的是一致性和承诺。培训必须持之以恒——至少每个季度或者每隔一个月进行一次，而且你必须严格执行。不要假定某个部门很忙、很重要或者对钓鱼邮件很熟悉，从而把一些员工排除在外。把所有员工都纳入训练中，看看他们在每两个月或每季度进行一次的钓鱼攻击训练中表现如何。


    由此你可以确定是否应该增加训练的频率，并想清楚如何与你的同事一起作为一个团队工作，而非处于对立的状态。


    在此强调一下预算受限的问题。这一问题看上去是由于下面两种原因之一（或者两者都有）导致的：


    +   - C级领导人不理解或者不支持这种培训；

    +   - 没有办法提供能够证明投资有所回报的数据。


    争取预算总是很艰难的，因为那就像购买保险：你购买它是为了避免不好的事情发生，而非享受好的东西。


    # ## 6.5　如果发现钓鱼攻击，请打这个电话


    我曾经自愿参加了一座大楼的拆除工作。为了重建这座大楼，它的内部结构需要拆除。问题是：大楼的墙壁都是用煤渣砖砌成的。


    我对于拆除工作一无所知，但好在那时我年轻力壮。我拿起我能找到的最重的锤子，走进房间，开始砸墙。煤渣砖的碎片飞得到处都是，我一边挥舞着大锤，一边'
  merge: -1
