  md: "通过以下练习，很容易产生悲伤的感觉。\n\n+   1. 轻轻地张开嘴巴。\n+   2. 下咧嘴角。\n+   3. 保持嘴唇不动，同时上抬你的双颊，感觉自己眯着眼睛。\n\
    +   4. 保持表情不动，眼睛往下看，让上眼睑无力地下垂。\n\n通常这个时候，你便会产生悲伤的情绪了。我第一次做这个表情的时候，就立刻奏效了。我发现自已得控制练习这个表情的时长，因为练习带来的悲伤会持续较长的一段时间。图5-11展示的便是“悲伤”的表情。\n\
    \n![](img/9f6d2369b69b99fb89843058054e5812_137_0.png)\n\n该图片由保罗·艾克曼博士提供  \n图5-11\
    \ 注意双唇和下垂的眼睑，这意味着悲伤\n\n悲伤的另一个特征使它成为一个奇妙的情感，即它并不需要显现出极度的痛苦或悲伤。悲伤可以表现得非常微妙，可以用局部的面部表情来传达。人们可能会试图使用虚假的微笑或者“坚忍的眼神”隐藏悲伤——凝视正前方，面容呆滞，但你可以看出他们正试图控制内心的真实感觉。\n\
    \n请看图5-12，图中展现的就是这种表达方式的悲伤。在对凯特·戈瑟兰（Kate Gosselin）的一次有关离婚和家庭的采访中，她极力地隐藏自己内心的情绪，然"
