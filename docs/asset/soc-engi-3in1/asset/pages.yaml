  md: '术支持人员”进去了。如果该社会工程师经验丰富，他可能就是通过观察秘书的面部表情得知了她的心理动态，通过不断强化她的担忧和紧张，使她达到恐惧的状态，从而实现自己的目的。


    恐惧是一种强大的推进器，可以使你或者目标对象做出异于平常的事情。


    # 5.2.5 惊讶


    如前文所述，艾克曼博士和微表情领域的其他心理学家认为惊讶和恐惧有着密切的联系，因为从表情上来看二者存在很多相似的地方。尽管如此，二者还是有些明显的不同，例如嘴唇移动的方向和眼睛反应方式。


    请试着做以下动作来练习“惊讶”。


    +   1. 抬起眉毛，不是充满恐惧而是抱着想尽量睁大眼睛的目的去做。\n2. 轻轻地张开下颚。\n3. 熟练这个表情以后，试着加快速度。


    我注意到自己做这种动作的时候不经意间吸了不少空气，这让我感到一种类似于惊讶的情绪。你应该会看到类似于图5-9所示的表情。


    ![](img/9f6d2369b69b99fb89843058054e5812_135_0.png)'
