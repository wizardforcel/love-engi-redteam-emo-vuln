  img_proc: true
- pgno: 699
  md: '在公司环境下，我们的鱼叉式钓鱼攻击通常在OSINT环节之后展开。我们会给客户提供报告，其中包括所发现的情报、如何利用这些情报，以及发送鱼叉式钓鱼攻击邮件后的结果。


    展示真实的鱼叉式钓鱼攻击的例子会泄露客户的信息，因此我只能在这里列出一些主题，但你可以看到它们是如何生效的。


    +   - 我们发现了客户的家庭住址，以及他们附近的房子正在出售。在发现他们也打算出售房子时，我们发邮件声称为他们提供免费的房产评估。

    +   - 发现一位主管喜欢带他的家人度假，而他们喜欢的地方是巴黎后，我们发送了一封鱼叉式钓鱼邮件，里面是迷人的巴黎春季之旅的打折广告。

    +   - 发现一位主管24年零10个月前毕业于一所军事院校后，我们发送了一封钓鱼邮件，邀请他担任25周年重聚大会时的重要发言人。

    +   - 发现一位主管的女儿“讨厌她父亲”后，我们以学校辅导员的名义发送了一封邮件，邮件里包含了一些细节和一份PDF格式的报告。


    这些内容可怕吗？的确很可怕。这些主题的恶意毋庸置疑。但是如果你的主管拥有你王国的钥匙（我们还曾和持有核设备钥匙的人一起共事过），那么此类测试是非常必要的，开展这方面的教育可以让人们和他们的公司意识到钓鱼攻击是一种多么可怕的威胁，并帮助他们抵御所面临的潜在危险。


    在继续之前，我得花上几分钟谈谈另一种四级钓鱼攻击，否则我可能会遗漏它。它是一种多重攻击，大体示例如下。


    早上11：00，约翰收到一封邮件。


    早上11：30，约翰接了一通“IT部门的拉里”打来的电话，拉里说：“约翰，我是楼下IT部门的拉里。我刚给你发了一封邮件，里面有一个PDF文档是关于你的工作站升级路径的。我需要你打开它，然后告诉我你的机器是否符合这些条件。”


    约翰说：“拉里？啊，好的。”约翰点开附件，然后说：“拉里，文件崩溃了，我打不开。”


    拉里回答道：“约翰，你是不是还在使用Acrobat 6.0？我们应该在两个月前为你进行了升级。好的，让我把它另存为成一个你可以打开的格式。我会在午饭之后打电话给你，然后把新文件发给你，好吗？”


    约翰说：“好的，谢谢，拉里。”然后挂了电话。'
