- pgno: 294
  md: '在一个人人都有手机的时代，人们会在公共汽车、地铁或者其他公共场合，使用手机接打私人电话或进行深入的交谈，使用手机的方式多种多样。利用手机进行窃听或与目标直接通话，这些攻击方式在过去是不可能实现的。随着市场上智能手机和具有计算机功能的手机日益增多，越来越多的人在手机上储存密码、个人数据和私人资料。这为社会工程人员通过不同场合接触目标、获取数据打开了一扇新的大门。


    如果拨号者可以通过某种“方式”提高其可信度，那么每天24小时开机就增加了信息泄露的几率。例如，如果来电显示表明电话是从公司总部打来的，则许多人会毫不犹豫地提供信息。苹果和安卓智能手机都有可供利用的应用程序，可以将来电显示号码篡改成任何号码。利用类似SpoofApp（[www.spoofapp.com](http://www.spoofapp.com)）的应用程序，社会工程人员能够以较低的成本将拨出的号码伪装成从任何地方打来的电话号码。这一切都将提高伪装的可信度。


    社会工程中电话的使用可以分为两个不同的领域：背后的技术和编造的借口。


    # 1. 篡改来电显示


    来电显示在商务和家用电话中都已成为一项普遍的技术，特别是在当前手机普遍取代固定电话的情况下，来电显示已成为日常生活的一部分。成功的社会工程人员必须意识到这一事实并且知道如何加以利用。


    来电显示篡改主要是篡改目标的来电显示信息。换句话说，尽管你使用某一号码拨号，但显示在对方屏幕上的却是另一个号码。


    利用该技术的一种方法是假装成在垃圾箱里找到的目标公司的供应商的号码。如果社会工程人员发现ABC公司是目标的计算机技术支持单位，就可以找到该公司的号码，在打电话跟目标预约下午见面时伪装该号码。通过篡改来电显示，你可以伪装成以下机构或个人：


    +   - 远程办公室

    +   - 办公室内部

    +   - 合作伙伴

    +   - 公用事业/服务公司（电话、水、网络及专业灭虫人员等）

    +   - 上司

    +   - 快递公司'
