- pgno: 98
  md: '# 4.2 伪装的原则和计划阶段


    像其他技术一样，伪装也有—定的原则可以遵循。下面列出了一些原则。当然，并不是说就只有这些，还可以继续添加，只是这些原则体现了伪装的本质。


    +   - 调查越充分，成功的几率越大。

    +   - 植入个人爱好会提高成功率。

    +   - 练习方言或者表达方式。

    +   - 很多时候，如果低估了电话的作用，可能会减少社会工程上的投入程度。不过对社会工程人员来说，使用电话并不会减少精力的投入。

    +   - 伪装越简单，成功率越高。

    +   - 伪装必须​​要很自然。

    +   - 为目标提供逻辑结论或下一步安排。


    下面各小节将详细讨论每一条原则。


    # 4.2.1 调查越充分，成功的几率越大


    这个原则不言自明，但还是值得多次强调，因为收到的成效直接和调查的广度与深度相关。正如第2章里讨论的那样，这是社会工程成功的关键。社会工程人员掌握的信息越多，实现有效伪装的机会就越大。还记得第2章中讲述的我的导师马蒂·阿哈罗尼的故事吗？他是如何说服一位高管访问他的集邮网站的？乍一看，对这家公司的进攻之路应该和金融、银行、融资或其他类似的事情有关，因为这是一家金融机构。马蒂做的调查越多，越觉得伪装成一个集邮册出售者最为合适。找出高管的兴趣所在，让马蒂可以轻易地入侵这家公司，而且确实奏效了。


    有时候细节决定成败。记住，没有不相关的信息。收集信息时，寻找故事、物品或者个人的特点也是很不错的主意。利用目标个人的性格或者情感依托可以使你离成功更近一步。如果社会工程人员发现首席财务官每年都向一个儿童癌症研究中心捐赠一笔资金，那么伪装时涉及一个与此有关的筹款活动极有可能奏效，尽管这听起来有点无情。


    问题是恶意的社会工程人员会不假思索地利用人们的同情心进行伪装欺诈。在2001年9月11日纽约双子大楼被攻击之后，很多恶意黑客和社会工程人员利用人员伤亡为自己牟利，他们设立网站，发送邮件给目标的计算机，并成立虚假基金，利用人们的慈善之心骗钱。在2010年智利和海地发生地震之后，同样的事情再次'
  merge: -1
  img_proc: true
- pgno: 99
  md: '发生，很多恶意社会工程人员建立网站，发布地震活动或者失踪人员的信息。这些站点利用恶意代码导致人们的电脑中毒。


    这类活动在某个电影明星或者歌星死后会更加猖獗。搜索引擎优化和市场营销天才会在几小时内让搜索引擎将他的文章置于首页。恶意的社会工程人员同营销天才一起建立含有对搜索引擎优化的恶意站点，提升搜索引擎排名，从而利用人们对搜索引擎的不断关注来吸引大家访问这些站点，他们就会获取信息或者传播病毒。


    有人会利用他人的不幸牟利，这是这个世界的可悲事实，这就是我所说的本书涉及的黑暗角落之一。作为一名社会工程审计人员，我可以利用一个雇员的感情向对方公司展示，表面上的好意会让这名职员泄露公司宝贵的商业运作数据。


    所有这些例子都明确地表达了一点，社会工程人员信息收集和调查过程执行得越好，他促进伪装成功的几率就越高。


    # 4.2.2　植入个人爱好会提高成功率


    通过个人爱好去提高社会工程的成功率听起来很天真，但是有助于让目标信服你。如果开始时宣称自己在某一方面很擅长，最终却显示出这方面知识的匮乏，这绝对是毁掉信任关系的最快方式。作为一名社会工程人员，如果你从没见过服务器机房，没有拆过电脑的话，伪装成一个技术人员是很容易失败的。伪装中加入自己感兴趣的话题和活动，从而能够侃侃而谈，会使你显得聪慧而自信。


    自信有助于说服目标相信你就是你宣称的那个人。某些伪装（例如集邮爱好者和核弹研究人员）需要更多的知识以让他人信服，这里我们又不得不提起前期研究。有时候伪装则比较简单，只要看一些网站或者读一本书就足够了。


    对于社会工程人员来说，获取知识、研究感兴趣的话题，这是非常重要的。在伪装时，你可以聊故事、观点和工作，也可以聊你很了解的某种兴趣爱好，或者是一些谈起来很舒服的话题，看看这些能否奏效。


    汤姆·G. 史蒂文斯（Tom G. Stevens）博士说：“记住，你的自信心始终与任务和自身处境密切相关。不同行况下，我们的自信心是不一样的。”这种说法很正确，因为自信心直接跟别人如何看待你这个社会工程人员有很大关系。自信（只要不是自大）可以建立信任和默契，而且让人感觉很放松。尽量让目标谈论他感到舒服的话题，然后你就可以自信地发挥，这点很重要。


    1957年，心理学家利昂·费斯廷格（Leon Festinger）提出了认知失调理论。该理论认为，人们倾向于协调自己的信仰、观点乃至几乎所有的认知。如果态度和'
