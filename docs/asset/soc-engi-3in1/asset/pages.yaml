- pgno: 682
  md: '举个例子，想像你开展培训的原因是因为遭遇了一次攻击。你并不期待任何钓鱼攻击服务商会立刻帮助你把钓鱼邮件点击率从90%降低到10%，对吧？在被攻击后立刻做出反应是很困难的，这需要快速行动和快速决策。所以此时你培训的主要目标是让人们知道钓鱼攻击是什么、它看起来是什么样的，以及如何缓解而非降低总点击率。


    然而，如果你开展培训的理由是为了在接下来的12个月里提高人们的安全意识，那么你会很自然地期待惊人的变化。


    在开始“烹饪”前，了解你为什么想进行钓鱼攻击培训，可以帮助你更好地开展它，为你的员工和上级领导做出更美味的佳肴。


    在你知道为什么要开展培训后，接下来要确定你该怎么做。


    # 5.1.2 主题是什么


    当你准备做饭时，可能会想想主题。例如，当你为超级碗派对准备一桌菜时，你可能不会使用与结婚20周年纪念日相同的主题，对吧？（我当然希望你不会在20周年纪念日时只是用餐巾纸扎个翅膀然后就坐在电视机前了。）关键是用餐的主题会改变其展现的形式。


    这可能听起来有点熟悉，类似于前几节中提到的问题，但是有一些重要差别。接下来会讲一些常见的主题。


    # 通用型


    这一类几乎覆盖了所有的情况，从古老的419骗局到伟哥广告。我想说这一类钓鱼攻击已经很少见了，但是如果你的组织机构之前从来没有遭受过钓鱼攻击，而你想要用一些容易识别的邮件来开始这个培训项目，给大家热热身，那么你可以考虑把它当作饭前开胃小吃。


    通用型钓鱼攻击能够帮助你划定一条基线，看看人们对带链接的东西有什么样的反应，而且你能够发现他们在发现可疑的事物时是否采取了适当的行动。


    一点建议：如果 你决定和服务商一起或者独自开展培训，那么确保你的项目并没有在通用型上停留太久。花太长时间在那些很容易识别出的钓鱼攻击上会让人懊恼。


    # 媒体/新闻


    现实世界中这类钓鱼攻击更为常见。这里举一些例子。'
