- pgno: 80
  md: '在她说的时候，你可以用赞赏的语气插话：“哈！折扣女王再次出击。我知道你不太喜欢牛排，但是我听莎莉说那边的鸡肉也很棒。”


    几分钟之后你就会在去那个餐厅的路上。如果没有前期准备工作，你很可能会得到干脆的拒绝：“不去。”铺垫工作对她的思维产生了影响，使她接受了你传递的内容并最终发挥了作用。


    再看另外一个非常简单的例子。一个朋友走过来说道：“我告诉你一件特别有趣的事情。”你会怎么反应呢？可能在他说出之前你就开始微笑了，你期待一个好玩的故事，所以在等待一个大笑的契机。他对你进行了铺垫，使你对幽默故事无限期待。


    在社会工程领域如何应用这些原理呢？


    铺垫本身就是一种技巧。以一种隐晦或婉转的方式植入想法或思路，比诱导本身更需要技巧。根据目标的不同，铺垫有时是相当复杂的。前面牛排的场景就是一个复杂的问题。铺垫需要投入时间和精力，特别简单的铺垫可能就是找出对象开的是哪个品牌的车或者其他一些看似无关紧要的信息。你可能“碰巧”与目标处于同一家熟食店，于是开始一次随意的聊天，你说道：“哥们，我很喜欢自己的丰田车。刚刚在停车场有个开雪佛兰的家伙倒车时撞了我的车，结果连个划痕都没有留下。”如果足够幸运的话，你对丰田车的评论会引起对方的兴趣，随后你们可能会讨论车型或你想了解的其他话题。


    在开始分析如何利用诱导的同时，考虑铺垫的问题会更有意义。社会工程人员从一开始就掌握了这项技巧。很多时候，社会工程人员在开始社会工程生涯之前就已经意识到自己有该项技能了。他们在青少年时期就发现与人沟通很简单，并且随后会倾向于与人沟通的工作。也许他是所在朋友圈的中心，人们遇到问题时会找他倾诉，会和他谈论任何问题。他后来意识到这些交流技巧能让他得到很多别人不能获得的机会。


    我年轻时就具有这一天赋。父母经常说起，我在五六岁时就能和完全陌生的人交流，有时我会走进繁忙的餐厅厨房，询问我们订单的情况或者菜是怎么做的。不管怎样，我做到了一点，为什么呢？也许是因为我根本不知道这种行为的怪异，因为我非常自信。在我长大后，这种天赋（或者无畏精神）得到了更全面的发挥。


    似乎人们（有时甚至是完全陌生的人）喜欢向我倾诉他们遇到的难处，喜欢和我交流。十七八岁时发生的一个故事可以说明我在利用铺垫以及诱导技术方面的技巧。'
  merge: -1
  img_proc: true
- pgno: 81
  md: '我曾经非常热衷于冲浪，所以经常会做一些奇怪的工作以支撑这一爱好，从比萨快递员、玻璃纤维切割师到救生员等不一而足。有一阵，我给父亲的财务咨询公司做些杂事，经常递送文件给他的客户，待客户签好名后再拿回来。很多客户会和我聊起来，聊他们的生活、离婚以及生意上的起起落落。通常，开始时他们仅仅是告诉我，我父亲对他们来说是如何重要。当时我很难理解，为何人们，尤其是成年人，会向一个十七八岁的年轻人敞开心扉，讲述其生活的艰辛。


    有一个我经常拜访的特别的客户，他拥有一整幢复式公寓，不大也不豪华，他只是拥有并管理着这些资产。这个可怜的家伙问题真多：家庭问题、健康问题及个人问题。每次只要我一坐下来他就开始反复不停地说。从那时起我就发现，只要坐在那里听就可以了，同时我可以神游于物外或者做一些奇妙的事情。这让他们感觉自己很重要，也显得我是一个乐于倾听的好人。我完全可以坐在那里遐想下一次美妙的冲浪，关键是我给他的感觉是在倾听。


    通常我会一直听，直到受不了他所喷出的“浓烟”（他抽烟比我所见到的任何人都还要多）。因为我还年轻，没有经验，所以无法提出什么建议，也没有什么解决方法，只有耳朵。关键是我真的关心，并未假装，我真心希望能有一个解决方法。有一天他告诉我，他很想回到西部，他的女儿在那里，他可以离家人更近一些。


    我当时正想有些变化，换个更酷且更有趣的工作，挣更多的钱，以便买更好的冲浪板和其他“需要”的东西。在一次倾听过程中，我突然冒出一个疯狂的想法，而且他也认为我是一个有责任心、有激情而且还有些头脑的年轻人。前几个月的促膝交流和倾听建立了良好的预加载基础，现在是收获的好时机。我说：“你回去吧，这边的物业由我帮你打理如何？”这个主意很荒谬，现在回过头来看，我会嘲笑这个古怪的想法。但是我和他交流的时间加起来有好几周，甚至有几个月了，我一直在倾听他的问题，我了解他以及他的痛楚。此外，我从没有过类似嘲笑或贬低他的做法。现在，他和我分享自己的问题，而我提供了一个对他来说可能很完美的解决方案，我们可实现双赢。我在收入方面的要求不高，他也想离家人更近一些。我们通过前面几个月的沟通建立了良好的关系，他也“了解”并信任我。


    经过一番讨论之后我们达成了共识，他起身回到西部，而17岁的我作为二房东帮他管理30套复式公寓。我还可以继续啰嗦这个故事的细节，但我想重点已经充分表达了。（这个工作很棒，直到后来他要我帮他把物业卖掉。我及时完成了这最后的任务，这份工作也就告一段落。）


    重点是我在没有任何恶意的情况下，构建了与他人的良好信任关系。我用几个月的时间与他沟通，在他的意识里构建了善良、有激情并且聪明的形象。在时机来'
