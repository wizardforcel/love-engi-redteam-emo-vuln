- pgno: 490
  md: '> “保罗·威廉姆斯。我和XYZ约了11点钟见面。”


    > “哦，亲爱的，你今天的运气不太好。这是ABC，XYZ在隔壁。”


    > “太不好意思了。你这么帮我，真是我的救世主。我现在得跑着去了，不然会迟到的。谢谢。”


    我微笑着走出了门，感觉非常好。因为我得到了一份干净的简历，同时还能远程操控该公司的网络。


    面部表情是我成功的唯一原因吗？不，根本不是。我的面部表情为我的故事增加了分量和可信度。如果表现得当，人们在看到这种表情后如实地感到悲伤和同情。


    对于使用悲伤这一表情的忠告是，当我们感到紧张时，可以做出悲伤或者恐惧的表情。但是当你要表现自己非常自信、蓄势待发时，却做出了悲伤的表情，就会释放出矛盾的信息。因此，要小心处理你的面部表情。


    # ## 分解


    悲伤是一种很复杂的面部表情。它包含很多组成部分。懂得如何观察、重现和表现这种情绪对于社会工程师来说是一个强大的能力。


    悲伤的情绪有以下组成部分。


    +   - 嘴巴张开，或者虽然不张开，但是嘴角会下拉，如图5-10所示。


    ![](img/9f6d2369b69b99fb89843058054e5812_490_0.png)'
  merge: -1
  img_proc: true
- pgno: 491
  md: '图 5-10　尽管嘴角只是稍稍下垂，脸颊只是微微上抬，也能清晰地表现悲伤的情绪


    +   - 在保持嘴巴姿势的情况下上抬脸颊，这个动作和眨眼的动作比较相似。

    +   - 当上眼睑下垂的时候要向下看，如图5-11所示。


    ![](img/9f6d2369b69b99fb89843058054e5812_491_0.png)


    图 5-11　即使面部其他地方没有任何表情，我们仍能从双眼中读到悲伤


    +   - 这些图片的另一个特点就是头会向下，前额会紧绷到有皱纹出现，如图5-11所示。

    +   - 此外，请注意在典型的悲伤表情中，眼眉的内角会皱在一起，形成一个V形（如图5-11所示）。艾克曼博士注意到只有少数人能有意地完成这些动作单元的组合。PK称这些人能够通过唤起同情而顺利地影响他人。他说演员伍迪·艾伦、内森·连恩以及图片中的阿玛雅都是能够利用眼眉表现悲伤的高手。


    在极度悲痛的情况下，嘴巴会张得更大，嘴角也会下撤。图5-10中呈现的悲伤情绪是很微妙的，然而我们依然能够观察到阿玛雅下垂的嘴角。


    有一点很重要，请务必牢记。那就是我们能清晰地从眼中看出悲伤的情绪。即使嘴唇并未向下，或者面部被衣物部分遮盖，我们依然能从眼中观察到情绪内容。


    如图5-12所示，表现悲伤情绪的一个难点是对眉毛的控制。在某些情况下，悲伤的情绪会以下列方式呈现：


    +   - 眉毛的内侧会上扬，而不是整条眉毛上扬；

    +   - 眉头会抬起，并向中间聚拢；'
