- pgno: 587
  md: '司在开始的攻击成功后变成了一个潜在受害者。在这个案例中，最初的受害者是塔吉特公司的 一家暖通空调（HAVC）供应商，它拥有塔吉特公司的网络证书。该供应商的一位员工收到了一封钓鱼邮件，然后他点击了邮件中会导致恶意软件加载的链接，恶意软件随后从承包商处窃取了他的登录信息。该承包商的网络和塔吉特公司的网络相连，用于账单和合同的递交等。现在还不清楚所有的攻击细节，但是攻击者最后进入了塔吉特公司的服务器，并攻陷了交易系统。


    > ⁶ Michael Riley, “Missed Alarms and 40 Million Stolen Credit Card Numbers: How
    Target Blew It,” March 13, 2014, http://www.businessweek.com/articles/2014-03-13/target-missed-alarms-in-epic-hack-of-credit-card-data#pl
    .


    > ⁷ Brian Krebs, “Email Attack on Vendor Set Up Breach at Target,” February 12,
    2014, http://krebsonsecurity.com/2014/02/email-attack-on-vendor-set-up-breach-at-target/
    .


    虽然对消费者造成的最终损失仍有待评估，但是塔吉特公司已经花费了2亿多美元以重印被盗取的信用卡——这还没有考虑日后可能发生的欺诈行为。总之，对于帮助人们意识到钓鱼攻击的危险性来说，这是生动而昂贵的一课。


    另一起值得注意的攻击是关于RSA公司的，你可能都不记得那件事了。现在提起RSA，人们首先想起的是始于2013年年底的与国家安全局有关的加密算法的事情。此事的影响远超过2011年RSA公司经历的攻击事件。⁸
    不同于塔吉特公司遭受的偶然性攻击，RSA公司所经历的看起来是一起针对RSA员工发动的攻击。显然，一封发给RSA低层员工的电子邮件中包含的恶意Excel附件导致了这一切（见图1-4）。


    > ⁸ Aviva Litan, “RSA SecurID Attack Details Unveiled—Lessons Learned,” April
    1, 2011, http://blogs.gartner.com/avivahlitan/2011/04/01/rsa-securid-attack-details-unveiledthey-should-have-known-better/
    .'
