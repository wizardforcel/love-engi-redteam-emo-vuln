- pgno: 528
  md: '已和她传递的信息没有自信。


    # 注意事项


    在做这个动作的时候，社会工程师要认真观察自己。当你感到不安的时候，就会变得很紧张。紧张会让你看起来死板、僵硬，这样一来，你既不能很好地微笑，也不能恰当地倾斜头部。因此，首先要观察自己的动作，然后确保你所表现的情绪与你的身份相匹配。


    此外，我知道我已经在本章说过太多类似的话，但是我不得不再次告诉你观察基准态的微妙变化有多么重要。因为这些变化就是“热点”。最近我的妻子和我讲述了她和朋友们的一次经历。当她对我讲述事情经过时，她是微笑和开放的。但是当我问她某个人的情况时，她交叉双臂，声音低沉下来，语气也僵硬起来。那一刻，我知道她们之间一定发生了什么。但是我也知道不能只是问“发生什么了”。


    我说：“你好吧？你看起来很不安。”


    “嗯……，”她在考虑是不是要告诉我，“是有一点，是这样……”之后我知道了整个事情的来龙去脉。时刻警惕交流对象的变化，因为这个变化能给你足够的信息去改变自己的肢体语言和交流方式，这样就能收集更多的信息。


    # 6.6　总结


    以下内容对人际交流有指导意义：非语言交流会影响他人对我们的看法，所以我们要明智地、谨慎地使用这些动作并多加练习。如果我们想让他人感到舒适和安逸，就要学着自觉地运用非语言交流。


    此外，还要注意那些对交流无益的消极或者不适的动作。它们可以用来支撑你的托词，但是要谨慎使用。


    注意舒适和不适的程度是解读非语言交流的良好开端。学习、使用并控制你的动作能让交流变得更好。更棒的是，这还会改变他人对你的看法。


    在结束本章关于非语言交流的内容后，我们还有一些未解的问题。这些问题主要集中在：这些行为是可控的吗？我们能精确地找到大脑中控制非语言行为的位置吗？在下一章我们会回答所有的问题，并介绍更多的内容。


