  md: '标相信了这件事，并且“愿意帮忙”，就会出现一个问题，而解决这个问题需要目标支付一定的费用。在付出费用之后，另外一个问题又会冒出来，需要支付另一笔费用。每个问题都是“最后一个问题”和“最后一笔费用”，但在几个月之后还会冒出新问题。整个过程中，目标不仅看不到一分钱，而且还会付出1万到5万美元。该骗局的惊人之处在于，过去报道过的骗局，有的采用官方文档、论文、书信抬头甚至面对面的欺骗方式。


    最近，此类骗局出现了一种变化，受害者会收到一张真实的支票。诈骗者承诺一大笔钱，谎称自己仅要其中的一小部分。如果目标汇出一小笔钱（例如1万美元），当收到承诺的支票时，他就可以兑现支票，留下其中的差额。有些案件中，受害者汇出了钱，但拿到的支票是假的，当他兑现支票时，会因兑现假支票而被处罚金。


    这种骗局相当成功，因为它利用了受害者的贪婪心理。谁不想用1万美元换得100万，哪怕只是10万美元呢？大部分聪明人都会这样做。当这些人收到来自“政府职员”寄来的官方文档、护照、收据时，他们会信心十足地尽最大努力来完成交易。承诺、一致和义务等观念在其中发挥了一定的作用。我会在后续章节中对这些特征进行详细分析，到时你会看到此种骗局如此强大的原因。


    # ## 2. 稀缺的力量


    [www.social-engineer.org/wiki/archives/Governments/Governments-FoodElectionWeapon.html](www.social-engineer.org/wiki/archives/Governments/Governments-FoodElectionWeapon.html)
    上的文章讨论的是稀缺的原理。


    当人们被告知，其需要或者想要的某样东西的供应量有限，且必须赞同某种观点或行为才能得到的时候，我们称这种情形为稀缺。很多时候根本不明确说明需要人们做什么，而是让他们看到行为“得当”的人得到了奖励。


    文章中讲述的是南非利用食品赢得选举的例子。当一些人或某个人不支持“正确”的领导人时，粮食会变得稀缺，工作也会被那些支持者“抢去”。人们发现这个问题时，很快就会转变成支持者。这是一种恶意的、带有伤害性的社会工程，但是其思路值得学习。当人们发现某样物品短缺，并且相信某些行为会导致自己得不到该物品时，他们通常会愿意做任何别的事以得到它。上例中使情况更糟的是，政府拿走一些生活必需品，然后造成“短缺”假象，仅仅提供给支持者——这是一种恶意但很有效的操纵策略。


