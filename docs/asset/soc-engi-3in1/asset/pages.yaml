  md: '如图6-2所示，我绘制了一个图表，显示社会工程师如何采用可视化方法，设计出利用“承诺和言行一致”方法获取信息的具体步骤。


    # 使用承诺和言行一致获取信息


    ![](img/9f6d2369b69b99fb89843058054e5812_212_0.png)


    图6-2 清楚地定义目标有助于你获得信息承诺


    如果让目标口头承诺采取特定的行为，就能够迫使目标掉入我们设定的圈套。恰尔迪尼说：“承诺和言行一致方法表明，作出决定时我们会承受来自他人和自身的压力，我们的行为必须与此决定一致。依据以往的经验，你会在压力下作出或好或坏的决定。”'
