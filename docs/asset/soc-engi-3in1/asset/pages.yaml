- pgno: 425
  md: '当我在第二重攻击中将自己伪装成技术支持代表时，我的声调要显得专业而不是紧张。即便目标对象看不到我的脸，但是他（她）能“听”到我的笑容。这个笑容有助于建立信任感。我的姿态也要让人感到权威。


    当我在第三重阶段假扮员工给技术支持公司打电话时，为了让我的说辞更可信，我的脸要表现出恐惧，音量、音高和语速都要更低、更慢。我的非语言行为必须要传递出这种信息：“对不起，我搞砸了，请帮帮我。”我通过改变面部表情来让情绪和身份匹配，进而让自己的托辞更为可信。


    甚至连我们的坐姿和着装也能影响到电话另一边的听者对我们语气的感知。在 social-engineer.org 第34期简讯（http://www.social-engineer.org/newsletter/Social-Engineer.Org%20Newsletter%20Vol.%2003%20Iss.%2034.html）中，我谈到了研究人员亚当·加林斯基进行的关于着装认知的实验。这个研究揭示了我们对于着装的感知会影响我们如何处理被要求去做的任务和工作。


    这个实验进一步证明了着装、非言语行为等会影响目标对象对我们语气的感知。正如前面所说的，由于心理原因，同样的衣服会因为受试者表现的不同而拥有另外的含义。因此，我了解到自己在工作中的穿着能够（也将会）对我的行事方式造成影响。


    # 2.8.3 我不是你想象的那种社会工程师


    在电话和网络间世之前，人们是需要亲自实施诈骗诡计的。从把埃菲尔铁塔卖了数次的维克多·卢斯蒂格到街头骗子，面对面行骗自古以来就是社会工程中常用的伎俩。


    近年来，在一个又一个的故事中，犯罪分子都在用着假冒的方法欺骗人们去做自己本不该做的事。比如，在美国，一个男人说服他的三兄弟去抢银行。在实施抢劫前，这个男人假扮自己是联邦便衣探员兼顾客进入该银行。当他的朋友开始抢劫时，他制止了他们的犯罪行为，挽救了整个局面。他对罪犯实施了“逮捕”，并拿走了所有的钱当作证据。当他带着犯罪分子和装着现金的袋子离开银行时，银行的员工认为银行恢复了安全。但是事后并没有警察到达现场进行跟进。


    为什么这样的攻击能够得逞呢？因为身份模拟能够和信任联系在一起。当某人带着徽章，穿着合适的制服，做出的行为也和他所说的身份一致时，我们的大脑就会对下列问题给出不言而喻的答案。


    +   - 这个人是谁？

    +   - 支撑他言论的证据是什么？

    +   - 我安全吗？


    当上述所有问题都有了答案，目标对象的心就安定下来了。这就是身份模拟的力量。在我讲过的关于库房的那个故事中，我不需要说出什么细节，因为我的制服说明了一切。'
