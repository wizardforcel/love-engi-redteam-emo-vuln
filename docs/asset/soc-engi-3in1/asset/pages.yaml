  md: '找什么托辞。也就是说有时情绪内容不仅会影响一两个人的情绪，还能影响一群人的情绪。


    即便你看到公司秘书对你笑得很真诚，也还要注意整个环境的紧张局面。这样能帮助你调和相匹的情绪或者更恰当地表达自己的情绪。


    作为社会工程师，当你能够牢记这些要点时，就能影响他人的决策能力。社会工程师的目标是创建一个容易触发共情的环境。正如我们所知，共情能够关闭大脑的逻辑中心。当逻辑中心没有火力全开时，正是我们提出要求的时候。在此可以引用纽约传奇脱口秀节目主持人乔·富兰克林的一句话来结束本节的内容：“真诚是成功的钥匙，如果我们能假装真诚，我们就成功了！”


    # 7.4 像社会工程师一样强行控制扁桃核


    在读到本书最后的部分时，你或许会好奇我们所讲的对社会工程有着怎样的意义。无论初衷是好是坏，都请记住社会工程师的目标是让他人做出行动。了解大脑如何决策会极大地帮助社会工程师促使他人按其所想做出决定。


    从个人角度来讲，我喜欢简化复杂的科学发现，以便更好地理解它们。强行控制扁桃核的基本方程式就是：（感官输入 > 共情）+逻辑中心关闭=强行控制扁桃核+提出要求。


    也就是说如果在激发对方的共情反应后提出要求，那么这个要求会更容易得到许可。我们该如何做到这一点呢？


    我们的大脑能够本能地反映出我们从周围环境观察到的情绪内容。因此，如果社会工程师能够表现出轻度悲伤的情绪，那么这种表现就会触发对方的共情心理。这种说法是合乎逻辑的。一旦共情心理被触发，并且社会工程师所说的话和讲述的故事能够联系在一起，那么大脑中的理性和逻辑中心就会立刻关闭。这就把处理大权全部交给了大脑的情感中心。所以当决策是基于这个请求而作出的时候，理性就被抛到脑后了。


    我曾为一家公司做过电话信息采集。我的目标是打电话给某个公司，然后让他们提供给我本不该提供的信息。


    在打其中一个电话时，我决定扮演该公司一个叫作吉姆的员工。我用“吉姆”的名字打了几个电话，并成功获取了关于该公司安全计划的一些信息和事实。


    我想继续我的游戏，所以我决定以吉姆的身份给技术公司打电话，看他们是否能够通过电话给我“我的”虚拟专网的证书。这通电话是这样开始的：


    > “您好，我是技术中心的苏·史密斯。有什可以帮您？”'
