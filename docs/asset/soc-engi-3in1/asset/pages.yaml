- pgno: 78
  md: '下面这个例子可能稍显突兀，但是我是塞萨尔·米兰（Cesar Milan，也称“狗语者”）的粉丝。我认为他是个天才。他可以与那些难以驯服的狗沟通。仅仅只需要几分钟时间，他就能让狗和其主人产生一种特质，从而让他们形成亲密的关系。他主要是教授人们怎样与狗沟通，即怎样通过狗可以理解的语言要求或告诉狗去做某事。他的理论中有一点我很认同，就是人的“精神”或活力会影响狗的精神或活力。换句话说，如果一个人走近狗的时候处于精神紧张且焦虑的状态，那么即使他的言辞显得很镇定，狗也会紧张、狂吠甚至具有攻击性。


    显然，人和狗是不同的，但我认为上述理论同样适用于人。当社会工程人员接近目标时，他的精神或活力会影响对方的感知。活力会通过肢体语言、面部表情、穿着打扮等各方面表现出来，语言只是一种辅助的表现方式。在不知不觉的情况下，人们就会有所感知。你有没有想过或者听别人说过，“那家伙似乎很猥琐”或者“这姑娘看上去很友善”？


    这背后的原因是什么？一个人的精神或活力会传递到你的“感知器”，这些数据会和以往的经历相关联，从而形成一个判断。判断会立刻形成，很多时候连自己都不知道。所以在进行诱导工作之前，必须使你的活力与所扮演的角色相匹配。如果你个性或精神特质不能使你轻易伪装成一位经理，那么就不要尝试去这么做。必须找到适合你的角色和切入点。就我个人来说，我只是一个普通人，强项不在化学或高等数学上。如果要参与化学和高等数学方面的对话，我不会扮演一个对二者十分精通的人，而是会伪装成一个只想随便聊聊天气的陌生人。


    不管你选择使用何种方法，都需要做一些准备工作，以期得到更好的结果。其中的一个步骤可以称为铺垫。


    # 3.2.1 铺垫


    排队买10美元一张的电影票时，会看到很多即将上映的影片的海报。等到你排队买40美元的爆米花和饮料时，会看到更多的海报，然后一路挤到自己的座位上。最后，电影正式开始前，还会放映一系列影片的预告片。有时，有些影片还没有开始制作，广告和预告片却已经到处都是，广告中可能会说“这是自……以来最有趣的影片”，或者随着一段恐怖的音乐响起，屏幕上烟雾弥漫，画外音提示“你认为‘少年杀手第45部’已经结束了……”
    ，极尽精彩之快。


    不管是什么电影，营销攻势都会告诉你如何去感受电影，换句话说，也就是在试映之前通过铺垫植入你应该对电影产生的看法。通过两三分钟的预告短片显示影片的概貌，让你产生看这部电影的意愿，并且呼吁那些想看喜剧片、恐怖片或爱情片的人前去观看。'
  merge: -1
  img_proc: true
- pgno: 79
  md: '虽然之前关于铺垫的文章不多，但这是一个严肃的课题。铺垫意指你可以按照它说的做——通过植入的信息或观点影响目标对特定信息的反应。铺垫常用于营销信息中，例如一些全国性连锁餐馆会通过广告展现人们微笑着享用美食，食物看起来精致而完美。当画面中的人说“太好吃了！”或者“哇噢！”的时候，你似乎也能感觉到其中的美味。


    当然，社会工程人员不能通过商业广告来影响目标，那么如何在社会工程过程中应用铺垫技术呢？


    在大多数社会工程应用中，你得从最终结果出发，确定开始时应该做哪些准备工作。你的目的是什么？你诱导的一般目的可能是获取对象工作项目的信息，或者他在办公室/度假的时间。不管是什么，必须首先设定目标。接下来要决定你要问何种类型的问题，然后才能决定如何植入一些前期信息，诱使对方给出你想要的答案。


    例如，晚上你想要去某个地方吃牛排，但是喜欢使用折扣券的妻子并不喜欢那家餐馆，而你却时时刻刻想着那些肋眼牛排，此时就可以通过意念植入来影响对方。早晨你可以无意中说起：“亲爱的，你知道我在想什么吗？一块大大的、鲜嫩多汁的烤牛排。前几天我开车去邮局，看到邻居弗雷德将烧烤架放在路边，用木炭烤牛排，香气从车窗飘进来，从那以后我就一直想吃牛排。”这个时候，妻子对这个诱导有没有反应并不重要，你已成功植入了一个思想的种子。她会设想牛排在烤架上滋滋作响，然后你接着说烤牛排的过程，说弥漫的香气，说自己有多么想大快朵颐。


    如果接着你带了份报纸回家，浏览中发现有目标餐厅的广告，上面有折扣券。只要将折扣券页面折叠放在桌上即可。当然，你的妻子可能看到，也可能没看到。但是，因为你把它和信件放在了一起，之前提到了牛排，而且她喜欢折扣券，所以桌上的折扣券会引起她的注意。


    过一会儿，她可能会过来问你：“今晚想吃什么？”这就是你之前一系列铺垫工作所发挥的作用——你提到了飘香四溢、鲜嫩多汁的牛排及自己的渴求，你将目标餐厅的折扣券放在桌子显眼的位置上，现在是晚餐讨论时间。你可能会回答：“今晚如果在家吃的话，你不仅得做饭还得花时间清理，我们已经有段时间没去XYZ牛排馆了，今晚我们去那里如何？”


    因为你知道她不喜欢那个餐馆，所以希望之前的铺垫工作能发挥作用。她回答道：“我看到报纸上有那个餐厅的折扣券，第二份半价，但是你知道我不喜欢……”'
  merge: -1
