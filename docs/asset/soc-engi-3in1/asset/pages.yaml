  md: '象，就是在艾克曼博士和莫林·奥沙利文博士关于评估信用和识别骗术的测试中，被称为“真相奇才”的那部分人。这些“奇才”大约有50位。他们是15 000名受试者中成绩靠前的三分之一的人中最终胜出的百分之一（99.666个百分点）。这些人在测试中的准确率（80%起）明显高于平均水平（53%）。为了确保本书是建立在科学的基础上，在本书的写作过程中，PK和我进行了密切的合作。此外，当我们遇到一些问题的时候，我们会向艾克曼博士提出这些问题。他能帮助我们不偏离主题。


    在与PK的多次谈话中，他都谈到了解读表情的力量。不过，和艾克曼博士一样，他也提出了同样的注意事项——我们观察到表情不意味着能马上知道该表情产生的原因。正如PK指出的，微表情并不能回答该表情产生的原因，但是通常能够引导我们找到该问题的答案。艾克曼博士仍在各行各业的人群中寻找像PK那样的人，同时也在继续他关于这些人的基本情绪和表情的研究。


    为了进一步帮助我们完成本书，艾克曼博士将我们在寻找的情绪分为7种基础情绪。这些情绪都是跨文化且通用的。每种情绪都有对应的表情和无意识的短期肌肉运动。它们是：恐惧、惊讶、悲伤、轻视、厌恶、愤怒和开心。本章会通过诸多实例详细介绍每种情绪。除此之外，你还会读到一位老兵真相奇才的故事。他的故事会巩固我们的论点，并为我们呈现社会工程师如何学习使用这些技能。


    # 5.2 什么是真相奇才


    在真相奇才的项目中，奥沙利文博士和艾克曼博士对15 000多人进行了测试。最终，他们只找到50位在谎言识别方面远高于平均水平的人。这种能力包括观察、识别和解读面部表情（不久后，艾克曼博士证明识别微表情是随时可以习得的技能）。这一小部分人使得只能有少数人参与研究。遗憾的是，奥沙利文博士在她关于真相奇才的作品出版前去世了。在一次采访中，她形容他们“好像奥林匹克运动员”。奥沙利文博士曾说：


    > “我们的这些奇才们是非常特别的，他们能够敏锐地捕捉到面部表情和肢体语言以及说话和思考方式的细微变化。虽然他们天赋异禀，但是仍会不断练习并且特别谨慎小心。他们往往是有一定生活阅历的人，且年纪稍长。”


    （www.eurekalert.org/pub_releases/2004-10/ama-lad100804.php）艾克曼博士记录道：“我们一直在尝试发现他们是如何学习这项技能的。他们是测谎界的莫扎特吗？这是他们与生俱来的天赋吗？”（www.onthemedia.org/story/131287-the-face-never-lies/transcript/）


    保罗·凯利就是这些人中的一员。他曾供职于美国特勤局，在美国特勤局研究院担任课程总监和高级导师。他还是美国国家安全局密码学校的兼职教授。他有着与各类人士打交道的丰富经验。对我来说，认识艾克曼博士并和他共事，还能就本书的这部分内容对他进行采访都让我感到荣幸之至。


    在我们的讨论中，我想首先确定宏表情和微表情的区别。PK让我认识到除了持续的时间（微表情持续的时间非常短，只有1/5到1/25秒；宏表情可以持续2到4秒）外，它们的'
