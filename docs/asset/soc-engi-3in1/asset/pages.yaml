  md: '![](img/9f6d2369b69b99fb89843058054e5812_500_0.png)


    图 5-20  愤怒的典型表现


    我能看出这位男士很生气。我拿出电话，假装自己在打电话。之后我放慢了脚步，以便能够听到那位男士在说什么。


    我偷偷听到他仿佛是和供应商发生了一些小的争执。这对我来说是个改变托辞的好机会。从他的话语中，我得知和他通话的供应商是制作考勤系统的。我进了门，直奔前台，说道：“您好，我是保罗，来检查你们的考勤系统。你们的老板告诉我你们和供应商有一些重大分歧，现在需要一个更有竞争力的报价。能告诉我在哪儿检查服务器吗？”


    前台带着我穿过一扇锁着的门，进入了服务器机房。他对一名信息技术人员喊道：“罗伊，保罗需要进去检查考勤系统。他会处理好所有的问题。”'
