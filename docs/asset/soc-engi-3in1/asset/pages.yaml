- pgno: 169
  md: '或许没有任何技能像聆听那么有学问。聆听是社会工程过程中的主要部分。你必须意识到听到和聆听之间存在着巨大的区别。


    一般认为，人们对于听到的东西连一半都记不住。这意味着如果你对一个人讲10分钟话，他只会记住你所说的几分钟的内容。虽然这就是人们生活中的常态，但对社会工程人员来说，这是不可接受的。


    人们通常认为，决定社会工程人员取得多大成功的通常是目标所说的很细微的东西。这个领域可以极大地提高你的聆听技能，不仅仅是听到说话的内容，而且包括说话的方式、时间及所蕴含的情感。所有这些因素都可以帮助你感知述说者所传递的信息。


    成为一个好的聆听者听起来很容易，但是当气氛很紧张，你的最终目的是进入服务器机房，而你在听出来抽烟的几个员工（你想跟着他们进到大楼里）的闲聊时，要做到真正的聆听是很难的。


    然而这正是需要认真聆听的时候。或许苏珊开始抱怨她的上司——人力资源部经理琼斯先生。她讲述最近他对她是多么地粗暴无礼，她已经受够了这样的日子。然后烟友贝斯说：“好吧，你应该去会计部看看，那里也到处都是笨蛋。”


    或许这听起来只是两个疲惫不堪且极为恼怒的员工在喋喋不休地抱怨。是否还有别的信息泄露出来了呢？你能听到她们的名 字、主管的名字、所在部门的名称以及一些员工的日常举止和行为。如果之后要提供被允许进入该办公楼的证明，这些信息就大有用武之地了。


    通常一个人讲话的方式可以透露很多信息，但是要将这些信息运用到实践中则需要多听。这个人是生气、沮丧还是开心？他的语速是加快了还是变慢了？他的情绪是越来越激动还是逐渐平静？关注这些方面有时可以告诉你很多弦外之音。


    那么如何成为一名优秀的聆听者呢？


    接下来的步骤有助于完善聆听技能。这些建议不仅在社会工程中有帮助，在日常生活中亦是如此，当把它们应用于社会工程审计中时，过程和结局会有很大的不同。


    +   1. 集中注意力  高度关注目标对象。不要鼓捣你的电话或别的小东西。不要拨弄或者敲手指。在对方说话时看着对方，将注意力集中在对方所说的内容。要充满好奇地去听、去看，不能让人感觉害怕，觉得你是在“刨根问底”。'
  merge: -1
  img_proc: true
- pgno: 170
  md: "尽量不要提前思考，不要急着去策划下一步反应。如果你在计划下一步反应或者想着辩驳，就不能集中注意力了，就可能错过一些重要的东西或者给目标留下你并不是真的关心的印象。这个很难去控制，所以对大多数人来说改掉这个习惯会花费很多工夫。\n\
    \n同时，尽量不要被环境因素影响。背景中的噪音或者一串笑声会转移你的注意力，不要允许这样的事情发生。\n\n最后，还要密切关注说话者的弦外之音。肢体语言、面部表情和其他一些交流时流露出的信号也要注意“聆听”。\n\
    \n+   2. **提供你在聆听的证据**　表现出真诚并且用肢体语言和面部表情来表明这一点。不时地点点头，不用太频繁，但是要足以让对方知道你在听。你当然不想成为只会机械点头的玩偶，但是你要让目标知道“你在听”。\n\
    +   \n+   不要忘记十分重要的微笑。微笑可以让目标对象觉得你在和他真诚地交流，并且知道他在说什么。如同之前所提到的“集中注意力”一样，要在合适的时候加入一些微笑。如果人家告诉你他的狗刚刚死去，那么点头微笑对你来说就没什么好处了。\n\
    \n+   3. **提供有价值的反馈**　个人信仰和经验的差异会过滤掉一些信息，这点再普遍不过了。如果是这样的话，你可能“听不到”对方在说什么。\n+ \
    \  \n+   确保所问的是相关的问题。如果他在讲述蓝天，而你问“到底有多蓝呢？”是不会有作用的。你的问题必须表现出你在积极地聆听，并且有很强的欲望去获取更深入的理解。\n\
    +   \n+   时不时地重述或者概括你所听到的东西就很管用。不要像做读书报告那样去背诵，而是要简明地概括主要想法，这样会使目标感觉你听进去了。\n\n\
    +   4. **不要打断对方**　这一点不用多说。打断对方的讲话显得你不顾及他的感受，并且会扰乱说话者的思绪。让他完整地述说后你再发言会更好。\n+  \
    \ \n+   然而，有时候打断确实很有用，或者不失为一种策略。电影《潜行者》（*Sneakers*）中就有类似的情节。当罗伯特·雷德福（Robert Redford）试图进入一扇大门时，他与门卫就一些快递的东西发生激烈的争论。他曾经这样干过几次，最终促使看门人示弱，让他在没有得到授权的情况下进去了。如果你认为对你有益，打断对方说话也可能是个好方法。但是大多数情况下并非如此。"
  merge: -1
  img_proc: true
- pgno: 171
  md: '# 5. 适当地反应


    这是区分聆听技巧好坏的分水岭。如果你专注于反驳或者下一个观点，或者在想刚才经过的金发美女，那么还是赶紧闭嘴吧。


    有一次培训一组人，我在跟他们详述操纵战术的一些方面。我看出有两个家伙根本没在听，于是随节省了一句话：“然后在350度的高温下，把一只狮子烤15分钟，它就脆了。”其他人哄堂大笑，然后我转向他俩其中之一说：“你觉得如何呢，约翰？”他立马愣住了，并且结结巴巴地说：“嗯……是的，听起来不错。”


    永远不要对目标那样做。这是对融洽关系的致命打击（本章后面会对此进行详述）。务必保持尊重，注意自己的情绪，在和目标交谈的时候务必时时作出适当的反应。


    集中注意力、提供证据、提供积极的反馈、小心翼翼不要去打断对方及作出适当的反应，这些都是聆听时决定成败的关键原则。它们在长时间的社会工程会面中尤其重要，比如当我不得不某商务会议中和一位先生会面时，我将“会面”地点设定在吧台，与他谈论生意上的东西。我想要的很多信息会在看似平常的谈话中不经意地被泄露出来。一定要在家里或办公室里训练这些技巧，让它们能在这种谈话机会出现时派上用场。你需要把好的聆听技巧变为本能，而不需要绞尽脑汁地去想。


    在聆听过程中，另一个必须要考虑的因素是你个人的情感。比如我是在一个非常严厉的意大利宗教家庭里长大的，从小就被教育要尊重女性，想到有一次我用一个轻蔑的方式称呼妈妈就不寒而栗。告诉你吧，我被狠狠地教训了一顿。多年后的一天，我和一位先生交谈，并且尽力想从他那里得到些信息。我在一次社交活动中接近他，并聊了起来。他开始用一种非常不当的方式谈起一个女同事。受成长环境的影响，我的内心极为愤怒。我狠
    represent地压制着怒火，但是愤怒肯定还是体现在了我的脸上和肢体语言上，这导致了我的失败。从这次失败中，我学到了很重要的一个课：在社会工程需要聆听的场景中，你必须极力压制那些内心的成见，以免影响你取得成果。


    同样，要记住对信息而不是对人作出反应。如果你不赞同一个人的信仰或立场，给他足够的面子，可以使对方感觉跟你相处非常舒服。甚至在不赞同时，你可以聊聊别的来转移注意力。举例如下。


    目标：“这个工作糟透了。工作时间安排得很糟糕，而且工资也很少。”


    你：“听起来你已经受不了这里的工作了。”'
