- pgno: 688
  md: '曾经我在安全会议DerbyCon上有个特别好的机会来使用一个趣味版的测谎仪。我们首先会问一些特别尴尬的问题，然后看被测者是说实话还是说谎并逃避。测谎者首先要设置一条基线——也就是说，测谎者要先问一个不可能撒谎的问题来看看被测者的真实反应。我们的基线问题是：“这间房里的灯亮着吗？”


    这条基线的作用是帮助测谎者了解当一个人说实话时的心跳速度、呼吸频率和出汗量。当测试开始时，可以通过基线来衡量其波动程度。


    成功的钓鱼培训项目都始于基线。但是你该如何为钓鱼攻击设定基线呢？这里有两种理论：“警戒线”和“出人意料的钓鱼攻击线”。


    # 警戒线


    第一种设置基线的办法是告诉员工你正在进行钓鱼攻击项目并发出警告。大体上，你要宣布开始进行钓鱼攻击，并解释你的目的是为了给公司和个人营造更安全的环境。你会以某段时间为间隔，给他们发送钓鱼邮件。


    建议你甚至可以告诉他们你想要他们采取什么行动：


    +   - 识别钓鱼邮件

    +   - 报告钓鱼邮件


    当这种提前警告的信息在公司里传播开来，将会产生很大的影响，它能帮助员工了解接下来会发生什么以及该如何应对。


    # 出人意料的钓鱼攻击线


    第二种开展钓鱼攻击培训的方法更激进一些。这种情形下你不需要事先警告然后再设定基线。你在没有任何提示的情况下发送钓鱼攻击邮件，然后看看结果如何。


    为什么有些人会选择这种方法呢？因为这种方法提供了最清晰的情况，可以看到员工面临真实世界的钓鱼攻击时的反应。


    另一些人选择提前警告他们的员工，因为他们想让员工在每次教育机会中都能有最佳的准备以抵御钓鱼攻击。


    哪种方法更好？老实说，我不能给你答案。这取决于你们的企业文化、员工、经验，以及很多其他因素。'
