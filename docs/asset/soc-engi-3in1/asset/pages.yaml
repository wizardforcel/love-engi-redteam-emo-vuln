  md: '# 7.1.3 PhishMe


    PhishMe（http://phishme.com）是一种SaaS解决方案，利用浸入式教学法来对员工进行识别和规避钓鱼攻击的培训。通过使用PhishMe，组织机构的所有员工都被置于真实的钓鱼攻击体验中。此外，员工可使用PhishMe
    Reporter（http://phishme.com/productservices/reporter）来报告可疑的钓鱼攻击，从而为安全机构和应急反应小组提供实时威胁情报。高级报告能力可以为每个单独项目分别追踪用户和群体行为，并根据时间统计回应的趋势。利用报告功能，你可以提供证据来说明组织机构内易受攻击的部分和安全行为管理的进展。


    # 优点


    +   - **程序化的方法。** PhishMe并不提供一次性评估工具，而是帮助组织机构建立可持续的培训项目，并依据其企业文化和商业需求来进行个性化设置。

    +   - **真实的情景和内容。** 为了紧跟最新的钓鱼攻击趋势并让内容贴近现实，PhishMe一直在更新内容，并会通知组织机构的信息安全人员最新出现的威胁。

    +   - **主动报告。** PhishMe的专利产品PhishMe Reporter是一种邮件插件，它允许用户以一种标准化的格式主动汇报可疑邮件给安全机构或者应急反应小组。用户的报告会为钓鱼攻击的早期侦测提供一种新的消息来源，也为衡量培训效果提供了另一种方式。

    +   - **标杆分析。** 组织机构可以使用系统化的训练，并在匿名情况下与其他PhishMe用户的训练结果进行对比。此外，组织机构还可以拿自己的结果与同一行业的竞争者进行对比。

    +   - **企业级平台。** PhishMe提供的SaaS解决方案在专门的安全设备上运行。在美国，它们运行在经过SOC 3认证的专门设备上。在欧洲，它们则运行在符合欧盟ISO
    9001和27001标准或者其他相关隐私规定的设备上。


    # 缺点


    PhishMe拒绝提供其产品的缺点。


    # 屏幕截图


    图7-8到图7-10展示了PhishMe的屏幕截图。'
