    # 2. 使用工具


    前面概述了一些不同类型的录音录像设备，但问题依旧是应如何使用。使用录音和摄像设备的基本原则与使用社会工程师手中的其他工具（如伪装或诱导）是一样的。


    最重要的还是练习。如果不能确定放置体载摄像机或录音设备的合理位置，最后可能只录到了天花板或者一段模糊的声音。准备并调校要携带的装备，并把摄像机和录音器放在适当的位置是很有必要的。试着坐下、起立、走几步，看看这些动作会不会影响音频和视频的质量。


    从专业社会工程师的角度出发，我必须再次强调合同中列出录音录像权限的重要性。如果没有合同许可，你可能会陷入法律困境。查阅当地的法规，确保使用这些设备不会惹来麻烦，也是个不错的主意。


    社会工程师绝对不能使用这些设备故意去记录他人的窘态或窥探别人的隐私。


    关于这个主题的讨论可以一直持续下去，希望本节对这些工具的概述及其使用方法的介绍能为社会工程师打开一扇选择的大门。


    下一节中，将给出社会工程师可使用的另外一些工具的例子。


    # 7. 1. 3 使用GPS跟踪器'
