  md: '![](img/9f6d2369b69b99fb89843058054e5812_531_0.png)


    图 7-1　扁桃核是大脑中的一个小的部分，负责处理情绪


    另有研究表明扁桃核拥有致密神经核，用于处理所有形态的输入或感觉。从本质上来说，我们所有的感官输入都会经过大脑的这个区域，然后再投射到不同的脑区。


    1992年，研究员D. G. 阿马拉尔在他的研究中称：“扁桃核在很多脑区都有投影，包括脑干、下丘脑、海马区、基底神经节以及大脑皮层区域。”这些区域都会参与我们情绪和反应的处理。


    # 扁桃核如何处理信息


    日本东京大学的佐藤亘曾发表了一篇非常优秀的论文，名为“扁桃核在情绪信息处理方面的作用”。他将扁桃核的处理作用进行了分类，并分析了该处理过程对我们的感官输入及输出的影响。


    论文中还提到了关于如何在某人对刺激物无意识的情况下探得他的情绪。为了证明这一点，河内山佐藤在2004年提出了病人的视野会单方面下意识地接收消极的（气愤）和中'
  merge: -1
  img_proc: true
- pgno: 532
  md: '性的情绪（没有情绪）。他还发现相比于中性情绪时，当病人处于消极情绪时，其皮肤电反应会较强。


    该研究和其他著作表明扁桃核对情绪的处理是无意识的，并且会受到感官输入的影响。H. 欧雅博士在2002年进行了一项名为“人类扁桃核的电生理反应”的研究，研究表明扁桃核会在刺激物出现后的50至150毫秒内被迅速激活。因为有人提出视觉皮层激活大概需要200至300毫秒，所以扁桃核的快速活性可以证明其对情绪的处理是下意识的。


    作为一名社会工程师，我发现研究成果的结合着实引人入胜。我对此的理解是在个体开始思考如何处理线索前，我们的大脑（扁桃核）就会下意识地在刺激物出现后开始处理过程。获准进入美军驻阿富汗的战斗部队进行采访，作家塞巴斯蒂安·荣格尔在他的书《战争》中对扁桃核进行了一系列描述。书中指出扁桃核能够在15毫秒内处理听觉信号。虽然这个处理速度很快，却只能触发一个需要思维去捕捉的映像。他还指出扁桃核需要一个负面的经验去判断什么是威胁。这些刺激物包括面部表情、着装和视觉线索，以及声音、气味和其他感官输入。


    上述诊断表明优秀的社会工程师需要对目标对象有充分的了解。要知道他喜欢什么、不喜欢什么、习惯是什么，问题是什么，等等。这能帮助社会工程师避免消极的，或者对目标对象来说是冒犯的相貌、表情或者着装风格。对信息的掌握还能帮助社会工程师知道自己该说什么、不该说什么。


    如果这一切都是真的，那么一定有方法可以强行控制别人的扁桃核。这样就能创建我们想让他表现的情绪内容，也就是说通过影响目标对象的情绪，让工作变得更轻松。


    # 7.2  强行控制扁桃核


    假设你现在正失意地坐在办公桌前，工作堆积如山，一眼望不到头。因为预算削减，团队成员不断辞职。此时电话响了，你当天还有三个会要开。你的配偶发消息说车也需要修理。邮件不停在响。同事告诉你之前发送的报告有错误数据，需要立即更正，而且之后不能再这样草草了事。之后你点击“回复”，以简洁但愤怒的语言向他做了解释。就在你点击“发送”后，顿时觉得周身放松，不过紧接着还有些担心。你找到“已发送文件夹”，看了看刚才写的邮件，忽然觉得是不是要跳出窗口才能让一切顺利点儿。


    发生了什么事？这就是研究人员称之为强行控制扁桃核的现象。当情绪处理器（扁桃核）加足马力，逻辑中心处理器（新皮质）近乎关闭和阻断。肾上腺素、荷尔蒙水平以及血压升高，同时我们的记忆开始变得低效。我们开始失去高效交流的能力，决策方式也开始进入“自动驾驶”模式。


    一组来自凯斯西储大学的研究人员进行了一些测试来看上述情况是否属实。他们征募了45名大学生，并要求他们在一个核磁共振机内待十分钟，先后接受五组实验。研究人员向他们随机展示了20个书写问题和20个视频问题，这些问题需要他们考虑其他人的感'
  merge: -1
  img_proc: true
- pgno: 533
  md: '觉。之后受试者收到了需要用物理学来解决的20个书写问题和20个视频问题。在每次提问后，他们需要在7秒钟内做出回答。两组问题之间有一个27秒的休息时间，同样，两组实验之间也有1到5秒不同的延迟时间。


    测试的结果很奇妙。当学生们被要求回答和解决能触发同情的问题时，负责分析的脑区失效，但是负责社交的脑区开启。当受试者处理物理和逻辑问题时，脑区中与同情相关联的部分失效，但是分析网络开启。当他们处于休息状态，没有任何问题提问时，两个脑区会同时开启，以便他们能够同时使用负责分析和负责道德/社交的脑区。


    这对社会工程师来说意味着什么呢？触发或者强制控制负责情绪、同情或社交的脑区，能够让人们失去逻辑思考的能力。


    骗子们就一直深谙此道（即使没有科学指导）。他们之所以会利用自然灾害、奄奄一息的孩子、疾病和其他能够触发情感的手段从受害者那里获得不义之财，原因正在于此。这些方法十分奏效。当一个故事情节能够触发人们的同情反应，人们就会失去理智，交出钱财。


    社会工程师也是同样。许多社会工程师都会利用悲伤、恐惧和其他情绪从目标对象那里骗取信息、行动或者钱财。


    让我们来回想一下第5章的一个例子。我的目标是利用存有流氓软件的USB钥匙潜入一个机构。当时我穿着套装，拿着被咖啡浸湿的简历走进了那个公司。之后我问前台工作人员是否可以在面试前让我用电子钥匙重新打印简历。当我走向前台时，发生了什么？看门人（前台）需要处理以下外部刺激：


    +   - 这个人是谁？

    +   - 他想做什么？

    +   - 我要怎么回应？


    这些问题会进入她的处理中心。我得强行控制她的处理中心，并关闭她的逻辑中心。这时，我的故事就派上了用场。因为我表现出了悲伤和关心，所以她的扁桃核对外部刺激，也就是我的故事和面部表情进行了处理。之后她的同情中心被触发，逻辑中心关闭。最终她仅用负责社交的脑区处理了我的请求。


    我发现有一些研究彻底改变了社会工程师强行控制扁桃核的能力，具体描述如下。


    # 7.3 人类所见和所为


    一群来自美国西北大学和威尔士班戈大学的研究人员（李、辛巴格、布恩和帕勒）合力完成了一篇论文，论文名为“从无意识情感表情和特质焦虑的影响中获得情绪启动的神'
  merge: -1
  img_proc: true
- pgno: 534
  md: '经和行为证据”。


    正如论文摘要中所说的：“通常人们无意识获得的情绪信息会影响人们的情感判断，但是影响这些因素的神经机制及其在感知威胁方面的个体调节差异仍是未知的。我们通过记录大脑在看到快乐或恐惧的面孔30毫秒后再看惊讶的面孔时的脑电位来研究阈下情绪启动。”本质上，李和其他研究人员是想看大脑是否能够下意识地识别非语言交流并作出反应，或者允许它们影响大脑的决策能力。


    首先，他们根据莱科里和格斯纳德（2001，2005）的研究设定了一个基准态。该研究推断人类拥有一个不断审视环境刺激的自动系统。换言之，这个系统会寻找触发人们理解周围世界的非语言反馈。


    这个推断就能解释为什么我们有时会在一些情况下毫无来由地感到不安、紧张，甚至恐惧。我们大脑的“雷达”会感受我们周围的环境，并观察他人以非语言形式表现出来的愤怒、恐惧或其他消极情绪。这会触发我们的感觉，让我们保持警惕。


    研究人员之所以要向学生展示惊讶的面孔，是因为惊讶的情绪可能来源于积极的经历，也可能是因为消极的经历。这些研究人员“推断惊讶情绪的歧义表示对于下意识的开心或恐惧面孔（在惊讶的面孔之前展示的面孔）带来的影响比较敏感”。他们研究了70个不同的人的140种惊讶的面孔，7种开心的面孔，还有7种恐惧的面孔。


    李和其他研究人员将学生们安置在一个光线昏暗且隔音的房间里。学生们面对着屏幕，通过内部通话装置进行交流。在展示一个恐惧或者开心的表情30毫秒后，每个学生会看到70张惊讶的面孔。每个面孔的展现都是随机的，每个学生看到的面孔也都不尽相同。学生们需要给每张惊讶的面孔定级，如“非常积极”“中度积极”“轻微积极”“轻微消极”“中度消极”或“非常消极”。


    正如论文第101页所述：“在看过恐惧和开心的面孔后，人们在对惊讶面孔的评级方面表现出了显著的差异。”换句话说，研究人员发现，基于持续30毫秒的开心或恐惧的面孔展示，人们对于惊讶面孔的评级会更多地趋向于要么积极要么消极。


    尽管和艾克曼博士一样，帕勒博士始终强调我们不能过度解读人们为什么会产生某种感觉的原因，但同时他也指出：“解读微表情的能力能够让观察者更善解人意，对于他人的真正意图和动机也更敏感。”


    我们在第1章中提到过“视觉悬崖”的实验。该实验证明，非语言交流从婴儿时期开始就在对既定情境的反应中扮演着重要的角色。这对于社会工程师来说至关重要。我们会在下面的部分介绍3个相关原因。


    # 7.3.1　解读他人的表情'
