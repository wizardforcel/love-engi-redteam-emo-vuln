  md: '人自己有一种糟糕的感觉，因为他要进去开除一些人。从他的语气中可以判断出他是在与妻子或者女朋友通话，而且他对这项工作任务比较排斥。


    我经过他的身边走向前台，在这过程中我发现前台的女孩正在玩扫雷游戏。当我走近时，她以标准的口吻问：“请问有什么可以帮您？”她脸上有一种无聊的表情，似乎心不在焉。我说：“嗨，我是来开会的，你的老板马上要进来，并且心情很好……”此时我压低了声音，拿着一个文件夹站在那里。几秒钟后老板走进门，我大声说：“多谢你的帮助。”


    她看着我说：“请稍等一下，先生。”然后对她的老板说：“早上好，史密斯先生，这边有您一些东西。”然后在他经过的时候递给他一小叠纸。


    在老板进入办公室后，她多次感谢我。她很清楚我刚才帮了她大忙，因为我提供的信息对她来说是无价的，所以接下来的话就变得很有分量：“我需要你帮个忙。我想见见人力资源部经理，你能让我尽快见到她吗？”


    她将我带进经理的办公室，并且在门口介绍我是“她的朋友”。几分钟内我的计划就成功了，这都是回报带来的好处。


    作为社会工程人员，寻找适当的小机会送出一些信息，会突显你在接收者眼中的价值，更重要的是让接收者感激你。


    仔细观察周边环境，看看能为目标做些什么事情，让他们感激你。谨记，不需要是什么一鸣惊人的事情，只要对他们有价值即可。要谨记的诀窍就是不要让对方感觉“不寻常”，紧时战术或者迫不及待的行为只会带来厌恶感。要很自然地应用这些原则。


    自然的含义就是可以在日常生活中开始应用这些原则。为人们开门、保持礼貌并寻找可能帮助他人的机会。这些行为会成为你的第二天性，这样在社会工程审查活动中做起来就很自然。


    回报是一个强大的影响战术，下面讨论的两个原则与其密切相关。


    # 6.2.2　义务


    义务就是基于社会、法律和道德要求，以及责任、合约或者承诺，人们认为必须做某件事。在社会工程中，义务与回报紧密相关但又不限于回报。如果你为别人开了外面的门，对方通常会为你打开里面的门，义务有时就是这样简单。不过义务也可以扩展到别人向你提供一些私人信息，因为你让对方觉得这样做是他们的义务。当目标是客户服务人员时，通常可从义务入手进行攻击。'
