- pgno: 501
  md: '以上就是一次因为观察到愤怒情绪而让我取得成功的经历。还有一次不那么成功的交流经历。当我和一位目标对象交流的时候，他开始贬损他的一位女同事。听到这，我感觉自己变得有点激动。他也一定是察觉到我露出了和图5-20类似的表情，因此终止了谈话并走开了。尽管很难做到，但是社会工程师需要在交流中抛开个人感觉和偏见，让目标对象自由地表达自己的观点，无论他的观点是否和你相左。


    一次，我有机会采访一位执法审问者。他向我讲述了他逮捕一名嫌犯的经历。那名嫌犯因为偷窥女性的卧室来自娱而受到了指控。他有牛仔靴恋物癖，所以一旦女士有那样的靴子，他的激情就被点燃了。


    一些办案人员想让他认罪。我们几乎都能想到那样的场景——办案人员用拳头敲着桌子或者作出威胁状。但是这些愤怒的表现并没能让那个嫌犯开口。之后，我的朋友走了进去，安静地坐下，脸上既没有愤怒，也没有厌恶。他开口说道：“我也喜欢女人穿牛仔靴。我最喜欢天然棕色的靴子。”


    看了他几眼后，嫌犯开口大声说：“棕色？看到红色靴子后，你眼里还容得下其他颜色吗？”


    从那之后，谈话得以顺利进行，那个嫌犯对其所有罪行供认不讳。社会工程师要努力不让自己的脸上呈现愤怒情绪的痕迹。因为愤怒会带来自已的主观感受，给工作带来灾难性的后果。


    # 分解


    在愤怒的情绪下会发生很多事。想想当你生气的时候会发生什么，是否会呼吸沉重或者变得紧张。这些都是正常的表现。我们的身体在备战，所以肌肉会紧张起来，呼吸会变得沉重，下巴会收起来以保护颈部，而双手也会握紧。


    此外，脸部能够表现很多紧张和皱眉的动作。做这些动作时一定要谨慎，否则你会看起来很愤怒。


    +   - 拉低眉毛，看起来好像要用鼻子碰到眉毛的内侧，如图5-21所示。'
