  md: '然艾瑞克谙熟此道。


    也许你还记得，框架的下一步就是诱导，即能通过精心构思的问题来套取信息或获得访问权限。艾瑞克套取信息的能力超群。在与警察通话的过程中，他通过诱导策略证实了自己就是所伪装的角色并且非常了解自己的“工作”。他知道行话以及必要的例行问题。事实上，不问那些问题反而会比问更可能引起警觉。这就是优秀的诱导策略的威力所在。


    艾瑞克早就知道他需要套取特定的电话号码去发起攻击。他没有解释自己为什么需要这一信息，而是使用了第3章中提到的假设性问题，简单地说：“我得知道答案，告诉我就好了。”这是强力诱导的另一个例子，你可以细致地分析他使用的方法，并从中学习到很多。


    大部分优秀的攻击同时也包括大量的伪装，这个例子也不例外。艾瑞克在这次攻击中设计了一些伪装，他必须多次转换身份才能达到目的。他伪装的执法部门的工作人员给人留下了深刻的印象（他做得非常好），但请牢记，这种行为在美国是严重的违法行为。你能从艾瑞克的社会工程过程和使用的方法中学到很多知识，但是在应用时必须小心谨慎。即使在付费的社会工程审查活动中，假冒执法部门的工作人员也是违法的。


    要了解当地的法律，这是经验教训，否则就不要害怕被逮捕。尽管实际上是合法的，你仍可以通过分析艾瑞克在攻击中的表现学到很多。他总是很镇定。当伪装成DMV工作人员时，他能够使用诱导技术来证明自己的身份。伪装成警察时，他的行为、声音和措词都支撑着他的伪装。对很多人来说，转换身份是极具难度的，所以在进行“直播”表演前最好多加练习。


    艾瑞克的伪装技术十分精湛，特别体现在伪装成DMV的工作人员和回应警察打来电话的时候。很多情况下，他可能会露出马脚，但最终似乎掌控得很好。


    社会工程中常运用到许多心理学方面的技能，比如眼神和微表情，本例中没有用到，因为这次攻击主要是通过电话完成的。但是艾瑞克确实应用了框架中的一些技术，例如关系构建、神经语言程序学以及思维模式。


    艾瑞克似乎是个建立关系的天才。他风度翩翩、平易近人，处理意外情况时泰然自若，能自信地伪装各种角色。他的声音和谈吐让电话那头的人完全有理由信任他。


    艾瑞克所使用的提问和交谈策略令人印象深刻，他甚至将这些技巧应用在了谙熟此道的执法人员身上。他成功地运用这些策略并在对方不知不觉中获取了他想要的所有信息。'
