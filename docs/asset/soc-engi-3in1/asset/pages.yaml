  md: '心态转变法（swish pattern）、换框法（reframing）、转变信念（belief change）、嵌套循环（nesting loop）、串联状态（chaining
    state）和次感元（submodality）的应用。


    在拿到心理学学位之后，班德勒和葛瑞德开始举办研讨会和群体实践，这为他们提供了训练和测试新发现的模式的场所，同时允许他们向参与者传授技巧。在此期间，一群具有创新思维的学生和心理治疗师聚集在他们周围，为NLP学术作出了宝贵的贡献，使得NLP更加完善。


    近年来，NLP成为了管理者的新流行语，使得这方面的培训人员、课程和专家群体快速增加。在没有管理机构的情况下，每个人都想学习控制他人、在撒谎时不会被拆穿，或者解决自己的心理问题，所以该领域不断发展。从业者没有执照，所以每个群组都教授他们自己的NLP形式和概念，并作为专家颁发自己的证书。所有这一切使得NLP给人们留下了糟糕的印象。


    抛开其坚实的历史因素，NLP的核心基础能够提高社会工程人员的能力。下一节将讨论NLP的一些核心准则，以便于你进行更深入的分析。


    # 5. 3. 2 神经语言程序学的准则


    20世纪70年代初，NLP就拥有一组学习和调查的准则，并由此产生了第一批书籍和“神经语言程序学”这一术语。随着时间的推移，约翰·葛瑞德和其他人在NLP领域不断作出贡献。“NLP新准则”是NLP发展的道德和美学框架。


    # 1. NLP新准则


    NLP的原始思想产生于20世纪70年代。随着时间的推移，约翰·葛瑞德开始认识到必须更新许多老的准则，以适应新的时代。他开始与格雷戈里·贝特森和朱迪思·德洛齐耶（Judith
    DeLozier）一起研究“新准则”，新准则更加关注人们思维和信念的产生以及信念的转变。扩展认识的学习技术、克服旧的思维模式以及改变习惯都有助于带来自我改变。


    新准则聚焦于状态、意识和无意识之间的关系及知觉过滤等关键概念，所有这些都指向人们的思维状态及其对那些状态的感知。这些新概念旨在推动和发展NLP，帮助NLP实践人员以新的方式思考NLP。新准则的许多基本原则现在已成为标准NLP课件的一部分。这一新准则可以通过阅读葛瑞德和德洛齐耶合著的《路途海龟：天才的条件》（Turtles
    All the Way Down）一书来充分地理解。该书是根据其研讨会“个人天赋的先决条件”的内容汇编而成的。'
