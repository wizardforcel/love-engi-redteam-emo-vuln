  md: '+   - 如图5-5所示，水平咧开嘴巴。努力让嘴巴发eek（发这个声音的时候嘴巴会向两侧水平咧开）的声音，就好像你刚刚看到了一只老鼠。这个表情会调动嘴旁的肌肉。


    ![](img/9f6d2369b69b99fb89843058054e5812_484_0.png)


    图 5-5 嘴巴向两侧咧开，嘴唇水平伸展开来


    +   - 在收紧上眼睑的时候抬高眼眉，露出虹膜上方的眼白。


    萨琳娜的额头和眼眉被她的刘海覆盖，这也让我们认识到重要的一点：即使脸部被部分遮挡，我们仍能通过眼睛和嘴巴清晰地观察到恐惧的情绪。


    在镜子前练习这些动作，之后观察出现的心理变化。如果你觉得这样复制恐惧的情绪有困难，可以站在镜子前，睁大眼睛，头向后仰，并发出eeeeek的声音。这样就会形成恐惧的嘴型。收紧的颈部会帮助你看到自己的样子并了解到相关的感受。


    # 5.2.3 惊讶


    与恐惧紧密相连的是惊讶。二者间有相似的表现。恐惧和惊讶经常被混淆。假设你出差了一个星期。在回来的路上你觉得烦躁不已，仿佛忘记了什么重要的事情。但是你觉得过一会儿就会想起来，所以就回家休息了。


    你把车开进车道。房间黑漆漆的。之后你开了门，走进房间，打开灯。这时三十个人跳起来欢呼“生日快乐”。


    会发生什么事呢？因为惊讶，你会睁大双眼，扬起眉毛，嘴巴张开，发出惊讶的声音（如图5-6所示）。通常惊讶的情绪会让人们先退到一旁，在意识到自己是安全的之后再走近让自己感到意外的东西。'
  merge: -1
  img_proc: true
- pgno: 485
  md: '![](img/9f6d2369b69b99fb89843058054e5812_485_0.png)


    图 5-6　虽然区别很微妙，但这是惊讶的表情，不是恐惧


    在这种情绪下会发生什么事呢？你的身体已经准备好战或退。但是在惊喜派对上，你很快就会看到一个不存在危险的场景。你的身体也会倾向于那个带来惊喜的物品。随之而来的是笑声和微笑。艾克曼博士称惊讶为“通路情绪”。因为当最初的惊讶带来的结果或后果实现后，它可以通向很多其他的情绪，如愤怒、开心和悲伤。


    这些暗示对社会工程师很重要。在经过战或逃的斗争并确定自己是安全的之后，惊讶能够变成美好感觉的通路。在这之后伴随的往往是笑声、微笑和开心的感觉。因此，这种情绪能够让你在试图影响他人的时候处于有利地位。


    当然，我不是说让你在下次社会工程渗透测试时要藏在一个壁橱里，然后忽然跳出来大喊“生日快乐”。接下来我将换一种方式来说明这一概念。'
  merge: -1
  img_proc: true
- pgno: 486
  md: '在一次工作中，我进入一栋大楼，来到前台尝试获得准入权限。当我走进柜台时，我注意到那个前台工作人员看起来很伤心。我没有用像往常一样的接近方法，而是问她：

    “你还好吗？”她告诉我她丢了一只耳环。她很沮丧，因为那副耳环很昂贵，而且还是她丈夫送给她的礼物。我告诉她我也替她感到难过，还帮她一起找耳环。幸运的是，我在她的头发上看到了闪光，那是耳环发出的光。当她抬起手摸到头发的时候，她的脸上出现了图5-6的表情。


    她特别开心，以至于一直都没有问我是誰。在她谢过我多次后，她只是问：“我们说到哪儿了？”我回答道：“哦，我要去见人事专员。五分钟后，我需要带着徽章去见他。”她给了我一个徽章，然后给我开了门。在这种情况下，惊喜和开心的情绪为我带来了成功。寻找让你的目标对象惊讶的方式并不需要从壁橱里跳出来就能实现。


    # 分解


    花时间去练习以下这些步骤会帮助你更清晰地表达、感受和观察这些表情，并获得经验。


    惊讶的情绪中包含的肌肉动作如下。


    +   - 在扬起眉毛的时候尽量睁大眼睛，如图5-7所示。眉毛在惊讶的时候会比恐惧时弯曲的程度更大。


    ![](img/9f6d2369b69b99fb89843058054e5812_486_0.png)


    图 5-7　双目圆睁，恐惧时更是如此


    +   - 你的下巴要微微分开，如图5-8所示。（想想“这是一次让人震惊不已的经历”或者“当我告诉你的时候，他的下巴都快掉到地上了”。）'
