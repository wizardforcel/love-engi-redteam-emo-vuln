  md: '本章的目标是提供一种资源，其中包含了一系列不会过时的想法和基础原则，帮助你学习如何抵御前三章中提到的攻击。


    让我们来开始第一课吧。


    # ## 4.1 第一课：批判性思维


    +   - 类别：普通和专业


    我认为如果不从这非常关键的一步——批判性思维——开始我的第一课，那么会是很失职的。在我的上一本书（《社会工程 卷2：解读肢体语言》）中已经讨论了一些细节。我认为这是帮助人们抵御任何社会工程学攻击的最重要的建议。


    请允许我在此重申一下我在那本书中所提出的观点。很多时候人们把批判性思维和逆反、缺乏信仰或者为了质疑而质疑联系在一起。但是这些都不是我对批判性思维的定义。


    我将批判性思维定义为：告诫自己不要事事都信以为真。不要认为邮件内容都是真实的，只因为没有时间评估、因为压力很大以至于没时间思考，或者因为有另外150封未读邮件。停下来思考一会儿。这听起来是一个耗时的任务，但是问问自己下面这几个问题并不会花很多时间。


    +   - 这封邮件来自我认识的人吗？

    +   - 我预料到会收到这样一封邮件吗？

    +   - 邮件里的请求合理吗？

    +   - 这封邮件是否试图唤起某些情绪，比如恐惧、贪婪或者好奇，或者最重要的——它是否试图让我做点什么？


    花上两三秒钟来想想上面每个问题，这能够帮助你更好地识别钓鱼邮件。


    在阅读下面的课程时，你可以把上述问题运用到课程中，并且你会发现在识别真正的威胁时，思考和不思考（哪怕只有一两个）上述问题的区别有多大。


    即使你已经问过自己上面所有的问题，本节中也有一些值得一看的建议，可以帮助你获得额外保护。'
  merge: -1
  img_proc: true
- pgno: 657
  md: '# 攻击者是如何绕过防御的


    攻击者不希望你思考，尤其不希望你进行批判性思考。他们会利用情绪来阻止你的批判性思维或者逻辑思考，（记得第2章中的杏仁核劫持吗？）并且会试图唤起你的恐惧、忧伤或者愤怒等情绪，迫使你采取一些你不该采取的行动。


    当你读到一封来自某个不认识的人的意外邮件，并且它试图让你产生情绪反应时，你就应该警觉。停下来几秒钟，在你采取行动前读点别的什么来冷静一下。


    # 4.2　第二课：学会悬停


    +   - 类别：普通和专业


    想象你坐在家中，或者办公室里，然后收到一封图4-1所示的邮件。你会有什么感觉？'
