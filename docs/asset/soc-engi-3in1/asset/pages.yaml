- pgno: 272
  md: '# 图7-8 垫片的工作原理


    图7-9展示的是专业的垫片，也可用铝罐制作。


    ![](img/9f6d2369b69b99fb89843058054e5812_272_0.png)


    图7-9 专业垫片


    近期发生的故事（参见[www.youtube.com/watch?v=7INIRLe7x0Y](http://www.youtube.com/watch?v=7INIRLe7x0Y)）表明要打开宾馆或者配有链锁的房门简直易如反掌。侵入者在锁链上系上橡皮圈，利用橡皮圈本身的弹力，就可以使链锁脱落。麻省理工学院提供了一个自由发布的开锁指南（详见[www.lysator.liu.se/mit-guide/MITLockGuide.pdf](http://www.lysator.liu.se/mit-guide/MITLockGuide.pdf)），其介绍更为深入详尽。


    你或许会好奇是否存在这样一种锁，它不会被撬开或至少很难被撬开。防撬双锁（Bump Proof BiLock，参见[www.wholesalelocks.com/bump-proof-bilock-ult-360.html](http://www.wholesalelocks.com/bump-proof-bilock-ult-360.html)）就是这样一种锁。双锁孔设计使得它几乎不可能被撬开。


    我在职业生涯中，遇到的不是锁的选择问题，而是与锁相关的安全问题。通常情况下，公司会买一把结实的锁，需要生物识别技术和密钥才能进入服务器机房，但门旁边就是一个单层玻璃的小窗。那么谁还需要开锁器呢？贼可以轻而易举地打破玻璃闯进去。


    其寓意在于单凭锁是无法保证安全的。安全是一种意识，而不是一种简单的硬件。


    不是每个社会工程人员都必须成为开锁专家，但是知晓锁的基本工作原理并具有开锁经验，可能会影响社会工程行动的成败。'
