- pgno: 58
  md: '难以相信在垃圾堆里能找出让我们获利丰厚的信息，就像难以想象我们为什么要去乐呵呵地翻垃圾一样。人们经常会扔掉发票、通知、信件、CD光盘、电脑、U盘以及其他种类繁多的设备和报告，我们可以从中收集到特别多的信息。正如前面提到的，如果人们连价值数百万的艺术品都会扔掉，那么只要认为某物是垃圾，人们都会不假思索地直接扔掉。


    有时，公司认为直接将重要文件扔掉会不安全，于是便用碎纸机碎掉再扔，然而一些碎纸颗粒度不高的碎纸机粉碎过的文件还是能轻易拼回去的。如图2-5所示。


    ![](img/9f6d2369b69b99fb89843058054e5812_58_0.png)


    图2-5　粗线条单向粉碎过的文件依然有些文字可读


    这张图展示的是粉碎后的一些文件，有些字还是可以被整体辨认的。这种情况下，只要肯花时间耐心地用胶带粘一下（如图2-6所示），便能将部分文件拼接回去，从而得到破坏性极强的信息。'
