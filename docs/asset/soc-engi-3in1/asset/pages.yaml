  md: '断的实践练习。通过这些简单的声音练习，能够帮助你控制这些语音特征。


    当想在说出的句子中包含一个隐藏的命令时，你要降低语调，通过细微的变化使目标意识不到其中命令的成分。否则你会提醒对方的潜意识，让他觉得什么地方出了问题。如果出现这种情况，他会察察你的企图，让你难以成功。


    和社会工程的大多数技能一样，如果一门技巧不是与生俱来的，则练习是必不可少的。在审计中使用该语音技巧之前，应该首先在家人和朋友身上进行尝试。


    从个人经验来看，第一次使用终极语音技术时，我设定的目标是将命令嵌入到问题中。这个目标花了一段时间才得以实现，但我是从较简单的事情开始的，如：


    > “亲爱的，今晚你想吃什么？牛排还是别的东西？”


    最后，社会工程人员在学习NLP时需要关注3件事情。


    +   - 音调。如前所述，声音的音调以及将重音放在某些特定的词语上能够改变整个句子的含义。通过使用音调和重音，可以在目标的潜意识思维中嵌入命令，使得目标对建议采取更加开放的态度。\n-
    审慎地选择用词 。学习选择能够产生最大影响的词语。对于想要目标积极思考的问题选择积极的词语，对于那些不需要目标想太多的事情选择消极的词语。这项技术还可以帮助社会工程人员让目标更加顺从。\n-
    创建一个可用于当面或电话社会工程审计的命令语句列表。将这些命令语句写出来并不断练习，这样才能在需要的时候即时回忆并应用上。


    最重要的是练习。控制语调、审慎选择用词并且注意如何表达，这些事情做起来并不容易。练习能够使它们成为你的第二天性。


    NLP是一个具有强大力量的主题，很像微表情，本节只触及皮毛。一旦你开始掌握NLP中的技巧和识别面部表情的能力，从逻辑上来讲，下一步就是在与目标交互的时候使用这些工具。接下来，本章会分析专业侦讯人员所使用的相同的战术。'
