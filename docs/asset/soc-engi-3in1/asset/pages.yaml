- pgno: 745
  md: '+   - 使用这款工具需要怎样的知识水平？


    PhishLine是我用过的工具中功能最强大的。PhishLine的界面也许并不像其他产品一样面向新手用户，但设置钓鱼攻击邮件、启动项目、导入列表这些操作都并不难。


    真正强大的是它的报告功能。该软件可以为任何人提供所需要的数据——从新手到专业数据人员。你可能需要学习PhishLine提供的课程或者从支持人员那里寻求帮助，才能学会使用它的数据报告功能。但是，一旦学会如何寻找你要的数据，你会为这一功能的强大感到震惊。


    PhishLine有非常具有深度的用户报告系统，允许你显示来自任何一个项目的任何子数据。我最喜欢的功能是将事件反馈加入到报告中，这样公司就可以通过使用内置于所有邮件客户端的邮件转发功能来管理事件反馈。你可以追踪、分类和报告那些正确回应的人，这样你就可以识别出谁“通过测试”了。


    +   - 用户信息的安全性如何？


    除PhishMe以外，列表中只有PhishLine是不使用亚马逊云服务来进行负载平衡的。我没有进行安全审计，但事实上所有负载均衡和平台都是运行于PhishLine自己的服务器上的，这意味着增加了安全层。


    根据我自己使用PhishLine的经验来看，可以说他们使用了非常安全的服务器来处理用户的数据，并允许每个用户进行分情况管理。


    +   - 使用该工具时有其他的困难吗？


    使用PhishLine唯一的困难是复杂的界面。我需要一些教程才能学会使用一些功能，这些功能在我使用的其他系统中通常都是可以凭直觉操作的。


    +   - 技术支持如何？


    冒着听起来像广告的风险，我要说PhishLine的技术支持团队非常出色。我曾亲眼目睹他们工作到很晚来帮助我为客户解决一个问题，并且这个问题并不是由于PhishLine的错误而导致的。他们不知疲倦地提高他们的产品质量，当然，他们欢迎任何人告诉他们可以改进的地方。从我的经验来看，他们接受反馈并做出改进的动作可谓神速。


