- pgno: 62
  md: '# 2.3 交流模型


    > > 交流模型越精巧，越清晰，花在交流上的时间就越少。

    > >

    > > ——约瑟夫·普利斯特利（Joseph Priestley）


    交流是将信息从一个实体传送到另一个实体的过程。交流需要至少二者之间的互动，可以视为一个双向的过程，这里发生着信息的交换、思维的碰撞、情感的互动，或者想法上的共识。


    这个概念和社会工程的定义非常相似，只是这里假定参与交流的人已经有了一个共识，而达成共识是社会工程人员和他人交流的目的。交流可以理解为这样一个过程：信息经过打包，由发送者通过传输媒介送达接收者，接收者解密收到的信息并给发送者送去反馈。所有的交流形式都需要有三个条件：发送者、信息和接收者。社会工程人员理解交流的原理对于构建合适的交流模型异常重要。对于社会工程人员，建立交流模型将帮助确定最好的传送和反馈方法，以及最合适的传输内容。


    交流可以采用多种不同的形式。有听觉方式，比如演讲、歌曲和说话的音调，还有非口头方式，比如肢体语言、手语、辅助语言、触摸和眼神交流。


    不论使用何种交流方式，对于接收者来说，信息的内容及其传达方式都会有确切的效果。


    理解最基本的规则对于为“目标”建立交流模型很重要。一些规则不可以被打破，比如交流总是有一个发送者和一个接收者。同时，每个人的实际情况都会因经验和观念的不同而有所不同。


    基于个人的现实情况，人们对事情的感知、体验和阐释总是会有所差异。正因为这样，人们对同一事件的看法会不尽相同。如果你有兄弟姐妹，一个简单的练习就可以证明这一点。问他们对于一件事情，尤其是一个情感事件的解释或记忆，你会发现他们对这件事情的阐释和你的记忆是完全不同的。


    每一个人都有身体和精神的私密空间。很多因素会影响你决定是否要允许他人靠近或进入这个空间。无论在何种场合，你和别人交流时，都是在尝试闯入他们的私密空间。社会工程人员的交流是尝试将他人带入其空间，从而了解他的状况。有效的沟通是试图把所有的参与者带入彼此的精神空间。只要有互动，就会发生这种带入，只是这太普遍了，一般人通常不会注意到这点。


    人际交流会传送两个层次的信息：语言的和非语言的。'
  merge: -1
  img_proc: true
- pgno: 63
  md: '交流经常包括一个文字或语言部分，不管它是以口头、书面还是其他文字形式呈现。通常也会有一个非语言的部分——面部表情、肢体语言，或者情感、字体等一些非语言信息。


    暂且不论每一种类型的暗示（语言或非语言）的数量，交流的信息包被传送给接收者，然后接收者根据其自身的情况进行过滤。他将根据实际情况形成一个概念，然后根据这个概念来解释这个信息包。当接收者解释信息时，便开始整理它的意思，即使那个意思并不是发送者的本意。发送者只能通过接收者给的反馈信息包，确定对方是接受还是拒绝了这个原始信息包，从而得知信息包是否以既定的方式被接收。


    这里所说的信息包是指某种沟通方式，包括言语、信件或发送的电子邮件等。接收者收到信息时，就会去阐释它。许多因素会影响最终被阐释出来的结果，如情绪的好坏、喜怒哀乐等。所有这些因素和改变接收者认知的其他暗示都将有助于他阐释该信息。


    社会工程人员的目的是利用这些语言和非语言的暗示，改变目标的感知，从而达到想要的效果。


    下面包含更多的基本交流规则：


    +   - 不要理所当然地认为接收者和你的情况完全一样；

    +   - 不要理所当然地认为接收者将按照你的方式阐释信息；

    +   - 交流不是一个绝对的、一成不变的事情；

    +   - 如果有多人参与交流，应始终假设每个人的情况各不相同。


    知道这些规则可以极大地提高你和他人交流的效率。这很好，但是交流和建立模型有什么关系？或者说，这又和社会工程有何关系呢？


    # 2.3.1 交流模型及其根源


    正如前面所说，交流的基本含义是发送一个信息包给既定接收者。这些信息也许来自多个信息源，比如视觉、听觉、触觉、味觉和语言。这个信息包随后被接收方处理，用于描绘出对方“所说的意思”。这种评估方法就是所谓的通信过程。通信过程最早是在1947年由社会科学家克劳德·香农（Claude
    Shannon）和沃伦·韦弗（Warren Weaver）简要说明的。当时他们发明了香农-韦弗（Shannon-Weaver）模型，也被称为“鼻祖模型”。'
  merge: -1
  img_proc: true
- pgno: 64
  md: '根据维基百科的定义，香农-韦弗模型“包含了信息源、信息、发送器、信号、信道、噪声、接收器、信息目的地、误差概率、编码、解码、信息率和信道容量等概念”。


    香农和韦弗用图像定义这种模型，如图2-8所示。


    ![](img/9f6d2369b69b99fb89843058054e5812_64_0.png)


    图2-8　香农-韦弗的“噪祖模型”


    在这样一个简单的模型（也被称为传递模型）中，信息或内容从发送者那里以某种形式发送到目的地或接收者那里。通信这一基本概念只是将通信视为发送和接收信息的一种方式。该模型的优势在于简单、通用和可量化。


    香农和韦弗构建这个模型的基础如下。


    +   - 一个创造信息的信息源

    +   - 一个把信息编码为信号的发送方

    +   - 一个适合传送信号的信道

    +   - 一个从信号中解码（重构）出信息的接收方

    +   - 一个信息发送的目的地


    通过这一理论，他们总结出通信中存在的3个层面的课题。'
  merge: -1
  img_proc: true
- pgno: 65
  md: '+   - 技术问题——信息传送的准确性如何？

    +   - 语义问题——信息表达的精确性如何？

    +   - 效率问题——接收到的信息对行为影响的有效性如何？（社会工程过程中这最后一点很重要，必须牢记。社会工程人员的目的就是创造出一个自己想要的行为。）


    差不多15年以后，大卫·贝罗（David Berlo）扩充了香农-韦弗的线性通信模型，发明出发送者-信息-信道-接收者（SMCR）通信模型。SMCR将模型分解成几个清晰的部分，如图2-9所示。


    ![](img/9f6d2369b69b99fb89843058054e5812_65_0.png)


    图2-9 贝罗模型


    可以认为通信是信息传播的过程，该过程由3个层次的规则控制。


    +   - 符号和标识的形式属性

    +   - 符号/表情及其使用者之间的关系

    +   - 符号和标识间的联系及其含义


    因此，可以进一步地将通信定义为社交，即至少两个对象使用一系列共同的符号和规则进行互动。'
  merge: -1
  img_proc: true
- pgno: 66
  md: '2008年，另一位研究员D. C. 巴尔芒（D. C. Balmund）将自己的研究与行业先驱的成果结合起来，形成了通信的事务模型，如图2-10所示。


    ![](img/9f6d2369b69b99fb89843058054e5812_66_0.png)


    图2-10　改进的新通信模型


    在他的模型中，可以看到信道和信息可以有多种形式，不仅是图片中所示的口头语言。信息可以有书面、视频或音频等形式，接收者可以是一人或多人，反馈也可以有多种形式。


    将这些成果结合起来进行研究有助于社会工程人员制定出一个稳健的通信/交流模型。不仅是社会工程人员，每个人都可以从中获益。学习如何制订交流计划可以加强你和他人（例如配偶、孩子、上司或下属）之间的交流。'
  merge: -1
  img_proc: true
- pgno: 67
  md: '因为本书的重点是社会工程人员，所以需要分析一名社会工程人员可以从中学到什么。在读完该理论所有内容之后，你可能会因感于怎么使用这些理论。请记住，社会工程人员必须是交流的大师，必须能够有效地进入且留在一个人私密的精神空间，并保证不冒犯目标或令目标反感。制定、实现和实践有效的交流模型是成功的关键。那么，接下来我们就学着制定这样一个交流模型。


    # ## 2．3．2　制定交流模型


    既然已知晓交流模型的关键要素，请以社会工程人员的视角来看待这些要素。


    +   - **信息源：** 社会工程人员就是要传递的信息或交流的源。

    +   - **信道：** 就是传达方式。

    +   - **信息：** 向接收者传达的内容。

    +   - **接收方：** 即目标。

    +   - **反馈：** 当有效地将信息传达出去之后，你希望对方给予的回应。


    如何有效地使用这些要素呢？运用交流模型的第一步是带着目的动手实践，首先从社会工程中上演的经典剧情开始。


    +   - 编写一个网络钓鱼邮件，尝试让25~50个雇员在工作时间访问一个嵌有恶意代码的非商业网站，以达到入侵其公司网络的目的。

    +   - 登门拜访，伪装成一个前来面试的人员，装作不小心将咖啡洒在了简历上，并说服前台工作人员允许你用USB存储器插入到电脑里重新打印一份。


    在制定交流策略时，你可能会发现反向使用模型大有裨益。


    +   - **反馈**　你期望得到什么样的回应？期望的回应是，接收邮件的大部分雇员都点击它，这是理想状况。当然，只有少数甚至一个目标人物点击你也会感到高兴，但是你的目的，即期望的反馈是让大部分目标人物上当。

    +   - **接收方**　这就是信息收集技巧派上用场的地方。你需要知道目标人物的全部信息。他们喜欢运动吗？他们中大多数是男性还是女性？他们是当地俱乐部的会员吗？休息的时候他们做些什么呢？他们成家了吗？他们是否年轻？这些问题的答案有助于社会工程人员决定传达什么类型的信息。'
