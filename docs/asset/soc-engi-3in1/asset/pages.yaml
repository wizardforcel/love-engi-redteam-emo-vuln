    # 8.4 询问“怎么样”“什么时候”以及“为什么”


    从非语言行为的角度来说，通过建立密切关系完成需求收集的最后一条原则就是询问“怎么样”“什么时候”以及“为什么”的问题。简单地说，询问这些问题要比询问“在哪里”“是什么”以及“是或否”的问题更有意义。'
