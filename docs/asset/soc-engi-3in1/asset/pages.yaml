  md: '接着我看了一眼侧边，心想：“这需要很多砂纸来打磨。如果明天来不及怎么办？我该没办法冲浪了。”于是我找了一些蜡和宽胶带，快速修补了一下。


    我对自己的修补很满意，并且觉得已经没问题了，于是第二天就出去冲浪了。然而几个小时后，我注意到冲浪板的底部凸了出来，变得软乎乎的。


    可以确定，快速修补工作没能经受住考验。烈日当头，冲浪板的蜡融化并脱离原处，于是水渗了进来，冲浪板变得沉重、充满积水，最后坏了。那天我也没能好好冲浪。


    # ### 6.3.1 定义


    也许因为预算，也许因为错误推理，也许因为糟糕的顾问。无论原因是什么，选择只测试一部分人就好像只修补两个漏洞的其中一个一样。


    钓鱼攻击的结果是如此主观和因人而异，你不能只测试一部分人就说“好了，我们测试的30%的人中有10%的点击率，我们干得不错”，或者“他们有90%的点击率，每个人都要中招了……”


    记住，只要有一次点击就会毁了你的网络。你真的确定攻击者只会攻击受测试的员工吗？


    # ### 6.3.2 消极之处


    每个人受钓鱼攻击和培训的影响程度都是不一样的。选择随机数目的员工或者一小部分员工接受测试，并不能告诉你公司在钓鱼攻击中整体表现如何。


    同样，如果接受测试的人群已经对这个测试或者对钓鱼攻击有所了解，那么这可能导致你产生一种你们公司已经准备好应对钓鱼攻击的错觉。


    # ### 6.3.3 如何改进


    我不能解决预算问题，并且话说回来，有总比没有好。我通常认为相比于全员投入而言，小样本测试效果并不好，虽然有些情况下这可能是必要的。然而如果这种小样本测试并非必要，那我建议还是别做了。测试一个小样本对你们公司而言并没有什么用，而且你最不想看到的就是培训以失败告终。


    假设你只被准许进行一次钓鱼攻击测试。我理解你会做你该做的事，但是从这一次测试中得来的数据并不能得出你们有多安全的结论。相反，你可以用它来说明下'
