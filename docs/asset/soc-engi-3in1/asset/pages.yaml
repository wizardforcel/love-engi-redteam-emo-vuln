    # 图6-9 咬唇是焦虑的表现


    如图6-9所示，我们不仅能从萨琳娜的嘴唇看出她的焦虑，还能从她眼神中看出焦虑的情绪。她眼睛张开的宽度与在感到恐惧或惊讶时的宽度类似，这表明她感到焦虑。有些人有做这个动作的习惯。我们要注意这个动作何时开始何时终止，因为这个动作能够表现基线。之后再观察其变化。通常情况下，人们在焦虑的时候会做出这个动作。


    有时人们在焦虑的时候不会咬嘴唇。你还会看到与图6-10和图6-11相似的表现。'
