  md: '举一个简单的例子来说明这样做的强大力量。之前我在希斯罗机场等候海关检查。当时一共有27个柜台，却只有3个人在工作。紧张的情绪在等候的队伍中蔓延。之后两名工作人员去休息，只留下一人工作。某个显示屏发布了一条消息，称乘客对于工作人员的投诉可以帮助他们提升工作质量。


    我在无意中听到一些人在向一个经理模样的人投诉。我得承认，我当时也非常激动。我需要搭乘另一个航班，航班还延迟了。我上下打量着那个经理，思索着什么时候走过去“提交我的投诉”。只见他悠闲地走下楼梯，像是刚刚结束休息。之后我改变了想法。因为他的双拳紧握，甚至能看见白色的关节。他下巴收紧，双唇紧闭，手臂僵直，步履沉重。看到这一幕，你会作何感想？


    他不只是愤怒，而且被激怒了。我不知道为什么会这样，但是我想如果我要投诉的话，他不是那个合适的人选。而现在，也不是合适的时间。对肢体语言和面部表情的了解使我免铸大错。


    当我走到前面时，我听到他对同事说：“只是为美国政府工作而已，他凭什么在我的国家这样对我说话？！要知道他在这里不过是一个游客。他的特权是可以被免除的！”


    毫无疑问，现在我得出他怒火中烧的结论。那么我小小的抱怨将不能“提升他们的服务质量”，反而会给我自己带来麻烦，比如误机，或者更大的麻烦。


    正如这个简单的故事所表明的，一旦我们敞开胸怀去理解他人，比如理解是什么让她做出选择，为什么她做出这样的反应，为什么她说出或者做出那样的事情，我们就会真正地理解她。这使我想起我最近的另一次经历，一次考虑不周的经历。我的话伤害了一个亲密的朋友。当她和我谈起这件事的时候，我觉得自己受到了攻击，进而激起了自己的防御状态。我以自己为中心，表现了自我保护的态度。请注意上述几句话中充斥着“我”这个字。这就是说我关注的是我自己的感受，而不是我朋友的感受。


    不久之后，我又见到了这个朋友。虽然有点紧张，但是能再次见到她我很开心。她看起来很伤心。她没有生我的气，但是很伤心。当我走近她的时候，她的髋部和脚尖都离我很远。我们彼此寒暄。我不太清楚当时发生了什么，但是不久后我反思了当时的情景。她脸上表现出来的悲伤以及她的肢体语言都表明她感到不适，并且想回避我们当时的交流。


    为什么要和你分享我犯的这个错误呢？因为了解如何读懂人心让我在这样的情境下看出我不是激怒了我的朋友，而是伤害了她。起初她可能觉得气愤，但是最后我给她留下的是伤心。这消除了我的自我保护需求，让我意识到自己的所作所为及其对朋友的影响。


    能够做到辨别、解读真实的情绪并作出反应是很强大的力量。但是任何强大的力量都需要使用得当。艾克曼博士的著作《情绪的解构》5中的一段话能够非常好地概括我想说的话。关于解读他人的情绪，他是这样说的：“通常最佳的做法是对你所看到的保持沉默。提防可能发生的事……如何回应取决于你和对方的关系，过去如何，未来可能会如'
