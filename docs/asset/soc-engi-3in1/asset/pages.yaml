  md: '我和克里斯在这里谈这些并不是为了评判这件事，而是想要通过这件事来给大家提个醒。这种公共事件欺诈的灾后变体无疑是非常可怕的。这些钓鱼邮件并没有进行恐吓（这样已经很坏了），而是利用了你和其他人的关系。在波士顿马拉松爆炸案发生后的几小时内，骗子就开始行动了。¹²
    很多钓鱼邮件只是简单地提供了一个似乎是指向爆炸视频的链接。它们利用人们天生的好奇心，而这些链接实际指向了一些会下载恶意软件的网站。此类钓鱼攻击的变种之一如图1-15所示，是一封伪造的来自CNN的邮件，它利用了人们对权威的盲从和天生的好奇心。


