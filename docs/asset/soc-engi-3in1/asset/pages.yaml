  md: '在我和克里斯撰写这本书的短暂时间里发生了很多事情。很多安全漏洞事件在报道后引起了高度关注，包括eBay、家得宝、索尼、福乐鸡和摩根大通。可以肯定，后续将会出现信用卡失窃、身份信息遭到泄露或者更进一步的钓鱼攻击活动。


    反钓鱼工作组于2014年8月29日发布的报告¹ 显示，2014年第二季度，被报告的独立钓鱼站点数量居于历年的第二位——128 378个。另外，被报告的钓鱼邮件达到了171
    801种。这还只是报告给反钓鱼工作组的数量。可以推测，现实中的钓鱼攻击和恶意网站的数量远超于此。近十年来，报告给反钓鱼工作组的钓鱼攻击和恶意网站的数量也有持续增加的趋势。


    > ¹ Anti-Phishing Working Group, “Phishing Activity Trends Report, 2nd Quarter
    2014,” August 29, 2014, http://docs.apwg.org/reports/apwg_trends_report_q2_2014.pdf
    .


    更糟糕的是，钓鱼攻击者的动作更快、手段更高明、攻击方式更富于变化了。最近一项由谷歌和加利福尼亚大学圣迭戈分校联合开展的关于账户劫持的研究² 表明，有20%的账号只需30分钟即可破解，50%的账号需要7个小时就能得手。另外，攻击者平均花费3分钟搜索邮件信息——例如财务数据或者其他账号信息——并据此确定哪些账号是有价值的。最后，这项研究发现被盗账号的联系人比其他人遭到钓鱼邮件攻击的可能性高36倍，这意味着钓鱼攻击者会利用受害人的朋友和同事的身份来进行攻击。


    > ² Google, Inc. and the University of California, San Diego, “Handcrafted Fraud
    and Extortion: Manual Account Hijacking in the Wild,” retrieved November 11, 2014,
    http://services.google.com/fh/files/blogs/google_hijacking_study_2014.pdf .


    无论如何，在可预见的未来，钓鱼攻击将继续成为困扰人们和组织机构的一个问题。想要真正解决这个问题，唯一的做法是不断学习，并在一切网络活动中保持安全意识。


    # 8.1 深入钓鱼攻击


    让最后一章不只是简单重复前几章的内容并不容易。我和米歇尔讨论过如何为本书做一个总结，最后我们列出了一个简短的清单，其中概括了本书中提出的一些概念，以及我们希望你能从本书中学到的东西。


    # 8.1.1 知已知彼，百战不殆


    钓鱼攻击并非一种娱乐消遣，它是坏人实实在在的生意。有报道称，2013年因钓鱼攻击而遭受的损失超过59亿美元。³ 像其他生意一样，钓鱼攻击一直在发展和调整'
