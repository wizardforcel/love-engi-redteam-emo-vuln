- pgno: 263
  md: '# 第7章　社会工程工具


    > > 人是使用工具的动物，没有工具，一事无成；有了工具，无所不能。

    > >

    > > ——托马斯·卡莱尔（Thomas Carlyle）


    1. 托马斯·卡莱尔（1795—1881），苏格兰评论家、讽刺作家及历史学家。——译者注


    工欲善其事，必先利其器。工具是否合适将直接影响社会工程人员的能力和成败。然而，仅有工具还远远不够，还得知道如何熟练地使用工具，这样才能取得成功。


    本章将讨论物理工具、电话工具以及基于软件的工具这三者之间的区别。需要注意的是，仅仅拥有最昂贵或最好的工具，并不会使你成为一名社会工程人员。工具在安全审计实践方面的作用，就如同菜肴中的调味品，放得恰到好处便成就美味佳肴，太多或太少则会造成味道太重或淡而无味。你一定不希望自己在执行社会工程任务时看起来像个腰间缠满工具的蝙蝠侠，同样也不愿意面临到了目标的门口却因缺少适当的工具而无法进入的窘境。


    社会工程工具的范围十分广泛，本书并非教你怎样开锁或篡改来电显示，而是要为你提供足够的信息，来帮助你决定什么样的工具可以增强你的实战能力。


    本章首先着重介绍开锁器、垫片和摄像机等工具。市场上一些新颖奇特的工具会让平凡的社会工程人员感觉自己就像是詹姆斯·邦德。本章将介绍一些这样的工具及其使用方法，同时展示一些工具的图片。此外，本章还会讨论社会工程攻击中如何篡改来电显示，介绍市面上几款最好的基于软件的信息收集工具，最后还将探讨一些密码分析工具。'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# 7.1 物理工具


    物理安全是指企业或个人为保障安全所采取的不涉及计算机的措施，通常涉及锁、摄像机及窗户传感器等工具。懂得物理安全并知晓其运作原理是成为优秀社会工程师的前提之一。你不必精通这些装置，但要对目标所使用的安全机制有清晰的认知，这样能帮助你克服社会工程审查过程中的阻碍，走向成功。


    # 7.1.1 开锁器


    在讲开锁之前，我们先来了解一下锁的基本工作原理。


    图7-1是简易弹子锁的简单示意图。


    ![](img/9f6d2369b69b99fb89843058054e5812_264_0.png)


    图7-1 弹子锁的简单示意图


    弹子锁的基本工作原理是通过钥匙控制弹子。钥匙将下弹子和上弹子推至一定的高度，当两类弹子的截线正好与锁筒和锁栓之间的缝隙一致时，便可以轻松地转动钥匙打开门、服务器机房及陈列柜等。'
  merge: -1
  img_proc: true
- pgno: 265
  md: "开锁器模拟了钥匙将所有弹子一个接一个地移动到正确位置的过程，使得锁芯可以自由转动并打开门。开锁时，所需配备的两个主要工具是拨片和扭力扳手。\n\n**拨片**是末端弯曲的长金属片，类似于牙医的工具。使用时将其插入锁的内部，上下拨动弹子直至其处于正确的位置。\n\
    \n**扭力扳手**是小而扁的金属器具，当使用拨片时，它能向锁施加压力。\n\n**梳子**的外形很像拨片，但它用于在锁上“梳”动以操作所有弹子。梳子可以十分迅速地打开大部分锁，这一特性对开锁者极具吸引力，因为这样的话，大部分锁就可以被快速打开了。\n\
    \n要开锁，请遵循下列步骤。\n\n+   1. 将扭力扳手插入锁眼，沿着用钥匙开门时转动的方向扭转。关键技巧是知道施加多大的张力，因为力太大或太小，弹子都不会进入正确的位置，从而无法打开锁。若用力恰到好处，则会创建一个小平台，从而让锁芯能卡住销轴。\n\
    +   \n+   2. 插入拨片，一个接一个地拨起弹子，直到感觉它们都处在固定的位置上了。当上弹子就位时，能听到轻微的咔嗒声。所有的弹子都就位后，锁芯便可自由地旋转，锁也就打开了。\n\
    \n上述步骤只能说是开锁的皮毛。欲了解更多有关开锁的知识，请访问下列网站。\n\n+   - [http://toool.us/](http://toool.us/)\n\
    +   - [http://home.howstuffworks.com/home-improvement/household-safety/security/lockpicking.htm](http://home.howstuffworks.com/home-improvement/household-safety/security/lockpicking.htm)\n\
    +   - [http://www.lockpicking101.com/](http://www.lockpicking101.com/)\n\n这些只是众多致力于开锁教学网站的冰山一角。作为一名社会工程人员，花时间练习开锁是明智的。当需要的信息被锁在服务器机柜、书桌抽屉或者其他设备中时，随身携带的小型开锁套装可能就成了你的制胜法宝。\n\
    \n开锁套装可以很小，图7-2中所示的开锁器只有普通名片大小。"
