- pgno: 512
  md: '![](img/9f6d2369b69b99fb89843058054e5812_512_0.png)


    图 6-4  揉擦脸部是安抚动作


    当社会工程师注意到这些动作后，他们就会知道对方对当前的决定或处境感到了威胁、不安全或者不适。艾克曼博士和其他的心理学家将这种非言语动作定义为“操纵性动作”。


    当我们在做艰难的决定时，揉擦或者抚摸流经颈部和胸上部的两条神经（交感神经和颈动脉窦）能起到安抚作用。


    # 注意事项


    社会工程师需要注意对方行为的变化。如果一个人在我们刚接触他的时候表现得很舒适，但是之后开始揉擦脸部或颈部，那我们就需要注意了。如果发生这样的情况，我们要迅速判断是我们本身，还是我们所说的话触发了这种行为变化。'
