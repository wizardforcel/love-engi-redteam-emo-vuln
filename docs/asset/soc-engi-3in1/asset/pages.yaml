- pgno: 474
  md: '在观看访谈、脱口秀、总统辩论或其他现场活动的时候，就会看到这个动作。你会发现，或许作为竞选的一部分，有的人会对于他主张的事情发表演讲。


    当一个问题或者论点被抛出来，在一到两秒钟的停顿之后，候选人开始回答问题时，你会注意到虽然他在点头说“是的”，但是却会表现出图4-11所示的情形。即使是一个轻微的耸肩都能说明做这个动作的人对自己所说的并不确定。点头是在说“是的”，但是肢体语言说的是“我不确定”。


    需要重点关注的是单一的耸肩动作。许多人认为这是一种非语言的矛盾行为。因为在心里，原本想说“是的”，但是大脑却在说“不是”或者“我不知道”。单一的耸肩动作通常是无意识的。这也是我们需要注意的。


    # 4.3 总结


    躯干和手臂能够传递大量的信息。总而言之，请关注躯干倾向。或前或后，或朝向你或远离你，这些躯干倾向都能表现出兴趣和舒适度水平。


    手臂也一样。请关注舒适或者不适的迹象。当手臂表现出目标对象封闭自己，对你设置屏障的时候，是不是因为他感受到了威胁？再或者，手臂敞开是不是意味着密切关系的建立和感到舒适呢？


    此外，也请关注平静或紧张的呼吸以及深呼吸。这些能帮助你了解目标对象究竟是感觉受到了威胁甚至生气，还是非常平和镇静。


    社会工程师的目标是建立平静放松的环境，让目标对象感到舒适。当你看到非语言行为使用得恰如其分时，就知道自己离成功不远了。


    要真正看透这些迹象，我们还需要关注身体的最后一个部分——面部。这也是我们下一章的主题。


    # 第5章 面部表情背后的科学


    > > “如果你想知道他人感觉如何，请先关注他面部的临时变化。”

    > >

    > > ——保罗·艾克曼博士，《心理学家的读脸术：解读微表情之下的人际交往情绪密码》'
  merge: -1
  img_proc: true
- pgno: 475
  md: '在过去的45年中，艾克曼博士的研究帮助世人认识到了面部在解读情绪方面的重要作用。许多其他的研究者也做了薪火相传的工作。因为面部的重要性，本书将用最长的篇幅来对其进行介绍。


    本章不会仅仅重复已有的相关研究，而是会关注一个未被关注的领域：社会工程领域。


    人们常说眼睛是心灵的窗户。如果这是真的，那么面部表情就会反映出我们的情绪内容。事实上，艾克曼强调面部是最主要也是最清晰的情绪通道。学习解读情绪内容并作出反应，判断采用何种策略，进而选择何时运用自己的情感。如果你能做到这些，就仿佛拥有了超乎寻常的能力。


    在一次工作中，我先与目标对象建立了密切关系。之后的对话进行得非常顺利。诱导也顺利进行。我准备实施进攻计划，进一步深入他的内心。我想通过利用他刚刚离职的一个同事来使自己成为该目标对象的“一员”，进而了解他的情绪状态。我转向他，说：“对不起，忘了自我介绍了。我叫保罗——保罗·威廉姆斯。”我先伸出了手。他跟我握手后说：“没关系，失礼了。我是格雷格·赫利。”我继续说道：“那两个人刚走，你是和他们一起工作吗？”格雷格长叹了一口气，说：“是的，罗杰和我为萨拉工作。”他脸上的表情“告诉”我更多的信息。那表情同图5-1很相似。


    ![](img/9f6d2369b69b99fb89843058054e5812_475_0.png)'
  merge: -1
  img_proc: true
- pgno: 476
  md: '图 5-1 你看到了什么？


    当你看到这张照片的时候，你看到了什么？有些人看到了傲慢或者装模作样。这些都是很好的猜想。我看到的是轻视。


    对这个表情的识别让我能够更深入地进入格雷格的内心。我还感觉到他与他的女老板在相处过程中遇到了一些问题。“那么，格雷格，或许你能帮助我。我也有一个非常厉害的女老板。你是如何应对的？或许你能指点指点我。”


    在接下来的25分钟里，格雷格向我倾诉了他的生活。从那之后，只要我需要什么，就会问他。对格雷格面部表情的解读帮助我将自己的沟通方式调整得更适合格雷格。我与他建立了密切的信任关系，还获得了成功所需的信息。


    本章将帮你学习如何做这些事。相关内容来自以下科学家的研究成果：艾克曼博士、华莱士V.弗里森博士以及莫林·奥沙利文博士。此外，还有包括保罗·凯利在内的其他参与者。保罗·凯利是前美国特勤局成员。在艾克曼博士和奥沙利文博士评估信用的测试中，保罗·凯利被称之为“真相奇才”。接下来我们将学习如何通过一个人的面部解读他的情绪内容，进而改变你的交流方式去适应目标对象。


    # ## 5.1 面部动作编码系统


    在研究面部表情数年后，艾克曼博士与弗里森博士在20世纪80年代开始了合作。他们建立了一个体系，为面部肌肉运动制作了示意图，并将这些动作分解为动作单元（Action
    Unit，AU）。他们相信通过学习辨别创建面部表情的肌肉，就能够看到情绪内容的“玄机”。


    在经过30多年的使用后，面部动作编码系统（Facial Action Coding System，FACS）已经成为该研究领域的标准。


    对动作单元的学习需以小组为单位。小组的分类是以涉及的位置和动作类型为基准的。首先是面上部的动作单元。它们会影响眉眼、额头和眼皮的动作。脸下部的动作单元分为以下五组：上/下、水平、倾斜、眼窝以及其他动作。学习完每组动作单元后，你需要练习面部行为评分。


    面部动作编码系统以以下三个主旨对动作单元进行阐述：


    +   - 外观变化；

    +   - 如何重现动作单元；

    +   - 评价动作单元的强度。'
