- pgno: 678
  md: '# 第 5 章 规划钓鱼攻击旅程：开展企业钓鱼攻击项目


    > “要么去做，要么放手……没有尝试的余地。”


    ——尤达（Yoda），《星球大战5：帝国反击战》


    目前为止你已经读了前四章，你可能会说：“好了，我明白你的意思了，并且100%同意你的观点……那么然后呢？”


    无论你相信与否，我每天都碰到你这样的人。凡是关注这世界正在发生什么的公司都会意识到对安全的需求。他们知道几乎每一起攻击中都会用到钓鱼邮件、语音钓鱼和社会工程学，他们也不想成为报纸上的下一个统计数据。


    很多安全专家都会在谷歌上快速搜索，查看哪种手段被用得最多。很快他们就会发现钓鱼攻击几乎总是居于榜首。下一步他们就开始搜索钓鱼攻击教育培训。


    一家公司可能会告诉你：“只需要使用我们的模板，你会大吃一惊的。”另一家可能会说：“你必须在吓唬员工这方面强硬一些。”然而又有一家可能提出这种建议：“你让他们尴尬或者出丑，他们就能学会。”第四家可能又会说：“维持教育和一种健康的恐惧之间的平衡是最好的。”


    你会如何选择？你该如何判断哪种方式最有帮助？


    正如第4章所提到的，我和米歇尔仅在去年就已经发送了——准备好了吗？——超过300万封钓鱼攻击邮件。在这些钓鱼攻击邮件的基础上，我们收集了目前为止最好、最坏和最笨的主意。


    本章的目的是概括我们用来帮助客户降低钓鱼攻击邮件点击率的办法，他们的钓鱼邮件点击率几年内从超过80%降低到了5%。本章的内容基于这几年的培训课程，经过了尝试和测试，现在我们把它呈现给你。


    说明 点击率 代表的是雇员点击钓鱼邮件的比例。


    但是这里有一个问题：我是专门出售公司钓鱼保护项目的。所以我该如何讲述所有这些知识并教你如何保护你或你的公司，还能使这一切听起来不像是销售宣传呢？我和米歇尔讨论了很多个下午，最后我们提出了一个好办法。'
