  md: '![](img/9f6d2369b69b99fb89843058054e5812_645_0.png)


    图 3-5　影响的原则


    # 3.6.1　互惠


    定义　互惠是一种普遍的信念，人们应该根据其所作为得到相应的回报。“善有善报”和“以眼还眼”这样的古老格言都描述了互惠的方式。这一概念是如此强大，以至于科恩和布拉德福德认为它是每一种影响的基础。⁵'
  merge: -1
  img_proc: true
- pgno: 646
  md: '5 Allan R. Cohen and David L. Bradford, “The Influence Model: Using Reciprocity
    and Exchange to Get What You Need,” November 11, 2005, http://onlinelibrary.wiley.com/doi/10.1002/joe.20080/abstract
    , doi:10.1002/joe.20080.


    例子 有一个关于这一原则的真实的例子，那就是提供退款以获取个人信息的骗局。6 这里的关键是恶意攻击者使目标觉得自己先得到了某样东西。因为目标觉得收到了某种礼物，所以他会认为有必要提供点什么东西（个人信息）作为回报。


    6 Chris Morran, “That Guy on the Phone Offering a Tech Support Refund Is Probably
    a Scammer,” The Consumerist website, January 3, 2014, http://consumerist.com/2014/01/03/that-guy-on-the-phone-offering-a-tech-support-refund-is-probably-a-scammer/
    .


    专业建议 尽管互惠原则是建立在礼物的基础上，但是礼物不一定是实物。它可以是一个微笑，是同情地聆听倾诉，甚至是在前面为别人开一下门。它只要对接受者来说足够宝贵，就可以产生足以对其施加影响的力量。


    # 3.6.2 义务


    定义 互惠是建立在礼物的基础上，义务 则通过传统、礼仪、个人感受和社会角色来施加影响。当有人给我让路时，出于礼貌，我会一种“挥手的义务”。你曾经有过让路而对方没有挥手的经历吗？多无礼啊！


    例子 一个真实的利用人们的义务感的例子是可怕的祖父母骗局。7 骗子假装成陷入麻烦的孙子或孙女。通常情况下，打电话者会要求保密，并声称需要钱出狱。很多骗子之前会对他们的目标进行一些研究，得知他们的一些情况，例如他们使用的昵称。他们利用这些可怜的人的社会角色和感受，就像一个受害者所说的：“你不想让你的孙子或孙女受到任何伤害。”


    7 Melanie Hicken, “‘Grandparent Scams’ Steal Thousands from Seniors,” CNN Money
    website, May 22, 2013, http://money.cnn.com/2013/05/22/retirement/grandparent-scams/
    .


    专业建议 你如何在不认识的人身上创造一种义务感？用一些与他们的身份相关的事情怎样？他们为父母吗？他们自认为喜欢帮助别人吗？在你辨识过这些之后，可以利用这些信息来制造一个需求帮你达到目的，或者以一种符合目标对自我的认知的方式行事。


    # 3.6.3 妥协


    定义 你曾经和重要的人吵架并陷入僵局吗？结果可能是一整天的冷冰冰的眼神和简短生硬的对话。你认为可以通过什么方式确认自己已经胜利？（女士们，我要说的是，当你的伴侣犹豫着走进卧室，坐在你旁边，然后说“呃，那个，今晚吃什'
  merge: -1
  img_proc: true
- pgno: 647
  md: '么？”时，你应该知道你已经赢了。）妥协 是一个人让步的时候。这通常表明主动权已经移交到另一个人手中了。


    这一点很重要，因为妥协会把目标置于困境之中。人性如此，有过一次让步后，还可能有更多的让步。这也被称为“登门槛法”（或得寸进尺法）。想想那些试图通过分发传单来卖东西的人们。他们知道如果让你拿到传单，那么你至少可能会停留一下。


    **例子**    祖父母骗局也可以当作一个妥协的例子。某一个案例中，有一位祖母被骗超过20 000美元——但不是一次就被骗这么多。受害者妥协一次并交出钱后，骗子继续要求更多的钱，她就继续妥协下去。<sup>8</sup>


    > > 8 Kathy Tomlinson, “Senior Loses $20,000 to Scammer Posing as Grandson,” CBC
    News website, March 20, 2012, http://www.cbc.ca/news/canada/senior-loses-20-000-to-scammer-posing-as-grandson-1.1148359
    .


    **专业建议**    专业社会工程人员有时候会通过成为让步的那个人来引导这一相互影响的过程。通过这种行为，社会工程人员暗示权利被让步给了目标，尽管妥协可能很微小或者无意义。汽车销售员总是这么做。


    # ### 3.6.4 稀缺


    **定义**    当资源有限或者缩减时，会变得更有价值。这是另一种在我们脑中根深蒂固的观念。以前抢不到 最后一只鸡翅膀真的事关生存，不像现在只会带来一种满足感，一种由于看到你的兄弟姐妹抢不到而产生的满足感。


    真正讽刺的是，我以研究这些把戏为生，并完全理解稀缺的含义。不过当我看见广告说“如此低价，不容错过”的时候，我还是偶尔会买广告里的商品。实际上有时候我一买就买两个。


    **例子**    该从哪里开始呢？你几乎每天都能见到骗局和那些实际上接近骗局的广告。20世纪70年代，一家夜总会的老板史蒂夫·鲁贝尔在夜总会门口竖了一根天鹅绒绳子，只允许特定的来宾进入。这一举措引发了人们近乎疯狂的想要光顾这家夜总会的热情。同理，有一类金币复制品
    （表面上不是 一个骗局）的广告宣称“尽早入手，免留遗憾”。


    **专业建议**    像互惠一样，稀缺或缩减的资源不一定偏要是实体的。你曾经试过约见某个重要人物吗？他真的在下周四下午1：20的时候只有10分钟空余时间给你吗？稀缺是如何对你的紧迫感和行为产生影响的？'
  merge: -1
  img_proc: true
- pgno: 648
  md: '# ### 3.6.5 权威


    **定义**　权威 是指拥有决策的权利。这种权利可能来源于法律或者其他合法来源，也可能基于个人魅力或者信誉而建立。


    **例子**　我们的成长伴随着服从权威和反抗权威的过程。我们成年后会倾向于自动回应具有权威的人或者权威的符号。如果有一个戴着安全帽、穿着安全背心的人在马 路对面向你招手，那么你可能会遵循他的指示。


    举一个特别极端的利用这一原则的例子。一些快餐店可能经历过这样的情况。一个自称是执法机构官员的人打来电话，对餐厅老板说他们有位员工涉嫌盗窃或者贩毒。^9 老板被要求遵循电话的另一头传来的指示，把那名员工锁在里屋，然后对他或她进行搜身，或者用其他方式羞辱这位员工。从这个例子中看到，权威极有可能被滥用，也很容易被用来操控他人。


    > > 9 Andrew Wolfson, “A Hoax Most Cruel: Caller Coaxed McDonald’s Managers into
    Strip-Searching a Worker,” Courier-Journal.com, October 9, 2005, http://archive.courier-journal.com/article/20051009/NEWS01/510090392/A-hoax-most-cruel-Caller-coaxed-McDonald-s-managers-into-strip-searching-worker
    .


    另一个有趣的例子是，有一位女士假扮华夫饼屋的经理，装模作样地检查了一下，然后从收银机里拿走了钱。^10 她只是简单地装作自己属于那里。根据警方提供的信息，“整个过程中，她没有恐吓，也没有使用武器”。


    > > 10 Mike Morris, “Police: Woman Posing as an Area Manager Steals Cash from
    SE Atlanta Waffle House,” AJC.com, February 26, 2014, http://www.ajc.com/news/local/police-se-atlanta-waffle-house-robbed-by-woman-pos/ndcz4/?_federated=1
    .


    **专业建议**　你不需要带着徽章彰显权威。穿着和谈吐，写作风格和身体语言，以及邮件里的签名都会传达这一信息：你知道你在说什么，并且你发出的指令应该被遵循。有一个为女士们准备的非专业的建议：由于你的外貌和其他特征，例如年龄、音调，亲自展现权威可能会有些困难。有意识地注意你正在展示什么，做你力所能及的事，并注意选择让别人相信你的理由。


    # ### 3.6.6 一致性与承诺


    **定义**　**一致性与承诺** 涉及这样一个概念：当人们已经做出某种行为后，他的后续行为会更倾向于与前面的行为保持一致。正如你所推测的，这一点和让步原则往往密切联系在一起。在一个人让步后，一致性与承诺就会让这个人觉得他应该继续让步。你会如何看待一个想法总是变来变去的人？没人想要被当成是那种人。'
