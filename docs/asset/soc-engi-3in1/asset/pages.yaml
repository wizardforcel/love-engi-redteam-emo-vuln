  md: '非手掌皮肤电位和心率反应的几个指数显示出耐受人群的反应较小。忍受程度也与主观压力的减轻相关。实验结果与下述观点一致，即接触忍受模型后痛苦指数的改变代表的是痛苦经历的基本特征发生了变化，而不是有关信息受到主观抑制。


    我们整理一下上面的内容，克雷格博士所做的基本上就是对人们施以电击，然后让他们标记痛苦级别。之后，在有能够“忍受”痛苦的人在场的时候，对实验参与者做同样的测试，但是改变了电击强度。此时实验参与者似乎穿上了神奇的外衣，因为他们现在忍受痛苦的能力更强了。


    该实验表明，表现出痛苦或者感觉痛苦的部分动机与周围人的表现相关。研究中的人们不是仅仅表现得好像痛苦减轻了，而是在能够“忍受”痛苦的人在场时，他们的皮肤和心率反应真实地反映出他们没有那么痛苦了。


    一个古老的电视节目《真实视频秀》（*Candid Camera*）幽默地展示了社会认同的威力，视频详见 [www.social-engineer.org/framework/Influence_Tactics:_Consensus_or_Social_Proof](http://www.social-engineer.org/framework/Influence_Tactics:_Consensus_or_Social_Proof)。


    视频展现了电梯中的实验对象如何在他们人的影响下面朝不同的方向站立，甚至在某一时刻会面向电梯内侧站立，因为其他人都这样。电梯实验中有4~5个参与者是我们特意安排进去的。每隔一段时间，这几个人会同时面向左、面向右或者面向后。几秒钟后，隐藏的摄像机捕捉到电梯里的其他人也开始模仿他们，面向同一方向、脱下帽子或者做其他动作。


    社会认同可以说是社会工程中的一件致命武器。通过告诉对方其他人甚至是行为榜样都采取了某种行为或表现，可以刺激对方也这样做，这就是社会认同原则的作用。社会认同提供了一条决定应该如何表现的捷径，但同时也使得人们易被想要利用这种影响的其他人所操纵。


    社会认同在以下两种情况下最具影响力。


    +   - **不确定** 在人们不确定并且形势不明的情况下，他们更可能观察他人的行为，并认为这种行为是正确的。

    +   - **相似性** 人们更倾向于跟随与自己类似的人的引导。


    在这些情况下，社会工程人员可以运用社会认同工具。向目标明示或者暗示之前很多人采取过某一特定的行动，会提高成功的几率。'
