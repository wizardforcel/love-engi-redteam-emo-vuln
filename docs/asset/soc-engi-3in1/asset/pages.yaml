  md: '在一期《骗术真相》节目中，保罗·威尔森设置了一个场景，在骗局中他让一位明星从商店里偷CD。商店雇员扣押了明星，等待警察的到来。之后保罗走了进来，说自己就是警察，还将他的钱包在对方眼前晃了一下，钱包中只有他小孩的照片，然后他“逮”走了明星，并且将CD和收银机中的现金一起作为证据带走了，没有人提出质疑。这个故事非常适用于说明这类问题构造的操纵方法。保罗有一个问题（小偷明星），然后将自己装扮成问题的解决方案（警察）。不管场景如何，在提出你的要求之前，要构造一个问题，以方便你这个好人出场，而那个问题会让你想操纵的人接受你的要求。


    # 6.4.3　你不能让我买那个


    卡马克¹。我很想在这一节只写这一个词，但感觉还是得多解释一下。卡马克提出了一种思路，称为产品陈列示意图或者货架图，通过这个图告诉零售商怎样基于产品的颜色、尺寸和其他标准来展示其产品，以刺激顾客购买和消费的欲望。


    ¹ 财富500强公司之一，总部位于美国，主要从事零售业务。——译者注


    货架图旨在优化视觉效果和商品摆放。


    这些图的使用就是一种形式的操纵，因为研究者仔细分析了人们逛商店、思考和购买的方式。通过对这些方面的理解，他们设计出了控制视觉输入的机制，从而刺激购物者的购买欲望。


    软件以及整个公司都致力于计划和执行这些货架图，以期达到让客户尽可能多购物的效果。


    他们使用了3种操纵购物者的布局方式。


    +   - 水平放置商品　要提高顾客对特定商品的注意力，可以将此种商品一个挨一个地水平放置。一些零售商发现，一种商品的最小放置区间在15~30厘米，这样才能有效吸引顾客的注意力（参见图6-9）。'
