    图5-16　人类思维缓冲区溢出实验一


    这个游戏并非表面上那么简单。如果你成功通关，可以试试不断加快朗读速度。对于大多数人（如果不是所有人）来说，至少有一次你会习惯性地读出单词，而不是其颜色，或者你会发现自己在整个过程中都很挣扎。


    为什么这个实验这么难呢？因为植入的命令。我们下意识地要读出这些单词而不是其颜色。这就是人类大脑连接的方式。大脑看到了颜色，但是首先会对单词的拼写作出反应。也就是说，思维中出现的是单词而不是其颜色。这个实验显示人类大脑中执行的代码可能会与人们想到或看到的相反。


    # 5.6.1　设定最基本的原则


    在一篇名为 Modification of Audible and Visual Speech 的论文（详见 www.prometheus-inc.com/asi/multimedia1998/papers/covell.pdf）中，米歇尔·科维尔（Michele
    Covell）、马尔科姆·斯莱尼（Malcolm Slaney）、克里斯托夫·贝格勒（Cristoph Bregler）和玛格丽特·威斯考特（Margaret
    Withgott）4位研究员共同指出，科学家已证明人们在一分钟时间里只能说出150'
