  md: '# 1. 摄像机


    现在可以找到形状像纽扣和钢笔的摄像机，它们可以隐藏在笔尖、时钟、泰迪熊玩具、假的螺帽和烟雾报警器中，基本上能想到的任何设备都可以隐藏摄像机。要像图7-10那样安装摄像机已非难事。


    ![](img/9f6d2369b69b99fb89843058054e5812_274_0.png)


    图7-10　隐藏在领带中的摄像机


    信不信由你，这条领带隐藏着全彩摄像头，使用12伏电源，并连接一个小型录制设备。戴着这条领带进行社会工程审查，绝对可以录制70度视角以内的一切事物。


    使用类似的录制设备好处多多，比如社会工程人员可以全力关注事先准备好的伪装或诱导方案，而不必担心遗漏任何细节。


    关于录音设备的使用，我给大家讲个故事，是关于我对一个提供在线售票服务的主题公园进行的一次安全审计。这个公司开设了一个售票窗口，有一名女工作人员在里面操作Windows系统的计算机。我假装在酒店通过网络购买了入场券但是不能打印出来，于是将入场券转换成PDF格式的文件，并以邮件方式将其发送给自己。我对她说：“我知道这个要求很奇怪，但是我女儿在一家餐厅看到了你们的广告，接着我们就立刻回酒店使用折扣码买了票，买完后却发现不能打印。酒店的打印机发生了故障，可我不想就这么浪费了入场券，所以把它们转换成PDF文件并发送到自己的邮箱中。您能帮我查看下文档吗？我自己登录也可以。”“孩子”就等在一'
