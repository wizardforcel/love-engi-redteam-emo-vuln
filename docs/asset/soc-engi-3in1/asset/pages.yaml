    # 7.1.4 Wombat PhishGuru


    使用Wombat Security’s PhishGuru

    (http://www.wombatsecurity.com/solutions/anti-phishing-training-suite)模拟钓鱼攻击服务，你可以通过发送模拟钓鱼邮件来评估你的员工易受攻击的程度并鼓励他们加强训练。当有员工落入陷阱时，它会显示独特的“教育提示”。员工面前会立刻出现一条持续显示10秒的信息，告诉员工刚刚发生了什么以及如何避免将来遭受类似的攻击。


    这一信息会提醒员工自身存在易受攻击的风险，并激励他们进行后续的互动训练。PhishGuru还包含一种自动注册功能，它会给落入陷阱的员工立刻发送一封训练安排邮件。


    # 优点


    +   - 自动功能提高了模拟钓鱼攻击的效率，使得外部钓鱼攻击的成功率大幅下降。

    +   - PhishGuru的自动注册功能与其安全教育平台相关联，允许你自动为落入陷阱的员工安排接下来的深度训练。

    +   - 可以选择一周中的哪几天或一天中的哪段时间向终端用户进行随机的模拟钓鱼攻击。错开邮件发送时间并随机选择收件人，可以让员工不那么容易察觉出模拟钓鱼攻击。'
