- pgno: 505
  md: '![](img/9f6d2369b69b99fb89843058054e5812_505_0.png)


    图 5-24  在 “社交微笑” 中，眼睛不参与表现微笑


    如果你表现出了社交微笑，一般的人并不会看着你，心想：“哇，那个人只用了颧骨主要肌肉而没有使用眼轮睑肌间的肌肉。那個笑容肯定是假的。” 但是对方会觉得不舒服，认为你没有表达真实的情感。


    社会工程师希望能让目标对象微笑、感觉良好，认为自己值得信赖。一个真诚的微笑就能实现这些目标。在名为 “微笑的价值：人脸博弈论” 的研究中，斯加勒曼、埃克尔、卡雷尔尼克和威尔森指出，微笑这个简单的动作就能建立起你与对方的情感纽带，并告诉对方你值得信任，能为对方带来快乐。要阅读完整的文章，请登录：
    www.sciencedirect.com/science/article/pii/s0167487001000599。


    在了解这些后，社会工程师理应确保自己能够在掌握紧张、恐惧、愤怒和其他感觉外，同样掌握开心的情绪。能够帮助我们的是相互混杂的各方面，如倾斜头部（下一章内'
  merge: -1
  img_proc: true
- pgno: 506
  md: '容）、开放的腹部动作（见第3章和第4章）以及压低的声音（见第2章）。


    # ### 分解


    按照以下的步骤操作就可以表现出真诚的微笑。


    +   (1) 开始思索那些让你开心的事。


    +   (2) 在扬起嘴角的时候抬高脸颊，如图5-25所示。


    ![](img/9f6d2369b69b99fb89843058054e5812_506_0.png)


    图 5-25 请注意脸颊抬起的方式，这样做将嘴唇上拉，形成了微笑。真诚的微笑能够调动更多的脸部器官，包括嘴、脸颊和下颌。有时还会有脸红的现象


    +   (3) 不眯眼睛，提高脸颊。这样做会把眼睛向上推，形成鱼尾纹（见图5-26）。


    ![](img/9f6d2369b69b99fb89843058054e5812_506_1.png)


    图 5-26 我们能从眼睛里看到真正的开心'
