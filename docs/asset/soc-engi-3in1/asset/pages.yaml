- pgno: 702
  md: '互联网上有很多慈善机构在寻求帮助和捐款。我以一家虚构的慈善机构的名义写了一封关于“9·11”事件的钓鱼攻击邮件。我对此很自豪，它看起来十分逼真，利用了各种激发情绪的手段。


    在正式发送前，我把这封邮件发给人事部门审核，人事部门拒绝了我的发送请求。我不能理解这是为什么，于是我们开了一个会。在那家公司里，有很多人länder在那次袭击中失去了家人和朋友。如果公司为了开展钓鱼培训授权发送这么一封邮件，那他们会怎么想？


    我能听见你的抱怨和难以置信的叹息：“但是坏人会那么做，所以人们需要学习！”我同意这一观点，但我并不是坏人。我在乎我的客户；我在乎他们的感受和他们的员工。我不想发送会造成永久性情感伤害的钓鱼邮件。那封邮件并没有发出，而我从那件事里学到了很多。


    还有一个反面的例子。我曾经发送过一个二级攻击的最简易程度的钓鱼邮件。邮件大意如下：“感谢您将信用卡邮件地址更改为attacker@hack.com。”当然原话比这更动人一些，不过这是主要前提。


    我们把这封邮件发给了上万人。很多人感到不安，但更多人克服了这种情绪。然而有一位女士极其不安，以至于取消了所有的信用卡，转移了银行账户，并回复邮件称将以死相威胁。


    我采取了与之前“9·11”的例子中完全不同的视角来看待此事。这位女士点击了链接，链接将她引向一个教育页面，但即使看到这个教育页面，她也依然决定取消所有的信用卡和银行账户，而不是采取她之前被教导过的方法（例如给IT部门打电话）。如果她按照之前学到的去做，那么她也许就不会这么心疼了。


    针对你的培训，选择适合你难度级别，然后编写一些符合前文提及的原则的邮件，要让它看起来可信，然后开始钓鱼攻击。


    警告 记住，你知道这是钓鱼攻击，因为是你发起的，所以其中的信息在你看来一目了然。但是不要认为你看得很清楚就意味着别人也能看得很清楚。开始时尽量简单一点吧。


    # 5.2.4 追踪和统计


    第7章会介绍很多用于钓鱼攻击数据追踪的软件。牢记你想要什么软件和什么功能，因为你的选择会影响你收集到什么样的數據。电子邮件营销软件只能大概了解谁点击了邮件，而使用强大的SaaS（Software
    as a Service，软件即服务）解决方案可以追踪每一个你想要知道的细节，因此二者的区别很大。'
