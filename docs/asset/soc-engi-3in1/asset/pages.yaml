- pgno: 55
  md: '2007年到2008年间，英国、法国和德国都通过了相关的法律，认为创建、发布和拥有能够导致他人入侵计算机的工具都是违法行为，端口扫描工具也在其中。


    当然，如果是收费的信息安全审计，这些都应在合同中描述清楚。对社会工程人员来说，应该熟知当地法律，避免做出违法行为，这非常重要。


    # ## 4. 社交媒体


    很多公司最近开始热衷于在社交网站上做推广和营销。社交网站的营销成本低廉，又有大量的潜在消费群体。这里提供了来自于企业的另外一股信息流：活动安排、新产品发布、新闻报道以及一些能与当前热点事件挂上钩的文章，等等。


    近期，社交网络正在逐步显示它们的作用。每当一个站点成名，便会涌现一系列采用类似技术的站点。有了Twitter、Blippy、PleaseRobMe、ICanStalkU、Facebook、LinkedIn、MySpace等站点以后，人们的生活和行踪被晒在了网上。随后，我们将深入讨论这一话题，你将发现社交网络作为信息源的神奇之处。


    # ## 5. 个人网站、博客等


    像博客、维基、网络视频等个人网站不仅会提供目标公司的信息，还会透露这些信息上传者的个人观点和信息。在博客上对企业满腹牢骚的员工会和那些持有类似观点的人相聊甚欢。不管以什么样的方式，人们总会在网上张贴大量的数据信息，任何人都可以阅读。


    举个例子。让我们一起来看看最近出现的一个网站——www.icanstalku.com（参见图2-4）。不同于它的域名，这个网站并不是鼓励人们去跟踪别人，它跟踪的是那些毫无防范意识的Twitter用户。它遍历Twitter网站，寻找那些塞到用户自己的智能手机拍摄照片并上传的家伙。很多人都没意识到智能手机拍摄的照片会隐藏GPS信息。你上传这些照片的同时，也泄露了自己的拍摄位置信息。'
