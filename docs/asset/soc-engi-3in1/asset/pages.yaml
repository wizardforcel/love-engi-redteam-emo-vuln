- pgno: 488
  md: '我从未见过那个女孩，但是当我看到这个新闻时，我的内心感受到了悲痛和孤寂。这就是悲伤的力量。人类都有同情和怜悯之心，这种情愫与生俱来，能够轻易地影响我们的情绪内容。


    悲伤的程度可以从轻度不适到极度悲伤。读懂悲伤的情绪会帮助我们更好地交流和理解他人的情绪内容。作为社会工程师，学会适当地表现这种情绪对于获得对方的同情（与悲伤密切相连的情绪）大有帮助。


    我曾经受雇通过电子的方式获得进入一栋大楼的许可。我的目标是用USB钥匙将一些恶意攻击软件下载到该公司的电脑网络中。房方想让我来检验他们公司禁止员工使用外来设备插入公司电脑这一政策的执行情况。


    我穿了衬衫，系了领带，还夹着一个马尼拉文件夹。文件夹里装着我打印好的所谓“个人简历”。我和同事往USB钥匙里加载了一份简历。这份简历中嵌入了恶意代码（亦称“壳”），如果该简历被点击，我们就可以远程操控该公司的网络。我还有一份好的简历，如果那份有恶意代码的简历“失败”了，目标对象还可以点击这份好的简历。


    我把车停在了停车场，打开车门，然后把一杯咖啡洒在了我装着简历的那个文件夹上。


    当我进入办公楼的时候，我知道我需要真实、恰当地表现我的悲伤，过于悲痛或微怒的表情都不合适。我的表情与图5-9所示的阿玛雅的表情类似。当我拿着湿漉漉的文件夹走到前台的时候，前台的秘书问道：“哦，天哪！亲爱的，发生什么事了？”我快速扫了一眼她桌上的照片，然后看到了一个孩子和一只猫。'
