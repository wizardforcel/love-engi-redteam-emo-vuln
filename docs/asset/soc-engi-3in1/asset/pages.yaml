- pgno: 453
  md: '# 3.1.5 低自信和按压手部的动作


    正如双手能够告诉我们对方感觉不错、很开心或者很积极，它们也能告诉我们对方感到情绪低落或者有压力。接下来将介绍一些例子帮助你更清晰地了解他人的情绪状态。


    # 1. 揉搓双手


    当人们感到紧张或不适的时候可能会握紧双手。如图3-5所示，我们称之为“白色指关节效应”。其他时间，他大概会搓手或揉手。也可以从他人摆弄戒指或其他手势的操纵性动作中看出一个人的不适感（参见图3-5到图3-7）。不停地叩响指关节，用手抓、揉，或者是对衣着及身体部位实施操纵性动作都是人们消极情绪状态的体现。


    # 2. 拇指动作


    竖起拇指表示一切顺利，而拇指向下则表明全是坏消息（如图3-18所示）。此外，高举拇指是自信的表现，而放低拇指或者藏起拇指则是缺乏自信或安慰的表现。注意图3-19中，虽然他手部或许呈现出尖塔形手势（表示高度自信的动作），但是藏起来的拇指则暗示截然相反的情绪状态。


    ![](img/9f6d2369b69b99fb89843058054e5812_453_0.png)'
  merge: -1
  img_proc: true
- pgno: 454
  md: '图 3-18 表示不满


    ![](img/9f6d2369b69b99fb89843058054e5812_454_0.png)


    图 3-19 藏起来的拇指暗示缺乏自信


    # 3. 缺乏自信导致的手部闭合


    正如前面所说的，手能够很大程度上表现人们的情绪状态。鉴于手抬高的程度代表自信的程度，我们需要特别注意手部闭合这种非语言动作。


    如图3-20所示，某人可能在站立的时候把手放在背后或者口袋里。这个时候先观察其他的暗示，之后再看他做出这个动作是否是因为缺乏自信。'
