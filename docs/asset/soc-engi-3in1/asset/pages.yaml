  md: '击率的显著增加，同时报告率也有了一点增长。于是第四季度我们停留在三级攻击的最简易程度。点击率下降了。针对这家公司的持续培训和测试看起来还是奏效的。


    +   - 公司二 我们被要求再次开展这一培训。这家公司已经自己组织了一年的钓鱼攻击训练，他们的点击率很低，上级对此也很支持。


    我们每个月都对所有员工进行钓鱼攻击。我们以二级攻击的一般程度开始，然后每月提升难度。第四个月时我们已经处于三级攻击的一般程度了。我们发现虽然点击率增加了，但是接下来的几个月里，有更多的人识别出了钓鱼攻击。


    正如你所看到的，你从哪种难度开始取决于很多因素。请记住下面这个简短的问题清单。


    +   - 你曾经进行过钓鱼攻击吗？

    +   - 你的上级（即可能阻止培训进行的人）坚定支持你的计划吗？

    +   - 你想多久进行一次钓鱼攻击？

    +   - 是否要对所有员工进行钓鱼攻击？


    # 5.2.3 编写钓鱼攻击邮件


    你已经划定了基线；选择了难度；每个人都同意参与；准备好开始钓鱼攻击了。如果 你独自开展这个项目，并且使用钓鱼攻击工具协助你，那么你可能会跃跃欲试，想要从软件中选一个模板，然后点击“发送”。


    先别急着点击。在你着手进行钓鱼攻击前，让我们谈谈可以帮助你进行完美的钓鱼攻击的一些办法。


    有些软件里的模板的确不错，但是它们会对你的公司起作用吗？通过对本章所提出的问题的回答，你应该对你想进行哪种钓鱼攻击有了清晰的答案（例如是否附上商标、是否使用指向性话语、是否与人合作）。


    然后你要决定如何更好地帮助员工。让我来说明一下这一点。我通常都是很实际的。我喜欢从新闻里找一些例子，然后用它们说明坏人通常是怎么做 的。有这么一个例子，发生
    在“9•11”事件的两年还是三年后，当时临近“9•11”的纪念日。'
