- pgno: 685
  md: '标识。现在暂时不考虑这些，以下提供了一些基本的信息。


    商标是指公司用来表示产品或者服务属于它们的文字、图像、短语或者符号。美国联邦法中主要的商标法规是载于《美国法典》第十五编的《兰哈姆法》（Lanham Act,
    15 U.S.C. §§ 1111 - 1129）。尽管商标法在过去几十年里有所发展，添加了很多复杂的条款，但一些基本要求是不变的：原告必须在开庭前找到被告未经授权使用商标的证据。


    +   - 原告必须证明拥有有效商标。

    +   - 原告必须证明被告在未经授权的情况下，在所出售的商品、服务或广告上使用了相同或者相似的商标。

    +   - 原告必须证明被告使用这个商标容易造成人们的混淆。


    其中第二条对钓鱼攻击来说最为关键，因为它表示如果不在含有广告或者产品促销信息的钓鱼邮件中使用商标，那么会更安全；反之则不然，即使你只是用它来愚弄你的客户或者你自己的员工。


    在你决定是否使用商标前，还有一些其他问题要考虑。


    +   - 你和你的客户有可能得到商标持有者的授权吗？（如果可以，那么请确保得到纸质的许可。）

    +   - 即使有很好的理由表明你没有侵犯其他人的商标，并且你最后在法庭上获胜，你也要考虑到昂贵的律师费、所耗费的时间和所承受的压力。如果真有公司决定起诉你，那么你做好在庭审上花费大量的时间、金钱和精力的准备了吗？

    +   - 你正考虑在钓鱼邮件中使用某家供应商的商标以显得更真实一些，但是是否你的客户也在使用那家供应商的服务？如果不是，那这么做值得吗？举例来说，我见过一个使用UPS商标的钓鱼邮件，它几乎骗过了所有人。但是我现在的客户只用FedEX（联邦快递）。因此，如果仅仅是为了使用UPS商标而向这位客户提议在训练中使用带有UPS商标的钓鱼邮件，那岂不是太傻了吗？


    在钓鱼攻击模拟中，你对这些问题的回答会极大地影响着你对是否使用以及如何使用商标的态度。


    我知道你现在可能想知道我的意见，让我来告诉你吧。我赞成使用商标。以做饭为例，我第一次试着做奶酪蛋糕时没有用烤盘。做出来的蛋糕没问题，但是不像外面卖的那么好看。如果你们中有人也做过奶酪蛋糕，那么就会知道并不是买回烤盘来'
