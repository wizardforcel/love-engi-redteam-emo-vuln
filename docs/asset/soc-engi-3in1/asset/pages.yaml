- pgno: 492
  md: '+   - 双目低垂；

    +   - 下唇的中心部位会向前突出。


    ![](img/9f6d2369b69b99fb89843058054e5812_492_0.png)


    图 5-12 收紧的双眉能体现悲伤


    只用眼眉就可以做出和悲伤或同情相联系的表情。这项技能可不是一蹴而就的。艾克曼博士称如果不是因为真的感到悲伤，很少有人能做出这样的表情。还是那句话，熟能生巧（还有建立共情联系）。


    # 5.2.5 轻视


    在《情绪的解析》一书中，艾克曼博士指出：“轻视只是对于人或人的行为的感受，而不是对味道、气味或触觉的感受。”


    周毅学（音译）是宾夕法尼亚大学的一名研究员。在他的论文《轻视与自尊》中，他将轻视定义为“对那些在道义或者社交上逊于自己的个人或群体的情感反应”。


    费舍尔和罗斯曼在他们的研究论文《打击他们还是禁止他们：愤怒和轻视的特征及社会功能》中进一步给出了轻视的定义。他们认为轻视的目的是，将我们轻视的对象排挤出我们的社会团体或阶层。


    从上述各种定义中，我们可以轻易看出轻视是一种消极的情绪。这种情绪是社会工程师在工作过程中不愿表现出的，也是 mostró 还在不愿在互动中从对方脸上看到的。'
