  md: '话说回来，米尔格兰姆所研究的是人们对权威的服从，但你也能从中看到一致性和承诺在个体身上施加了多少压力。


    # ### 3.6.7 喜爱


    **定义**　　你曾经遇到过一见面就喜欢的人吗？除了这个人迅速建立融洽关系（请看专业建议！）的能力外，你认为你喜欢这个人的原因是什么？我们倾向于喜欢那些喜欢我们的人。我们也**确实**喜欢那些像我们的人。广告商一直在使用这一原则：雇用我们喜欢（并且想要去模仿）的演员或者和我们能产生联系的演员。


    **例子**　　不幸的是，恶意攻击者也常常利用我们想要帮助喜欢的人的愿望。典型的“滞留旅客”钓鱼攻击生效的原因是，骗子盗取了某个人的邮箱，然后联系他的朋友和父母，假装受害人并声称需要钱。^13^


    > > 13 Liz Phillips, “How I Got Caught Up in a ‘Stranded Traveller’ Phishing Scam,”
    *The Guardian* website, November 13, 2013, http://www.theguardian.com/money/2013/nov/13/stranded-traveller-phishing-scam
    .


    **专业建议**　　因此，你该如何让某人立刻喜欢你呢？专业社会工程人员通过发展某些品质来建立融洽关系，如积极聆听，以及与语言相一致的非语言行为。另一个增加好感的简单的办法是，识别出你和目标之间确实存在的相似之处。当你和某人有共同点时，他就很难向你说不。


    # ### 3.6.8 社会认同


    **定义**　　我处于一个真实的两难境地。我有时候去一类餐厅，那里是在吧台点餐，然后找个位置坐下来等上菜。应该付小费吗？我不确定。有时候鼓励我付小费的原因是看见吧台上有装小费的罐子，这是一种行为上的社会认同。**社会认同**
    是我们的自然倾向，即通过观察他人来指导自己的行为。像刚才那样的两难情况下，这一作用尤其强烈。


    **例子**　　由于我们的社会性，社会认同是一种极为强大的影响原则。我们会想：“如果其他人都这么做，那么这件事就是正确的。”骗子已经在利用这一倾向，不过我们现在如此紧密地通过互联网相连，尤其是在社交媒体上，于是这就成为了一个很大的问题。第1章中提到过，灾后骗局激增，因为人们想要帮助他人的心愿被利用。这些骗局在社交媒体上传播迅速^14^，并给人一种每个人都在通过某种途径进行捐款的错觉。


    > > 14 Matt Liebowitz, “Tips to Avoid Japanese Earthquake Phishing Scams,” NBCNEWS.com,
    March 11, 2011, http://www.nbcnews.com/id/42036358/ns/technology_and_science-security/t/tips-avoid-japanese-earthquake-phishing-scams/#.VBYrJkig6bB
    .'
