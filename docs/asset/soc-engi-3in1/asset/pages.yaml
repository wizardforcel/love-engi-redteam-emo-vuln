- pgno: 204
  md: '作为社会工程人员，如果让步会导致丢脸、丧失共识或者失去有利位置，也是得不偿失的。让步和你与目标的关系之间必须实现微妙的平衡，找到平衡点就意味着成功了一半。找到它，让步就会成为你手中的一件利器。


    # ### 6.2.4 稀缺


    如果物品或者机会比较稀缺或者难得，人们通常会觉得其更有吸引力。这也是我们经常在报纸和电台广告中看到或听到“最后一天”、“限时提供”、“仅售三天”以及“关门甩货”等信息的原因，这会诱使人们尽快去购买这些“以后再也不会有”的产品。


    销售场景中使用稀缺概念的最典型语句就是“尽快行动！限时特供！”。还有一些也很常见，比如“最先打入电话的X位将获得免费的附件”，或者为流行产品故意制造一个短缺的假象。最近，任天堂Wii游戏机的销售就应用了这一策略。Gamasutra游戏网站的专栏作家贾森·多布森（Jason
    Dobson）说：“但是我认为任天堂有意制造了供应短缺的假象，他们想在财年内卖出更多设备。新财年起始于4月1日，我认为供应会很充足。”（详见 [www.gamasutra.com/php-bin/news_index.php?story=13297](http://www.gamasutra.com/php-bin/news_index.php?story=13297)。）


    在我居住的地方，一家汽车经销商在某周四发布广告说，由于新车到货他们将会处理XX辆车，价格极低而且有些车型不会再生产，该周末是见证一段汽车销售历史的最后机会。


    那个周末的销量就像乘坐了火箭，那么空仓销售结束了吗？没有，那个广告持续播放了三个多月，每周四都会出现。我经常奇怪人们为什么就不明白，但是经销商确实通过这种方法卖出了很多汽车。


    如果应用了稀缺策略，社会事件经常会引起更多的关注。在这种情况下，意识到参加这些社会活动的好处经常会不断点燃人们的热情。广告策略中，关键点就是宣告最后的演唱会门票即将售罄，这会收到很好的效果。


    很多受欢迎的餐馆会关闭一部分区域，造成更加繁忙的假象。这种极度受欢迎的现象会增强人们在那 边订餐的欲望。如果要看一个真实的利用稀缺策略宣传的广告，可以移步
    [www.social-engineer.org/wiki/archives/Scarcity/Scarcity-Advertisement.html](http://www.social-engineer.org/wiki/archives/Scarcity/Scarcity-Advertisement.html)。


    这个广告中有4个主要部分都使用了稀缺策略：'
