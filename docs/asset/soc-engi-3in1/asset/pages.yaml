  md: '+   - “有人在对你进行背景调查。”

    +   - “突发新闻。〈插入某个地名〉有炸弹爆炸了。”

    +   - “〈插入某种灾难〉重大新闻！点击此处查看更多。”

    +   - “你被邀请接受CNN的采访。请选择一个你方便的时间段。”


    不管原因是什么，新闻和媒体总是广泛用于钓鱼攻击，这一主题会吸引很多人的兴趣。它可以帮助教导你的学员如何辨别真假新闻故事，以及了解钓鱼攻击者在利用某个特定主题时的目的是什​​么。


    # 其他主题/来源


    我在前两节中列出的邮件类型只是部分例子。实际上钓鱼邮件有很多种，即使没有上百种，也远远超过了此处能够列出的数量。


    由于我不能把它们全列出来，我会把与你的公司无关的其他主题包括进来，它们可能来自供应商或者内部来源。看上去似乎来自Facebook、亚马逊和LinkedIn的钓鱼攻击邮件都可以被纳入其中。


    +   - 供应商


    社会工程人员用来查找目标公司的一种办法是：查出目标所使用的全部供应商。钓鱼攻击者会研究废品管理公司、电话和网络提供商、电力公司、软件和硬件供应商，甚至你的安全服务供应商。


    为什么这些信息对他们来说很有价值呢？因为社会工程人员知道，你和你的员工更倾向于信任可信的供应商，并更愿意打开来自它们的链接、附件，或者向它们提供信息，而新出现的陌生来源很难做到这一点。


    钓鱼攻击者凭借这一事实，想要让你“采取一些不符合你的最佳利益的行动”，他们愿意冒充你的供应商来达到这一目的。一位社会工程人员如果知道你的废品管理公司叫WasteR-Us，域名是www.wasterus.com，那么给你发一封来自accounting@waterus.com（是的，是故意拼写错的）的邮件就可能会让你打开一个含有恶意代码的PDF文件。


    一个难题是：安全服务供应商使用其他公司的商标和标志来做测试是否合法且符合伦理道德的吗？我对此有一些思考，会在下面的5.1.3节中进行讨论。


    +   - 内部来源'
