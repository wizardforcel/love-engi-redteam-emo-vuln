    # 图 3-4 是“好运”还是猥亵的手势？


    这些只是众多象征动作中的几个。每个象征动作都有一个直接的言语意义，而且与该意义准确相符。象征动作都是有意而为之。接收者明白其接收到的信息就是为他（她）而来，动作的发出者也确是有心为之。这也就是象征动作的定义。


    在上述每个例子中，对于象征动作及其起源的了解能够改变我们对他人情绪状态的理解。另外，通过使用基于他人所独有的象征动作，我们还可以有意或无意地改变别人的情绪状态。


    虽然我们身体的很多部位都能做出象征动作，但是象征动作主要都发生在手部，其次是头部、脸部和躯干。'
