- pgno: 672
  md: '正如米歇尔在第3章中提到的，朋友可以很容易地影响我们。钓鱼攻击者知道这一点，他们也知道要让你以为这封邮件是你信任的人发给你的，从而让你信任邮件中的附件、链接或者文件——没有比这刚好的办法了。


    钓鱼攻击者会获得合法电脑的访问权限，并使用它们的邮件服务器来给所有的联系人、好友和收件箱里其他随机的地址发送恶意邮件。如果你收到此类邮件并分析邮件头，那么你会看到什么？


    你会看到一封合法邮件。如果你选择试着去分析邮件头，仍然要记住在你相信任何邮件之前，你都要思考一下那些批判性思维的问题。尽管分析邮件头可以让你避免点击欺诈邮件，但是并不能100%保证你可以识别出所有的欺诈性邮件。


    # ## 4.5　第五课：沙盒


    +   - 分类：专业


    首先，我想谈谈沙盒是什么，这可以帮助你理解为什么本节提供的是专业建议。沙盒（sandboxing）是一个科技领域的名词，指的是创建一个可以运行未经测试或者不受信任的代码的环境。这些代码可能包含病毒或者恶意软件，或者出于其他原因而不可信任。所以在用户想要在他们的系统或网络中使用它们之前，他们可以拥有一个几乎对主机没有任何影响的环境来执行这些代码。这个概念非常简单，图4-9是沙盒的一个简单示意图。


    ![](img/9f6d2369b69b99fb89843058054e5812_672_0.png)


    图 4-9　简化的沙盒'
  merge: -1
  img_proc: true
- pgno: 673
  md: '这个理论很棒，它对很多威胁都有有效。我曾见过有公司把所有收到的邮件集中到沙盒中进行处理。链接可以被自动系统确认，附件可以被扫描，甚至被打开。只有确保安全之后，它们才会发到指定人员那里。


    沙盒的概念很聪明，也很高明。（在iOS和Android平台上都有沙盒应用，可以用来打开邮件中的附件而不影响手机本身。）一般来说普通家庭或者小型企业根本想不到可以使用沙盒。


    很多大公司使用虚拟机来创建沙盒。这种环境允许一个基于任何操作系统的“虚拟”的电脑运行，因此邮件和其他应用都可以在上面测试以确定其安全与否。


    尽管我不会讲如何 建立一个沙盒（因为那并不是这本书的目的），但我想提及它作为一种可行的防止人们遭受钓鱼攻击的手段。


    # 攻击者是如何绕过防御的


    我在写作本章时读到了一个故事，故事是关于邮件中附带的某种来源于一个叫Quarian的组织的恶意软件。这种恶意软件于2011年在附件中被发现，能伪装成PDF、DOC或者XLS文件。这个组织主要是对政府部门进行鱼叉式钓鱼攻击。


    现在看来，Quarian又回来了，并升级成了一个更邪恶的版本。这个新版本包含了某些需要注意的功能。


    +   - 它自动安装成一个Windows服务，不再只是一个运行程序。

    +   - 它通过运行一系列的命令连接到国外的服务器来下载有效载荷。 3

    +   - 它依赖AppID或者命令行交互，因此它不会被沙盒检测到。


    3 病毒通常会做一些有害的或者恶性的动作。在病毒代码中实现这个功能的部分叫作“有效载荷”。——译者注


    另外，六年多以前我和马蒂·阿哈罗尼（Mati Aharoni）一起工作，他是BackTrack（现在的Kali Linux）的安全专家和创始人，他给我展示了一种能通过虚拟机直接感染主机的恶意软件。


    这意味着什么？攻击者变得更聪明了，他们正在学习如何绕过这种我们用来抵御他们攻击的方法。（以五倍语速再说一遍。）


    我认为有一条规则与任何人的因素所导致的问题的技术解决方案相通，那就是：“仅仅依靠技术，并不能让你免于社会工程人员的攻击。”'
  merge: -1
  img_proc: true
- pgno: 674
  md: '与很多我们所看到和提出的好主意相比，我和米歇尔也曾遇到过很多非常糟糕的主意。下一节我们会来讨论这些主意以及它们为什么那么糟糕。


    # 4.6 “绵羊墙”或者坏主意陷阱


    很多概念表面上听起来很棒，可以保证员工的安全，其中有些甚至有希望成功，但是我们将其归为“坏主意”一类。


    下面是一些我们听说过的在公司使用过的坏主意，本节会谈谈它们是怎么回事，以及为什么它们弊大于利。


    # 4.6.1 复制粘贴，麻烦解决


    一条我在一家公司培训课程上亲眼目睹过的建议是：“如果你不确定你在邮件中收到的链接是否安全，那么选中它，然后复制并粘贴到浏览器的地址栏中。”


    我很确定你们会立刻明白，为什么这一建议会名列史上最糟糕建议的前茅。但以防万一，我们来分析一下。如果你收到一封钓鱼邮件，里面附有一个链接 www.superbadhackingsitethatwillruinyourlife.com，你选中它，然后复制、粘贴，那么你猜你会进入哪个页面？是的，你猜对了——你仍然访问的是
    www.superbadhackingsitethatwillruinyourlife.com。


    > “但是，”你会说，“如果URL看起来像是www.microsoft.com，而它所指向的网站是一个恶意网站，那么复制粘贴不就会失效吗？”


    是的，从技术上来说，如果你让你的用户只是复制那段文本，那么他们会访问的就是那个文本所示的网站。但是如果用户误点了那个链接而不是复制，或者他们错误地选择了右键复制那个链接而不是选中复制，或者他们作了上述两件事的组合，他们仍然会访问到一个恶意网站，并有可能将恶意软件带入到你的网络中来。


    所以说，安全起见，我们告诉普通用户不要点击链接。不要靠近它。不要复制粘贴它。除非你非常熟悉如何解码URL，否则不要试着分析它。


    # 4.6.2 分享也是关照


    另外一个主意是这样的：“我刚收到一封邮件，我认为可能是钓鱼邮件。我把它转发给我的最懂电脑技术的五位朋友，这样他们就能告诉我这是不是钓鱼邮件了。”'
  merge: -1
  img_proc: true
- pgno: 675
  md: '如果你这么做了，那么你所做的就是转发了一个有潜在危险的恶意邮件给了五位朋友。如果这些朋友和你在同一家公司工作，那么你可能在公司里散布了潜在的威胁。如果他们在另一家公司工作，你可能传播了病毒，帮社会工程人员做了他们想做的事。


    上面这个主意和这个说法很类似：“我认为我感冒了。我要去向我的五个朋友咳嗽，如果他们也感冒了，那么我就确认我确实感冒了。”


    在一次审计中，我做了一下USB密钥遗失测试。我们在USB密钥中放置了一个PDF文件，这个文件的功能是“给家里打电话”。它在连接我们的服务器后，会连接到一个Metasploit⁴服务器上，并给我们一个远程shell（或者说对用户电脑的远程连接）。这个PDF文件被命名为EmployeeBonuses（员工奖金）.PDF。


    ⁴ Metasploit是一款开源的安全漏洞检测工具。——译者注


    我们把这个USB设备放在事先约定好的地方，然后回到办公室。等我们回去时，我们已经有七个shell了。我们知道我们只放置了一个设备。我们开始寻找shell所处的单位，然后在人事部门、IT部门以及同一部门的其他地方发现了它们。


    我们感到疑惑不解吗？是的，但我们也很高兴，因为这下我们有很多系统可以选择了。随后我们询问了一下发生了什么，于是我们被告知当第一个人试着打开EmployeeBonuses.PDF文件时，文件崩溃了，于是他拿着这个USB设备去了他在人事部门的一位技术更高明的朋友那里。当文件在第二个人那里崩溃时，他们拿着它去了IT部门的一位朋友那里，这位朋友在他的三台电脑上尝试打开这个文件。最后，这位人事部门员工非常沮丧地随便找了一个人，说：“试试打开这个。”然后这位员工照做了。


    本质上来说，这些人在试图打开这个文件看看他们的奖金时把它传播到了整个公司里。在这种情况下，分享并非是一种关照，尽管你的祖母可能告诉过你乐于分享的好处。可疑的钓鱼邮件也是同理。希望你的公司有一套设计好的方法来报告钓鱼邮件。如果没有，赶快给我打电话吧。


    # 4.6.3 移动设备是安全的


    我曾无意间听到有人这么对另外一个人说：“如果你认为这是一封恶意邮件，那么就在你的上打开它。它们不会像你的电脑一样感染病毒的。”


    听完这话后我有些无言以对，我礼貌地对那个人解释说如今已经有很多针对手机的恶意软件和病毒了。我纠正了他错误的观念，并告诉他这么做是多么危险，以及为什么说这是一个巨大的威胁的原因。'
  merge: -1
  img_proc: true
- pgno: 676
  md: '让我们更进一步。想想假如你的公司允许BYOD（bring your own device，自带设备），然后你的一位客户把他所有的垃圾邮件都发到他的iPad上了，这样他就可以用他所认为的个人沙盒打开它们了。现在他带着他的设备来到你的办公室，然后他做了什么？把设备连接到你们公司的网络里。


    这下你的公司网络布满了病毒。在移动设备上打开恶意邮件绝对是你想要立刻抛弃的“建议”之一。


    # #### 4.6.4 好的反病毒软件可以拯救你


    反病毒，顾名思义，它试着阻止病毒。它是如何做到的呢？病毒有自己的签名——这是一种病毒内存在的一系列起指纹作用的代码。就像你的指纹可以用来识别你的身份一样，病毒的指纹也可以用来识别病毒。


    这些病毒的指纹被放进了反病毒软件的数据库中，然后反病毒软件对你的电脑进行扫描。如果发现某个网页、文件、文件夹或者程序有这些指纹，那么反病毒软件就会清除它，以确保它不会造成进一步的破坏。


    很棒，不是吗？是的。但是反病毒软件是管理软件，而不是安全软件。反病毒软件可以帮助你识别出已知签名的病毒。但如果病毒是新出现的，还没有登记指纹呢？如果病毒使用多态shellcode（shellcode会在每次载入时改变自己的签名）呢？


    你认为我过于夸张了吗？我是在谈某种科幻的东西吗？不。我的好朋友大卫·肯尼迪，一个叫作SET（Social Engineer Toolkit，社会工程人员工具包）的渗透测试工具的开发者，就做到了这一点。他使用这款工具进行的攻击每次都会使用相同的shellcode，但是大多数时候，所有的反病毒软件都无法检测出来。如果好人可以这么做，那么我们可以假设坏人也在这么做。这是否意味着你应该放弃反病毒软件，不再浪费钱购买它们了？不，当然不是。继续使用反病毒软件吧，因为它能抓住那些已经流行了一阵子的讨厌的病毒，但是不要把它当成救世主，因为它不能帮助你抵御有特别目的的攻击者。


    # ## 4.7 总结


    最后一节谈到了shellcode，这使我想起了一个编码工具——一个人们可以通过对shellcode进行编码来给它一个全新签名的小程序——Shikata Ga
    Nai。这是一个多态编码工具，名字来源于日文，意思是“无事可做”，也可以翻译成“没有希'
  merge: -1
  img_proc: true
- pgno: 677
  md: '望”。在回顾我们前面几节中所谈到的内容后，你可能会感觉shikata ga nai，但是不要担心。我的目标就是让你找回一些希望。


    此处列举一下目前我们所知道的一切。


    +   - 坏人更高明、坚定和努力。他们似乎领先于你，并依靠你的弱点取胜。

    +   - 仅仅依靠技术是救不了你的，技术也不应该被视作社会工程学的解决方案。

    +   - 钓鱼攻击是真正的威胁，一种会让你失去你的银行账户信息或者国家机密，以及介于二者之间的所有东西的威胁。

    +   - 如果你的工作是确保公司安全，那么你需要找到那些给你出坏主意的人并清除它们……我是指，清除掉坏主意，而不是人。


    如果所有这些都做到了，那么你还能做些什么？


    教育是解决问题的关键。你必须与公司一起努力来进行持久的、定期的、基于真实案例的教育，要让员工有根深蒂固的观念，并创建安全意识文化。


    现在你可能会说：“我让所有员工参与30分钟或者60分钟的机考，我给他们足够长时间的测试，我每个月给他们发送长达五页的安全知识邮件，但是他们就是学不进去。所以，教育没用！”


    我同意你的观点。这种教育的确没用。你每天收到多少封邮件？50封、100封、200封？你有一份全职工作吗？现在要你把会议、电话、报告、个人邮件、个人问题、工作压力都放到一边，去参加一个60分钟的强制性机考，你认为大多数人对此会怎么想？


    我可以告诉你，但是你可能不想听。这种感觉就像听见钱在火炉里燃烧一样。


    这个问题答案并非像你想象的那样糟糕，也并非要你对所有的用户进行重新编程，解雇所有人，然后重回纸笔工作。


    第5章就是围绕着这一主题展开的。'
