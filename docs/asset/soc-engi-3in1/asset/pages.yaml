    Intelligence的缩写）开玩笑——探听情报就是：“如果你问他们，他们就会告诉你！”关键就在于如何就一个问题进行提问。也就是说你需要采用技术手段从他人那里获取信息。关于这些技术，我通常会引用罗宾·迪克尔余《It’s
