  md: '专业建议 社会工程人员通常制造这种社会认同的假象来鼓励某些行为。其他人完成的调查和请愿使得你更愿意提供个人信息。人们聚集在一起讨论，使得路过的人几乎不可能不下来望一眼或听一会儿。


    # 3.7 与影响相关的更多乐趣


    我们从社会认同很自然地过渡到这一节，因为它对影响原则起作用的原因作了一些解释。最基本的解释是它们都利用了人类的天性，但是也有其他因素在起作用。


    # 3.7.1 社会性与影响


    在这个世界上，社会性与影响有什么关联？事实上二者几乎所有方面都有关联。现代科学的发展使得无论强壮还是瘦弱的人都可以存活；在现代科学出现之前，人们依赖他人的庇护和安慰来抵御外界的威胁。除了少数著名的例外，那些决定远离人群独自生存的人都……死了，和他的基因一起消失。古代最严厉的惩罚就是流放。因此，对一个人所处的社会环境敏感并非只是因为挑剔，还有寻求生存和繁衍的最佳时机的因素。


    这已经变成了我们天性的一部分。我们天生会对明显的或微妙的群体需求有所反应。因此，不要责备那些躲避同辈压力的孩子们，或者说那些盲目从众的人愚蠢，你要明白他们只是在跟随自己的生存本能。


    专业建议 现代社会中，社会工程人员会使用他们所掌握的关于社会性的知识，模拟出群体压力下的环境。即使“独狼”也会在某种程度上感到社会压力，依环境和附近的人而定。社会工程人员通常会构造一种场景来造成某种紧张、担忧的情绪，或者促使人们采取行动。最优秀的社会工程人员可以很自然地做到这一点。这是社会工程人员真正的技巧——刻意营造一个场景，却能让人感觉两个人（或更多人）之间在真诚地交流。


    # 3.7.2 生理反应


    克里斯在第2章中讨论过杏仁核在情绪化思考和理性思考中的作用。当大脑受到刺激时，人体内也发生了一连串有趣的事情。尽管把大脑反应和生理反应分开来说并不合适，但我还是这么说吧。


    如果人体感受到威胁，那么杏仁核就会开始进行一系列活动来保护人体。无论这种威胁是一条鲨鱼要吃掉你，还是收到一封宣告你患有癌症的邮件，你的身体都会产生同样的反应。'
