- pgno: 309
  md: '艾瑞克还很好地掌握并运用了影响策略，在攻击中最明显的表现之一就是他要求警察致电另一位DMV工作人员。这很可能惹恼对方，但是这个策略的成功之处在于艾瑞克之前已经“给”了对方一些信息，也就是他“核实”了对方需要的信息，只不过就在他要为对方提供最后一部分信息的紧要关头，“计算机”挂了。


    通过运用一些影响力的规则，艾瑞克轻松地让对方听从了他的意见。


    与艾瑞克的伪装密不可分的是他成功运用了框架。回忆一下，框架是令自己和自己的故事可信，从而使目标的思维与你的思维一致。这是伪装的关键之一，能使你的伪装更加完美，并使目标对你的话深信不疑。艾瑞克的伪装技巧精湛可信，但是真正让目标信任他的是他使用的框架。他的框架取决于谈话的对象。有时候他必须让电话那头的办公室人员为其提供呼叫中心的号码，有时候他需要成为业务技能娴熟的DMV工作人员。


    艾瑞克利用框架使自己高度可信，他假定自己会获得所谓问的信息，在应对过程中没有慌乱，并且自信地提出每一个问题，让对方“感觉”作出回答是他的义务。所有这些表现使对方落入他的设计，相信他的伪装，并自然而然地作出了回应。


    正如你所看到的，通过分析艾瑞克的社会工程攻击你能学到很多东西。你能够猜想出，艾瑞克要么练习过所有这些攻击方法，要么进行过多次模拟和演练，以便熟悉如何处理攻击中使用的那些内部系统。


    虽然艾瑞克的方法奏效了，但我还想补充一些预防措施。举例如下。


    +   - 处理DMV电话时，我会先确保自己是在“办公室”里再进行呼叫转移。我会设置一个有些背景噪音的办公环境，并准备好记录所有信息所需的设备，以避免我在记录时被服务生或朋友打断而露馅。

    +   - 尽管对反追踪来说，使用一次性手机是个好主意，但还有一种技术可以应用，即利用谷歌语音服务（Google Voice）或Skype号码转拨。我不信任手机信号，因为掉线、信号微弱且不稳定可能瞬间就会导致攻击失败。


    除了这两项，他的攻击中基本没什么需要改进的了。艾瑞克充分运用了社会工程框架中的各项技巧，确保了攻击的成功。'
