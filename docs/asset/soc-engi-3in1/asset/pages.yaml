- pgno: 515
  md: '改变我们的推进方式。如果这是对某个公众事件的反应，我们可以利用这些情绪成为对方的一员。


    想象一下如果我们是在案发现场，或者是目睹了某些可怕的事件。当大家都捂着嘴，倒吸着气，并把脸转过去时，人群中却有一个人脸上洋溢着笑容。你会怎么想？那个人没有融入群体中，却以一个不好的方式引人注目。类似地，社会工程师需要注意自己要接近的人群是否因为某个事件而震惊和惊讶。融入群体的捷径是和自己周围的人群表现出同样的情绪内容。


    举个911事件后的例子。当时我站在一群陌生人附近，当新闻播出第二架飞机撞击第二座楼的时候，震惊和惊骇让人们倒吸一口气。这个动作让我们迅速成为了一个集体。对同一个事件的相同反应将我们的情绪连在了一起。


    寻找（或者更恶劣的是，制造）一种可以利用重大事件加入某个群体的情境，虽然这种做法听起来让人不安，也很恶劣，但却是恶意攻击者屡试不爽的伎俩。


    如果没有很好的理由，我不建议社会工程师使用这个方法。如果你的交流对象在震惊和恐惧之余，觉察出来他们无端被冤，他们会觉得困惑甚至气愤。


    # 6.3 嘴唇


    嘴唇能提供舒适或不适的海量信息。这不仅仅因为它们是发声的器官，更重要的是，它们在不说话的时候也能发挥一定作用。


    有时候对方明明想说什么，但却欲言又止，嘴唇的动作会表现这一点。嘴唇也会告诉我们对方的紧张或是不够自信。这些微妙迹象可以增加社会工程师的行动把握。


    假设你在工作时要面对你所讨厌的经理。你对她说了一些刺耳的话，然后她报以如图6-6的表情。'
