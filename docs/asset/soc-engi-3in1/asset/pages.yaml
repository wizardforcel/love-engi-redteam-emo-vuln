- pgno: 483
  md: '研究帮助我们了解到如果我们的脸上呈现出恐惧、担忧和惊慌，只会对他人的情绪产生影响并引发更多的心理危险信号。


    在这种情况下，我们最好是做出一个开心的表情，但是不能过度。面带微笑，头部微倾就能让你获得信任感。


    关键的一点是要注意到情绪触发点。当你看到担忧或者惊慌情绪闪现时，你要对其有所反应。即便不能完全确定为什么对方会有这样的情绪，也要确保你能够将该情绪重新定向至其他原因或情绪。


    # 分解


    现在我要将恐惧分为几大部分来介绍。这样会帮助你对此有一个更清晰的认识，通过重现该情绪去影响他人，并注意自己是否有做这种表情的习惯。


    以下是PK和我总结的一些窍门，可以帮助了解恐惧包含的动作。


    +   - 尽量抬高上眼睑。如果可能的话，同时收紧下眼睑。对于恐惧来说，最主要的区别就是眼睛睁开的宽度，如图5-4所示。


