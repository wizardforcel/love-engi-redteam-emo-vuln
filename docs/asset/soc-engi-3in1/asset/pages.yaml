- pgno: 522
  md: '社会工程师需要注意自己是否在交流过程中引发了这些动作，如果是的话，要调整自己的行为。同之前章节提到的其他动作相似，我们同样可以利用嘴唇的动作微妙地影响他人的情绪。


    举例来说，当你想请他人帮忙的时候，稍稍咬唇或者撇嘴能够表现出这件事对你来说难以开口。这会为你赢得对方的同情。或者当你讲述一件事情的时候，提到如果任务不完成你可能会丢工作时，做一些撇嘴的动作能够为你的故事增加分量。这样能体现出你对于自己所说的话是多么羞于出口。


    无论观察还是使用这些动作，都要学会识别这些动作的含义。这会对社会工程师的成功起到巨大的作用。


    # 6.4 遮住眼睛


    当人们感到极度悲伤的时候，会使劲闭上眼睛或者甚至把眼睛遮住，如图6-12所示。这是为什么呢？出于生理反应，我们的身体要阻挡或遮住让我们伤心的物品。这种情况也发生在人们不那么悲伤，但是努力阻挡那些能让他们生气、悲伤或愤怒的对象时。


    如果你在工作中看到对方做出这种表现，这正是分析出现这种情绪的原因的好时机，并观察这个表现是否是情绪的基准态。


    当我年轻的时候，人们流行用“妈的”作为开场话去侮辱他人。这似乎适用于任何场合，而且通常会带来笑声。一次我和一位密友在一起，我们彼此相互调侃，当我用到这个词时，我看到了和图6-12类似的情形，还有我朋友的眼泪。我忘记了几周前她妈妈去世了。我说钝和冷酷的言语勾起了她的伤心事。她的表现是努力隔离给她带来痛苦的对象，也就是我。'
