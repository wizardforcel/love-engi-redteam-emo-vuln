    我们需要注意这类钓鱼邮件有着一些关键特征。首先，它们是可以收发的，看起来和真的Facebook邮件一样，有着一样的设计和颜色，看起来简单恰当。此外，标题也是从真正的Facebook邮件中窃取的。如果满足以下各项内容，那么这封邮件就是虚假的。


