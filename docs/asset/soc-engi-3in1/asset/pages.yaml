    框架绝对是一种艺术形式，在与沟通和影响等科学相结合之后，就会变成熟练社会工程人员手中的强大武器，通过以某种形式传递信息后，社会工程人员就能够“轻易”地与目标形成联盟，促使目标在不会感到内疚的情况下采取行动，改变目标对现实的感知。


    框架和影响是社会工程的重要组成部分，但后者经常与社会工程的“黑暗角落”联系起来。本书文前提到了这些角落，下一节内容会改变你对“影响”的看法。'
