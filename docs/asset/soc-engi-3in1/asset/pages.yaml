    # 2.6　总结


    我希望这是增长见闻且富有趣味性的一章，但是这只是其一。本章从决策制定者——那个选择纸而非塑料，或者巧克力而非覆盆子的人——的视角出发，同时也告诉大家收到来自陌生人的邮件时应该保持警惕。


