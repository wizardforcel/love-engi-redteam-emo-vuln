- pgno: 69
  md: '谢谢！


    我的梦幻篮球联赛团队


    这封邮件至少会使那24名联赛球迷感兴趣，诱导他们去点击链接，查看网站并且免费试用这些功能。


    分析一下这封邮件。首先，它有一个吸引梦幻篮球联盟网站现有会员的邀请。然后，他们中的很多人会意识到这个邀请只限定给前100名，所以一收到邮件就会点击链接，而且很可能还是在工作期间。邮件链接的网站含有恶意代码，虽然大部分人会成为受害者，但是只要有一人落入圈套，社会工程人员的目的就已达到。


    同样需要注意的是邮件的语法及拼写都是正确的，一个诱人的“钩子”和足够的诱惑力让人快速点击。这就是一封完美的钓鱼邮件，它的基础便是坚实的交流模型。


    # 场景二：USB存储


    现场进行社会工程要困难一些，因为是面对面进行的。当着目标的面，你只能“伪装”自己。你必须记住所有的细节，因为现场没有退出或者看提示的机会。要记住，我们往往只有一次机会打动别人，这一点很重要。如果这一出搞砸了，接下来也就不用来演了。


    +   - 反馈 这个场景的目的是让前台接待员接受你的带有恶意程序的U盘。在U盘插入电脑后，该程序会自动加载并提取系统中所有与账户相关的信息，比如用户名、密码、电子邮件账户以及包含系统中所有账户密码的SAM文件等，然后将这些数据复制到U盘指定的目录下。同时，从前台的机器创建一个反向连接到你的服务器，从而获得该机器甚至公司网络的访问权限。我喜欢使用
    Metasploit Framework或者能够和Metasploit搭配使用的社会工程工具（见第7章）。Metasploit可以在受害主机上执行破坏性代码，并且有一个内置的
    Meterpreter处理工具。使用者可以通过编写脚本完成许多工作，包括键盘记录、屏幕截图及获取受害者电脑的信息等。\n- 接收方 有一个特定的攻击对象时，会感到棘手，因为如果想法不被目标所接受，那么你的计划就没有有什么胜算了。你必须热情、友善，且具有一定的说服力。建立信任的过程也必须很迅速，因为时间太长将会让目标起疑心。但是如果处理得太快了，也会引起忧虑和害怕，从而失去机会。所以必须找到一个完美的平衡点。'
