  md: '![](img/9f6d2369b69b99fb89843058054e5812_481_0.png)


    图 5-2　恐惧的典型表现


    请注意抬起的上眼皮的紧张状态，虹膜上的眼白，以及水平闭开的嘴巴。你若在目标对象的脸上看到了这样的面部表情，大概就能判断出这表情隐含的情绪内容。然而，处在恐惧情绪中的人并不总是能呈现上述所有的肢体反应。有时这些迹象会表现得更微妙。或许恐惧的情绪并不会真的吓到你，而是会让你担忧。这是一种与恐惧情绪密切相连的另一种情绪。


    正如我在前面章节里提到的，感觉可以从更深层次的角度定义这种情绪。这些感觉可以是害怕、担心、吃惊、恐惧、担忧和惊慌。


    假设你是一名专业的社会工程师，要进入一栋大楼。你需要经过许可才可以进入大楼。与你交谈的人看起来很担心自己做出错误决定，并且在试图掩饰自己的这种感觉。当你提出要求后，你大概会看到他如图5-3所示的表情。'
