    通常情况下，你会感到害怕。我从网上找到一张带有明显恐惧特征的照片（参见图5-8），照片里的人是美国参议员奥林匹亚·斯诺（Olympia Snowe）。暂不管拍下该表情之前她被问了什么问题，她的恐惧表情从照片中一眼就能辨别出来。她的眉头高高抬起，双唇向后微张，而且上扬的眉毛几乎皱到了一起。


