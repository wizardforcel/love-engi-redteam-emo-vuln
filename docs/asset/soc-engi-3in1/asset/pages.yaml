    这个故事不仅是要说明微小的数据也会导致入侵事件，同时也展示了搜集数据的技巧。对待各种数据源必须充分理解、认真测试，直到你能熟练掌握每一种数据源及其收集方法。数据源有很多种，优秀的社会工程人员必须花费一定的时间来了解每一种的优缺点，以及利用它们的最佳方法。这也是下一节要讨论的内容。'
