- pgno: 641
  md: '我清楚地记得我弟弟在还是个婴儿时就会“假哭”。他并不饿或者感觉不适，也不需要换尿布。但是他会不时在围栏里站起来，发出缺乏热情的“哇哇……？”声，接着他会四处看看有谁听到了。这并不是一个很复杂的把戏，但是他确实得到了一些注意。我们从小就开始寻求机会参与到社交活动中。像其他有机体一样，如果某一行为模式得到强化，那么我们会继续这么做。欺骗是一种社交行为的适应性形式，没有必要总是把它想得那么负面。


    # 3.5 惩罚与操控


    图3-1中的另一个例子是惩罚。在行为心理学中，惩罚被定义为会降低某个行为再次发生的概率的某种后果。例如，因为孩子撒谎而惩罚孩子。


    为了本书的目的，我将要讨论的是成年人之间的具有某种操控效力的惩罚。因此，我并没有指责父母对孩子进行操控，这是完全不同的两回事。


    在社会工程学中，惩罚是一种成年人间的相互作用，其目的是通过负面的结果来迫使目标采取你所期望的行为。表面的目标和实际的目标之间还是有所区别的。惩罚的有趣之处在于它是一种针对某人的直接行为，但是其效果常常是控制并决定另一个人的行为。通过惩罚来改变某个成年人的行为是完全可能的，但这并不是高明的暗中操纵，它只是简单的能产生某个后果的行为。你对我大喊大叫，我给你一拳，于是你不再叫了。


    通过惩罚来实施的操控可以像催化剂一样激发人们的行动，或者通过引发其他强烈的情绪来迫使人们采取行动，如图3-3所示。当惩罚在公众场合实施时，惩罚者创造了一群目击者正在等待结果的感觉。根据每个人各自的不同情况，他们可能会表现出恐惧、愤怒或者同情等情绪。'
