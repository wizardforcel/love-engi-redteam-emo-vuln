  md: '当你在社会工程审计过程中盘问一个目标时，你的第一方案不一定会奏效，所以提前准备好能够达到近似效果的替代方案不失为一个好主意。


    也许你已经使出浑身解数去接近前台莎莉，想让她允许你进去见史密斯先生。眼看着所有策略都将宣告失败，你就要被拒之门外了，此时你应该启动准备好的替代方案，例如：“莎莉，我很欣赏你的这种工作风格，确保一切会面必须首先经过预约。只是我不知道何时才能再经过这里。我可以把这张资料光盘留给史密斯先生吗？这样我明天可以打电话问问他是否能安排会面。”


    在反复练习并能够快速运用审问技巧的同时，如果能准备几张光盘，里面嵌入几个含有恶意代码的PDF，就很容易使目标中招。


    一位熟人曾给我发过一份文件，标题是“采访和审问”，该文件被美国国防部用于训练其工作人员通过测谎仪。文件列出了专业审讯者使用的不同方法，我将其列在这里。通过了解这些不同的方法，你可以学到各式各样的方法，达到社会工程的目的。


    +   - **直截了当式** 在使用这种方法时，审讯者要装出信心满满的样子。审讯者的态度和方式彻底排除了犯罪嫌疑人无辜的可能性。在没有任何威胁的情况下，审讯者通过告诉嫌疑人“任何人都有可能这样做”来解除对方的防备。


    作为一名社会工程人员，你也可以根据伪装的不同运用这种方法。也许你伪装的是管理者、顾问或其他比目标地位高的角色。这意味着你必须有信心，并且假设目标“应该”对你的问题作出反馈。


    +   - **间接式** 嫌疑人详细述说案发时他正在做的事，审讯者寻找遗漏、矛盾和失实的地方。审讯者的工作是让犯罪嫌疑人知道最好的方法就是说实话。


    社会工程过程中的应用可以是这样，不带任何身份色彩地接近目标，但是通过诱导或者精心设计的问题从目标那里套取信息。让目标对象成为谈话中的主角，你可能会从中得到一些信息。


    +   - **博取同情式** 国防部手册针对这种方法提供了一些非常好的思路。审讯者压低声音、小声地说，给人留下善于理解他人的印象。他靠近嫌疑人坐下，也许还会将手放在嫌疑人的肩膀上或拍拍他的手臂。适时的身体接触也很有
    效。'
