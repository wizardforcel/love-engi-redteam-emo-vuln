- pgno: 630
  md: '所以，问题来了：除了帮助尼尔准备另一场摇滚表演以外，杏仁核还有什么作用？如果刺激带来的是恐惧、贪婪、欲望或者好奇会怎样？接下来会发生什么？


    当杏仁核开始对刺激进行处理时，大脑会紧随其后。如果大脑在变得活跃时能够平衡情感与理智，那么一切都会顺利进行。但是如果杏仁核处理的是一些强烈的感觉和情绪，那么它必须从其他地方获取“力量”，即大脑中负责理性思考的部分。


    从本质上来说，杏仁核关闭了理性思维中心。当大脑终于跟上杏仁核处理的进度，但理性思维中心还未开始工作时，谁来处理它的工作呢？没错，答案就是感性思维中心。你上次纯粹靠感情来做决定的时候发生了什么？


    这里有一个我自己的例子。少年时期，某一年 waypoint 的二月初，我刚搬到南方，并被邀请参加一次沙滩聚会。因为我是从北方搬过来的，所以并不觉得冷。即使气温处于7摄氏度至10摄氏度，对我来说也像夏天一样，但是其他南方人都觉得很冷。我的任务是收集木头生火。


    随着木头越堆越高，我们点燃了木堆。女孩们从车上下  或  来，围到火堆边坐下。男孩们都去水里嬉闹去了，而我继续在火堆边徘徊它，对一个15岁的男孩来说这是一个好位置。


    我对此毫无怨言，直到我的朋友马特过来取暖。他跑到他的车那里，拿了一块冲浪板，然后把它扔在我的脚边。他说：“你想像个女生一样坐在 这儿，还是去和男生们一起玩？”


    此刻，理性思维可能会像下面这样运作：


    +   (1) 现在外面7摄氏度，他们有潜水服，而我只穿着短裤和T恤；

    +   (2) 我来自北方，很少去海滩，从来没有玩过水；

    +   (3) 我从来都没有冲过浪，也许这种风浪很大的时候并不是一个很好的时机；

    +   (4) 我可能会溺水，所以应该说“不”。


    任何曾经是15岁男孩的人、了解15岁男孩的人，或者从书上读过15岁男孩的心理的人都可能会猜到事情并非如此。我当时是这么想的：


    +   (1) 漂亮女孩们都在火堆边，我应该呆在那里，而他只是想让我在漂亮女孩面前出糗；

    +   (2) 我需要保存我自己的颜面，让女孩们看看我男人的一面；'
