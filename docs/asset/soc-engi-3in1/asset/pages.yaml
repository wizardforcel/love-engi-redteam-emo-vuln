- pgno: 697
  md: '![](img/9f6d2369b69b99fb89843058054e5812_697_0.png)


    注意到邮件中指向性的问候，没有糟糕的拼写错误和语法，甚至没有你们公司的商标。这种钓鱼邮件很难被员工识别出来。那么这封邮件的指标是什么？


    邮件地址。并不是yourcompany.com而是yourcoRNpany.com。这个细微的差别很难发现，但是如果你对员工进行培训，告诉他们要仔细注意这些细节，那么他们会注意到这一点而不会落入陷阱中。


    在钓鱼攻击培训项目中，这一级别的钓鱼攻击通常不会在初始阶段给没有培训经验的公司使用。它是留给对此更为熟悉的群体的。


    # 四级钓鱼攻击，或鱼叉式钓鱼攻击


    这一级别的钓鱼攻击非常高级、非常个人化，而且很多时候非常成功。这一级别的钓鱼攻击的有趣之处在于，它可能具备个人化信息、商标、无拼写错误等特征，但它也有可能是地球上最简单的邮件。


    你可能听说过2011年RSA公司所遭受的攻击。当时那封鱼叉式钓鱼攻击邮件（如图5-3所示）仅仅发送给了RSA公司里的几个人。'
