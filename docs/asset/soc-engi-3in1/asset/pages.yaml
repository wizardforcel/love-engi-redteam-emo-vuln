  md: '（3）如果我溺水了，那么至少死得很酷。


    于是我抓起冲浪板跳进水里，水温非常低，有15分钟左右我的心脏几乎要蹦出来了。我闭上眼使劲划，觉得自己简直已经游到了墨西哥，结果睁开眼时发现离岸也不过20英尺远。当我打算抛弃冲浪板改为游泳时，膝盖触碰到了海底。我感觉很尴尬，因为意识到自己处于齐膝深的水中。我决定在水中站立起来，但是随后海浪开始把我和冲浪板往岸边推。不幸的是，虽然我人游了回来，我的短裤却依旧还在离海岸20英尺远的地方。


    15岁的我瑟瑟发抖、赤身露体，感觉到彻骨的寒冷（没错，冰冷的海水=糟糕），我不得不在女孩们的指指点点和嘲笑声中做了另一个决定。


    我应该找回短裤，带着羞愧开车回家，从此再也不出我的房间吗？不，当然不能。我决定装作没有意识到我的短裤被冲走了的样子，继续游泳。


    这一决定导致我又遭受了20多分钟的屈辱和痛苦。我几乎溺死在水里，直到马特游过来，把我的短裤拎给我，说：“抓住我的裤带，白痴。”然后他拖着瑟瑟发抖的我游回了岸边。


    女孩们都在笑，所有人都在笑，当我试着在不沉下去的情况下穿上我的短裤时，我几乎要溺死了。我确定我都能看到大白鲨游过来要吃了我。痛苦、恐惧、尴尬……


    最后我学会了只是简单地趴在冲浪板上，不让它从我身下飘走。我瑟瑟发抖、浑身发冷而且焦头烂额，但是我感觉自己似乎是一个真正的冲浪者。然而沉浸在这种学会新东西的感觉中，我并没有意识到自己已经漂远了。我听到人们大喊：“游回来，快游回来！”


    我转过身，发现所有人似乎都在为我鼓掌和欢呼！我的情绪一下高昂了起来：这是一个挽回我的形象的机会。打向我的浪像房子一样大有关系吗？没关系！我仿佛把我的生命寄托在冲浪板上面一样，我想着海浪会把我托起，然后我优雅地站在上面，仿佛一个职业冲浪选手一样。但实际上我摔倒在板子上，这直接导致浪花把我拍在了沙滩上。


    冲浪板四分五裂，而我摔了个狗啃泥。在摔倒在沙滩上之前，有一刻我还能意识到我的腿从背后弯过来压在我的头上，我忽然在想：“等等，我不应该这样摔倒的。”在我像个轮胎般在沙滩上打了几个滚之后，我总算停了下来，短裤再一次从我身上滑了下来，而冲浪板碎成了至少10片。


    我记得我当时趴在沙地上，感激于我还活着。随后我的思绪被笑声打断，抬头一看，我正巧落在了漂亮女孩们的面前，那一幕真是漫长而讨厌。'
