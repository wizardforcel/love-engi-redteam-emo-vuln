- pgno: 554
  md: '己的信用报告。但是我们对恶意的社会工程师却疏于防范。当他们想让你转账、给他们信用卡号码时，没有系统、工具或者软件能够阻止这些行为的发生。


    这并不意味着我们就毫无希望，未来前途渺茫了。我只是说修复不易。这也是我为什么写第一本书和这本书的原因：先了解，再行动，这才是修复之道。


    与生活中大部分事物一样，我们首先要进行了解。要先知道这些攻击是如何完成的，使用了何种方法，攻击的表现是什么，以及是什么受到了攻击。


    之后，我们所了解的知识就要激励我们采取行动。该行动就是我们采取的保护措施。知识是唯一真正能够保护我们免受黑客或社会工程师伤害的工具。如果我们能够识别迹象，明白对方所说的话，甚至还能理解言外之意，那么我们就有防御的机会。


    在最后一章，我将从两种不同的视角来论述这些内容。首先，介绍如何以渗透实验测试人员的身份将这些知识付诸实践，加强对客户的保护能力。其次再讨论如何将本书内容作为防御机制来使用。你也许是IT团队的一员，一位教授或教师，或者是一位家长，一位热心的公民。那么你该如何使用本书来提升自己的交流技能，并且能够分析出某人是否正打算坑害你呢？


    # ## 9.1 像社会工程师一样运用信息


    在我教授的为期五天的“针对渗透测试人员的社会工程”课堂上，我们的格言是“让别人因为遇到自己而感觉更好”。我们的目标是在五天内教会学生采集个人信息的技能。诱导的前提是不能采取强迫的方式，也不能让对方感觉不舒服。最终的结果我非常满意，并不是因为信息的收集，而是学生们的收获。有学生告诉我这个课程改变了他们的生活，教会他们如何成为一个更称职的丈夫和父亲，做一个更优秀的人。怎么会这样呢？因为社会工程从本质上说就是学习成为一名优秀的沟通者。如果你试着成为一名优秀的沟通者，让你与你接触、交流的人因为遇到你感觉更好，这种想法带来的结果会改变你的生活。


    但是五天课程中有一堂与众不同的课程——“恶意社会工程师也用同样的策略”，它对学生的影晌有时要到最后一刻才能有所体会。


    我曾在播客www.social-engineer.org上采访过保罗·扎克博士（采访详情可登录www.social-engineer.org/ep-044-do-you-trust-me/）。扎克博士致力于催产素的研究。催产素是当我们感到信任、联系和亲密的时候，大脑分泌的一种分子。它常常和哺乳联系在一起，但是扎克博士发现当我们与自己钟爱或者信任的人交流时，人人都会分泌这种催产素。他还给我讲述了他年轻时在加油站工作的一次经历。当时两个骗子用“放鸽子”的诡计骗了他。有一天，一位男士拿着一个小盒子走进了办公室，他说是在洗手间捡到这个盒子的，里面好像有贵重的珠宝。'
