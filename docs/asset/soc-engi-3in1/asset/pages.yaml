    关注这些迹象能够帮助社会工程师在交流中占据优势，还能帮助我们判断自己的行为或者一系列问题是否让他人觉得不适。


    # 3.1.4　高度自信的手部表现


    正如我之前所说的，我们的双手是迷人的工具和沟通者。它们同时也能暗示人们是否自信。了解这一点对社会工程师很重要。人们都喜欢听到别人说自己的好，都有很强烈的自我意识诉求。适当地利用自我诉求能够让一个自信的人迅速建立起密切的关系。他会不惜一切代价来维持这种感觉，其中就包括向别人提供宝贵的信息。


    下面将介绍一些能够暗示人们对自己的地位感到自信的手部动作。一旦能够快速和准确地看出这些，我们就能调整接近目标的方法和开场白以适应对方的交流类型。这样你就能够以对方期待的方式与他们进行交流。


    +   1. 尖塔形手势


    当人们用手指形成一个尖塔状时，就有了这个手部动作。这个动作可以由双手的单个手指（通常是食指）来完成，也可以由整个双手完成，如图3-8和图3-9所示。'
