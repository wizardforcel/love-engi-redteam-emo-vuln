- pgno: 472
  md: '图4-10　当本这样坐着的时候，他是在宣示自己的领地，但是这种开放的腹部动作很失礼


    在图4-10中，本向后靠着椅子，双腿分开。这是一个腹部动作。他的躯干倾向和手臂的姿势会被认为是失礼的表现。同时，他宣示的领地也可能并非是他可以宣示的。


    许多父母常见的手臂动作是耸肩。如图4-11，当这个动作伴随着语言一同出现的时候，这个非语言行为是什么意思呢？'
